<style>
  :root{
    --bg:#141414; --panel:#1a1a1a; --panel2:#212121; --panel3:#262624; --border:#333330;
    --muted:#9a9a96; --accent:#c1272d; --accent-hover:#a8181e; --paper:#faf8f2; --ink:#2a2a28; --good:#6fbf8b;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; background:var(--bg); color:#f2f0ec; font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; overflow:hidden; -webkit-font-smoothing:antialiased; }
  a{ color:inherit; text-decoration:none; }
  button{ font-family:inherit; cursor:pointer; }
  input,select{ font-family:inherit; }
  .disp{ font-family:Inter,system-ui,sans-serif; letter-spacing:-.01em; }
  #app{ display:flex; flex-direction:column; height:100vh; }

  /* Top bar */
  #topbar{ height:56px; flex-shrink:0; display:flex; align-items:center; gap:16px; padding:0 20px; border-bottom:1px solid var(--border); }
  #topbar .back{ font-size:13px; color:var(--muted); white-space:nowrap; }
  #topbar .sep{ width:1px; height:18px; background:var(--border); }
  #topbar .title{ font-size:15px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:38vw; }
  #topbar .grow{ flex:1; }
  #ratioSel, #statusFilter{ background:var(--panel2); border:1px solid var(--border); border-radius:8px; color:#f2f0ec; font-size:12.5px; padding:7px 10px; }
  #searchBox{ width:190px; background:var(--panel2); border:1px solid var(--border); border-radius:8px; color:#f2f0ec; font-size:12.5px; padding:7px 10px; }
  #searchBox::placeholder{ color:var(--muted); }
  #searchBox:focus, #statusFilter:focus, #ratioSel:focus{ outline:none; border-color:#5a5a54; }
  #zoomGroup{ display:flex; align-items:center; gap:6px; }
  #zoomGroup .btn{ padding:5px 10px; line-height:1; }
  #zoomLabel{ font-size:12px; color:var(--muted); min-width:38px; text-align:center; user-select:none; }
  #statusMsg{ font-size:12px; color:var(--muted); white-space:nowrap; }
  .btn{ background:var(--panel2); border:1px solid var(--border); border-radius:8px; padding:8px 14px; color:#f2f0ec; font-size:13px; }
  .btn:hover{ background:#2a2a26; }
  .btn.primary{ background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  .btn.primary:hover{ background:var(--accent-hover); }
  .btn:disabled{ opacity:.45; cursor:default; pointer-events:none; }

  #body{ flex:1; display:flex; min-height:0; }

  /* Left rail (scene nav in grid view, layers in focus view) */
  #leftRail{ width:240px; flex-shrink:0; background:var(--panel); border-right:1px solid var(--border); overflow-y:auto; padding:16px 12px; display:flex; flex-direction:column; }
  .rail-label{ font-size:11px; letter-spacing:.08em; color:var(--muted); font-weight:600; padding:4px 6px 8px; display:flex; align-items:center; justify-content:space-between; }
  .scene-item{ padding:8px 8px; border-radius:6px; font-size:12.5px; cursor:pointer; color:#d8d6d0; display:flex; align-items:center; gap:8px; }
  .scene-item:hover{ background:#232320; }
  .scene-item:hover .sceneDel{ display:flex; }
  .scene-item.active{ background:var(--panel2); font-weight:600; color:#f2f0ec; border-left:2px solid var(--accent); padding-left:6px; }
  .scene-item .dot{ width:6px; height:6px; border-radius:50%; background:#4a4a44; flex-shrink:0; }
  .scene-item .dot.hasInk{ background:var(--good); }
  .scene-item .txt{ flex:1; min-width:0; }
  .scene-item .num{ display:block; }
  .scene-item .sub{ display:block; font-size:11px; color:var(--muted); font-weight:400; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .scene-item.active .sub{ color:#b8b6b0; }
  .scene-item .sceneDel{ display:none; align-items:center; justify-content:center; width:20px; height:20px; border-radius:5px; border:none; background:none; color:var(--muted); flex-shrink:0; }
  .scene-item .sceneDel:hover{ background:#33332e; color:#f2f0ec; }
  #newSceneBtn{ margin-top:10px; width:100%; padding:9px 10px; border-radius:8px; border:1px dashed #4a4a44; background:none; color:#c8c6c0; font-size:12.5px; text-align:left; display:flex; align-items:center; gap:8px; }
  #newSceneBtn:hover{ border-color:var(--accent); color:#fff; background:#1f1c1c; }
  .railSpacer{ flex:1; }

  /* Main / overview (all scenes together) */
  #main{ flex:1; display:flex; flex-direction:column; min-height:0; overflow:hidden; }
  #gridScroll{ flex:1; overflow-y:auto; padding:24px 28px; }
  .sceneSection{ margin-bottom:34px; }
  .sceneSection:last-child{ margin-bottom:8px; }
  .sceneHead{ margin-bottom:14px; display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
  .sceneHead .headMain{ min-width:0; }
  .sceneHead .h{ font-size:16px; font-weight:600; }
  .sceneHead .sub{ font-size:12px; color:var(--muted); margin-top:2px; }
  .jumpLink{ font-size:11.5px; color:var(--muted); text-decoration:none; border:1px solid var(--border); border-radius:6px; padding:3px 8px; display:inline-flex; align-items:center; gap:4px; white-space:nowrap; }
  .jumpLink:hover{ color:#f2f0ec; border-color:#5a5a54; }
  .sceneSection.filteredOut{ display:none; }
  .card.filteredOut{ display:none; }
  .grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(240px, 1fr)); gap:20px; }
  .card{ background:var(--panel2); border:1px solid var(--border); border-radius:10px; overflow:hidden; display:flex; flex-direction:column; }
  .card:hover{ border-color:#4a4a44; }
  .card.dragOver{ border-color:var(--accent); box-shadow:0 0 0 1px var(--accent); }
  .card.dragging{ opacity:.4; }
  .card .frame{ width:100%; background:var(--paper); position:relative; cursor:pointer; }
  .card .frame canvas{ width:100%; height:100%; display:block; }
  .card .cap{ padding:10px 12px; display:flex; flex-direction:column; gap:3px; }
  .card .cap .top{ display:flex; align-items:center; gap:6px; font-size:13px; font-weight:600; }
  .card .cap .top .statusDot{ width:7px; height:7px; border-radius:50%; background:#4a4a44; flex-shrink:0; }
  .card .cap .top .statusDot.shot{ background:var(--good); }
  .card .cap .top .statusDot.reshoot{ background:var(--accent); }
  .card .cap .top .shotLabel{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .card .cap .top .cardActions{ margin-left:auto; display:flex; align-items:center; gap:4px; }
  .card .cap .top .cardMenu{ display:flex; gap:2px; visibility:hidden; }
  .card:hover .cap .top .cardMenu, .card:focus-within .cap .top .cardMenu{ visibility:visible; }
  .card .cap .top .miniBtn{ width:20px; height:20px; border-radius:5px; border:none; background:none; color:var(--muted); display:flex; align-items:center; justify-content:center; padding:0; flex-shrink:0; }
  .card .cap .top .miniBtn:hover{ background:#33332e; color:#f2f0ec; }
  .card .cap .top .miniBtn.delBtn:hover{ background:#3a2020; color:#ff8f8f; }
  .card .cap .top .grip{ color:var(--muted); cursor:grab; touch-action:none; display:flex; flex-shrink:0; }
  .card .cap .sub{ font-size:11.5px; color:var(--muted); }
  .empty-state{ position:absolute; inset:10%; border:1.5px dashed #cfc9ba; border-radius:8px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; color:#a39d86; font-size:11px; }

  /* "Add shot" tile at the end of a scene's grid — same frame+cap shape as a real card, so it
     lines up flush with its row instead of floating at a different height. */
  .addTile{ border:1.5px dashed var(--border); background:none; padding:0; color:var(--muted); cursor:pointer; }
  .addTile .frame{ background:none; cursor:pointer; }
  .addTile:hover{ border-color:var(--accent); color:#f2f0ec; }
  .addTile:hover .frame{ color:var(--accent); }

  /* Generic modal (new scene, etc.) */
  .modalShade{ position:fixed; inset:0; z-index:200; background:rgba(0,0,0,.55); display:flex; align-items:center; justify-content:center; padding:16px; }
  .modalBox{ width:min(400px,100%); background:#1a1b1f; border:1px solid rgba(255,255,255,.14); border-radius:14px; padding:20px; box-shadow:0 24px 60px rgba(0,0,0,.6); }
  .modalBox h3{ margin:0 0 4px; font-size:16px; font-weight:600; }
  .modalBox .hint{ font-size:12px; color:var(--muted); margin-bottom:14px; }
  .modalBox label{ display:block; font-size:11.5px; color:var(--muted); margin:10px 0 5px; }
  .modalBox select, .modalBox input{ width:100%; height:36px; padding:0 10px; border-radius:8px; border:1px solid var(--border); background:var(--panel2); color:#f2f0ec; font-size:13px; box-sizing:border-box; }
  .modalRow{ display:flex; gap:8px; }
  .modalRow > div{ flex:1; }
  .modalBtns{ display:flex; gap:8px; justify-content:flex-end; margin-top:18px; }
  .empty-scenes{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; padding:60px 20px; color:var(--muted); text-align:center; }

  /* Focus view */
  #layersList{ display:flex; flex-direction:column; gap:2px; }
  .layer-row{ display:flex; align-items:center; gap:8px; padding:7px 8px; border-radius:6px; font-size:12.5px; }
  .layer-row:hover{ background:#232320; }
  .layer-row.active{ background:var(--panel2); border-left:2px solid var(--accent); padding-left:6px; }
  .layer-row .eye{ background:none; border:none; padding:0; display:flex; }
  .layer-row .name{ flex:1; cursor:pointer; }

  #toolbar{ min-height:50px; flex-shrink:0; display:flex; flex-wrap:wrap; align-items:center; gap:8px 10px; padding:8px 16px; border-bottom:1px solid var(--border); }
  #zoomResetBtn #zoomLabel{ min-width:34px; display:inline-block; color:inherit; }
  /* Shot details form (right rail) — same look as the dialogs */
  #rightRail label{ display:block; font-size:11.5px; color:var(--muted); margin:10px 0 5px; }
  #rightRail select, #rightRail input[type=text]{ width:100%; height:34px; padding:0 8px; border-radius:8px; border:1px solid var(--border); background:var(--panel2); color:#f2f0ec; font:inherit; font-size:12.5px; box-sizing:border-box; }
  #rightRail select:focus, #rightRail input:focus, #rightRail textarea:focus{ outline:none; border-color:#6a6a62; }
  #rightRail .modalRow > div{ min-width:0; }
  .tool-group{ display:flex; gap:2px; background:var(--panel2); border-radius:8px; padding:3px; }

  #brushRing{ position:fixed; left:0; top:0; pointer-events:none; z-index:60; border-radius:50%; display:none;
    border:1px solid rgba(0,0,0,.85); box-shadow:0 0 0 1px rgba(255,255,255,.85), inset 0 0 0 1px rgba(255,255,255,.55); transform:translate(-50%,-50%); }

  .swatch.pick input{ position:absolute; inset:-6px; width:calc(100% + 12px); height:calc(100% + 12px); opacity:0; cursor:pointer; border:0; padding:0; }

    let moved = 0; const done = [];
    for(const key of S.prevRooms){
      const oldRef = window.firebase.database().ref("rooms/" + key + "/storyboard");
      let old = null;
      try{ old = (await oldRef.once("value")).val(); }catch(_e){ old = null; }
      if(!old || typeof old !== "object") continue;
      if(!merged.aspect && old.aspect) merged.aspect = old.aspect;
      merged.order = Object.assign({}, old.order || {}, merged.order || {});
      if(!merged.blockSets && old.blockSets) merged.blockSets = old.blockSets;
      merged.panels = merged.panels || {};
      Object.keys(old.panels || {}).forEach((k) => {
        const src = old.panels[k] || {}; const dst = merged.panels[k] = merged.panels[k] || {};
        const add = Object.keys(src.strokes || {}).filter((sk) => !(dst.strokes && dst.strokes[sk]));
        dst.strokes = Object.assign({}, src.strokes || {}, dst.strokes || {});
        if(!dst.ref && src.ref) dst.ref = src.ref;
        if(!dst.blocking && src.blocking) dst.blocking = src.blocking;
        moved += add.length;
      });
      done.push(oldRef);
    }
    if(!done.length) return cur;
    await S.boardRef.set(merged);                                  // new room first…
    for(const r of done){ try{ await r.remove(); }catch(_e){} }   // …then clear the old ones
    if(moved) setTimeout(() => notify("Brought your sketches across after the sharing change (" + moved + " stroke" + (moved === 1 ? "" : "s") + ")."), 400);
    return merged;
  }
  function fbKey(s){ return String(s || "").replace(/[.#$\[\]\/]/g, "_") || "k"; }

  /* ---------------- State ---------------- */
  const S = {
    fileId:"", title:"Storyboard", roomKey:"", boardRef:null,
    scenes:[], shots:[], shotsByScene:{}, curScene:null,
    order:{},   // sceneKey (fbKey'd) -> [shotKey,...] display order, a Storyboard-only convenience
    ratio: 2.39, panelsCache:{}, // shotKey -> { layers:{}, strokes:{id:stroke}, ref:{imageId} }
    view:"overview", curShotKey:"", tool:"pencil", color:"#2a2a28", weight:3, activeLayer:"line",
    searchQuery:"", statusFilter:"", zoom:1,
    redo:{},   // shotKey (fbKey'd) -> strokes you undid, newest last
    blockSets:{},   // "Save as location" sets, shared by every shot on this board
    mode3d:"draw"   // focus view: "draw" (pencil tools) or a 3D blocking mode: "cam" | "set" | "fig"
  };
  try{
    const pr = JSON.parse(localStorage.getItem("Camp_STORYBOARD_PREFS_V1") || "null");
    if(pr){ if(pr.tool) S.tool = pr.tool; if(pr.color) S.color = pr.color; if(pr.weight) S.weight = Number(pr.weight) || S.weight; }
  }catch(_e){}
  function savePrefs(){ try{ localStorage.setItem("Camp_STORYBOARD_PREFS_V1", JSON.stringify({ tool:S.tool, color:S.color, weight:S.weight })); }catch(_e){} }
  const LAYER_DEFS = [
    { id:"sketch", name:"Rough sketch" },
    { id:"line", name:"Line art" },
    { id:"shading", name:"Shading" }
  ];
  const TOOL_STYLE = {
    pencil: { alpha:0.88, widthMul:1, comp:"source-over" },
    pen: { alpha:1, widthMul:1.6, comp:"source-over" },
    soft: { alpha:0.32, widthMul:3.2, comp:"source-over" },
    eraser: { alpha:1, widthMul:3.4, comp:"destination-out" }
  };
  // Same option lists as the Shot List Sheet's dropdowns (shotlist_model.gs), so a size/angle/etc.
  // picked here is exactly what you'd get typing it in the Sheet.
  const SHOT_SIZE_OPTS = ["", "EWS", "WS", "MS", "MCU", "CU", "ECU", "OTS", "TWO SHOT", "INSERT", "CUTAWAY"];
  const SHOT_ANGLE_OPTS = ["", "Eye level", "High angle", "Low angle", "Dutch/canted", "Bird's eye", "Worm's eye", "POV"];
  const SHOT_MOVE_OPTS = ["", "Static", "Pan", "Tilt", "Dolly", "Truck", "Handheld", "Steadicam/gimbal", "Crane/jib", "Drone", "Zoom"];
  const SHOT_LENS_OPTS = ["", "14mm", "18mm", "24mm", "28mm", "35mm", "50mm", "85mm", "100mm", "135mm", "Zoom"];
  const SHOT_EQUIP_OPTS = ["", "Tripod", "Handheld", "Gimbal", "Slider", "Dolly", "Jib/crane", "Drone"];
  const SHOT_STATUS_OPTS = ["", "Not shot", "Shot", "Needs reshoot"];

  // Strokes are stored in a FIXED logical canvas (anchored on height, LOGICAL_H tall) rather than
  // as a fraction of whatever panel size happened to be on screen — so changing the aspect ratio
  // crops the sides of a drawing instead of squashing/stretching it. MAX_RATIO is the widest ratio
  // offered (2.39 · Scope); every narrower ratio just shows a centered, narrower slice of the same
  // fixed-width logical canvas.
  const LOGICAL_H = 1000;
  const MAX_RATIO = 2.39;
  const LOGICAL_W = LOGICAL_H * MAX_RATIO;
  const STROKE_W_SCALE = LOGICAL_H / 500;
  function logicalOffsetX(ratio){ return (LOGICAL_W - ratio * LOGICAL_H) / 2; }
  function logicalToPx(lx, ly, w, h){
    const scale = h / LOGICAL_H;
    return [(lx - logicalOffsetX(S.ratio)) * scale, ly * scale];
  }

  function setStatus(t, isErr){ const el = document.getElementById("statusMsg"); if(el){ el.textContent = t || ""; el.classList.toggle("err", !!isErr); } }

  // Without live sync (no Firebase in config.json) the board used to live only in memory, so every
  // sketch vanished on reload. It's now kept in this browser instead, per script.
  const LOCAL_PREFIX = "Camp_STORYBOARD_LOCAL_V1:";
  function localKey(){ return LOCAL_PREFIX + (S.fileId || "none"); }
  function loadLocalBoard(){
    try{ const v = JSON.parse(localStorage.getItem(localKey()) || "null"); return v && typeof v === "object" ? v : null; }catch(_e){ return null; }
  }
  let __localSaveT = 0;
  function saveLocalBoard(){
    if(S.boardRef) return;
    clearTimeout(__localSaveT);
    __localSaveT = setTimeout(saveLocalBoardNow, 250);
  }
  function saveLocalBoardNow(){
    {
      const panels = {};
      Object.keys(S.panelsCache).forEach((k) => {
        const p = S.panelsCache[k]; const strokes = {};
        Object.keys(p.strokes || {}).forEach((sk) => { const c = Object.assign({}, p.strokes[sk]); delete c._k; strokes[sk] = c; });
        const blk = blockingBlob(p.blocking);
        if(Object.keys(strokes).length || p.ref || blk) panels[k] = { strokes, ref: p.ref || null, blocking: blk };
      });
      try{ localStorage.setItem(localKey(), JSON.stringify({ aspect: S.ratio, order: S.order, panels, blockSets: S.blockSets })); setStatus("Saved on this device"); }
      catch(_e){ setStatus("Couldn't save on this device (browser storage is full or blocked).", true); }
    }
  }

  /* ---------------- Boot ---------------- */
  async function boot(){
    const r = route();
    S.fileId = r.fileId;
    if(!S.fileId && !r.pid){
      showFatal("Open the Storyboard from a script in the Library (the ⋯ menu on any script, or File › Storyboard in the editor).");
      return;
    }
    const loadRes = await apiGet("load", S.fileId ? { fileId: S.fileId } : { pid: r.pid });
    if(!loadRes || loadRes.ok === false){ showFatal((loadRes && loadRes.error) || "Couldn't open that script."); return; }
    S.fileId = loadRes.fileId || S.fileId;
    S.title = (loadRes.doc && loadRes.doc.title && loadRes.doc.title.title) || String(loadRes.name || "").replace(/\.json$/i, "") || "Untitled Script";
    S.roomKey = loadRes.live && loadRes.live.room || "";
    S.prevRooms = (loadRes.live && Array.isArray(loadRes.live.prev)) ? loadRes.live.prev.filter((k) => k && k !== S.roomKey) : [];
    document.getElementById("pageTitle").textContent = S.title + " — Storyboard";
    document.title = S.title + " · Storyboard — Camp";
    const hub = new URLSearchParams(location.search).get("hub");
    document.getElementById("scriptLink").href = "editor.html?fileId=" + encodeURIComponent(S.fileId) + cloudParam() + (hub ? "&hub=" + encodeURIComponent(hub) : "");
    if(hub){ const b = document.getElementById("backLink"); b.href = "hub.html?pid=" + encodeURIComponent(hub) + "&tab=storyboard"; b.innerHTML = "&larr; Project"; }

    const sl = await apiGet("shotlistdata", { fileId: S.fileId });
    if(!sl || sl.ok === false){
      if(sl && sl.error && !sl.reason){ showFatal(sl.error); return; }
      showEmptyBoard(sl && sl.reason);
      return;
    }
    applyShotlistData(sl);
    __slSig = shotlistSig(sl);

    if(S.roomKey){
      try{ S.boardRef = await connectFirebase(S.roomKey); }catch(_e){ S.boardRef = null; }
    }
    if(S.boardRef){
      try{
        const snap = await S.boardRef.once("value");
        let val = snap.val() || {};
        try{ val = await adoptOldRooms(val); }catch(_e){}
        if(val.aspect) S.ratio = Number(val.aspect) || S.ratio;
        S.panelsCache = normalizePanels(val.panels || {}, S.ratio);
        S.order = val.order || {};
        S.blockSets = parseBlob(val.blockSets) || {};
      }catch(_e){}
    }else{
      const local = loadLocalBoard();
      if(local){
        if(local.aspect) S.ratio = Number(local.aspect) || S.ratio;
        S.panelsCache = normalizePanels(local.panels || {}, S.ratio);
        S.order = local.order || {};
        S.blockSets = parseBlob(local.blockSets) || {};
      }
    }
    document.getElementById("ratioSel").value = String(S.ratio);

    document.getElementById("loading").style.display = "none";
    document.getElementById("app").style.display = "flex";
    wireTopbar();
    window.addEventListener("popstate", onPopState);
    history.replaceState({ view: "overview" }, "", location.href);
    renderLeftRailScenes();
    renderOverview();
    startShotlistWatch();
  }

  function showEmptyBoard(reason){
    document.body.classList.add("overviewView"); document.body.classList.remove("focusView");
    document.getElementById("loading").style.display = "none";
    document.getElementById("app").style.display = "flex";
    document.getElementById("pageTitle").textContent = S.title + " — Storyboard";
    document.getElementById("leftRail").innerHTML = "";
    document.getElementById("rightRail").style.display = "none";
    document.getElementById("ratioSel").style.display = "none";
    document.getElementById("exportBtn").style.display = "none";
    document.getElementById("main").innerHTML = `
      <div id="emptyBoard">
        <div class="disp" style="font-size:18px;font-weight:600;color:#f2f0ec;">No Shot List yet</div>
        <div style="max-width:380px;font-size:13px;line-height:1.5;">
          The Storyboard builds its panels from your Shot List, so export one first — open this script in the editor,
          then File &rsaquo; Export &rsaquo; Export Shot List. Come back here once that's done.
        </div>
        <a class="btn primary" href="editor.html?fileId=${encodeURIComponent(S.fileId)}${cloudParam()}">Open the script</a>
      </div>`;
  }

  /* ---------------- Top bar ---------------- */
  function wireTopbar(){
    document.getElementById("ratioSel").onchange = async (e) => {
      S.ratio = Number(e.target.value) || 2.39;
      if(S.boardRef) S.boardRef.child("aspect").set(S.ratio); else saveLocalBoard();
      if(S.view === "overview") renderOverview(); else showFocus(S.curShotKey, true);
    };
    document.getElementById("exportBtn").onclick = () => printBoard();
    document.getElementById("searchBox").oninput = (e) => { S.searchQuery = e.target.value || ""; applyFilter(); };
    document.getElementById("statusFilter").onchange = (e) => { S.statusFilter = e.target.value || ""; applyFilter(); };
  }

  // Search/filter across the whole board — matches shot number, size/angle/move/lens/equipment,
  // description, notes and cast, plus an optional status dropdown. Purely a display-time filter:
  // it never touches the Shot List Sheet, so it's always safe to clear.
  function matchesFilter(sh){
    if(S.statusFilter && (sh.status || "") !== S.statusFilter) return false;
    const q = S.searchQuery.trim().toLowerCase();
    if(!q) return true;
    const hay = [sh.shot, sh.size, sh.angle, sh.move, sh.lens, sh.equip, sh.desc, sh.notes, sh.cast]
      .filter(Boolean).join(" ").toLowerCase();
    return hay.indexOf(q) !== -1;
  }
  function applyFilter(){
    if(S.view !== "overview") return;
    const active = !!(S.searchQuery.trim() || S.statusFilter);
    document.querySelectorAll(".sceneSection").forEach((section) => {
      const cards = section.querySelectorAll(".card:not(.addTile)");
      let visible = 0;
      cards.forEach((card) => {
        const sh = S.shots.find((x) => x.key === card.dataset.shotKey);
        const show = !sh || matchesFilter(sh);
        card.classList.toggle("filteredOut", !show);
        if(show) visible++;
      });
      const addTileEl = section.querySelector(".card.addTile");
      if(addTileEl) addTileEl.classList.toggle("filteredOut", active);
      section.classList.toggle("filteredOut", cards.length > 0 && visible === 0);
    });
  }

  /* ---------------- Back-navigation (History API): the browser/device back action steps out of
     focus view into the overview before it ever leaves the page for the Library. ---------------- */
  function onPopState(e){
    const st = e.state || { view: "overview" };
    if(st.view === "focus" && st.shotKey) showFocus(st.shotKey, true);
    else{ renderLeftRailScenes(); renderOverview(); if(st.scrollScene) scrollToScene(st.scrollScene); }
  }
  function goToOverview(scrollScene){
    history.pushState({ view: "overview", scrollScene: scrollScene || "" }, "", location.href);
    renderLeftRailScenes(); renderOverview();
    if(scrollScene) scrollToScene(scrollScene);
  }
  function enterFocus(shotKey){
    history.pushState({ view: "focus", shotKey: shotKey }, "", location.href);
    showFocus(shotKey, true);
  }
  function scrollToScene(sceneN){
    const el = document.getElementById("scene-" + sceneN);
    if(el) el.scrollIntoView({ block: "start" });
  }

  /* ---------------- Left rail: scenes ---------------- */
  function sceneHasInk(n){ return (S.shotsByScene[n] || []).some((sh) => panelHasInk(sh.key)); }
  function sceneKeyOf(n){ const shots = S.shotsByScene[n] || []; return shots.length ? shots[0].key.split(":")[1] : ""; }
  // Heading is the compact slug used everywhere as the scene's short label: number, INT/EXT,
  // DAY/NIGHT — the three things you need at a glance to navigate or shoot in order. Location
  // and cast are longer-form, so they live in the subheading underneath instead.
  function sceneTitle(sc){
    const bits = [sc.ie, (sc.dn || "").toUpperCase()].filter(Boolean);
    return "SC " + sc.n + (bits.length ? " - " + bits.join(" - ") : "");
  }
  function sceneSub(sc){ return [sc.set, sc.cast].filter(Boolean).join(" · "); }

  // Jump-to navigation for the all-scenes overview — clicking a scene scrolls to it (and takes
  // you back to the overview first, if a shot's focus view is currently open).
  function renderLeftRailScenes(){
    const rail = document.getElementById("leftRail");
    rail.innerHTML = `<div class="rail-label">SCENES</div>`;
    const list = document.createElement("div");
    S.scenes.forEach((sc) => {
      const shotCount = (S.shotsByScene[sc.n] || []).length;
      const item = document.createElement("div");
      item.className = "scene-item" + (sc.n === S.curScene && S.view === "overview" ? " active" : "");
      item.dataset.sceneN = String(sc.n);
      item.title = [sceneTitle(sc), sceneSub(sc)].filter(Boolean).join(" · ");
      item.innerHTML = `
        <span class="dot${sceneHasInk(sc.n) ? " hasInk" : ""}"></span>
        <span class="txt">
          <span class="num">${escapeHtml(sceneTitle(sc))}</span>
          <span class="sub">${sc.set ? `<span class="loc">${escapeHtml(sc.set)}</span> · ` : ""}${shotCount} shot${shotCount === 1 ? "" : "s"}${sc.isExtra ? " · Added here" : ""}</span>
        </span>
        ${sc.isExtra ? `<button class="sceneDel" type="button" title="Remove this scene" aria-label="Remove this scene">${xIcon()}</button>` : ""}`;
      item.querySelector(".txt").onclick = () => {
        S.curScene = sc.n;
        if(S.view === "focus") goToOverview(sc.n); else { scrollToScene(sc.n); renderLeftRailScenes(); }
      };
      const del = item.querySelector(".sceneDel");
      if(del) del.onclick = (e) => { e.stopPropagation(); removeScene(sc); };
      list.appendChild(item);
    });
    rail.appendChild(list);
    rail.appendChild(document.createElement("div")).className = "railSpacer";
    const addBtn = document.createElement("button");
    addBtn.type = "button"; addBtn.id = "newSceneBtn";
    addBtn.innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg> New scene`;
    addBtn.onclick = () => openNewSceneModal();
    rail.appendChild(addBtn);
  }
  function xIcon(){ return `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 5l14 14M19 5L5 19"/></svg>`; }

  /* ---------------- New scene / remove scene / add shot ---------------- */
  function openNewSceneModal(){
    const shade = document.createElement("div");
    shade.className = "modalShade";
    shade.innerHTML = `
      <div class="modalBox">
        <h3 class="disp">New scene</h3>
        <div class="hint">Adds a real scene to the Shot List Sheet — the Storyboard and Sheet stay in sync either way you edit it.</div>
        <div class="modalRow">
          <div><label>Int / Ext</label><select id="nsIe"><option value="INT">INT</option><option value="EXT">EXT</option><option value="INT/EXT">INT/EXT</option></select></div>
          <div><label>Day / Night</label><select id="nsDn"><option value="D">DAY</option><option value="N">NIGHT</option><option value="M">DUSK/DAWN</option></select></div>
        </div>
        <label>Location</label><input id="nsSet" type="text" placeholder="e.g. KITCHEN" maxlength="60">
        <label>Cast in this scene (optional)</label><input id="nsCast" type="text" placeholder="e.g. MAYA, JORDAN">
        <div class="modalBtns">
          <button class="btn" type="button" id="nsCancel">Cancel</button>
          <button class="btn primary" type="button" id="nsAdd">Add scene</button>
        </div>
      </div>`;
    document.body.appendChild(shade);
    const close = () => shade.remove();
    shade.addEventListener("mousedown", (e) => { if(e.target === shade) close(); });
    shade.querySelector("#nsCancel").onclick = close;
    const setEl = shade.querySelector("#nsSet");
    setTimeout(() => setEl.focus(), 30);
    shade.addEventListener("keydown", (e) => {
      if(e.key === "Escape"){ e.preventDefault(); close(); }
      if(e.key === "Enter" && e.target.tagName === "INPUT"){ e.preventDefault(); shade.querySelector("#nsAdd").click(); }
    });
    shade.querySelector("#nsAdd").onclick = async () => {
      const btn = shade.querySelector("#nsAdd");
      btn.textContent = "Adding…"; btn.disabled = true;
      const body = {
        fileId: S.fileId,
        ie: shade.querySelector("#nsIe").value,
        dn: shade.querySelector("#nsDn").value,
        set: setEl.value.trim(),
        cast: shade.querySelector("#nsCast").value.trim()
      };
      try{
        const res = await apiPost("sb_addscene", body);
        if(!res || res.ok === false) throw new Error((res && res.error) || "Couldn't add that scene.");
        close();
        applyShotlistData(res);
        const added = S.scenes[S.scenes.length - 1];
        renderLeftRailScenes(); renderOverview();
        if(added){ S.curScene = added.n; scrollToScene(added.n); }
        setStatus("Scene added · Saved to the Shot List Sheet");
      }catch(err){
        btn.textContent = "Add scene"; btn.disabled = false;
        notify(String(err.message || err), true);
      }
    };
  }

  function removeScene(sc){
    const hasInk = sceneHasInk(sc.n);
    if(!confirm(`Remove "${sceneTitle(sc)}" from the Shot List Sheet?${hasInk ? " It has sketches on it that will be lost." : ""}`)) return;
    const sceneId = sceneKeyOf(sc.n);
    setStatus("Removing scene…");
    apiPost("sb_removescene", { fileId: S.fileId, sceneId }).then((res) => {
      setStatus("");
      if(!res || res.ok === false){ notify((res && res.error) || "Couldn't remove that scene.", true); return; }
      notify("Scene removed");
      applyShotlistData(res);
      if(S.curScene === sc.n) S.curScene = S.scenes.length ? S.scenes[0].n : null;
      renderLeftRailScenes(); renderOverview();
    });
  }

  function addShotToScene(sceneN){
    const sceneKey = sceneKeyOf(sceneN);
    if(!sceneKey) return;
    setStatus("Adding shot…");
    apiPost("sb_addshot", { fileId: S.fileId, sceneKey }).then((res) => {
      setStatus("");
      if(!res || res.ok === false){ notify((res && res.error) || "Couldn't add that shot.", true); return; }
      applyShotlistData(res);
      renderLeftRailScenes(); renderOverview();
      scrollToScene(sceneN);
      notify("Shot added");
    });
  }

  function removeShot(sh){
    if(!confirm(`Delete Shot ${sh.shot}? This can't be undone.`)) return;
    setStatus("Deleting shot…");
    apiPost("sb_removeshot", { fileId: S.fileId, shotKey: sh.key }).then((res) => {
      setStatus("");
      if(!res || res.ok === false){ notify((res && res.error) || "Couldn't delete that shot.", true); return; }
      notify("Shot " + sh.shot + " deleted");
      applyShotlistData(res);
      renderLeftRailScenes(); renderOverview();
    });
  }

  async function duplicateShot(sh){
    setStatus("Duplicating shot…");
    try{
      const res = await apiPost("sb_duplicateshot", { fileId: S.fileId, shotKey: sh.key });
      if(!res || res.ok === false) throw new Error((res && res.error) || "Couldn't duplicate that shot.");
      applyShotlistData(res);
      if(res.newShotKey) duplicatePanelData(sh.key, res.newShotKey);
      renderLeftRailScenes(); renderOverview();
      setStatus("Shot duplicated");
    }catch(err){
      setStatus("");
      notify(String(err.message || err), true);
    }
  }
  // Copies a shot's sketch (every layer's strokes, plus its reference photo) onto a brand-new
  // shot the Sheet just created — the metadata fields were already copied server-side, but the
  // drawing itself lives in Firebase, not the Sheet, so that half has to happen here.
  function duplicatePanelData(srcKey, newKey){
    const src = panelData(srcKey);
    const dst = panelData(newKey);
    dst.layerVis = Object.assign({ sketch:true, line:true, shading:true, ref:true }, src.layerVis || {});
    dst.ref = src.ref ? Object.assign({}, src.ref) : null;
    Object.keys(src.strokes || {}).forEach((k) => {
      const s = src.strokes[k];
      const localId = "l" + Date.now() + Math.random().toString(36).slice(2, 7);
      const copy = Object.assign({}, s, { pts: (s.pts || []).map((p) => p.slice()), _k: localId });
      dst.strokes[localId] = copy;
      if(S.boardRef){
        const ref = S.boardRef.child("panels/" + fbKey(newKey) + "/strokes").push();
        const payload = Object.assign({}, copy, { pts: JSON.stringify(copy.pts) });
        delete payload._k;
        ref.set(payload).then(() => {
          delete dst.strokes[localId]; dst.strokes[ref.key] = Object.assign({}, copy, { _k: ref.key });
        }).catch(() => {});
      }
    });
    if(S.boardRef && dst.ref) S.boardRef.child("panels/" + fbKey(newKey) + "/ref").set(dst.ref).catch(() => {});
    const blk = blockingBlob(src.blocking);
    if(blk){
      dst.blocking = JSON.parse(blk);
      if(S.boardRef) S.boardRef.child("panels/" + fbKey(newKey) + "/blocking").set(blk).catch(() => {});
    }
    if(Object.keys(dst.strokes).length || dst.ref || blk) markHasContentOnce();
    saveLocalBoard();
  }

  // Refresh S.scenes/S.shots from a shotlistdata-shaped response (from sb_addscene/removescene/addshot)
  function applyShotlistData(sl){
    S.scenes = sl.scenes || [];
    S.shots = sl.shots || [];
    S.shotsByScene = {};
    S.shots.forEach((sh) => { (S.shotsByScene[sh.scene] = S.shotsByScene[sh.scene] || []).push(sh); });
    if(!S.scenes.some((s) => s.n === S.curScene)) S.curScene = S.scenes.length ? S.scenes[0].n : null;
  }

  // 3D blocking is stored as one JSON string per shot (like stroke points), so Realtime Database
  // never reshapes its nested arrays; older/local copies may already be plain objects.
  function parseBlob(v){
    if(!v) return null;
    if(typeof v === "string"){ try{ v = JSON.parse(v); }catch(_e){ return null; } }
    return v && typeof v === "object" ? v : null;
  }
  function blockingBlob(b){
    if(!b || !b.objs) return null;
    return JSON.stringify({ v:1, on:!!b.on, fade:b.fade == null ? 0.85 : b.fade, tn:b.tn || "", objs:b.objs, figs:b.figs || [], cam:b.cam || null, opts:b.opts || {} });
  }

  /* ---------------- Panel data helpers ---------------- */
  // Firebase stores each stroke's points as a JSON string (Realtime Database has no native array-
  // of-pairs type worth trusting); unpack that back into real point arrays once, on load.
  function normalizePanels(raw, boardAspect){
    const out = {};
    Object.keys(raw || {}).forEach((k) => {
      const src = raw[k] || {};
      const strokes = {};
      Object.keys(src.strokes || {}).forEach((sk) => {
        const s = src.strokes[sk] || {};
        let pts = s.pts;
        if(typeof pts === "string"){ try{ pts = JSON.parse(pts); }catch(_e){ pts = []; } }
        pts = pts || [];
        let stroke = Object.assign({}, s, { pts: pts, _k: sk });
        if(!stroke.sp) stroke = migrateLegacyStroke(stroke, boardAspect || MAX_RATIO);
        strokes[sk] = stroke;
      });
      out[k] = { strokes, ref: src.ref || null, blocking: parseBlob(src.blocking), layerVis: { sketch:true, line:true, shading:true, ref:true } };
    });
    return out;
  }
  // Older strokes were saved as fractions of whatever panel size was on screen at the time (0..1
  // of that ratio's width/height). Convert them once, on load, into the fixed logical canvas —
  // best effort, assuming they were drawn at the board's aspect ratio at the time (there was only
  // ever one, since the old version had no per-ratio memory).
  function migrateLegacyStroke(s, oldRatio){
    const offX = logicalOffsetX(oldRatio);
    const pts = (s.pts || []).map((pt) => [offX + (pt[0] || 0) * oldRatio * LOGICAL_H, (pt[1] || 0) * LOGICAL_H]);
    const w = (s.w || 0.006) * oldRatio * LOGICAL_H;
    return Object.assign({}, s, { pts: pts, w: w, sp: 2 });
  }

  function panelData(shotKey){
    const k = fbKey(shotKey);
    return S.panelsCache[k] || (S.panelsCache[k] = { strokes:{}, ref:null });
  }
  function panelHasInk(shotKey){
    const p = panelData(shotKey);
    return p && p.strokes && Object.keys(p.strokes).length > 0;
  }

  /* ---------------- Drawing: shared renderer ---------------- */
  // Strokes are stored in the fixed logical canvas (see LOGICAL_H/LOGICAL_W above); rendering
  // maps that into pixels for whatever canvas size is on screen, using the CURRENT ratio to pick
  // which centered slice of the logical canvas is visible — a narrower ratio just crops the sides.
  function drawStrokeOn(ctx, stroke, w, h){
    const st = TOOL_STYLE[stroke.tool] || TOOL_STYLE.pencil;
    const pts = stroke.pts || [];
    if(pts.length < 2) return;
    const scale = h / LOGICAL_H;
    const P = pts.map((pt) => logicalToPx(pt[0], pt[1], w, h));
    ctx.save();
    ctx.globalCompositeOperation = st.comp;
    ctx.globalAlpha = st.alpha;
    ctx.strokeStyle = stroke.color || "#2a2a28";
    ctx.lineWidth = Math.max(1, (stroke.w || 6) * scale * st.widthMul);
    ctx.lineCap = "round"; ctx.lineJoin = "round";
    ctx.beginPath();
    ctx.moveTo(P[0][0], P[0][1]);
    for(let i = 1; i < P.length - 1; i++){
      const mx = (P[i][0] + P[i+1][0]) / 2, my = (P[i][1] + P[i+1][1]) / 2;
      ctx.quadraticCurveTo(P[i][0], P[i][1], mx, my);
    }
    const last = P[P.length - 1];
    ctx.lineTo(last[0], last[1]);
    ctx.stroke();
    ctx.restore();
  }
  function renderPanelToCanvas(shotKey, canvas, opts){
    opts = opts || {};
    const w = canvas.width, h = canvas.height;
    const ctx = canvas.getContext("2d");
    ctx.clearRect(0, 0, w, h);
    const p = panelData(shotKey);
    const order = ["sketch","line","shading"];
    const hidden = opts.hiddenLayers || {};
    const strokes = Object.values(p.strokes || {}).sort((a, b) => String(a._k || "").localeCompare(String(b._k || "")));
    order.forEach((layerId) => {
      if(hidden[layerId]) return;
      strokes.filter((s) => (s.layer || "line") === layerId).forEach((s) => drawStrokeOn(ctx, s, w, h));
    });
  }

  /* ---------------- Overview: every scene, together, in order ---------------- */
  // Shot order within a scene is a Storyboard-only display convenience — it never touches the
  // Shot List Sheet's own rows or shot labels (1A, 1B...), just how they're arranged here.
  function orderedShotsForScene(n){
    const shots = (S.shotsByScene[n] || []).slice();
    const sceneKey = sceneKeyOf(n);
    const order = S.order[fbKey(sceneKey)];
    if(!order || !order.length) return shots;
    const byKey = {}; shots.forEach((sh) => { byKey[sh.key] = sh; });
    const out = [];
    order.forEach((k) => { if(byKey[k]){ out.push(byKey[k]); delete byKey[k]; } });
    Object.keys(byKey).forEach((k) => out.push(byKey[k])); // any shot not yet in the stored order (e.g. just added)
    return out;
  }
  function saveSceneOrder(n, shots){
    const sceneKey = sceneKeyOf(n);
    S.order[fbKey(sceneKey)] = shots.map((sh) => sh.key);
    if(S.boardRef) S.boardRef.child("order/" + fbKey(sceneKey)).set(shots.map((sh) => sh.key)); else saveLocalBoard();
  }

  function renderOverview(){
    unmountBlocking(); hideBrushCursor(); document.body.classList.remove("b3dOn", "b3dEdit");
    S.view = "overview";

    main.innerHTML = `<div id="gridScroll"></div>`;

      const jumpHref = (sc.id && !sc.isExtra)

        : "";
      section.innerHTML = `

            <div class="h disp">${escapeHtml(sceneTitle(sc))}</div>

  // Keeps the left rail's highlighted scene in sync with whatever's actually on screen as you
  // scroll the overview, not just whichever one you last clicked — the rail is a "where am I"
  // indicator as much as a jump-to list.
  let __scrollSpyRAF = null;
  function wireOverviewScrollSpy(){
    const scroll = document.getElementById("gridScroll");
    if(!scroll) return;
    const onScroll = () => {
      if(__scrollSpyRAF) return;
      __scrollSpyRAF = requestAnimationFrame(() => {
        __scrollSpyRAF = null;
        const top = scroll.scrollTop + 30; // roughly the overview's top padding
        let current = S.scenes.length ? S.scenes[0].n : null;
        S.scenes.forEach((sc) => {
          const el = document.getElementById("scene-" + sc.n);
          if(el && el.offsetTop <= top) current = sc.n;
        });
        if(current !== null && current !== S.curScene){
          S.curScene = current;
          syncRailActive();
        }
      });
    };
    scroll.addEventListener("scroll", onScroll, { passive: true });
  }
  function syncRailActive(){
    document.querySelectorAll("#leftRail .scene-item").forEach((el) => {
      el.classList.toggle("active", Number(el.dataset.sceneN) === S.curScene);
    });
  }

  let __dragShot = null; // { sceneN, key } — the card currently being dragged
  function shotCard(sh, sceneN){
    const card = document.createElement("div");
    card.className = "card";
    card.draggable = true;
    card.dataset.shotKey = sh.key;
    const hasInk = panelHasContent(sh.key);
    const frame = document.createElement("div");
    frame.className = "frame";
    frame.style.aspectRatio = S.ratio + " / 1";
    if(hasInk){
      const cv = document.createElement("canvas");
      cv.width = 480; cv.height = Math.round(480 / S.ratio);
      frame.appendChild(cv);
      renderComposite(sh.key, cv);
    }else{
      frame.innerHTML = `<div class="empty-state">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M15 3L21 9L9 21H3V15L15 3Z" stroke="#a39d86" stroke-width="1.4" stroke-linejoin="round"/></svg>
        No sketch yet</div>`;
    }
    frame.onclick = () => enterFocus(sh.key);
    frame.tabIndex = 0; frame.setAttribute("role", "button"); frame.setAttribute("aria-label", "Draw shot " + sh.shot);
    frame.onkeydown = (e) => { if(e.key === "Enter" || e.key === " "){ e.preventDefault(); enterFocus(sh.key); } };
    const cap = document.createElement("div");
    cap.className = "cap";
    const bits = [sh.size, sh.angle, sh.move, sh.lens].filter(Boolean).map(escapeHtml).join(" &middot; ") || (sh.desc ? escapeHtml(sh.desc) : "No details yet");
    const statusClass = sh.status === "Shot" ? "shot" : sh.status === "Needs reshoot" ? "reshoot" : "";
    cap.innerHTML = `
      <div class="top">
        <span class="statusDot ${statusClass}" title="${escapeHtml(sh.status || "Not shot")}"></span>
        <span class="shotLabel">Shot ${escapeHtml(sh.shot)}</span>
        <span class="cardActions">
          <span class="cardMenu">
            <button class="miniBtn dupBtn" type="button" title="Duplicate shot" aria-label="Duplicate shot">${dupIcon()}</button>
            <button class="miniBtn delBtn" type="button" title="Delete shot" aria-label="Delete shot">${trashIcon()}</button>
          </span>
          <span class="grip" title="Drag to reorder">${gripIcon()}</span>
        </span>
      </div>
      <div class="sub">${bits}</div>`;
    card.appendChild(frame); card.appendChild(cap);
    cap.onclick = (e) => { if(!e.target.closest("button, .grip")) enterFocus(sh.key); };
    cap.querySelector(".dupBtn").onclick = (e) => { e.stopPropagation(); duplicateShot(sh); };
    cap.querySelector(".delBtn").onclick = (e) => { e.stopPropagation(); removeShot(sh); };

    // Drag-to-reorder, within this same scene only — but not when the drag started from the
    // duplicate/delete buttons, which sit inside the same draggable card.
    card.addEventListener("dragstart", (e) => {
      if(e.target.closest(".cardMenu")){ e.preventDefault(); return; }
      __dragShot = { sceneN, key: sh.key };
      card.classList.add("dragging");
      try{ e.dataTransfer.setData("text/plain", sh.key); }catch(_e){}
      e.dataTransfer.effectAllowed = "move";
    });
    card.addEventListener("dragend", () => { card.classList.remove("dragging"); __dragShot = null; });
    card.addEventListener("dragover", (e) => {
      if(!__dragShot || __dragShot.sceneN !== sceneN || __dragShot.key === sh.key) return;
      e.preventDefault(); e.dataTransfer.dropEffect = "move";
      card.classList.add("dragOver");
    });
    card.addEventListener("dragleave", () => card.classList.remove("dragOver"));
    card.addEventListener("drop", (e) => {
      card.classList.remove("dragOver");
      if(!__dragShot || __dragShot.sceneN !== sceneN || __dragShot.key === sh.key) return;
      e.preventDefault();
      const shots = orderedShotsForScene(sceneN);
      const from = shots.findIndex((x) => x.key === __dragShot.key);
      const to = shots.findIndex((x) => x.key === sh.key);
      if(from < 0 || to < 0) return;
      const moved = shots.splice(from, 1)[0];
      shots.splice(to, 0, moved);
      saveSceneOrder(sceneN, shots);
      renderOverview();
    });
    return card;
  }
  function gripIcon(){ return `<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.4"/><circle cx="15" cy="6" r="1.4"/><circle cx="9" cy="12" r="1.4"/><circle cx="15" cy="12" r="1.4"/><circle cx="9" cy="18" r="1.4"/><circle cx="15" cy="18" r="1.4"/></svg>`; }
  function dupIcon(){ return `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="8" y="8" width="12" height="12" rx="1.5"/><path d="M4 16V5a1 1 0 0 1 1-1h11"/></svg>`; }
  function trashIcon(){ return `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2m-9 0 1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13" stroke-linecap="round" stroke-linejoin="round"/></svg>`; }

  // Shares shotCard's frame+cap structure (not a plain box) so it lines up with the real cards
  // in the same row at any aspect ratio, instead of sitting shorter or taller than its neighbors.
  function addTile(sceneN){
    const btn = document.createElement("button");
    btn.type = "button"; btn.className = "card addTile";
    btn.innerHTML = `
      <div class="frame" style="aspect-ratio:${S.ratio} / 1;display:flex;align-items:center;justify-content:center;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 5v14M5 12h14"/></svg>
      </div>
      <div class="cap" style="align-items:center;"><div class="top" style="justify-content:center;">Add shot</div></div>`;
    btn.onclick = () => addShotToScene(sceneN);
    return btn;
  }

  /* ---------------- Print / export: A4 landscape, 8 shots a page, grouped by scene ---------------- */
  // Each scene starts on its own page — its shots never share a page with another scene's — so a
  // page reads as one continuous block instead of a jumble of two different scenes stitched
  // together. A scene longer than 8 shots just continues onto a second page for that same scene.
  const PRINT_PER_PAGE = 8;
  async function printBoard(){
    if(S.shots.some((sh) => blockingOn(sh.key)) && window.SB3D && !SB3D.loaded()){
      setStatus("Preparing 3D blocking…");
      try{ await SB3D.ready(); }catch(_e){}
      setStatus("");
    }
    const root = document.getElementById("printRoot");
    root.innerHTML = "";
    if(!S.scenes.length){ notify("Add some scenes first — there's nothing to print yet.", true); return; }

    const scenePages = [];
    S.scenes.forEach((sc) => {
      const shots = orderedShotsForScene(sc.n);
      if(!shots.length) return;
      const chunks = [];
      for(let i = 0; i < shots.length; i += PRINT_PER_PAGE) chunks.push(shots.slice(i, i + PRINT_PER_PAGE));
      chunks.forEach((items, i) => scenePages.push({ sc: sc, items: items, part: i + 1, parts: chunks.length }));
    });
    if(!scenePages.length){ notify("Add some shots first — there's nothing to print yet.", true); return; }

    scenePages.forEach((pg, pageIdx) => {
      const page = document.createElement("div");
      page.className = "printPage";
      const label = sceneTitle(pg.sc) + (pg.parts > 1 ? " — part " + pg.part + " of " + pg.parts : "");
      const sub = sceneSub(pg.sc);
      page.innerHTML = `
        <div class="printPageHead">
          <div>
            <div class="t">${escapeHtml(S.title)}</div>
            <div class="sceneLabel">${escapeHtml(label)}${sub ? " &middot; " + escapeHtml(sub) : ""}</div>
          </div>
          <span class="pageNum">Page ${pageIdx + 1} of ${scenePages.length}</span>
        </div>
        <div class="printGrid"></div>`;
      const grid = page.querySelector(".printGrid");
      pg.items.forEach((sh) => {
        const card = document.createElement("div");
        card.className = "printCard";
        const bits = [sh.size, sh.angle, sh.move, sh.lens].filter(Boolean).join(" · ");
        card.innerHTML = `
          <div class="pFrame"></div>
          <div class="pCap">
            <div class="pTop">Shot ${escapeHtml(sh.shot)}</div>
            <div class="pMeta">${escapeHtml(bits) || "&nbsp;"}</div>
            ${sh.desc ? `<div class="pDesc">${escapeHtml(sh.desc)}</div>` : ""}
          </div>`;
        const frame = card.querySelector(".pFrame");
        if(panelHasContent(sh.key)){
          const cv = document.createElement("canvas");
          cv.width = 640; cv.height = Math.round(640 / S.ratio);
          frame.appendChild(cv);
          renderComposite(sh.key, cv);
        }
        grid.appendChild(card);
      });
      root.appendChild(page);
    });

    setTimeout(() => window.print(), 60); // let the canvases paint before the print dialog opens
  }

  function eyeIcon(on){
    return on

      : `<svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M2 12C2 12 5.5 5 12 5C18.5 5 22 12 22 12C22 12 18.5 19 12 19C5.5 19 2 12 2 12Z" stroke="#8f8f8a" stroke-width="1.5"/><circle cx="12" cy="12" r="3" stroke="#8f8f8a" stroke-width="1.5"/></svg>`;
  }

    return `<select id="${id}">${opts.map((o) => `<option value="${escapeHtml(o)}"${o === (cur || "") ? " selected" : ""}>${escapeHtml(o || "—")}</option>`).join("")}</select>`;

  function saveShotField(sh, field, value, fromCam){
    const prev = sh[field];
    if(prev === value) return;
    sh[field] = value;
    __pendingEdits[sh.key + "|" + field] = { v: value, t: Date.now() };
    if(!fromCam && SHEET_CAM_FIELDS[field]) sheetToCamera(sh);
    setStatus("Saving…");
    apiPost("sb_editshot", { fileId: S.fileId, shotKey: sh.key, field: field, value: value }).then((res) => {
      if(!res || res.ok === false){
        sh[field] = prev;
        setStatus("Couldn't save that change: " + ((res && res.error) || "unknown error"));
        if(S.curShotKey === sh.key) renderRightRailInfo(sh);
        return;
      }
      setStatus("Saved · " + new Date().toLocaleTimeString());
    }).catch((err) => {
      sh[field] = prev;
      setStatus("Couldn't save that change: " + (err.message || err));
      if(S.curShotKey === sh.key) renderRightRailInfo(sh);
    });
  }

  function buildToolbar(){

      { id:"soft", label:"Soft brush", key:"B", svg:`<circle cx="12" cy="12" r="7" stroke-dasharray="2 2"/>` },

      b.style.background = c; b.setAttribute("aria-label", name); b.title = name;
      b.onclick = () => { S.color = c; savePrefs(); if(S.mode3d !== "draw") setMode3d("draw"); buildToolbar(); };
      cg.appendChild(b);
    });
    // Any other colour: the native picker, shown as a rainbow swatch (filled with the colour once picked)
    const custom = !INK_COLORS.some(([c]) => c === S.color);
