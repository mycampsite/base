    if(custom) pick.style.background = S.color;
    pick.innerHTML = `<input type="color" value="${/^#[0-9a-f]{6}$/i.test(S.color) ? S.color : "#2a2a28"}" aria-label="Pick any colour">`;
    pick.querySelector("input").oninput = (e) => { S.color = e.target.value; pick.style.background = S.color; };
    pick.querySelector("input").onchange = () => { savePrefs(); if(S.mode3d !== "draw") setMode3d("draw"); buildToolbar(); };
    cg.appendChild(pick);
    document.getElementById("weightRange").oninput = (e) => { S.weight = Number(e.target.value) || 3; savePrefs(); updateBrushCursor(); };
    document.getElementById("weightRange").title = "Brush size ( [ smaller · ] bigger )";
    document.getElementById("undoBtn").onclick = () => undoAny();
    document.getElementById("redoBtn").onclick = () => redoAny();
    buildModeGroup();
    document.getElementById("prevShotBtn").onclick = () => stepShot(-1);
    document.getElementById("nextShotBtn").onclick = () => stepShot(1);
    updateShotNav();
    updateUndoState();
    document.getElementById("zoomOutBtn").onclick = () => setZoom(S.zoom - 0.25);
    document.getElementById("zoomInBtn").onclick = () => setZoom(S.zoom + 0.25);
    document.getElementById("zoomResetBtn").onclick = () => setZoom(1);
    updateZoomLabel();
  }

  // Zoom is a CSS transform on #panelStack — since wireDrawing()'s posOf() derives its scale
  // factor from the canvas's live, on-screen size (getBoundingClientRect), zooming in or out
  // never throws off where a stroke actually lands. #canvasWrap already scrolls (overflow:auto),
  // so panning around a zoomed-in panel is just scrolling.
  const ZOOM_MIN = 0.5, ZOOM_MAX = 3;
  /* ---------------- Drawing palette + brush cursor ---------------- */
  const INK_COLORS = [
    ["#2a2a28","Ink"], ["#6b6960","Graphite"], ["#a8a395","Light grey"], ["#faf8f2","Paper white"],
    ["#c1272d","Red"], ["#e07a1f","Orange"], ["#e8c22c","Yellow"], ["#2f9e57","Green"],
    ["#1b9aa0","Teal"], ["#2f62c9","Blue"], ["#7a4fc4","Purple"], ["#8a5a3a","Brown"]
  ];
  let __ringXY = null;
  function brushRing(){
    let r = document.getElementById("brushRing");
    if(!r){ r = document.createElement("div"); r.id = "brushRing"; document.body.appendChild(r); }
    return r;
  }
  // On-screen diameter = the stroke width the brush will actually lay down at the current zoom.
  function brushDiameter(){
    const cv = document.getElementById("drawCanvas"); if(!cv) return 0;
    const st = TOOL_STYLE[S.tool] || TOOL_STYLE.pencil;
    return Math.max(1, S.weight * STROKE_W_SCALE * st.widthMul * cv.getBoundingClientRect().height / LOGICAL_H);
  }
  function moveBrushCursor(e){
    const cv = document.getElementById("drawCanvas");
    if(e.pointerType === "touch" || S.mode3d !== "draw"){ hideBrushCursor(); return; }
    __ringXY = [e.clientX, e.clientY];
    if(cv) cv.classList.add("ringCursor");
    updateBrushCursor();
  }
  function updateBrushCursor(){
    const r = brushRing();
    if(!__ringXY || S.view !== "focus" || S.mode3d !== "draw"){ r.style.display = "none"; return; }
    const d = brushDiameter(), size = Math.max(5, d);
    r.style.display = "block"; r.style.width = size + "px"; r.style.height = size + "px";
    r.style.left = __ringXY[0] + "px"; r.style.top = __ringXY[1] + "px";
    r.classList.toggle("eraser", S.tool === "eraser"); r.classList.toggle("tiny", d < 6);
  }
  function hideBrushCursor(){ __ringXY = null; const r = document.getElementById("brushRing"); if(r) r.style.display = "none"; }

  function setZoom(z){
    S.zoom = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, Math.round(z * 100) / 100));
    const stack = document.getElementById("panelStack");
    if(stack) stack.style.transform = "scale(" + S.zoom + ")";
    updateZoomLabel(); updateBrushCursor();
  }
  function updateZoomLabel(){
    const el = document.getElementById("zoomLabel");
    if(el) el.textContent = Math.round(S.zoom * 100) + "%";
  }

  function buildCanvasStack(shotKey){
    const stack = document.getElementById("panelStack");
    const wrap = document.getElementById("canvasWrap");
    const availW = Math.max(200, (wrap ? wrap.clientWidth : 920) - 40);
    const availH = Math.max(140, (wrap ? wrap.clientHeight : 600) - 40);
    const wCss = Math.round(Math.min(880, availW, availH * S.ratio >= 200 ? availH * S.ratio : availW)), hCss = Math.round(wCss / S.ratio);
    stack.style.width = wCss + "px"; stack.style.height = hCss + "px";
    stack.style.transform = "scale(" + S.zoom + ")";
    stack.innerHTML = `
      <canvas id="cvBlock" width="${wCss}" height="${hCss}"></canvas>
      <canvas id="cvRef" width="${wCss}" height="${hCss}"></canvas>
      <canvas id="cvInk" width="${wCss}" height="${hCss}"></canvas>
      <canvas id="drawCanvas" width="${wCss}" height="${hCss}"></canvas>`;
    redrawStack();
    wireDrawing(shotKey);
    wireZoomWheel();
    mountBlocking(shotKey);
  }
  let __resizeT = 0;
  window.addEventListener("resize", () => {
    clearTimeout(__resizeT);
    __resizeT = setTimeout(() => { if(S.view === "focus" && S.curShotKey && document.getElementById("panelStack")) buildCanvasStack(S.curShotKey); }, 150);
  });

  /* ---------------- Previous / next shot, across scenes in board order ---------------- */
  function boardOrder(){ const out = []; S.scenes.forEach((sc) => orderedShotsForScene(sc.n).forEach((sh) => out.push(sh))); return out; }
  function stepShot(dir){
    const all = boardOrder(); const i = all.findIndex((x) => x.key === S.curShotKey);
    const next = all[i + dir]; if(!next) return;
    history.replaceState({ view: "focus", shotKey: next.key }, "", location.href);
    showFocus(next.key, true);
  }
  function updateShotNav(){
    const all = boardOrder(); const i = all.findIndex((x) => x.key === S.curShotKey);
    const pos = document.getElementById("shotPos"); if(pos) pos.textContent = i >= 0 ? (i + 1) + " / " + all.length : "";
    const pv = document.getElementById("prevShotBtn"), nx = document.getElementById("nextShotBtn");
    if(pv) pv.disabled = i <= 0; if(nx) nx.disabled = i < 0 || i >= all.length - 1;
  }

  // Ctrl/Cmd+scroll zooms the panel, same gesture as most drawing/design tools — a plain scroll
  // still just scrolls #canvasWrap to pan around when zoomed in.
  function wireZoomWheel(){
    const wrap = document.getElementById("canvasWrap");
    if(!wrap || wrap.__zoomWired) return;
    wrap.__zoomWired = true;
    wrap.addEventListener("wheel", (e) => {
      if(!(e.ctrlKey || e.metaKey)) return;
      e.preventDefault();
      setZoom(S.zoom + (e.deltaY < 0 ? 0.1 : -0.1));
    }, { passive: false });
  }

  function redrawStack(){
    const p = panelData(S.curShotKey);
    const cvInk = document.getElementById("cvInk");
    if(cvInk) renderPanelToCanvas(S.curShotKey, cvInk, { hiddenLayers: { sketch: !p.layerVis.sketch, line: !p.layerVis.line, shading: !p.layerVis.shading } });
    const cvRef = document.getElementById("cvRef");
    if(cvRef){
      const ctx = cvRef.getContext("2d");
      ctx.clearRect(0, 0, cvRef.width, cvRef.height);
      if(p.layerVis.ref && p._refImg){
        const img = p._refImg, cw = cvRef.width, ch = cvRef.height;
        const sc = Math.max(cw / img.width, ch / img.height), dw = img.width * sc, dh = img.height * sc;
        ctx.globalAlpha = blockingOn(S.curShotKey) ? 0.5 : 1;
        ctx.drawImage(img, (cw - dw) / 2, (ch - dh) / 2, dw, dh);
        ctx.globalAlpha = 1;
      }
    }
  }

  function wireDrawing(shotKey){
    const cv = document.getElementById("drawCanvas");
    const ctx = cv.getContext("2d");
    let drawing = false, pts = [];
    const posOf = (e) => {
      const r = cv.getBoundingClientRect();
      const scale = r.height / LOGICAL_H;
      return [(e.clientX - r.left) / scale + logicalOffsetX(S.ratio), (e.clientY - r.top) / scale];
    };

    cv.onpointerdown = (e) => {
      drawing = true; pts = [posOf(e)];
      cv.setPointerCapture(e.pointerId);
    };
    cv.onpointermove = (e) => {
      if(!drawing) return;
      pts.push(posOf(e));
      ctx.clearRect(0, 0, cv.width, cv.height);
      drawStrokeOn(ctx, liveStroke(pts), cv.width, cv.height);
    };
    const finish = () => {
      if(!drawing) return;
      drawing = false;
      ctx.clearRect(0, 0, cv.width, cv.height);
      if(pts.length > 1) commitStroke(shotKey, liveStroke(pts));
      pts = [];
    };
    cv.onpointerup = finish;
    cv.onpointercancel = finish;
    cv.onpointerleave = () => { if(drawing) finish(); };
    cv.addEventListener("pointermove", (e) => moveBrushCursor(e));
    cv.addEventListener("pointerdown", (e) => moveBrushCursor(e));
    cv.addEventListener("pointerenter", (e) => moveBrushCursor(e));
    cv.addEventListener("pointerleave", () => hideBrushCursor());
  }
  function liveStroke(pts){
    return { tool:S.tool, color:S.color, layer:S.activeLayer, w: S.weight * STROKE_W_SCALE, pts: pts.slice(), sp: 2 };
  }

  // Simple session-once flag so the Library's "has a storyboard" badge lights up the first
  // time this session actually puts something on the board (a stroke or a reference photo).
  let __markedHasContent = false;
  function markHasContentOnce(){
    if(__markedHasContent) return;
    __markedHasContent = true;
    apiPost("sb_mark", { fileId: S.fileId }).catch(() => {});
  }

  function commitStroke(shotKey, stroke, isRetry){
    const p = panelData(shotKey);
    const localId = stroke._k || ("l" + Date.now() + Math.random().toString(36).slice(2, 7));
    stroke._k = localId;
    if(!isRetry){
      p.strokes[localId] = stroke;
      if(!stroke._fromRedo) S.redo[fbKey(shotKey)] = [];   // a fresh stroke ends the redo chain
      delete stroke._fromRedo;
      if(S.curShotKey === shotKey && S.view === "focus") redrawStack();
      updateUndoState();
      markHasContentOnce();
    }
    if(S.boardRef){
      setStatus("Saving…");
      const ref = S.boardRef.child("panels/" + fbKey(shotKey) + "/strokes").push();
      const payload = Object.assign({}, stroke, { pts: JSON.stringify(stroke.pts) });
      delete payload._k;
      ref.set(payload).then(() => {
        // Undone while it was still uploading: take it back out of the cloud too (it used to reappear)
        if(!p.strokes[localId]){ ref.remove().catch(() => {}); setStatus("Saved · " + new Date().toLocaleTimeString()); return; }
        delete p.strokes[localId]; p.strokes[ref.key] = Object.assign({}, stroke, { _k: ref.key });
        setStatus("Saved · " + new Date().toLocaleTimeString());
      }).catch((err) => {
        // Kept on this device (p.strokes[localId] is untouched) so nothing is lost — one automatic
        // retry, then a message with the real reason instead of a generic "check your connection".
        const msg = (err && err.message) || String(err);
        if(!p.strokes[localId]) return;
        if(!isRetry){ setStatus("Saving…"); setTimeout(() => commitStroke(shotKey, stroke, true), 1500); return; }
        setStatus("Not saved to the cloud (" + msg + ") — kept on this device only for now.", true);
      });
    }else{
      saveLocalBoard();
    }
  }
  // Newest stroke first. Local ids ("l<time>") are still uploading, so they're always the newest;
  // cloud push ids sort by time on their own.
  function newestStrokeKey(p){
    const keys = Object.keys(p.strokes || {});
    if(!keys.length) return "";
    const local = keys.filter((k) => /^l\d/.test(k)).sort();
    if(local.length) return local[local.length - 1];
    keys.sort(); return keys[keys.length - 1];
  }
  function undoLastStroke(){
    const p = panelData(S.curShotKey);
    const last = newestStrokeKey(p);
    if(!last) return;
    const stroke = p.strokes[last];
    delete p.strokes[last];
    const rk = fbKey(S.curShotKey);
    (S.redo[rk] = S.redo[rk] || []).push(Object.assign({}, stroke, { pts: (stroke.pts || []).map((pt) => pt.slice()) }));
    redrawStack();
    updateUndoState();
    if(S.boardRef && !/^l\d/.test(last)) S.boardRef.child("panels/" + fbKey(S.curShotKey) + "/strokes/" + last).remove();
    else if(!S.boardRef) saveLocalBoard();
  }
  function redoStroke(){
    const rk = fbKey(S.curShotKey);
    const st = (S.redo[rk] || []).pop();
    if(!st) return;
    const copy = Object.assign({}, st, { _fromRedo: true });
    delete copy._k;
    commitStroke(S.curShotKey, copy);
  }
  // Greys out and disables Undo once there's nothing left to undo, instead of leaving it clickable
  // forever with no effect — small, but it's the kind of thing an industry tool gets right.
  function updateUndoState(){
    const btn = document.getElementById("undoBtn");
    if(!btn) return;
    if(S.mode3d !== "draw" && window.SB3D && SB3D.loaded() && SB3D.isMounted()){
      btn.disabled = !SB3D.canUndo();
      const rb3 = document.getElementById("redoBtn"); if(rb3) rb3.disabled = !SB3D.canRedo();
      return;
    }
    const p = panelData(S.curShotKey);
    btn.disabled = !Object.keys(p.strokes || {}).length;
    const rb = document.getElementById("redoBtn");
    if(rb) rb.disabled = !((S.redo[fbKey(S.curShotKey)] || []).length);
  }


  /* ---------------- 3D blocking (per shot, optional) ----------------
     A shot's blocking lives on its panel as p.blocking = { on, fade, tn, objs, figs, cam, opts }.
     Turning it off keeps the data (on:false), so switching back restores the same set. Off means the
     shot is exactly the original white-paper drawing. */
  function blockingOn(shotKey){ const p = panelData(shotKey); return !!(p.blocking && p.blocking.on); }
  // Nearest earlier shot in the SAME scene with blocking — a new scene starts fresh with its own cast.
  function prevBlocking(shotKey){
    const sh = S.shots.find((x) => x.key === shotKey); if(!sh) return null;
    const all = orderedShotsForScene(sh.scene), i = all.findIndex((x) => x.key === shotKey);
    for(let j = i - 1; j >= 0; j--){ const q = panelData(all[j].key).blocking; if(q && q.objs) return q; }
    return null;
  }
  function toggleBlocking(shotKey){
    const p = panelData(shotKey);
    if(p.blocking && p.blocking.on){
      p.blocking.on = false; S.mode3d = "draw"; saveBlocking(shotKey);
      unmountBlocking(); renderLeftRailLayers(shotKey); applyBlockingUi(); redrawStack(); buildToolbar();
      return;
    }
    setStatus("Loading 3D…");
    SB3D.ready().then((api) => {
      setStatus("");
      if(!p.blocking || !p.blocking.objs){
        const prev = prevBlocking(shotKey);
        api.setCast(boardCast());
        p.blocking = prev ? JSON.parse(JSON.stringify(prev)) : api.newState("Empty", castForShot(shotKey));
        if(!prev){ const sh = S.shots.find((x) => x.key === shotKey), sc = sh && S.scenes.find((x) => String(x.n) === String(sh.scene));
          if(sc && /night/i.test(sc.dn || "")) p.blocking.opts.night = true; }
        if(p.blocking.fade == null) p.blocking.fade = 0.85;
      }
      p.blocking.on = true;
      saveBlocking(shotKey); markHasContentOnce();
      if(S.curShotKey !== shotKey || S.view !== "focus") return;
      S.mode3d = "cam";
      renderLeftRailLayers(shotKey); buildToolbar(); mountBlocking(shotKey); applyBlockingUi(); redrawStack();
    }).catch((err) => { setStatus(""); notify((err && err.message) || "Couldn't start 3D blocking.", true); });
  }
  function mountBlocking(shotKey){
    if(!blockingOn(shotKey) || !window.SB3D) return;
    const cv = document.getElementById("cvBlock"); if(!cv) return;
    SB3D.ready().then((api) => {
      if(S.curShotKey !== shotKey || S.view !== "focus" || !blockingOn(shotKey)) return;
      const cvNow = document.getElementById("cvBlock"); if(!cvNow) return;
      api.setLocations(S.blockSets);
      api.setCast(boardCast());
      api.mount({
        canvas: cvNow, panel: document.getElementById("b3dWrap"), state: panelData(shotKey).blocking,
        ratio: S.ratio, mode: S.mode3d,
        prevShot: () => prevBlocking(shotKey),
        onChange: () => saveBlocking(shotKey),
        onCamEnd: () => { saveBlocking(shotKey); cameraToSheet(shotKey); },
        onHistory: () => updateUndoState(),
        onLocations: (sets) => saveBlockSets(sets),
        onRatio: (r) => { const sel = document.getElementById("ratioSel"); const opt = [...sel.options].find((o) => Math.abs(Number(o.value) - r) < 0.01); if(!opt || sel.value === opt.value) return; sel.value = opt.value; sel.onchange({ target: sel }); }
      });
      applyBlockingUi();
      reconcileWithSheet(shotKey);
    }).catch(() => {});
  }

  /* ---------------- 3D blocking <-> Shot List Sheet (Size / Angle / Lens) ----------------
     Both ways, automatically: changing a dropdown (here or in the Sheet) reframes the 3D camera;
     finishing a camera move writes the matching Size / Angle / Lens back through sb_editshot.
     Values a camera can't express are never overwritten. */
  const SHEET_CAM_FIELDS = { size:"fSize", angle:"fAngle", lens:"fLens" };
  const SHEET_KEEP = { size:["OTS","TWO SHOT","INSERT","CUTAWAY"], angle:["POV"], lens:["Zoom"] };
  function blockingLive(shotKey){ return S.view === "focus" && S.curShotKey === shotKey && blockingOn(shotKey) && window.SB3D && SB3D.loaded() && SB3D.isMounted(); }
  function sheetToCamera(sh){ if(blockingLive(sh.key)) SB3D.applyShot({ size: sh.size || "", angle: sh.angle || "", lens: sh.lens || "" }); }
  function cameraToSheet(shotKey){
    if(!blockingLive(shotKey)) return;
    const sh = S.shots.find((x) => x.key === shotKey); if(!sh) return;
    const r = SB3D.readShot();
    Object.keys(SHEET_CAM_FIELDS).forEach((f) => {
      const cur = sh[f] || "", v = r[f];
      if(!v || v === cur || SHEET_KEEP[f].includes(cur)) return;
      saveShotField(sh, f, v, true);
      const el = document.getElementById(SHEET_CAM_FIELDS[f]); if(el) el.value = v;
    });
  }
  // When a shot opens with blocking on: if the Sheet says something the camera doesn't show
  // (edited in the Sheet, or blocking only just turned on), frame the camera from the Sheet.
  function reconcileWithSheet(shotKey){
    if(!blockingLive(shotKey)) return;
    const sh = S.shots.find((x) => x.key === shotKey); if(!sh) return;
    const r = SB3D.readShot();
    const off = Object.keys(SHEET_CAM_FIELDS).some((f) => { const cur = sh[f] || ""; return cur && !SHEET_KEEP[f].includes(cur) && r[f] !== cur; });
    if(off) sheetToCamera(sh);
  }

  /* ---------------- Characters from the Shot List ----------------
     Every name in the scenes' and shots' Cast fields, in script order. Each keeps one colour on
     every shot, and a newly blocked shot starts with that shot's cast (or its scene's cast). */
  function splitNames(v){ return String(v || "").split(/\s*(?:,|;|\/|&|\band\b|\n)\s*/i).map((x) => x.trim()).filter((x) => x && x.length <= 30); }
  function boardCast(){
    const out = [];
    S.scenes.forEach((sc) => { splitNames(sc.cast).forEach((n) => out.push(n)); orderedShotsForScene(sc.n).forEach((sh) => splitNames(sh.cast).forEach((n) => out.push(n))); });
    return out;
  }
  function castForShot(shotKey){
    const sh = S.shots.find((x) => x.key === shotKey); if(!sh) return [];
    const own = splitNames(sh.cast);
    if(own.length) return own;
    const sc = S.scenes.find((x) => String(x.n) === String(sh.scene));
    return sc ? splitNames(sc.cast) : [];
  }
  function unmountBlocking(){ if(window.SB3D && SB3D.loaded()) SB3D.unmount(); }
  // Batch D will save this to Firebase / this device; for now blocking lives in memory for the session.
  const __blkSaveT = {};
  function saveBlocking(shotKey){
    const k = fbKey(shotKey);
    clearTimeout(__blkSaveT[k]);
    __blkSaveT[k] = setTimeout(() => {
      delete __blkSaveT[k];
      const blk = blockingBlob(panelData(shotKey).blocking);
      if(!blk) return;
      if(!S.boardRef){ saveLocalBoard(); return; }
      setStatus("Saving…");
      S.boardRef.child("panels/" + k + "/blocking").set(blk)
        .then(() => setStatus("Saved · " + new Date().toLocaleTimeString()))
        .catch((err) => setStatus("3D blocking not saved to the cloud (" + ((err && err.message) || err) + ").", true));
    }, 700);
  }
  function saveBlockSets(sets){
    S.blockSets = sets || {};
    if(!S.boardRef){ saveLocalBoard(); return; }
    S.boardRef.child("blockSets").set(JSON.stringify(S.blockSets))
      .catch((err) => setStatus("Saved location not stored in the cloud (" + ((err && err.message) || err) + ").", true));
  }
  function setMode3d(m){
    S.mode3d = m;
    if(m !== "draw") hideBrushCursor();
    if(window.SB3D && SB3D.loaded()) SB3D.setMode(m);
    applyBlockingUi(); buildModeGroup(); updateUndoState();
  }
  function buildModeGroup(){
    const g = document.getElementById("b3dModes");
    if(!g) return;
    const on = blockingOn(S.curShotKey);
    g.style.display = on ? "flex" : "none";
    if(!on){ g.innerHTML = ""; return; }
    const modes = [["draw","Draw"],["cam","Camera"],["set","Set"],["fig","Figures"]];
    g.innerHTML = modes.map(([id, label]) => `<button type="button" data-m="${id}" class="${S.mode3d === id ? "active" : ""}" aria-pressed="${S.mode3d === id}">${label}</button>`).join("");
    g.querySelectorAll("button").forEach((b) => { b.onclick = () => setMode3d(b.dataset.m); });
  }
  function applyBlockingUi(){
    const on = S.view === "focus" && blockingOn(S.curShotKey);
    document.body.classList.toggle("b3dOn", on);
    document.body.classList.toggle("b3dEdit", on && S.mode3d !== "draw");
    const cv = document.getElementById("cvBlock");
    if(cv) cv.style.opacity = on ? String(panelData(S.curShotKey).blocking.fade == null ? 0.85 : panelData(S.curShotKey).blocking.fade) : "";
  }
  function undoAny(){ if(S.mode3d !== "draw" && window.SB3D && SB3D.loaded() && SB3D.isMounted()){ SB3D.undo(); updateUndoState(); } else undoLastStroke(); }
  function redoAny(){ if(S.mode3d !== "draw" && window.SB3D && SB3D.loaded() && SB3D.isMounted()){ SB3D.redo(); updateUndoState(); } else redoStroke(); }


  /* ---------------- Board thumbnails + print: 3D blocking under the sketch ----------------
     Blocking and ink are drawn on separate offscreen canvases and then stacked, so an eraser
     stroke only ever removes ink — never the 3D set underneath. */
  const __offInk = document.createElement("canvas"), __offBlk = document.createElement("canvas");
  let __thumb3dQueued = false;
  function panelHasContent(shotKey){ return panelHasInk(shotKey) || blockingOn(shotKey); }
  function renderComposite(shotKey, canvas){
    const w = canvas.width, h = canvas.height, ctx = canvas.getContext("2d");
    ctx.clearRect(0, 0, w, h);
    const b = panelData(shotKey).blocking;
    if(b && b.on){
      if(window.SB3D && SB3D.loaded()){
        __offBlk.width = w; __offBlk.height = h;
        SB3D.renderTo(__offBlk, b, S.ratio);
        ctx.fillStyle = "#faf8f2"; ctx.fillRect(0, 0, w, h);
        ctx.globalAlpha = b.fade == null ? 0.85 : b.fade; ctx.drawImage(__offBlk, 0, 0); ctx.globalAlpha = 1;
      }else if(window.SB3D && !__thumb3dQueued){
        // three.js isn't loaded yet: fetch it once, then redraw the board with the blocking in.
        __thumb3dQueued = true;
        SB3D.ready().then(() => { if(S.view === "overview") renderOverview(); }).catch(() => {});
      }
    }
    if(panelHasInk(shotKey)){
      __offInk.width = w; __offInk.height = h;
      renderPanelToCanvas(shotKey, __offInk, {});
      ctx.drawImage(__offInk, 0, 0);
    }
  }


  /* ---------------- Shot List -> Storyboard: pick up edits made in the Sheet ----------------
     Re-reads the Shot List every 30s while the tab is visible, and straight away when you come back
     to the tab. Changes to scenes, shots and their details appear on the board and in the open
     shot; a changed Size / Angle / Lens reframes the 3D camera. Edits made here in the last 15s win
     over the refresh, so a slow save can't be undone by an older read. Read-only: nothing is written. */
  let __slSig = "", __slBusy = false, __slLast = 0, __slTimer = 0;
  const __pendingEdits = {};
  const DETAIL_FIELDS = { fSize:"size", fAngle:"angle", fMove:"move", fLens:"lens", fEquip:"equip", fStatus:"status", fCast:"cast", fDesc:"desc", fNotes:"notes" };
  function shotlistSig(sl){ return JSON.stringify([sl.scenes || [], sl.shots || []]); }
  function startShotlistWatch(){
    clearInterval(__slTimer);
    __slTimer = setInterval(() => refreshShotlist(false), 30000);
    window.addEventListener("focus", () => refreshShotlist(false));
    document.addEventListener("visibilitychange", () => { if(!document.hidden) refreshShotlist(false); });
  }
  async function refreshShotlist(force){
    if(__slBusy || document.hidden || !S.fileId) return;
    if(!force && Date.now() - __slLast < 5000) return;
    if(__dragShot || document.querySelector(".modalShade")) return;
    __slBusy = true; __slLast = Date.now();
    try{
      const sl = await apiGet("shotlistdata", { fileId: S.fileId });
      if(!sl || sl.ok === false || !Array.isArray(sl.shots)) return;
      const now = Date.now();
      Object.keys(__pendingEdits).forEach((k) => {
        const pe = __pendingEdits[k];
        if(now - pe.t > 15000){ delete __pendingEdits[k]; return; }
        const [key, field] = [k.slice(0, k.lastIndexOf("|")), k.slice(k.lastIndexOf("|") + 1)];
        const sh = sl.shots.find((x) => x.key === key); if(sh) sh[field] = pe.v;
      });
      const sig = shotlistSig(sl);
      if(sig === __slSig) return;
      __slSig = sig;
      const before = S.shots.find((x) => x.key === S.curShotKey);
      const camBefore = before ? { size: before.size || "", angle: before.angle || "", lens: before.lens || "" } : null;
      applyShotlistData(sl);
      if(S.view === "overview"){
        const g = document.getElementById("gridScroll"), top = g ? g.scrollTop : 0;
        renderLeftRailScenes(); renderOverview();
        const g2 = document.getElementById("gridScroll"); if(g2) g2.scrollTop = top;
      }else if(S.view === "focus"){
        const cur = S.shots.find((x) => x.key === S.curShotKey);
        if(!cur){ notify("This shot was removed from the Shot List."); goToOverview(); return; }
        refreshShotDetails(cur);
        updateShotNav();
        if(window.SB3D && SB3D.loaded() && SB3D.isMounted()) SB3D.setCast(boardCast());
        if(camBefore && ["size","angle","lens"].some((f) => camBefore[f] !== (cur[f] || ""))) sheetToCamera(cur);
      }
      setStatus("Updated from the Shot List · " + new Date().toLocaleTimeString());
    }catch(_e){
    }finally{ __slBusy = false; }
  }
  // Updates the open shot's detail fields in place (never the one you're typing in) and points
  // their save handlers at the fresh shot record.
  function refreshShotDetails(sh){
    Object.keys(DETAIL_FIELDS).forEach((id) => {
      const el = document.getElementById(id); if(!el) return;
      const f = DETAIL_FIELDS[id], v = sh[f] || "";
      if(el !== document.activeElement && el.value !== v){
        if(el.tagName === "SELECT" && v && ![...el.options].some((o) => o.value === v)){ const o = document.createElement("option"); o.value = v; o.textContent = v; el.appendChild(o); }
        el.value = v;
      }
      el.onchange = (e) => saveShotField(sh, f, e.target.value);
    });
    const t = document.querySelector("#rightRail .disp"); if(t) t.textContent = "Scene " + sh.scene + " · Shot " + sh.shot;
  }

  /* ---------------- Reference image upload ---------------- */
  function uploadReference(shotKey, file){
    const reader = new FileReader();
    if(file.size > 12 * 1024 * 1024){ notify("That photo is over 12 MB — try a smaller one.", true); return; }
    reader.onload = async () => {
      setStatus("Uploading reference…");
      const res = await apiPost("uploadimage", { fileId: S.fileId, name: file.name, dataUrl: reader.result });
      setStatus("");
      if(!res || res.ok === false){ notify((res && res.error) || "Couldn't upload that image.", true); return; }
      const p = panelData(shotKey);
      p.ref = { imageId: res.imageId };
      if(S.boardRef) S.boardRef.child("panels/" + fbKey(shotKey) + "/ref").set(p.ref);
      markHasContentOnce();
      saveLocalBoard();
      notify("Reference photo added");
      loadReferenceThumb(res.imageId, shotKey);
    };
    reader.readAsDataURL(file);
  }
  async function loadReferenceThumb(imageId, shotKey){
    shotKey = shotKey || S.curShotKey;
    const p0 = panelData(shotKey);
    if(p0._refImg && p0._refImgId === imageId){ showRefImg(p0._refImg, shotKey); return; }
    const res = await apiGet("image", { imageId });
    if(!res || res.ok === false){ if(res && res.error) setStatus("Couldn't load the reference photo: " + res.error, true); return; }
    const img = new Image();
    img.onload = () => {
      const p = panelData(shotKey);
      p._refImg = img; p._refImgId = imageId;
      showRefImg(img, shotKey);
    };
    img.src = "data:" + res.mime + ";base64," + res.dataB64;
  }
  function showRefImg(img, shotKey){
    if(S.curShotKey !== shotKey || S.view !== "focus") return;
    {
      const box = document.getElementById("refThumb");
      if(box){ box.innerHTML = ""; const t = img.cloneNode(); t.style.width = "100%"; t.style.height = "100%"; t.style.objectFit = "cover"; box.appendChild(t); }
      const up = document.getElementById("uploadRefBtn"); if(up) up.textContent = "Replace reference";
      redrawStack();
    }
  }


  document.addEventListener("keydown", (e) => {
    const tag = (e.target && e.target.tagName || "").toLowerCase();
    if(document.querySelector(".modalShade")) return;
    if(tag === "input" || tag === "select" || tag === "textarea"){
      if(e.key === "Escape" && e.target.id === "searchBox" && e.target.value){ e.target.value = ""; S.searchQuery = ""; applyFilter(); }
      return;
    }
    const mod = e.ctrlKey || e.metaKey;
    if(S.view === "overview"){
      if(e.key === "/" && !mod){ e.preventDefault(); document.getElementById("searchBox").focus(); }
      return;
    }
    if(S.view !== "focus") return;
    const k = e.key.toLowerCase();
    if(mod && !e.shiftKey && !e.altKey && (k === "c" || k === "v" || k === "d") && S.mode3d !== "draw" && window.SB3D && SB3D.loaded() && SB3D.isMounted()){
      const done = k === "c" ? SB3D.copy() : k === "v" ? SB3D.paste() : SB3D.duplicate();
      if(done){ e.preventDefault(); if(k === "c") setStatus("Copied — paste with Ctrl/Cmd+V, in this shot or another"); }
      else if(k === "d") e.preventDefault();
      return;
    }
    if(mod && k === "z" && !e.shiftKey){ e.preventDefault(); undoAny(); return; }
    if(mod && ((k === "z" && e.shiftKey) || k === "y")){ e.preventDefault(); redoAny(); return; }
    if(mod || e.altKey) return;
    if(S.mode3d !== "draw" && window.SB3D && SB3D.loaded() && SB3D.key(e)) return;
    if(e.key === "Escape"){ e.preventDefault(); history.back(); return; }
    if(e.key === "ArrowLeft"){ e.preventDefault(); stepShot(-1); return; }
    if(e.key === "ArrowRight"){ e.preventDefault(); stepShot(1); return; }
    const TOOL_KEYS = { p:"pencil", n:"pen", b:"soft", e:"eraser" };
    if(TOOL_KEYS[k]){ S.tool = TOOL_KEYS[k]; savePrefs(); if(S.mode3d !== "draw") setMode3d("draw"); buildToolbar(); updateBrushCursor(); return; }
    if(e.key === "[" || e.key === "]"){
      S.weight = Math.max(1, Math.min(10, S.weight + (e.key === "]" ? 1 : -1))); savePrefs();
      const r = document.getElementById("weightRange"); if(r) r.value = S.weight;
      updateBrushCursor();
      return;
    }
    if(e.key === "0"){ setZoom(1); return; }
    if(e.key === "=" || e.key === "+"){ setZoom(S.zoom + 0.25); return; }
    if(e.key === "-"){ setZoom(S.zoom - 0.25); return; }
  });

  window.addEventListener("pagehide", () => {
    if(S.curShotKey && blockingOn(S.curShotKey) && !__blkSaveT[fbKey(S.curShotKey)]) __blkSaveT[fbKey(S.curShotKey)] = 1;
    Object.keys(__blkSaveT).forEach((k) => {
      clearTimeout(__blkSaveT[k]); delete __blkSaveT[k];
      const p = S.panelsCache[k]; const blk = p && blockingBlob(p.blocking);
      if(blk && S.boardRef) S.boardRef.child("panels/" + k + "/blocking").set(blk).catch(() => {});
    });
    if(!S.boardRef){ clearTimeout(__localSaveT); try{ saveLocalBoardNow(); }catch(_e){} }
  });

  boot();
})();
</script>
</body>
