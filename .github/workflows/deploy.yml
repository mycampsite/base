name: Deploy
on:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      # The production math must pass its tests before anything is published
      - run: node tests/breakdown.test.js && node tests/elements.test.js && node tests/production.test.js && node tests/prodpanel.test.js && node tests/board.test.js && node tests/shottime.test.js && node tests/docscards.test.js
      # Every page must open in a real browser without a JavaScript error (Playwright is installed outside the site folder, so it never gets published)
      - run: npm install --prefix "$RUNNER_TEMP/pw" playwright@1.56.0 && "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
      - run: NODE_PATH="$RUNNER_TEMP/pw/node_modules" node tests/pages.smoke.js
      - run: sed -i "s|__API_KEY__|${{ secrets.GOOGLE_API_KEY }}|" config.json index.html
      - run: grep -c "__API_KEY__" config.json index.html || echo "replaced"
      # Stamp this deploy on every page and in version.json, so a page left open in a browser can tell it is behind
      # (not idtoken.js: it compares against the literal __BUILD__ to know when it is running from an undeployed copy)
      - run: sed -i "s|__BUILD__|${GITHUB_SHA::12}|g" version.json index.html library.html editor.html treatment.html storyboard.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - uses: actions/deploy-pages@v4
