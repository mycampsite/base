<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Treatment - Camp</title>
<meta name="theme-color" content="#141414">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Inter+Tight:ital,wght@0,400;0,500;0,600;0,700;0,800;1,600;1,800&family=Archivo:wdth,wght@62..125,400..900&family=Archivo+Black&family=Bodoni+Moda:ital,wght@0,500;0,700;1,500&family=Playfair+Display:ital,wght@0,400;0,700;0,800;0,900;1,400;1,800&family=Barlow+Condensed:wght@500;700&family=Unbounded:wght@500;700;900&family=Anton&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;700&family=Dela+Gothic+One&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Bebas+Neue&family=Oswald:wght@300;400;600&family=Space+Grotesk:wght@400;500;700&family=DM+Serif+Display:ital@0;1&family=Special+Elite&family=Montserrat:wght@300;400;600;800&display=swap">
<style>
  :root{
    color-scheme:dark;
    --uiBg:#141414; --uiPanel:#1b1b1b; --uiText:#f2f2f2; --uiMuted:#b9b9b9; --uiBorder:#2b2b2b;
    --accent:#ececf0; --focus:#5b8cff; --ok:#4cd964; --err:#ff8b83; --gold:#f2c94c; --danger:#c4413a; --sel:#5a96ff;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; background:var(--uiBg); color:var(--uiText); font:14px/1.45 Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; overflow:hidden; -webkit-font-smoothing:antialiased; }
  a{ color:inherit; text-decoration:none; }
  button{ font-family:inherit; cursor:pointer; color:inherit; }
  input,select{ font-family:inherit; }
  :focus-visible{ outline:2px solid var(--focus); outline-offset:2px; }

  /* Banner (same on every Camp page) */
  #banner{ position:fixed; top:0; left:0; right:0; height:58px; z-index:150; display:flex; align-items:center; gap:10px; padding:0 12px; background:rgba(20,20,20,.985); border-bottom:1px solid var(--uiBorder); }
  #banner .logo img{ height:34px; display:block; }
  #banner .area{ position:absolute; left:50%; transform:translateX(-50%); font-size:13px; font-weight:700; letter-spacing:.24em; text-transform:uppercase; opacity:.92; pointer-events:none; white-space:nowrap; }
  #banner .right{ margin-left:auto; display:flex; align-items:center; gap:8px; }
  .chip{ display:inline-flex; align-items:center; height:28px; padding:0 10px; border:1px solid var(--uiBorder); border-radius:999px; font-size:12px; color:var(--uiMuted); max-width:240px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .chip:empty{ display:none; }
  .hamb{ display:none; width:34px; height:34px; border-radius:10px; border:1px solid var(--uiBorder); background:rgba(255,255,255,.04); align-items:center; justify-content:center; padding:0; }
  #navMenu{ position:fixed; top:62px; left:12px; z-index:160; display:none; min-width:190px; padding:6px; background:#1d1e22; border:1px solid var(--uiBorder); border-radius:12px; box-shadow:0 10px 35px rgba(0,0,0,.35); }
  #navMenu.show{ display:block; }
  #navMenu a{ display:block; padding:8px 10px; border-radius:8px; font-size:13px; }
  #navMenu a:hover{ background:rgba(255,255,255,.07); }

  #app{ display:flex; flex-direction:column; height:100vh; padding-top:58px; }
  #toolbar{ height:50px; flex-shrink:0; display:flex; align-items:center; gap:10px; padding:0 14px; border-bottom:1px solid var(--uiBorder); background:var(--uiPanel); }
  #toolbar .back{ font-size:13px; color:var(--uiMuted); white-space:nowrap; }
  #toolbar .back:hover{ color:var(--uiText); }
  #toolbar .sep{ width:1px; height:18px; background:var(--uiBorder); }
  #toolbar .title{ font-size:14px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:26vw; }
  .tlink{ display:inline-flex; align-items:center; height:28px; padding:0 10px; border:1px solid var(--uiBorder); border-radius:8px; font-size:12.5px; color:var(--uiMuted); white-space:nowrap; }
  .tlink:hover{ color:var(--uiText); background:rgba(255,255,255,.06); }
  .grow{ flex:1; }
  #statusMsg{ font-size:12px; color:var(--uiMuted); white-space:nowrap; min-width:96px; text-align:right; }
  #statusMsg.err{ color:var(--err); }
  .btn{ height:34px; padding:0 14px; border-radius:10px; border:1px solid var(--uiBorder); background:rgba(255,255,255,.04); color:var(--uiText); font-size:13px; font-weight:600; display:inline-flex; align-items:center; justify-content:center; gap:6px; white-space:nowrap; }
  .btn:hover{ background:rgba(255,255,255,.08); }
  .btn.primary{ background:var(--accent); border-color:var(--accent); color:#111; }
  .btn.primary:hover{ background:#fff; }
  .btn.danger{ background:var(--danger); border-color:var(--danger); color:#fff; }
  .btn.sm{ height:28px; padding:0 10px; border-radius:8px; font-size:12.5px; }
  .btn:disabled{ opacity:.45; cursor:default; pointer-events:none; }

  #body{ flex:1; display:flex; min-height:0; }

  /* Left rail: pages */
  #leftRail{ width:232px; flex-shrink:0; background:var(--uiPanel); border-right:1px solid var(--uiBorder); overflow-y:auto; padding:14px 12px; display:flex; flex-direction:column; }
  .rail-label{ font-size:11px; letter-spacing:.08em; color:var(--uiMuted); font-weight:600; padding:4px 6px 8px; }
  .navItem{ padding:6px; border-radius:12px; cursor:pointer; margin-bottom:6px; border:1px solid transparent; }
  .navItem:hover{ background:rgba(255,255,255,.04); }
  .navItem.active{ background:rgba(255,255,255,.06); border-color:#4a4a48; }
  .navItem.dragOver{ border-color:var(--accent); }
  .navItem.dragging{ opacity:.4; }
  .navThumb{ width:100%; aspect-ratio:297/210; overflow:hidden; border-radius:4px; position:relative; background:#000; pointer-events:none; }
  .navThumb .tpage{ position:absolute; top:0; left:0; transform-origin:0 0; }
  .navMeta{ display:flex; align-items:center; gap:6px; margin-top:6px; font-size:11.5px; }
  .navMeta .num{ color:var(--uiMuted); font-variant-numeric:tabular-nums; }
  .navMeta .name{ flex:1; min-width:0; font-weight:600; letter-spacing:.04em; text-transform:uppercase; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .navMeta .name input{ width:100%; font:inherit; text-transform:none; letter-spacing:0; background:rgba(0,0,0,.25); color:var(--uiText); border:1px solid rgba(255,255,255,.2); border-radius:4px; padding:1px 4px; }
  .navMeta .acts{ display:none; gap:2px; }
  .navItem:hover .acts{ display:flex; }
  .miniBtn{ width:20px; height:20px; border-radius:5px; border:none; background:none; color:var(--uiMuted); display:flex; align-items:center; justify-content:center; padding:0; }
  .miniBtn:hover{ background:rgba(255,255,255,.08); color:var(--uiText); }
  .miniBtn.del:hover{ background:rgba(196,65,58,.25); color:var(--err); }
  #addPageBtn{ margin-top:4px; width:100%; padding:10px; border-radius:12px; border:1px dashed rgba(255,255,255,.17); background:none; color:var(--uiMuted); font-size:12.5px; text-align:left; display:flex; align-items:center; gap:8px; }
  #addPageBtn:hover{ border-color:var(--accent); color:var(--uiText); background:rgba(255,255,255,.03); }

  /* Centre stage */
  #stageWrap{ flex:1; min-width:0; display:flex; align-items:center; justify-content:center; padding:28px; overflow:hidden; background:#0f0f0f; }
  #stage{ position:relative; box-shadow:0 10px 40px rgba(0,0,0,.55); }
  #stage > .tpage{ position:absolute; top:0; left:0; transform-origin:0 0; }

  /* Right rail */
  #rightRail{ width:290px; flex-shrink:0; background:var(--uiPanel); border-left:1px solid var(--uiBorder); overflow-y:auto; padding:16px 14px 28px; display:flex; flex-direction:column; gap:16px; }
  .section-title{ font-size:11px; letter-spacing:.08em; color:var(--uiMuted); font-weight:600; margin-bottom:10px; }
  #rightRail label{ display:block; font-size:11.5px; color:var(--uiMuted); margin:10px 0 5px; }
  #rightRail input[type=text], #rightRail input[type=number], #rightRail select{ width:100%; height:34px; padding:0 8px; border-radius:8px; border:1px solid rgba(255,255,255,.14); background:rgba(0,0,0,.25); color:var(--uiText); font-size:12.5px; }
  #rightRail select option{ background:#1d1e22; color:var(--uiText); }
  #rightRail input:focus, #rightRail select:focus{ outline:none; border-color:rgba(255,255,255,.35); }
  #rightRail input[type=range]{ width:100%; accent-color:#ececf0; }
  #rightRail input[type=color]{ width:100%; height:30px; margin-top:8px; border:1px solid rgba(255,255,255,.14); border-radius:8px; background:rgba(0,0,0,.25); padding:2px; }
  #rightRail .chk{ display:flex; align-items:center; gap:8px; color:var(--uiText); font-size:12.5px; margin-top:12px; cursor:pointer; }
  .swatches{ display:flex; flex-wrap:wrap; gap:7px; }
  .swatch{ width:24px; height:24px; border-radius:50%; border:1px solid rgba(255,255,255,.2); padding:0; background-size:cover; }
  .swatch.selected{ box-shadow:0 0 0 2px var(--uiPanel), 0 0 0 3.5px #fff; }
  .swatch.auto{ background:linear-gradient(135deg, #f2efe8 50%, #1a1a18 50%); }
  .swatch.key{ border-radius:7px; }
  .hint{ font-size:11.5px; color:var(--uiMuted); line-height:1.5; }
  .divider{ border-top:1px solid var(--uiBorder); padding-top:14px; }
  .row2{ display:flex; gap:8px; }
  .row2 > *{ flex:1; min-width:0; }
  .seg{ display:flex; gap:2px; background:rgba(0,0,0,.25); border:1px solid rgba(255,255,255,.08); border-radius:8px; padding:3px; }
  .seg button{ flex:1; border:none; background:none; color:var(--uiMuted); border-radius:6px; height:26px; font-size:11.5px; display:flex; align-items:center; justify-content:center; padding:0 4px; }
  .seg button:hover{ color:var(--uiText); }
  .seg button.on{ background:rgba(255,255,255,.1); color:#fff; }
  .addGrid{ display:grid; grid-template-columns:repeat(4, 1fr); gap:6px; }
  .addGrid button{ background:rgba(255,255,255,.03); border:1px solid var(--uiBorder); border-radius:10px; padding:9px 0 7px; color:#d8d6d0; font-size:10.5px; display:flex; flex-direction:column; align-items:center; gap:5px; }
  .addGrid button:hover{ border-color:#5a5a54; color:#fff; background:rgba(255,255,255,.07); }
  .themeGrid{ display:grid; grid-template-columns:repeat(3, 1fr); gap:6px; }
  .themeCard{ padding:0; border:1px solid var(--uiBorder); border-radius:10px; background:rgba(255,255,255,.03); overflow:hidden; text-align:left; }
  .themeCard:hover{ border-color:#5a5a54; }
  .themeCard.on{ border-color:var(--accent); box-shadow:0 0 0 1px var(--accent); }
  .tcSw{ display:flex; align-items:flex-end; justify-content:space-between; height:44px; padding:5px 7px; background-size:cover !important; }
  .tcSw b{ font-size:19px; line-height:1; }
  .tcSw i{ width:9px; height:9px; border-radius:50%; flex-shrink:0; margin-bottom:3px; }
  .tcName{ display:block; font-size:10.5px; padding:4px 7px 5px; color:var(--uiMuted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .varGrid{ display:grid; grid-template-columns:1fr 1fr; gap:6px; }
  .varOpt{ padding:4px; border:1px solid var(--uiBorder); border-radius:8px; background:rgba(255,255,255,.03); text-align:left; }
  .varOpt:hover{ border-color:#5a5a54; }
  .varOpt.on{ border-color:var(--accent); box-shadow:0 0 0 1px var(--accent); }
  .varOpt span{ display:block; font-size:10.5px; color:var(--uiMuted); margin-top:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .libGrid{ display:grid; grid-template-columns:repeat(3, 1fr); gap:6px; }
  .libItem{ position:relative; aspect-ratio:1; border-radius:8px; overflow:hidden; border:1px solid var(--uiBorder); background:#111; padding:0; cursor:pointer; }
  .libItem:hover{ border-color:#6a6a62; }
  .libItem img{ width:100%; height:100%; object-fit:cover; display:block; pointer-events:none; }
  .libItem .x{ position:absolute; top:2px; right:2px; width:18px; height:18px; border-radius:4px; background:rgba(0,0,0,.7); color:#ddd; display:none; align-items:center; justify-content:center; font-size:13px; line-height:1; }
  .libItem .x:hover{ background:var(--danger); color:#fff; }
  .libItem:hover .x{ display:flex; }
  .libItem .used{ position:absolute; left:4px; bottom:4px; width:6px; height:6px; border-radius:50%; background:var(--ok); }
  .libEmpty{ border:1px dashed rgba(255,255,255,.17); border-radius:12px; padding:14px 10px; text-align:center; font-size:11.5px; color:var(--uiMuted); line-height:1.5; }

  /* ---------- Treatment page (fixed A4 landscape, real units) ---------- */
  .tpage{ width:297mm; height:210mm; position:relative; overflow:hidden; font-family:Inter,sans-serif; }
  .tpage .el{ position:absolute; overflow:hidden; }
  .el-text{ white-space:pre-wrap; overflow-wrap:break-word; outline:none; }
  .el-text:empty::before{ content:attr(data-ph); opacity:.38; }
  .el-wave{ display:flex; align-items:center; gap:1mm; }
  .el-wave b{ flex:1; background:currentColor; opacity:.9; border-radius:.3mm; }
  .el-image img{ position:absolute; left:0; top:0; width:100%; height:100%; max-width:none; object-fit:cover; display:block; }
  .el-image .dim{ position:absolute; inset:0; }
  .el-image.empty::after{ content:attr(data-ph); position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font:600 2.1mm Inter,sans-serif; letter-spacing:.14em; text-transform:uppercase; opacity:.45; }
  .el-image.empty.bleed{ background:transparent; outline:.3mm dashed rgba(140,140,140,.45); outline-offset:-5mm; }
  .el-image.empty.bleed::after{ align-items:flex-end; padding-bottom:8mm; }
  .el-divider{ opacity:.4; }
  .el-divider::before{ content:""; position:absolute; left:0; right:0; top:50%; border-top:.3mm solid currentColor; }
  .chrome{ position:absolute; inset:0; pointer-events:none; z-index:100000; font-size:2.45mm; letter-spacing:.12em; text-transform:uppercase; line-height:1.2; }
  .chrome > div, .chrome > i{ position:absolute; white-space:nowrap; overflow:hidden; }

  /* Freeform editing on the stage only (never in thumbnails, preview or PDF) */
  #stage .tpage .el{ cursor:move; }
  #stage .tpage .el:hover{ outline:calc(1px / var(--s, 1)) dashed rgba(90,150,255,.7); }
  #stage .tpage .el.editing{ cursor:text; outline:calc(1.5px / var(--s, 1)) solid var(--sel); filter:none !important; }
  #selBox{ position:absolute; outline:1.5px solid var(--sel); pointer-events:none; z-index:10; }
  #selBox .h{ position:absolute; width:9px; height:9px; margin:-5px 0 0 -5px; background:#fff; border:1.5px solid var(--sel); border-radius:1px; pointer-events:auto; }
  .h-nw{ left:0; top:0; cursor:nwse-resize; } .h-n{ left:50%; top:0; cursor:ns-resize; } .h-ne{ left:100%; top:0; cursor:nesw-resize; } .h-e{ left:100%; top:50%; cursor:ew-resize; }
  .h-se{ left:100%; top:100%; cursor:nwse-resize; } .h-s{ left:50%; top:100%; cursor:ns-resize; } .h-sw{ left:0; top:100%; cursor:nesw-resize; } .h-w{ left:0; top:50%; cursor:ew-resize; }
  #selBox.line .h-n, #selBox.line .h-s, #selBox.line .h-ne, #selBox.line .h-nw, #selBox.line .h-se, #selBox.line .h-sw{ display:none; }
  #selBox.crop .h{ display:none; }
  #stage .guide{ position:absolute; background:#e0457b; pointer-events:none; z-index:11; }
  #stage .guide.gv{ top:0; bottom:0; width:1px; }
  #stage .guide.gh{ left:0; right:0; height:1px; }
  #stage .tpage .el.dropTarget{ outline:calc(2.5px / var(--s, 1)) solid var(--accent) !important; }
  #stage .tpage .el.cropping{ cursor:grab; }

  /* Live collaboration */
  .liveFaces{ display:flex; }
  .liveFace{ width:24px; height:24px; border-radius:50%; border:2px solid var(--uiPanel); color:#fff; font-size:10px; font-weight:700; display:flex; align-items:center; justify-content:center; padding:0; margin-left:-6px; }
  .liveFaces .liveFace:first-child{ margin-left:0; }
  .liveFace.more{ background:#444; }
  .livePill{ display:flex; align-items:center; gap:6px; height:28px; border:1px solid var(--uiBorder); border-radius:999px; padding:0 10px; font-size:12px; color:#d8d6d0; background:rgba(255,255,255,.04); }
  .livePill .liveDot{ width:7px; height:7px; border-radius:50%; background:var(--ok); }
  .livePill.off{ color:var(--err); border-color:rgba(255,139,131,.45); cursor:pointer; }
  .livePill.off .liveDot{ background:var(--err); }
  .navDots{ display:flex; gap:3px; }
  .navDots i{ width:8px; height:8px; border-radius:50%; display:block; }
  #stage .rsel{ position:absolute; border:1.5px solid; pointer-events:none; z-index:9; }
  #stage .rsel span{ position:absolute; left:-1.5px; top:-17px; font:600 10px Inter,sans-serif; color:#fff; padding:1px 6px; border-radius:3px 3px 3px 0; white-space:nowrap; }
  .ro .acts, .ro #addPageBtn{ display:none !important; }

  /* Dialogs */
  .modalShade{ position:fixed; inset:0; z-index:200; background:rgba(0,0,0,.6); display:flex; align-items:center; justify-content:center; padding:16px; }
  .modalBox{ width:min(760px,100%); max-height:90vh; overflow:auto; background:#1a1b1f; border:1px solid var(--uiBorder); border-radius:14px; padding:20px; box-shadow:0 24px 60px rgba(0,0,0,.6); }
  .modalBox.wide{ width:min(1120px,100%); display:flex; flex-direction:column; overflow:hidden; }
  .modalBox h3{ margin:0 0 4px; font-size:16px; font-weight:600; }
  .modalBox .hint{ margin-bottom:14px; }
  .modalBtns{ display:flex; gap:8px; justify-content:flex-end; margin-top:16px; }
  .layoutGrid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(170px,1fr)); gap:12px; }
  .layoutOpt{ background:rgba(255,255,255,.03); border:1px solid var(--uiBorder); border-radius:12px; padding:6px; color:#d8d6d0; text-align:left; }
  .layoutOpt:hover{ border-color:var(--accent); color:#fff; }
  .layoutOpt .navThumb{ margin-bottom:6px; }
  .layoutOpt span{ font-size:11px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; }
  .layoutOpt .hint{ margin:3px 0 0 !important; text-transform:none; letter-spacing:0; font-weight:400; }
  .pickWrap{ display:flex; gap:16px; min-height:0; flex:1; }
  .pickNav{ width:160px; flex-shrink:0; overflow:auto; display:flex; flex-direction:column; gap:2px; }
  .pickNav button{ text-align:left; background:none; border:0; padding:7px 10px; border-radius:8px; color:var(--uiMuted); font-size:13px; }
  .pickNav button:hover, .pickNav button.on{ background:rgba(255,255,255,.07); color:var(--uiText); }
  .pickBody{ flex:1; overflow:auto; padding-right:4px; }
  .pickBody h4{ margin:16px 0 8px; font-size:11px; letter-spacing:.08em; color:var(--uiMuted); text-transform:uppercase; font-weight:600; }
  .pickBody h4:first-child{ margin-top:0; }

  /* Preview */
  #preview{ position:fixed; inset:0; z-index:400; background:#050505; display:none; align-items:center; justify-content:center; }
  #preview.show{ display:flex; }
  #preview .pvStage{ position:relative; box-shadow:0 20px 60px rgba(0,0,0,.6); }
  #preview .pvStage > .tpage{ position:absolute; top:0; left:0; transform-origin:0 0; }
  #preview .pvBar{ position:fixed; bottom:18px; left:50%; transform:translateX(-50%); z-index:2; display:flex; align-items:center; gap:10px; background:rgba(27,27,27,.9); border:1px solid var(--uiBorder); border-radius:12px; padding:6px 10px; font-size:12px; color:var(--uiMuted); opacity:.25; transition:opacity .15s; }
  #preview .pvBar:hover{ opacity:1; }
  #preview .pvHit{ position:fixed; top:0; bottom:70px; width:30%; z-index:1; cursor:pointer; }
  #preview:fullscreen{ background:#050505; }
  #preview .el-text:empty::before, #preview .el-image.empty::after{ content:none; }
  #preview .el-image.empty{ background:transparent !important; border-color:transparent !important; outline:0 !important; }

  /* Loading / toast */
  #loading{ position:fixed; inset:58px 0 0 0; background:var(--uiBg); display:flex; align-items:center; justify-content:center; color:var(--uiMuted); font-size:13px; z-index:50; }
  #loading .loadBox{ display:flex; flex-direction:column; align-items:center; gap:14px; text-align:center; max-width:420px; padding:0 20px; line-height:1.5; }
  #loading .loadBox .row{ display:flex; gap:8px; }
  #tToast{ position:fixed; left:16px; bottom:16px; transform:translateY(16px); opacity:0; pointer-events:none; z-index:500; display:flex; align-items:center; gap:10px; max-width:min(460px, calc(100% - 32px)); padding:10px 14px; border-radius:12px; background:#1d1e22; border:1px solid var(--uiBorder); box-shadow:0 14px 40px rgba(0,0,0,.5); font-size:13px; transition:all .18s ease; }
  #tToast.show{ opacity:1; transform:translateY(0); pointer-events:auto; }
  #tToast .dot{ width:8px; height:8px; border-radius:50%; background:var(--ok); flex-shrink:0; }
  #tToast.err .dot{ background:var(--err); }

  @media (max-width:760px){
    .hamb{ display:inline-flex; }
    #banner .logo{ display:none; }
    .chip{ display:none; }
    #toolbar .back, #toolbar .sep, .tlink, #liveWrap{ display:none !important; }
    #leftRail{ width:120px; padding:10px 6px; }

  /* ---------------- Screenplay → data (read-only, one way) ---------------- */
  function runText(l){
    const r = l && l.runs; if(!Array.isArray(r)) return String((l && l.text) || "");
    return r.map((x) => typeof x === "string" ? x : (x && (x.text != null ? x.text : x.t)) || "").join("");

  // Cue names that are not a single person (a character called "Everyone" is a group, not a role to cast)
  const GROUP_NAMES = new Set(["EVERYONE","EVERYBODY","EVERY ONE","ALL","BOTH","TOGETHER","CROWD","THE CROWD","GROUP","OTHERS","ANYONE","ANYBODY","SOMEONE","SOMEBODY","NOBODY","NO ONE","VARIOUS","VOICES","VOICE","CHORUS","AUDIENCE","PEOPLE","STUDENTS","KIDS","CHILDREN","MEN","WOMEN","THEM","THEY","WE","US","MOB","GUESTS","EVERYONE ELSE","ALL OF THEM","V.O.","O.S.","CUT TO"]);
  const isGroupName = (n) => GROUP_NAMES.has(n) || /^(ALL|BOTH|EVERYONE|EVERYBODY|TOGETHER)\b/.test(n);
  const titleCase = (s) => String(s).toLowerCase().replace(/(^|[\s\-\/(])([a-z])/g, (m, a, b) => a + b.toUpperCase()).replace(/\b([OoDdLl])'([a-z])/g, (m, a, b) => a + "'" + b.toUpperCase());
  // "MARY (V.O.)", "MARY CONT'D", "JOHN AND MARY", "A / B" -> clean, individual names
  function cueNames(raw){
    const t = String(raw || "").replace(/\(.*?\)/g, " ").replace(/\^/g, " ")
      .replace(/\b(?:V\.?\s?O\.?|O\.?\s?S\.?|O\.?\s?C\.?|CONT'?D\.?|CONTINUED|FILTERED|ON PHONE|ON TV|ON RADIO)(?=\s|$)/gi, " ")
      .replace(/\s+/g, " ").trim().toUpperCase();

  }
  const TOD = /^(DAY|NIGHT|DAWN|DUSK|MORNING|EVENING|AFTERNOON|NOON|MIDNIGHT|LATER|CONTINUOUS|CONT'?D\.?|SAME|SUNSET|SUNRISE|MOMENTS? LATER)\b/i;

    t = String(t || "").replace(/\s+/g, " ").trim();

    if(!m) return null;
    const tag = m[1].toUpperCase(), ie = /\//.test(tag) ? "INT/EXT" : tag.startsWith("INT") ? "INT" : "EXT";

  }
  function sceneOf(l){
    const t = runText(l), ty = String((l && l.type) || ""), s = parseSlug(t);
    if(/scene|slug|heading/i.test(ty)) return s || (t.trim() ? { place:t.trim(), ie:"" } : null);
    if((!ty || /action|general/i.test(ty)) && s && t === t.toUpperCase()) return s;

  }
  function scriptData(doc){
    doc = doc || {};
    const tp = doc.title || {}, meta = doc.meta || {};

        const k = sc.place.toUpperCase(), e = lm[k] || (lm[k] = { name:titleCase(sc.place), ie:sc.ie, scenes:0, last:-1, order:Object.keys(lm).length });
        if(e.last !== scene){ e.scenes++; e.last = scene; }

      }
      if(l.type !== "character") return;
      cueNames(runText(l)).forEach((n) => {

  /* ---------------- Rendering ---------------- */
  const IMG = {}; // imageId -> { src, thumb } (loaded) | { p:Promise } (loading)
  async function makeThumb(src){
    return new Promise((res) => {
      const im = new Image();
      im.onload = () => { try{ res(drawJpeg(im, im.naturalWidth, im.naturalHeight, 240, 0.72)); }catch(_e){ res(src); } };
      im.onerror = () => res(src); im.src = src;
    });
  }
  function drawJpeg(bmp, w, h, max, q){
    const s = Math.min(1, max / Math.max(w, h)), c = document.createElement("canvas");
    c.width = Math.max(1, Math.round(w * s)); c.height = Math.max(1, Math.round(h * s));

  }
  function ensureImg(id){
    if(!id) return Promise.resolve(null);

    const p = apiGet("image", { imageId:id }).then(async (res) => {
      if(!res || res.ok === false){ delete IMG[id]; return null; }
      const src = "data:" + res.mime + ";base64," + res.dataB64;
      IMG[id] = { src, thumb: await makeThumb(src) };

  }
  function onImgLoaded(id){

      if(w < MIN){ if(dir.includes("w")) x = r0.x + r0.w - MIN; w = MIN; }
      if(el.t !== "divider" && h < MIN){ if(dir.includes("n")) y = r0.y + r0.h - MIN; h = MIN; }
      r = { x:rd(x), y:rd(y), w:rd(w), h:rd(h) };
      placeLive(node, r); showGuides(gx, gy);
    };
    const up = () => {
      window.removeEventListener("pointermove", mv); window.removeEventListener("pointerup", up);
      showGuides(null, null);
      if(moved){ commit(() => Object.assign(el, r)); refreshCurThumb(); }
      BUSY = Math.max(0, BUSY - 1); flushRemote();
    };
    window.addEventListener("pointermove", mv); window.addEventListener("pointerup", up);
  }

  // Click straight into text: double-click (or Enter on a selected text box). One undo step per edit.
  let __preEdit = null, __preText = "";
  function startEdit(id){
    if(RO) return;
    const el = findEl(id), n = elNode(id);
    if(!el || !n || el.t !== "text" || el.auto) return;
    SEL = id; EDITING = id; __preEdit = snap(); __preText = el.text || "";
    drawSel();
    n.classList.add("editing");
    try{ n.contentEditable = "plaintext-only"; }catch(_e){ n.contentEditable = "true"; }
    n.oninput = () => { el.text = n.innerText.replace(/\n$/, ""); };
    n.onpaste = (ev) => {
      if(n.contentEditable !== "true") return;
      ev.preventDefault(); document.execCommand("insertText", false, (ev.clipboardData || window.clipboardData).getData("text/plain"));
    };
    n.onkeydown = (ev) => { ev.stopPropagation(); if(ev.key === "Escape"){ ev.preventDefault(); finishEdit(); } };
    n.onblur = () => { if(EDITING === id) finishEdit(); };
    n.focus();
    const rg = document.createRange(); rg.selectNodeContents(n); rg.collapse(false);
    const s = getSelection(); s.removeAllRanges(); s.addRange(rg);
  }
  function finishEdit(){
    const id = EDITING; if(!id) return;
    EDITING = null;
    const el = findEl(id), n = elNode(id);
    if(n){ n.contentEditable = "false"; n.classList.remove("editing"); n.oninput = n.onblur = n.onkeydown = n.onpaste = null; if(el && !el.text) n.textContent = ""; }
    let redraw = false;
    if(el && (el.text || "") !== __preText){
      const pg = curPage(), ek = el.ech || el.ecq;
      if(ek){ pg.els.forEach((e) => { if(e !== el && (e.ech === ek || e.ecq === ek)) e.text = el.text; }); redraw = true; }      // outlined echoes follow the title
      if(el.pall != null && /^#[0-9a-f]{6}$/i.test((el.text || "").trim())){                                                   // typing a hex recolours its swatch
        const sw = pg.els.find((e) => e.pal === el.pall); if(sw){ sw.fill = el.text.trim().toLowerCase(); redraw = true; }
      }
      T.undo.push(__preEdit); if(T.undo.length > 100) T.undo.shift();
      T.redo = []; markDirty(); updateUndoState(); refreshCurThumb();
    }
    if(redraw) renderStage(); else { const sp = stagePage(); if(sp) fitText(sp); }
    drawSel();
    flushRemote();
  }

  /* ---------------- Element actions ---------------- */
  const topZ = () => Math.max(0, ...curPage().els.map((e) => e.z || 0)) + 1;
  function addEl(kind){

    const pg = curPage(), off = (pg.els.length % 5) * 4;
    const mk = (t, x, y, w, h, o) => Object.assign({ id:uid(), t, x:x + off, y:y + off, w, h, z:0 }, o);
    let made = {
      text:      () => mk("text", 98.5, 90, 100, 30, { s:"body", text:"", ph:"Text" }),
      heading:   () => mk("text", 48.5, 80, 200, 30, { s:"head", text:"", ph:"Heading" }),
      quote:     () => mk("text", 48.5, 70, 200, 60, { s:"lead", text:"", ph:"A line worth quoting." }),
      image:     () => mk("image", 98.5, 45, 100, 120, { img:"", fx:50, fy:50 }),
      shape:     () => mk("shape", 98.5, 65, 100, 80, { fk:"acc" }),

      character: () => [mk("image", 108.5, 30, 80, 90, { img:"", fx:50, fy:50 }), mk("text", 108.5, 124, 80, 10, { s:"head", text:"", ph:"Name", ds:40 }), mk("text", 108.5, 136, 80, 34, { s:"small", text:"", ph:"Who they are…" })]
    }[kind]();
    if(!Array.isArray(made)) made = [made];
    const z0 = topZ(); made.forEach((e, i) => { e.z = z0 + i; });
    commit(() => made.forEach((e) => pg.els.push(e)));

  function dupEl(el){

  /* ---------------- Page management ---------------- */
  function addPage(vid, o){

  function duplicatePage(i){

  // Content travels between layouts by role: words, photos (with their crop) and any styling the user picked.
  const STY_KEYS = ["color", "ck", "font", "weight", "it", "up", "eff", "ls"];
  function harvest(pg){
    pg.stash = pg.stash || {};
    const loose = [];
    pg.els.forEach((e) => {
      if(!e.role){ if(e.t === "image" && e.img) loose.push({ img:e.img, fx:e.fx, fy:e.fy, zoom:e.zoom }); return; }
      const s = {};
      if(e.t === "text"){ if(!(e.text || "").trim()) return; s.text = e.text; STY_KEYS.forEach((k) => { if(e[k] != null) s[k] = e[k]; }); }
      else if(e.t === "image"){ s.img = e.img || ""; s.fx = e.fx; s.fy = e.fy; if(e.zoom) s.zoom = e.zoom; }
      else if(e.t === "shape"){ if(!e.fill) return; s.fill = e.fill; }
      else return;
      pg.stash[e.role] = s;
    });
    return loose;
  }
  function applyStash(els, stash, loose){
    const used = new Set();
    els.forEach((e) => {
      const s = e.role && stash[e.role]; if(!s) return;
      if(e.t === "text"){ if(s.text) e.text = s.text; STY_KEYS.forEach((k) => { if(s[k] != null) e[k] = s[k]; }); }
      else if(e.t === "image" && s.img){ e.img = s.img; e.fx = s.fx != null ? s.fx : 50; e.fy = s.fy != null ? s.fy : 50; if(s.zoom) e.zoom = s.zoom; used.add(s.img); }
      else if(e.t === "shape" && s.fill) e.fill = s.fill;

    const spare = [];
    (loose || []).concat(Object.keys(stash).map((k) => stash[k])).forEach((s) => { if(s && s.img && !used.has(s.img)){ used.add(s.img); spare.push(s); } });
    els.filter((e) => e.t === "image" && !e.img).sort((a, b) => (a.y - b.y) || (a.x - b.x)).forEach((e) => {
      const s = spare.shift(); if(s){ e.img = s.img; e.fx = s.fx != null ? s.fx : 50; e.fy = s.fy != null ? s.fy : 50; if(s.zoom) e.zoom = s.zoom; }

  function rebuildPage(pg, vid, o){

    if(!same && (!pg.sec || !pg.name || pg.name === SEC_NAME[pg.sec])) pg.name = SEC_NAME[V.sec];

  }
  // The same page shown in another layout (for the layout thumbnails); the real page is untouched
  function previewPage(pg, vid){ const c = clone(pg); rebuildPage(c, vid); return c; }

  // Older pages (before themes) carried their own fonts and colours; a theme change clears those so the theme shows
  function restyleLegacy(pg, key){
    const th = THEMES[key];
    pg.bg = { th:key, v:(pg.bg && pg.bg.tone === "light") ? Math.max(0, th.v.findIndex((x) => x.light)) : 0 };
    pg.els.forEach((e) => { delete e.font; if(e.ac){ delete e.ac; delete e.color; } });
  }
  function applyTheme(key, scope){
    const th = THEMES[key]; if(!th) return;
    const pages = scope === "page" ? [curPage()] : T.pages;
    commit(() => pages.forEach((pg) => {
      if(!pg.sec) restyleLegacy(pg, key);
      else pg.bg = { th:key, v:Math.min((pg.bg && typeof pg.bg.v === "number") ? pg.bg.v : 0, th.v.length - 1) };
    }));

  }
  // Restyle: the template's theme everywhere, plus its layout for each section it covers. Words and photos stay.
  function applyTemplate(key){
    const tp = TEMPLATES[key]; if(!tp) return;
    const th = THEMES[tp.theme];
    commit(() => T.pages.forEach((pg) => {
      if(!pg.sec){ restyleLegacy(pg, tp.theme); return; }
      const hit = tp.seq.find((s) => s[0] === pg.sec);

  }

  // Thumbnails render in small batches so big pickers open instantly

  /* ---------------- Images: upload, library, placing ---------------- */
  async function prepImage(file){
    if(file.size > 40 * 1024 * 1024) throw new Error("That file is over 40 MB.");
    let bmp;
    try{ bmp = await createImageBitmap(file, { imageOrientation:"from-image" }); }
    catch(_e){ bmp = await new Promise((ok, no) => { const im = new Image(); im.onload = () => ok(im); im.onerror = () => no(new Error("Couldn't read that image.")); im.src = URL.createObjectURL(file); }); }
    const w = bmp.width || bmp.naturalWidth, h = bmp.height || bmp.naturalHeight;
    // 2600px on the long edge is ~220 dpi on A4: sharp in the PDF, small enough to upload fast
    return { dataUrl: drawJpeg(bmp, w, h, 2600, 0.9), thumb: drawJpeg(bmp, w, h, 240, 0.72) };
  }
  async function uploadFiles(files){
    const ids = []; let i = 0;
    for(const f of files){
      i++; setStatus("Uploading " + i + "/" + files.length + "…");
      try{
        const { dataUrl, thumb } = await prepImage(f);
        const res = await apiPost("uploadimage", { fileId:T.fileId, name:f.name, dataUrl });
        if(!res || res.ok === false) throw new Error((res && res.error) || "Upload failed.");
        T.images.push({ id:res.imageId, name:res.name || f.name });
        IMG[res.imageId] = { src:dataUrl, thumb };
        ids.push(res.imageId);
      }catch(err){ notify(f.name + ": " + String((err && err.message) || err), true); }
    }
    if(ids.length){ markDirty(); renderRight(); } else updateSaveState();
    return ids;
  }
  const usedImageIds = (pages) => { const s = new Set(); (pages || T.pages).forEach((p) => p.els.forEach((e) => { if(e.img) s.add(e.img); })); return s; };
  function setImage(el, id){
    commit(() => { el.img = id; el.fx = 50; el.fy = 50; delete el.zoom; });
    renderStage(); refreshCurThumb(); renderRight();
  }
  // Puts images into frames in reading order: the selected frame first (unless told not to), then empty ones
  function fillFrames(ids, noSel){
    const pg = curPage(), sel = !noSel && SEL && findEl(SEL), frames = [];
    if(sel && sel.t === "image") frames.push(sel);
    pg.els.filter((e) => e.t === "image" && !e.img && e !== sel).sort((a, b) => (a.y - b.y) || (a.x - b.x)).forEach((e) => frames.push(e));
    const n = Math.min(frames.length, ids.length); if(!n) return 0;
    commit(() => { for(let i = 0; i < n; i++){ const f = frames[i]; f.img = ids[i]; f.fx = 50; f.fy = 50; delete f.zoom; } });
    renderStage(); refreshCurThumb(); renderRight();
    return n;
  }
  function placeFromLib(id){
    if(!fillFrames([id])) notify("Select an image frame first, or drag the photo onto one.", true);
  }
  function removeFromLib(id){
    if(usedImageIds().has(id)){ notify("That image is used on a page. Replace it there first.", true); return; }
    T.images = T.images.filter((x) => x.id !== id); markDirty(); renderRight();
  }

  const loadImg = (src) => new Promise((res) => { const im = new Image(); im.onload = () => res(im); im.onerror = () => res(null); im.src = src; });
  async function paletteFrom(srcs, n){
    const bins = {};
    for(const src of srcs){
      const im = await loadImg(src); if(!im) continue;
      const k0 = 64 / Math.max(im.naturalWidth, im.naturalHeight), w = Math.max(1, Math.round(im.naturalWidth * k0)), h = Math.max(1, Math.round(im.naturalHeight * k0));
      const c = document.createElement("canvas"); c.width = w; c.height = h;
      const x = c.getContext("2d"); x.drawImage(im, 0, 0, w, h);
      const px = x.getImageData(0, 0, w, h).data;
      for(let i = 0; i < px.length; i += 4){
        if(px[i + 3] < 128) continue;
        const k = ((px[i] >> 4) << 8) | ((px[i + 1] >> 4) << 4) | (px[i + 2] >> 4), b = bins[k] || (bins[k] = { n:0, r:0, g:0, b:0 });
        b.n++; b.r += px[i]; b.g += px[i + 1]; b.b += px[i + 2];
      }
    }
    const list = Object.keys(bins).map((k) => {
      const b = bins[k], c = { r:b.r / b.n, g:b.g / b.n, b:b.b / b.n }, mx = Math.max(c.r, c.g, c.b), mn = Math.min(c.r, c.g, c.b);
      c.w = b.n * (0.6 + (mx - mn) / (mx || 1)); return c;
    }).sort((a, b) => b.w - a.w);
    const dist = (a, b) => Math.hypot(a.r - b.r, a.g - b.g, a.b - b.b), out = [];
    [64, 44, 28, 0].forEach((th) => { for(const c of list){ if(out.length >= n) break; if(!out.includes(c) && out.every((o) => dist(o, c) > th)) out.push(c); } });

  }

  function liveReason(err){
    const m = String((err && (err.code || err.message)) || err);
    if(/permission/i.test(m)) return "Firebase refused access (" + m + "). The treatment lives under rooms/<room>/treatment and treatmentPresence, so your Realtime Database rules need to allow those paths (same as storyboard).";
    if(/popup/i.test(m)) return "The Google sign-in popup was blocked or closed. Allow popups for this site, or open the Treatment from the editor after signing in, then reload.";
    if(/operation-not-allowed|admin-restricted|anonymous/i.test(m)) return "Anonymous sign-in isn't turned on in Firebase (Authentication → Sign-in method → Anonymous → Enable). (" + m + ")";
    return m;
  }
  async function seedRoom(){
    const flat = flatLocal();
    await withTimeout(LV.root.set(Object.assign(nest(flat), { init:{ by:LV.uid }, savedRev:T.rev })), 10000);
    LV.synced = flat;
  }
  const roomHas = (v) => !!(v && typeof v.order === "string" && v.pages);
  function adoptRoom(val){ const remote = flatFromVal(val); LV.synced = remote; return applyFlat(remote); }

  async function startLive(roomKey){
    try{
      const cfg = await loadConfig_(), fbCfg = cfg && cfg.firebase;
      if(!fbCfg || !fbCfg.apiKey || !fbCfg.databaseURL) throw new Error("config.json on your site doesn't have the \"firebase\" settings yet.");
      await withTimeout(Promise.all([loadScript(LIVE_SDK + "firebase-app-compat.js")]), 12000);
      await withTimeout(Promise.all([loadScript(LIVE_SDK + "firebase-auth-compat.js"), loadScript(LIVE_SDK + "firebase-database-compat.js")]), 12000);
      const fb = window.firebase; LV.fb = fb;
      if(!fb.apps.length) fb.initializeApp(fbCfg);
      const auth = fb.auth(), cred = await window.Camp.ensureGoogleUser(auth, fb);   // no timeout: the Google popup waits for the person
      await window.Camp.roomAccess(auth, T.fileId);
      LV.uid = (cred.user && cred.user.uid) || (auth.currentUser && auth.currentUser.uid) || "";
      const TS = fb.database.ServerValue.TIMESTAMP;
      LV.room = fb.database().ref("rooms/" + roomKey); LV.root = LV.room.child("treatment"); LV.pres = LV.room.child("treatmentPresence");
      try{ LV.offset = Number((await withTimeout(fb.database().ref(".info/serverTimeOffset").once("value"), 5000)).val()) || 0; }catch(_e){}
      let val = (await withTimeout(LV.root.once("value"), 10000)).val();
      const savedRev = Number((val && val.savedRev) || 0);
      let adopted = false;
      if(roomHas(val) && !(T.rev > savedRev)) adopted = adoptRoom(val);
      else if(roomHas(val)){ await seedRoom(); adopted = true; }          // Drive is newer than the room: the room follows Drive
      else{
        const tx = await withTimeout(LV.root.child("init").transaction((cur) => cur ? undefined : { by:LV.uid }), 10000);
        if(!tx.committed){                                                // someone else is seeding right now
          for(let i = 0; i < 20 && !adopted; i++){ await new Promise((r) => setTimeout(r, 300)); val = (await withTimeout(LV.root.once("value"), 10000)).val(); if(roomHas(val)) adopted = adoptRoom(val); }
        }
        if(!adopted) await seedRoom();
      }
      LV.ready = true; LV.on = true; LV.offReason = "";
      LV.root.on("value", (s) => { LV.lastVal = s.val(); onRoomValue(LV.lastVal); });
      LV.me = LV.pres.child(LV.uid); LV.me.onDisconnect().remove();
      const mine = () => ({ n:LV.name, j:TS, h:TS, pg:(curPage() && curPage().id) || "", sel:"" });
      await withTimeout(LV.me.set(mine()), 10000);
      setInterval(() => { if(LV.me) LV.me.update({ h:TS }).catch(() => {}); electLeader(); renderLivePill(); updateNavDots(); drawRemote(); }, 25000);
      LV.pres.on("value", (s) => {
        LV.presence = s.val() || {};
        if(!LV.presence[LV.uid] && !LV.leaving) LV.me.set(mine()).catch(() => {});
        electLeader(); renderLivePill(); updateNavDots(); drawRemote();
      });
      window.addEventListener("pagehide", () => { LV.leaving = true; try{ LV.me.remove(); }catch(_e){} });
      electLeader(); renderLivePill();
    }catch(err){
      console.warn("Live treatment unavailable", err);
      liveOff(liveReason(err));
    }
  }

  /* ---------------- Preview & PDF ---------------- */
  let __pv = 0;
  function openPreview(){ if(EDITING) finishEdit(); __pv = T.cur; document.getElementById("preview").classList.add("show"); renderPreview(); }
  function closePreview(){ if(document.fullscreenElement) document.exitFullscreen().catch(() => {}); document.getElementById("preview").classList.remove("show"); }
  function togglePvFull(){ const pv = document.getElementById("preview"); if(document.fullscreenElement) document.exitFullscreen().catch(() => {}); else if(pv.requestFullscreen) pv.requestFullscreen().catch(() => {}); }
  function renderPreview(){
    const st = document.getElementById("pvStage");
    const fs = !!document.fullscreenElement, s = Math.min(innerWidth / PAGE_WPX, innerHeight / PAGE_HPX) * (fs ? 1 : 0.92);
    st.style.width = PAGE_WPX * s + "px"; st.style.height = PAGE_HPX * s + "px";
    mountScaled(st, T.pages[__pv], PAGE_WPX * s);
    document.getElementById("pvPos").textContent = (__pv + 1) + " / " + T.pages.length;
  }
  function stepPreview(d){ __pv = Math.max(0, Math.min(T.pages.length - 1, __pv + d)); renderPreview(); }
  function gotoPreview(i){ __pv = Math.max(0, Math.min(T.pages.length - 1, i)); renderPreview(); }
  function blankReport(){
    let frames = 0, texts = 0;
    T.pages.forEach((p) => p.els.forEach((e) => { if(e.t === "image" && !e.img) frames++; if(e.t === "text" && !e.auto && !String(e.text || "").trim()) texts++; }));
    return { frames, texts };
  }
  function exportPdf(){
    if(EDITING) finishEdit();
    if(document.getElementById("preview").classList.contains("show")) closePreview();
    const br = blankReport();
    if(br.frames || br.texts){
      const parts = []; if(br.frames) parts.push(br.frames + " empty image frame" + (br.frames > 1 ? "s" : "")); if(br.texts) parts.push(br.texts + " empty text box" + (br.texts > 1 ? "es" : ""));
      notify(parts.join(" and ") + " will be left out of the PDF.", false, 5000);
    }
    const ids = Array.from(usedImageIds()), loaded = (id) => IMG[id] && IMG[id].src;
    if(ids.some((id) => !loaded(id))) notify("Preparing images…");
    // Images must be fully loaded before the print dialog, or they come out blank in the PDF
    Promise.all(ids.map(ensureImg)).then(async () => {
      if(ids.some((id) => !loaded(id))) notify("Some images couldn't load, so they'll be blank in the PDF.", true, 7000);
      const root = document.getElementById("printRoot");
      root.innerHTML = ""; root.classList.add("measure");                 // laid out off-screen so long titles can be fitted
      T.pages.forEach((pg) => root.appendChild(pageDom(pg)));
      await Promise.all([document.fonts ? document.fonts.ready : null, ...Array.from(root.querySelectorAll("img")).map((im) => im.decode ? im.decode().catch(() => {}) : null)]);
      fitText(root); root.classList.remove("measure");
      const prevTitle = document.title;
      document.title = T.title + " — Treatment";                       // becomes the suggested PDF file name
      const done = () => { document.title = prevTitle; root.innerHTML = ""; window.removeEventListener("afterprint", done); };
      window.addEventListener("afterprint", done);
      setTimeout(() => { window.print(); }, 50);
    });
  }

  /* ---------------- Boot ---------------- */
  function wireBanner(){
    const menu = document.getElementById("navMenu");
    document.getElementById("menuBtn").onclick = (e) => { e.stopPropagation(); menu.classList.toggle("show"); };
    document.addEventListener("click", (e) => { if(!e.target.closest("#navMenu")) menu.classList.remove("show"); });
    document.getElementById("signOutBtn").onclick = async () => {
      try{
        if(window.Camp && typeof window.Camp.signOut === "function") await window.Camp.signOut();
        else if(window.firebase && window.firebase.apps && window.firebase.apps.length) await window.firebase.auth().signOut();
      }catch(_e){}
      location.href = "index.html";
    };
  }
  async function boot(){
    wireBanner();
    const r = route();
    T.fileId = r.fileId;
    if(!T.fileId && !r.pid){ showFatal("Open the Treatment from a script (File › Treatment in the editor)."); return; }
    const loadRes = await apiGet("load", T.fileId ? { fileId:T.fileId } : { pid:r.pid });
    if(!loadRes || loadRes.ok === false){ showFatal((loadRes && loadRes.error) || "Couldn't open that script."); return; }
    T.fileId = loadRes.fileId || T.fileId;
    T.script = loadRes.doc || {};
    T.title = (T.script.title && T.script.title.title) || String(loadRes.name || "").replace(/\.json$/i, "") || "Untitled Script";
    RO = !!loadRes.readOnly; if(RO) document.body.classList.add("ro");
    LV.name = (loadRes.me && loadRes.me.name) || "Someone";
    document.getElementById("pageTitle").textContent = T.title;
    DATA = scriptData(T.script);
    const chip = document.getElementById("userChip"); chip.textContent = (loadRes.me && (loadRes.me.email || loadRes.me.name)) || ""; chip.title = chip.textContent;
    const hub = new URLSearchParams(location.search).get("hub");
    const q = "?fileId=" + encodeURIComponent(T.fileId) + cloudParam() + (hub ? "&hub=" + encodeURIComponent(hub) : "");
    if(hub){ const b = document.getElementById("backLink"); b.href = "hub.html?pid=" + encodeURIComponent(hub) + "&tab=treatment"; b.innerHTML = "&larr; Project"; document.getElementById("mnLib").href = b.href; document.getElementById("mnLib").textContent = "Project"; }
    document.getElementById("scriptLink").href = document.getElementById("mnScript").href = "editor.html" + q;
    document.getElementById("sbLink").href = document.getElementById("mnSb").href = "storyboard.html" + q;

    // 1) What Drive has
    let driveDoc = null;
    const tr = await apiGet("treatmentload", { fileId:T.fileId });
    if(tr && tr.ok !== false){ if(tr.exists && tr.doc){ driveDoc = tr.doc; T.rev = Number(tr.rev || tr.doc.rev || 0); } }
    else if(tr && /Unknown action/i.test(String(tr.error || ""))){ DR.unsupported = true; }
    else if(tr && tr.network){ DR.offline = true; }
    else{ showFatal((tr && tr.error) || "Couldn't open the treatment."); return; }

    // 2) What this device has (offline edits, or a pre-Drive copy from earlier versions)
    let local = null;
    try{ local = JSON.parse(localStorage.getItem(localKey()) || "null"); }catch(_e){}
    const localOk = !!(local && Array.isArray(local.pages) && local.pages.length);
    let pages = null, images = [];
    if(driveDoc){
      pages = driveDoc.pages; images = Array.isArray(driveDoc.images) ? driveDoc.images : [];
      if(localOk && local.unsynced === true){
        const mine = () => { pages = local.pages; images = Array.isArray(local.images) ? local.images : []; driveDirty = true; };
        if(Number(local.baseRev || 0) === T.rev){ mine(); notify("Restored your changes from this device."); }
        else if(confirm("Changes you made on this device never reached Drive, and this treatment was changed somewhere else since.\n\nOK = use my version from this device\nCancel = use the shared version (my version downloads as a backup)")) mine();
        else{ const keep = { p:T.pages, i:T.images }; T.pages = local.pages; T.images = local.images || []; backupDownload("offline copy"); T.pages = keep.p; T.images = keep.i; }
      }
    }else if(localOk){ pages = local.pages; images = Array.isArray(local.images) ? local.images : []; driveDirty = true; }   // earlier local-only copy: move it to Drive
    if(!pages){ pages = defaultTreatment(scriptData(T.script)); images = []; driveDirty = true; }
    T.pages = pages; T.images = images;
    __z = Math.max(0, ...T.pages.flatMap((p) => p.els.map((e) => e.z || 0)));
    // Batch A dividers were 0.6mm tall (unclickable): give them the 4mm hit area, same line position
    T.pages.forEach((p) => p.els.forEach((e) => { if(e.t === "divider" && e.h < 2){ e.y = rd(e.y - 1.7); e.h = 4; } }));

    // 3) Join the live room (it may hold newer, not-yet-saved work from teammates)
    const room = loadRes.live && loadRes.live.room;
    if(room && !DR.unsupported){
      await startLive(room);
      if(LV.on && driveDoc){ const same = sj({ p:T.pages, i:T.images }) === sj({ p:driveDoc.pages, i:Array.isArray(driveDoc.images) ? driveDoc.images : [] }); if(same && !local?.unsynced) driveDirty = false; }
    }else if(!room){ LV.offReason = ""; }

    wireStage();
    document.getElementById("loading").style.display = "none";
    document.getElementById("app").style.display = "flex";
    document.getElementById("undoBtn").onclick = undo;
    document.getElementById("redoBtn").onclick = redo;
    document.getElementById("previewBtn").onclick = openPreview;
    document.getElementById("exportBtn").onclick = exportPdf;
    document.getElementById("pvPrev").onclick = () => stepPreview(-1);
    document.getElementById("pvNext").onclick = () => stepPreview(1);
    document.getElementById("pvClose").onclick = closePreview;
    document.getElementById("pvFull").onclick = togglePvFull;
    document.getElementById("pvPdf").onclick = exportPdf;
    document.getElementById("pvHitL").onclick = () => stepPreview(-1);
    document.getElementById("pvHitR").onclick = () => stepPreview(1);
    document.addEventListener("fullscreenchange", () => { if(document.getElementById("preview").classList.contains("show")) renderPreview(); });
    UI_READY = true;
    renderAll(); renderLivePill(); updateSaveState();
    // web fonts arrive after the first paint: re-fit titles once they land
    if(document.fonts){ let ft = 0; document.fonts.addEventListener("loadingdone", () => { clearTimeout(ft); ft = setTimeout(() => { if(BUSY || EDITING) return; renderNav(); renderStage(); }, 150); }); }
    if(LV.on && LV.fb && !document.getElementById("userChip").textContent){ try{ const u = LV.fb.auth().currentUser; if(u && u.email) document.getElementById("userChip").textContent = u.email; }catch(_e){} }
    if(driveDirty){ saveLocal(); scheduleDrive(1200); }
  }

  let __rsT = 0;
  window.addEventListener("resize", () => { clearTimeout(__rsT); __rsT = setTimeout(() => { renderStage(); if(document.getElementById("preview").classList.contains("show")) renderPreview(); }, 120); });

  document.addEventListener("keydown", (e) => {
    if(document.querySelector(".modalShade")) return;
    const tag = (e.target && e.target.tagName || "").toLowerCase();
    if(tag === "input" || tag === "select" || tag === "textarea" || (e.target && e.target.isContentEditable)) return;
    const mod = e.ctrlKey || e.metaKey, k = e.key.toLowerCase();
    if(document.getElementById("preview").classList.contains("show")){
      if(e.key === "Escape") closePreview();
      else if(["arrowright","pagedown"," "].includes(k)){ e.preventDefault(); stepPreview(1); }
      else if(["arrowleft","pageup"].includes(k)){ e.preventDefault(); stepPreview(-1); }
      else if(k === "home"){ e.preventDefault(); gotoPreview(0); }
      else if(k === "end"){ e.preventDefault(); gotoPreview(T.pages.length - 1); }
      else if(k === "f"){ e.preventDefault(); togglePvFull(); }
      else if(mod && k === "p"){ e.preventDefault(); exportPdf(); }
      return;
    }
    if(mod && k === "z" && !e.shiftKey){ e.preventDefault(); undo(); return; }
    if(mod && ((k === "z" && e.shiftKey) || k === "y")){ e.preventDefault(); redo(); return; }
    if(mod && k === "p"){ e.preventDefault(); exportPdf(); return; }
    const sel = SEL && findEl(SEL);
    if(sel){
      if(e.key === "Escape"){ if(CROPPING){ CROPPING = null; renderStage(); renderRight(); return; } deselect(); return; }
      if(e.key === "Delete" || e.key === "Backspace"){ e.preventDefault(); delEl(sel); return; }
      if(mod && k === "d"){ e.preventDefault(); dupEl(sel); return; }
      if(mod && (e.key === "]" || e.key === "[" || e.key === "}" || e.key === "{")){
        e.preventDefault(); const fwd = e.key === "]" || e.key === "}";
        arrange(sel, fwd ? (e.shiftKey ? "front" : "up") : (e.shiftKey ? "back" : "down")); return;
      }
      if(e.key === "Enter" && sel.t === "text"){ e.preventDefault(); startEdit(sel.id); return; }
      const st = e.shiftKey ? 5 : 1, A = { arrowleft:[-st, 0], arrowright:[st, 0], arrowup:[0, -st], arrowdown:[0, st] }[k];
      if(A){ e.preventDefault(); nudge(sel, A[0], A[1]); return; }
    }
    if(k === "pagedown" || k === "arrowdown"){ e.preventDefault(); if(T.cur < T.pages.length - 1){ T.cur++; renderAll(); } }
    if(k === "pageup" || k === "arrowup"){ e.preventDefault(); if(T.cur > 0){ T.cur--; renderAll(); } }
  });

  const ICON = {
    al_left:`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M4 10h10M4 14h16M4 18h10"/></svg>`,
    al_center:`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M7 10h10M4 14h16M7 18h10"/></svg>`,
    al_justify:`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M4 10h16M4 14h16M4 18h16"/></svg>`,
    al_right:`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M10 10h10M4 14h16M10 18h10"/></svg>`,
    t_text:`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M5 6h14M5 11h14M5 16h9"/></svg>`,
    t_head:`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M6 5v14M18 5v14M6 12h12"/></svg>`,
    t_quote:`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M7 7c-2 1-3 3-3 6v4h5v-5H6M17 7c-2 1-3 3-3 6v4h5v-5h-3"/></svg>`,
    t_img:`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="1"/><path d="M3 16l5-5 4 4 3-3 6 6"/></svg>`,
    t_shape:`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="5" y="5" width="14" height="14" rx="1"/></svg>`,
    t_grid:`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4" y="4" width="7" height="7" rx="1"/><rect x="13" y="4" width="7" height="7" rx="1"/><rect x="4" y="13" width="7" height="7" rx="1"/><rect x="13" y="13" width="7" height="7" rx="1"/></svg>`,
    t_char:`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-4 3-6 7-6s7 2 7 6"/></svg>`,
    t_div:`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 12h18"/></svg>`,
    plus:`<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>`,
    dup:`<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="8" y="8" width="12" height="12" rx="1.5"/><path d="M4 16V5a1 1 0 0 1 1-1h11"/></svg>`,
    trash:`<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2m-9 0 1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13" stroke-linecap="round" stroke-linejoin="round"/></svg>`
  };

  boot();
})();
</script>
