<script src="ui.js" defer></script>
<title>Camp</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">

<!-- Web fonts (kept minimal + writer-friendly). If a font fails to load, system fallbacks apply. -->
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&family=Inter:wght@400;600;700&family=Source+Sans+3:wght@400;600;700&family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">
<style>

#bootLoader{
  position: fixed;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  background: rgba(15,15,15,0.55);
  z-index: 999999;
}
#bootLoader[data-on="1"]{ display:flex; }
#bootLoader .bootBox{
  min-width: 220px;
  max-width: 360px;
  padding: 18px 20px;
  border-radius: 14px;
  background: rgba(25,25,25,0.92);
  box-shadow: 0 10px 40px rgba(0,0,0,0.45);
  color: #fff;
  font: 14px/1.35 system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  letter-spacing: 0.2px;
}
#bootLoader .bootRow{ display:flex; gap:12px; align-items:center; }
#bootLoader .bootSpinner{
  width: 18px; height: 18px;
  border-radius: 999px;
  border: 2px solid rgba(255,255,255,0.25);
  border-top-color: rgba(255,255,255,0.95);
  animation: bootSpin 0.9s linear infinite;
  flex: 0 0 auto;
}
#bootLoader .bootText{ opacity: 0.95; }
@keyframes bootSpin{ to { transform: rotate(360deg); } }

  :root{
    /* Physical page */
    --a4w-mm: 210;
    --a4h-mm: 297;

/* Margins (page-edge based) */
    --m-top-mm: 25.4;   /* 2.55cm (measured) */
    --m-bot-mm: 25.4;   /* ~2.45cm (measured) */
    --m-right-mm: 25.4;   /* 2.5cm */
    --m-left-mm: 38.1;    /* 3.9cm */

    /* Title page margins (Final Draft style: centered on full page, not script text column) */
    --tp-left-mm: 25.4;   /* match right so title text is truly centered on page */
    --tp-right-mm: 25.4;

    /* Wrap calibration (mm): tweak to match Final Draft line breaks across browser fonts */
    --wrap-cal-mm: 0;  /* wrap calibration (mm): adjust only if needed */

    /* Header band reserved for page number (non-editable) */
    --header-band-mm: 12;

    /* Baseline step (physical units) */
    --baseline-mm: 4.233; /* ~12pt in mm (12pt = 4.233mm) */
    --baseline-cal: 1.000; /* hidden calibration knob */
    --baseline-step-mm: calc(var(--baseline-mm) * var(--baseline-cal));

    /* Font */
    --font-size-pt: 12;
    --font-stack: "Courier Prime","Courier New",Courier,monospace;

    /* Geometry (mm) – filled by JS */
    --x-action-L-mm: 39;
    --x-action-R-mm: 25;
    --x-character-L-mm: 0;
    --x-character-R-mm: 25;
    --x-dialogue-L-mm: 0;
    --x-dialogue-R-mm: 0;
    --x-paren-L-mm: 0;
    --x-paren-R-mm: 0;
    --x-trans-R-mm: 25;

    /* UI */
    --ui-bg: #101114;
    --ui-panel: #171922;
    --ui-border: #2a2f3a;
    --ui-text: #e9ecf2;
    --ui-muted: #aeb6c6;
    --ui-accent: #5b8cff;
  }

  /* Native browser spell/grammar underlines (where supported) */
  ::spelling-error{
    text-decoration: underline wavy rgba(255,77,77,0.75);
    text-decoration-skip-ink: none;
    text-decoration-thickness: 1.2px;
    text-underline-offset: 0.22em;
  }
  ::grammar-error{
    text-decoration: underline wavy rgba(77,125,255,0.75);
    text-decoration-skip-ink: none;
    text-decoration-thickness: 1.2px;
    text-underline-offset: 0.22em;
  }


  
  /* Prevent distracting spell/grammar underline flicker while you type:
     Keep native spellcheck ON, but hide its underlines ONLY on the active line. */
  #scriptEditor.spell-suppress-all::spelling-error,
  #scriptEditor.spell-suppress-all::grammar-error,
  #scriptEditor.spell-suppress-all::-moz-spelling-error,
  #scriptEditor.spell-suppress-all::-moz-grammar-error,
  #scriptEditor.spell-suppress-all::-webkit-spelling-error,
  #scriptEditor.spell-suppress-all::-webkit-grammar-error,
  #scriptEditor.spell-suppress-all .line::spelling-error,
  #scriptEditor.spell-suppress-all .line::grammar-error,
  #scriptEditor.spell-suppress-all .line::-moz-spelling-error,
  #scriptEditor.spell-suppress-all .line::-moz-grammar-error,
  #scriptEditor.spell-suppress-all .line::-webkit-spelling-error,
  #scriptEditor.spell-suppress-all .line::-webkit-grammar-error,
  .spell-suppress::spelling-error,
  .spell-suppress::grammar-error,
  .spell-suppress::-moz-spelling-error,
  .spell-suppress::-moz-grammar-error,
  .spell-suppress::-webkit-spelling-error,
  .spell-suppress::-webkit-grammar-error{
    text-decoration: none !important;
  }
@page { size: A4; margin: 0; }
  @media print{
    body{ background:#fff; }
    .topbar, .status {
  display: none !important; display:none !important; }
    .workspace{ padding:0 !important; }
    .paperArea{ gap:0 !important; }
    .titlePaper{ box-shadow:none !important; border:none !important; margin:0 !important; }
    .scriptStack{ box-shadow:none !important; border:none !important; margin:0 !important; background:transparent !important; }
    .pageBg{ box-shadow:none !important; border:none !important; }

    /* Force paper to print white even if Dark Mode is enabled */
    .pageBg, .titlePaper{ background:#fff !important; color:#111 !important; }
    .scriptEditor{ color:#111 !important; }
    .pageNumber{ color:#111 !important; }
  }

  body{
    margin:0;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    background: var(--ui-bg);
    color: var(--ui-text);
  }

  .topbar{
    position: sticky; top:0; z-index: 50;
    background: linear-gradient(180deg, rgba(20,22,30,0.98), rgba(16,17,20,0.92));
    border-bottom: 1px solid var(--ui-border);
    backdrop-filter: blur(10px);
    padding: 10px 12px;
    display:flex; gap:10px; align-items:center; flex-wrap:wrap;
  }

  .group{ display:flex; gap:8px; align-items:center; padding:6px; border:1px solid var(--ui-border); border-radius:12px; background: rgba(255,255,255,0.03); }
  .btn{
    appearance:none; border:1px solid var(--ui-border);
    background: rgba(255,255,255,0.04);
    color: var(--ui-text);
    border-radius: 10px;
    padding: 7px 10px;
    font-size: 13px;
    cursor:pointer;
    user-select:none;
  }

  .btn:focus-visible, .menuBtn:focus-visible, .item:focus-visible, .tool:focus-visible{
    outline: 2px solid var(--ui-accent);
    outline-offset: 2px;
  }
  .btn:hover{ border-color: rgba(91,140,255,0.55); }
  .btn:active{ transform: translateY(0.5px); }
  .btn.tog.on{ background: rgba(91,140,255,0.18); border-color: rgba(91,140,255,0.7); }

  select{
    background: rgba(255,255,255,0.04);
    color: var(--ui-text);
    border:1px solid var(--ui-border);
    border-radius: 10px;
    padding: 7px 10px;
    font-size: 13px;
    outline:none;
  }
  /* Improve dropdown readability (font / size menus): native option list often renders on white */
  select option, select optgroup{
    color:#111;
    background:#fff;
  }
  select:focus{ border-color: rgba(91,140,255,0.65); }

  .workspace{
    padding: 14px 14px 60px;
    display:flex;
    justify-content:center;
  }

  .paperArea{
    width: min(100%, 920px);
    display:flex;
    flex-direction:column;
    gap: 16px;
    align-items:center;
  }

/* Page look */
  .pageBg, .titlePaper{
    width: calc(var(--a4w-mm) * 1mm);
    height: calc(var(--a4h-mm) * 1mm);
    background: #fff;
    color:#111;
    border-radius: 10px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.45);
    border: 1px solid rgba(0,0,0,0.12);
    position: relative;
    overflow:hidden;
  }

  /* Optional: dark pages (View > Dark Mode)
     UI stays the same; only the paper + script text invert. */
  :root[data-pages="dark"] .pageBg,
  :root[data-pages="dark"] .titlePaper{
    background: #202124;
    color: #f3f4f6;
    border: 1px solid rgba(255,255,255,0.14);
    box-shadow: 0 12px 40px rgba(0,0,0,0.60);
  }
  :root[data-pages="dark"] .pageNumber{ color: #f3f4f6; }
  :root[data-pages="dark"] .scriptEditor{ color: #f3f4f6; }

  :root[data-pages="dark"] .titleField[data-empty="1"],
  :root[data-pages="dark"] .contactField[data-empty="1"]{
    caret-color: #f3f4f6;
  }
  :root[data-pages="dark"] .titleField[data-empty="1"]::before,
  :root[data-pages="dark"] .contactField[data-empty="1"]::before{
    color: #f3f4f6;
    opacity: .35;
  }


  .pageHeaderBand{
    position:absolute; left:0; right:0; top:0;
    height: calc(var(--header-band-mm) * 1mm);
    pointer-events:none;
  }
  .pageNumber{
    position:absolute;
    top: calc(12.5 * 1mm); /* Final Draft-style: ~0.5in from top edge */
    right: calc(var(--m-right-mm) * 1mm);
    font-family: var(--font-stack);
    font-size: calc(var(--font-size-pt) * 1pt);
    color:#111;
    user-select:none;
    pointer-events:none;
  }

  /* Draft name & date (Format > Pages): title page bottom-right, and top of every page */
  .tpDraft{
    position:absolute; right: calc(var(--m-right-mm) * 1mm); bottom: calc(var(--m-bot-mm) * 1mm); min-height: calc(24 * 1mm);
    text-align:right; font-family: var(--font-stack); font-size: calc(var(--font-size-pt) * 1pt);
    line-height: calc(var(--baseline-step-mm) * 1mm); white-space: pre; color:#111; pointer-events:none; user-select:none;
  }
  .tpDraft[hidden], .pageDraft[hidden]{ display:none; }
  .pageDraft{
    position:absolute; top: calc(12.5 * 1mm); left: 0; right: 0; text-align: center;
    font-family: var(--font-stack); font-size: calc(var(--font-size-pt) * 1pt); color:#111; white-space:pre;
    user-select:none; pointer-events:none;
  }
  :root[data-pages="dark"] .pageDraft, :root[data-pages="dark"] .tpDraft{ color:#f3f4f6; }

  /* ---------- Tablets: pages scaled to fit ---------- */
  #paperArea{ transform-origin: top center; }
  body.scaledView #paperArea{ transform: translateX(var(--viewShift, 0px)) scale(var(--viewScale, 1)); transform-origin: top center; align-self: flex-start; flex-shrink: 0; }
  /* Phones: real pages, tight chrome */
  body.phoneUI .wrap{ padding: 8px 4px 24px !important; gap: 0 !important; }
  body.phoneUI:not(.railCollapsed) .wrap{ padding-right: 28px !important; }
  body.phoneUI .top{ background: #141414 !important; }
  body.phoneUI #countSave{ max-width: 96px; overflow: hidden; }
  body.phoneUI #countSave .n{ display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  body.phoneUI #paperArea{ gap: 14px !important; }
  body.phoneUI .titlePaper, body.phoneUI .pageBg{ border-radius: 3px !important; }
  body.phoneUI .scriptStack, body.phoneUI #scriptEditor{ -webkit-tap-highlight-color: transparent; }
  html{ overflow-anchor: none; }
  /* Never let the full-size page widen the screen on phones/tablets (it's scaled to fit instead) */
  @media (max-width: 1120px){
    .wrap{ grid-template-columns: minmax(0, 1fr) !important; }
    .stage, .stageInner{ min-width: 0; overflow-x: clip; }
  }
  @media (max-width: 599px){ html, body{ overflow-x: clip; } }
  #paperArea > *{ flex-shrink: 0; }
  body.scaledView .stage, body.scaledView .stageInner{ overflow-x: clip; min-width: 0; max-width: 100%; }
  body.scaledView .wrap{ overflow-x: clip; }
  body.scaledView .notesPaper{ width: 100%; }

  /* ---------- Touch toolbar ---------- */
  .touchBar{
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 1000; display:flex; align-items:center; gap:4px;
    padding: 8px 10px calc(8px + env(safe-area-inset-bottom)); overflow-x:auto; -webkit-overflow-scrolling: touch;
    background: rgba(22,22,24,.96); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border-top: 1px solid rgba(255,255,255,.1); transition: transform .12s ease; scrollbar-width: none;
  }
  .touchBar::-webkit-scrollbar{ display:none; }
  .touchBar[hidden]{ display:none; }
  .touchBar button{
    flex: 0 0 auto; height: 38px; min-width: 38px; padding: 0 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,.1);
    background: rgba(255,255,255,.05); color: rgba(255,255,255,.88); font: 600 13.5px Inter, system-ui, sans-serif; touch-action: manipulation;
    display:inline-flex; align-items:center; justify-content:center;
  }
  .touchBar button.on{ background: #ececf0; color: #111; border-color: #ececf0; }
  .touchBar .tbIcon{ padding: 0; width: 38px; }
  .touchBar .tbIcon svg{ width: 18px; height: 18px; }
  .touchBar .tbSep{ flex: 0 0 1px; height: 24px; background: rgba(255,255,255,.12); margin: 0 4px; }
  body.hasTouchBar{ padding-bottom: 70px; }
  .top{ transition: transform .18s ease; }
  body.kbOpen .top{ transform: translateY(-100%); }
  body.kbOpen .touchBar{ padding: 4px 6px; gap: 3px; border-top-color: rgba(255,255,255,.14); }
  body.kbOpen .touchBar button{ height: 32px; min-width: 32px; padding: 0 9px; font-size: 12.5px; }
  body.kbOpen .touchBar .tbIcon{ width: 32px; padding: 0; }
  body.kbOpen .touchBar .tbSep{ height: 18px; margin: 0 2px; }

  /* ---------- Page slider ---------- */
  .pageRail{ position: fixed; z-index: 45; width: 22px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .pageRail[hidden]{ display: none !important; }
  .prToggle{ flex: 0 0 auto; width: 22px; height: 22px; padding: 0; border-radius: 7px; border: 1px solid var(--uiBorder); background: var(--uiPanel); color: var(--uiMuted); display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .prToggle:hover{ color: var(--uiText); }
  .prToggle svg{ width: 12px; height: 12px; transition: transform .15s ease; }
  .pageRail.collapsed .prToggle svg{ transform: rotate(180deg); }
  .pageRail.collapsed .prTrack{ display: none; }
  .prTrack{ position: relative; flex: 1 1 auto; width: 22px; min-height: 60px; border-radius: 11px; border: 1px solid var(--uiBorder); background: rgba(255,255,255,.035); cursor: pointer; touch-action: none; outline: none; box-sizing: border-box; }
  .prTrack:focus-visible{ border-color: var(--ui-accent); }
  .prTick{ position: absolute; left: 7px; right: 7px; height: 1px; background: rgba(255,255,255,.18); pointer-events: none; }
  .prNum{ position: absolute; left: 0; right: 0; text-align: center; transform: translateY(-50%); font: 600 8.5px/1 Inter, system-ui, sans-serif; color: var(--uiMuted); pointer-events: none; }
  .prThumb{ position: absolute; left: -2px; right: -2px; height: 18px; border-radius: 9px; background: var(--uiText); color: var(--uiBg); font: 700 9.5px/18px Inter, system-ui, sans-serif; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,.45); pointer-events: none; }
  .prBubble{ position: absolute; left: calc(100% + 8px); white-space: nowrap; transform: translateY(-50%); padding: 5px 9px; border-radius: 8px; background: #1c1d21; color: #fff; border: 1px solid rgba(255,255,255,.16); font: 600 12px/1.3 Inter, system-ui, sans-serif; box-shadow: 0 8px 22px rgba(0,0,0,.5); pointer-events: none; opacity: 0; transition: opacity .12s; max-width: 260px; overflow: hidden; text-overflow: ellipsis; }
  .prBubble small{ display: block; font-weight: 500; opacity: .65; overflow: hidden; text-overflow: ellipsis; }
  .pageRail.dragging .prBubble, .prTrack:hover .prBubble{ opacity: 1; }
  .pageRail.edge .prBubble{ left: auto; right: calc(100% + 8px); }
  body.notesMode .pageRail, body.kbOpen .pageRail{ display: none !important; }
  @media print{ .pageRail{ display: none !important; } }
  .sceneSheetShade{ position: fixed; inset: 0; z-index: 100002; background: rgba(0,0,0,.5); display:flex; align-items:flex-end; }
  .sceneSheet{ width: 100%; max-height: 72vh; display:flex; flex-direction:column; background:#1c1d21; color: rgba(255,255,255,.92); border-radius: 16px 16px 0 0; padding-bottom: env(safe-area-inset-bottom); font: 14px Inter, system-ui, sans-serif; }
  .ssHead{ display:flex; align-items:center; justify-content:space-between; padding: 14px 16px; border-bottom: 1px solid rgba(255,255,255,.08); }
  .ssHead button{ all: unset; font-weight: 600; color: #f2c94c; padding: 4px 8px; cursor: pointer; }
  .ssList{ overflow:auto; padding: 6px 8px 14px; }
  .ssList button{ all: unset; display:flex; gap: 12px; width: 100%; box-sizing: border-box; padding: 12px 10px; border-radius: 10px; font-weight: 600; font-size: 13.5px; cursor: pointer; }
  .ssList button:active{ background: rgba(255,255,255,.08); }
  .ssList button span{ min-width: 22px; color: rgba(255,255,255,.45); font-weight: 500; }
  .ssEmpty{ padding: 20px; opacity: .6; }

  /* ---------- Small screens: compact top bar ---------- */
  @media (max-width: 760px){
    .topInner{ padding: 8px 8px !important; gap: 6px !important; display: flex !important; align-items: center; justify-content: space-between; }
    .topTitle{ display: none !important; }
    .menubar{ min-width: 0; }
    .menuBtn{ padding: 6px 7px !important; font-size: 13px; }
    .viewTabs{ margin-left: 4px !important; }
    .viewTabs button{ padding: 4px 8px !important; }
    #countWords, #countScenes, #countPages{ display:none !important; }
    .stats{ max-width: none !important; }
    .dropdown{ max-width: calc(100vw - 16px); }
  }
  @media (max-width: 440px){
    .topInner{ padding: 8px 6px !important; gap: 4px !important; }
    .menuBtn{ padding: 6px 5px !important; font-size: 12.5px; }
    .viewTabs button{ padding: 4px 6px !important; font-size: 12px; }
    #countSave{ padding: 4px 8px !important; font-size: 11.5px; }
    #countSave .n{ font-size: 11.5px; }
  }

  /* ---------- Phones: script re-flows to the screen (no page frames) ---------- */
  body.phoneView .wrap{ padding: 0 !important; }
  body.phoneView .stage, body.phoneView .stageInner, body.phoneView #paperArea, body.phoneView .paperArea{ width: 100% !important; max-width: 100% !important; }
  body.phoneView #paperArea{ gap: 12px; padding: 12px 10px 0; box-sizing: border-box; }
  body.phoneView .scriptStack{ width: 100% !important; height: auto !important; background: #fff; border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.35); }
  body.phoneView .pagesLayer{ display: none !important; }
  body.phoneView .editorLayer{ position: relative !important; }
  body.phoneView .scriptEditor{
    position: relative !important; width: 100% !important; min-height: 40vh !important; padding: 18px 14px 45vh !important; box-sizing: border-box;
    font-size: clamp(12px, 3.5vw, 14px) !important; line-height: 1.5 !important; color: #111;
    left: auto !important; top: auto !important; right: auto !important;
  }
  /* Real page breaks, shown as thin numbered dividers */
  body.phoneView .scriptEditor .pageSpacer{ height: 0 !important; margin: 0 !important; }
  body.phoneView .scriptEditor .pageSpacer[data-kind="between"]{ height: 0 !important; margin: 16px -14px 14px !important; border-top: 1px dashed rgba(0,0,0,.22); position: relative; }
  body.phoneView .scriptEditor .pageSpacer[data-kind="between"]::after{ content: attr(data-page) "."; position: absolute; right: 12px; top: -8px; padding: 0 6px; background: #fff; color: #8a8a8a; font: 600 10.5px/16px Inter, system-ui, sans-serif; text-transform: none; }
  body.phoneView .scriptEditor .pageSpacer.pageMarker{ height: auto !important; min-height: 1.5em; margin-left: 34% !important; color: #555; }
  body.phoneView .scriptEditor .line{ width: auto !important; min-height: 1.5em !important; margin-left: 0 !important; margin-right: 0 !important; }
  body.phoneView .scriptEditor .line[data-type="character"]{ margin-left: 34% !important; }
  body.phoneView .scriptEditor .line[data-type="dialogue"]{ margin-left: 14% !important; margin-right: 10% !important; }
  body.phoneView .scriptEditor .line[data-type="parenthetical"]{ margin-left: 24% !important; margin-right: 16% !important; }
  body.phoneView .scriptEditor .line[data-type="transition"]{ text-align: right; }
  body.phoneView .scriptEditor .line + .line[data-type="scene"]{ margin-top: 1.5em !important; }
  body.phoneView .titlePaper{ width: 100% !important; height: auto !important; min-height: 0 !important; padding: 26px 16px 20px; box-sizing: border-box; }
  body.phoneView .titlePaper .pageHeaderBand, body.phoneView .titlePaper .wmLayer{ display: none; }
  body.phoneView .titleBody{ position: static !important; padding: 0 !important; }
  body.phoneView .titleField, body.phoneView .contactField, body.phoneView .tpDraft{
    position: relative !important; top: auto !important; left: auto !important; right: auto !important; bottom: auto !important;
    width: auto !important; min-height: 1.5em !important; margin: 0 0 14px !important; font-size: clamp(12px, 3.5vw, 14px) !important; line-height: 1.5 !important;
  }
  body.phoneView .contactField{ margin-top: 26px !important; }
  body.phoneView .tpDraft{ text-align: left; min-height: 0 !important; }
  body.phoneView .notesPaper{ width: 100% !important; min-height: 70vh; }
  body.phoneView #notesArea{ padding: 12px 10px 0; box-sizing: border-box; }
  body.phoneView .cmtMarks{ display: none; }

  /* Name dictionary dialog */
  .nmChips{ display:flex; flex-wrap:wrap; gap:6px; max-height: 180px; overflow:auto; }
  .nmChip{ display:inline-flex; align-items:center; gap:6px; height: 28px; padding: 0 10px; border-radius: 14px; background: rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.12); font-size: 12.5px; }
  .nmChips.auto .nmChip{ opacity:.7; }
  .nmChip button{ all: unset; cursor: pointer; opacity: .6; font-size: 11px; }

  body.notesMode #paperArea{ position:absolute !important; left:-100000px !important; top:0 !important; visibility:hidden !important; }

  /* Title page */
  .titleBody{
    position:absolute; inset:0;
    padding-top: calc(var(--header-band-mm) * 1mm);
    box-sizing:border-box;
  }
  .titleField{
    position:absolute;
    left: calc(var(--tp-left-mm) * 1mm);
    right: calc(var(--tp-right-mm) * 1mm);
    text-align:center;
    font-family: var(--font-stack);
    font-size: calc(var(--font-size-pt) * 1pt);
    line-height: calc(var(--baseline-step-mm) * 1mm);
    min-height: calc(var(--baseline-step-mm) * 1mm);
    outline:none;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .titleField[data-name="title"]{
    top: calc(98.1mm - (0.35 * var(--baseline-step-mm) * 1mm) + (0.25 * var(--baseline-step-mm) * 1mm));
    font-weight: 700;
    text-transform: uppercase;
  }
  .titleField[data-name="writtenby"]{ top: calc(115.6mm - (0.55 * var(--baseline-step-mm) * 1mm) + (0.25 * var(--baseline-step-mm) * 1mm)); }
  .titleField[data-name="name"]{ top: calc(127.7mm - (0.35 * var(--baseline-step-mm) * 1mm) + (0.25 * var(--baseline-step-mm) * 1mm)); }

  .contactField{
    position:absolute;
    left: calc(var(--tp-left-mm) * 1mm);
    bottom: calc(var(--m-bot-mm) * 1mm);
    width: calc(80 * 1mm);
    min-height: calc(24 * 1mm);
    text-align:left;
    font-family: var(--font-stack);
    font-size: calc(var(--font-size-pt) * 1pt);
    line-height: calc(var(--baseline-step-mm) * 1mm);
    outline:none;
    white-space: pre-wrap;
    word-break: break-word;
  }

  /* Title page placeholders (Final Draft-style: grey pre-fill that disappears on type)
   We keep a hidden NBSP in empty fields so the caret has a real glyph box to align to.
   Placeholder itself is a ::before overlay driven by data-empty="1". */
  .titleField[data-empty="1"],
  .contactField[data-empty="1"]{
    color: transparent;
    caret-color: #111;
  }

  .titleField[data-empty="1"]::before,
  .contactField[data-empty="1"]::before{
    content: attr(data-placeholder);
    opacity: .35;
    pointer-events: none;
    position: absolute;
    left: 0; right: 0; top: 0;
    color: #111;
    white-space: pre-wrap;
  }
  .contactField[data-empty="1"]::before{
    right: auto;
  }

/* Script stack (visual pages behind one continuous editor) */
  .scriptStack{
    width: calc(var(--a4w-mm) * 1mm);
    position: relative;
  }
  .pagesLayer{
    position:absolute; left:0; right:0; top:0;
    pointer-events:none;
  }
  .pagesLayer .pageBg{
    margin-bottom: 16px;
  }
  .editorLayer{
    position:relative;
    z-index:5;
    /* align with pageBg stacking margins */
    pointer-events:auto;
  }

  /* One editable DOM that spans all pages (plus spacers) */
  .scriptEditor{
    width: calc(var(--a4w-mm) * 1mm);
    position: relative;
    outline:none;
    font-family: var(--font-stack);
    font-size: calc(var(--font-size-pt) * 1pt);
    line-height: calc(var(--baseline-step-mm) * 1mm);
    color:#111;
    background: transparent;
    box-sizing:border-box;
    /* keep it inside page paper */
    padding-left: calc(var(--m-left-mm) * 1mm);
    padding-right: calc(var(--m-right-mm) * 1mm);
    /* no top/bottom padding: we insert explicit spacers per-page */
    padding-top: 0;
    padding-bottom: 0;
  }

  /* Page spacers live inside editor, but are non-editable */
  .pageSpacer{
    height: 0;
  }
  .line.pgTopBlank{ height: 0 !important; min-height: 0 !important; overflow: hidden; }
  .pageSpacer[data-kind="top"]{
    height: calc(var(--m-top-mm) * 1mm);
  }
  .pageSpacer[data-kind="between"]{
    height: calc((var(--m-bot-mm) + var(--m-top-mm)) * 1mm);
  }
  .pageSpacer{
    pointer-events:none;
    user-select:none;
  }
  /* (MORE) / NAME (CONT'D) — display-only, drawn from data-label so it's never copied or saved */
  .pageSpacer.pageMarker{
    margin-left: calc((var(--x-character-L-mm) - var(--m-left-mm)) * 1mm);
    white-space: pre;
    text-transform: uppercase;
    overflow: visible;
  }
  .pageSpacer.pageMarker::before{ content: attr(data-label); }

  .line{
    min-height: calc(var(--baseline-step-mm) * 1mm);
    white-space: pre-wrap;
    word-break: break-word;
    overflow-wrap: anywhere; /* long links / unbroken text must wrap inside the page in every browser */
    tab-size: 4;
    position: relative;
    box-sizing: border-box;
    width: calc((var(--a4w-mm) - var(--x-action-L-mm) - var(--x-action-R-mm) + var(--wrap-cal-mm)) * 1mm);
    margin-left: 0;
    margin-right: 0;
  }

    /* Scene numbers (Format > Pages > Scene Numbers)
     Shooting script convention: show scene numbers on BOTH sides.
     Keep them comfortably in the margins (not crowding the slugline). */
  :root{
    /* Fixed box width for numbers (handles 1–3 digits cleanly) */
    --scene-num-box-w: 0.7in;

    /* Where the number box sits from the page edge */
    --scene-num-left-edge: 0.25in;   /* box's LEFT edge from page LEFT edge */
    --scene-num-right-edge: 0.25in;  /* box's RIGHT edge from page RIGHT edge */
  }

  :root[data-scenenums="1"] .line[data-type="scene"]::before,
  :root[data-scenenums="1"] .line[data-type="scene"]::after{
    content: attr(data-scene-num);
    position: absolute;
    top: 0;
    width: var(--scene-num-box-w);
    font-weight: 400;
    line-height: inherit;
    color: inherit;
    pointer-events: none;
    user-select: none;
    text-decoration: none;
  }

  /* LEFT scene number: right-aligned in a fixed margin box */
  :root[data-scenenums="1"] .line[data-type="scene"]::before{
    left: calc((-1) * (calc(var(--m-left-mm) * 1mm) - var(--scene-num-left-edge)));
    text-align: right;
  }

  /* RIGHT scene number: left-aligned in a fixed margin box */
  :root[data-scenenums="1"] .line[data-type="scene"]::after{
    left: calc(100% + (calc(var(--m-right-mm) * 1mm) - var(--scene-num-right-edge) - var(--scene-num-box-w)));
    text-align: left;
  }


  .line[data-type="scene"], .line[data-type="action"]{
    width: calc((var(--a4w-mm) - var(--x-action-L-mm) - var(--x-action-R-mm) + var(--wrap-cal-mm)) * 1mm);
    margin-left: 0;
  }
  .line[data-type="character"]{
    width: calc((var(--a4w-mm) - var(--x-character-L-mm) - var(--x-character-R-mm) + var(--wrap-cal-mm)) * 1mm);
    margin-left: calc((var(--x-character-L-mm) - var(--m-left-mm)) * 1mm);
  }
  .line[data-type="dialogue"]{
    width: calc((var(--a4w-mm) - var(--x-dialogue-L-mm) - var(--x-dialogue-R-mm) + var(--wrap-cal-mm)) * 1mm);
    margin-left: calc((var(--x-dialogue-L-mm) - var(--m-left-mm)) * 1mm);
  }
  .line[data-type="parenthetical"]{
    width: calc((var(--a4w-mm) - var(--x-paren-L-mm) - var(--x-paren-R-mm) + var(--wrap-cal-mm)) * 1mm);
    margin-left: calc((var(--x-paren-L-mm) - var(--m-left-mm)) * 1mm);
    text-indent: -1ch;   /* Final Draft hangs the opening "(" one character left of the text */
  }
  .line[data-type="transition"]{
    width: calc((var(--a4w-mm) - var(--x-action-L-mm) - var(--x-trans-R-mm) + var(--wrap-cal-mm)) * 1mm);
    margin-left: 0;
    text-align:right;
  }

  /* Dual Dialogue (side-by-side, Final Draft-style) */
  :root{
    --dual-gap-mm: 6.35;   /* Final Draft: 0.25" gutter between the two 2.875" columns */
    --dual-pad-mm: 0;      /* dialogue starts flush with each column, like Final Draft */
  }
  .line[data-type="dual"]{
    width: calc((var(--a4w-mm) - var(--x-action-L-mm) - var(--x-action-R-mm) + var(--wrap-cal-mm)) * 1mm);
    margin-left: 0;
  }
  .line[data-type="dual"] .dualGrid{
    display: grid;
    grid-template-columns: 1fr 1fr;
    column-gap: calc(var(--dual-gap-mm) * 1mm);
    width: 100%;
  }
  .line[data-type="dual"] .dualCol{
    min-width: 0;
    display: flex;
    flex-direction: column;
  }
  .line[data-type="dual"] .dualField{
    min-height: calc(var(--baseline-step-mm) * 1mm);
    white-space: pre-wrap;
    word-break: break-word;
    overflow-wrap: anywhere;
    outline: none;
    margin: 0;
  }
  .line[data-type="dual"] .dualChar{
    text-align: center;
    text-transform: uppercase;
    padding: 0 calc(var(--dual-pad-mm) * 1mm);
  }
  .line[data-type="dual"] .dualDlg{
    padding: 0 calc(var(--dual-pad-mm) * 1mm);
  }

  /* Final Draft-style: scene / character / transition are uppercase by default */
  .line[data-type="scene"],
  .line[data-type="character"],
  .line[data-type="transition"]{ text-transform: uppercase; }

  /* Auto scene separation: add one extra blank-line worth of space ABOVE every Scene Heading
     when it is not the first line on a page. This creates the common “double gap” between scenes. */
  .line + .line[data-type="scene"]{
    margin-top: calc(var(--baseline-step-mm) * 1mm);
  }

/* Optional: Bold Scene Headings (Format > Pages > Bold Scene Headings) */
:root[data-boldsceneheads="1"] .line[data-type="scene"]{

}

/* Optional: Underline Scene Headings (Format > Pages > Underline Scene Headings) */
:root[data-underlinesceneheads="1"] .line[data-type="scene"]{
  text-decoration: underline;
  text-underline-offset: 2px;
  text-decoration-thickness: from-font;
}

/* === Project B UI Skin (scoped, but used as primary chrome) === */

@font-face{
  font-family:"CourierFinalDraft";
  src: local("Courier Final Draft"), local("CourierFinalDraft"), local("Courier FinalDraft"), local("CourierFD");
  font-weight: 400;
  font-style: normal;
}

:root{
  --topBarH: 58px;

  /* Solid app background (avoid banding / double-tone when scrolling) */
  --uiBg:#141414;
  --uiBg2:#141414;
  --uiPanel:#1b1b1b;
  --uiText:#f2f2f2;
  --uiMuted:#b9b9b9;
  --uiBorder:#2b2b2b;
  --uiShadow: 0 18px 55px rgba(0,0,0,0.55);

  --paper:#ffffff;
  --paperText:#111111;
  --paperMuted:#5a5a5a;

  /* Script font stack */
  --scriptFont:'Courier Prime','Courier New',Courier,monospace;
  --fontSize: 12pt;
  --leading: 1;
  --paraLine: calc(1em * var(--leading));

  /* US Letter (8.5" × 11") */
  --paperW: 210mm;
  --paperH: 297mm;

  /* Page-edge margins */
  --mTop: 25.4mm;
  --mBottom: 25.4mm;
  --mLeft: 38.1mm;
  --mRight: 25.4mm;

  /* Visual gap between sheets in UI */
  --pageGap: 18px;

  /* Element indents measured from page edge */
  --indentBodyL: var(--mLeft);
  --indentBodyR: var(--mRight);

  --indentDialogueL: 34mm;
  --indentDialogueR: 34mm;

  --indentCharacterL: 54mm;
  --indentParenL: 44mm;
}

*{box-sizing:border-box}
html,body{
  height:100%;
  margin:0;
  background: var(--uiBg);
  color:var(--uiText);
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;
  padding-top: var(--topBarH);
}
/* The offset belongs on <body> only: on both, the menu bar gap was doubled (a dead ~58px band). */
html{ padding-top: 0; }

/* Top bar */
.top{
  height: var(--topBarH);
  position:fixed; top:0; left:0; right:0; z-index:999;
  background: rgba(20,20,20,0.90);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--uiBorder);
}
.topInner{
  height: 100%;
  max-width: 1400px;
  margin: 0 auto;
  padding: 10px 16px;
  display:grid;
  grid-template-columns: 1fr auto 1fr; /* true centered title */
  align-items:center;
  gap:12px;
}
.menubar{display:flex; align-items:center; gap:6px; justify-content:flex-start; justify-self:start}
.menuBtn{
  border:1px solid transparent;
  background:transparent;
  color:var(--uiText);
  padding:6px 10px;
  border-radius:8px;
  cursor:pointer;
  font-weight:650;
  font-size:13px;
  line-height:1;
}
.menuBtn:hover{background:rgba(255,255,255,0.06)}
.menuBtn[aria-expanded="true"]{background:rgba(255,255,255,0.08); border-color:rgba(255,255,255,0.10)}
.menu{position:relative}
.dropdown{
position:absolute;
  
  z-index: 9999;
top:38px; left:0;
  min-width: 220px;
  background: var(--uiPanel);
  border: 1px solid var(--uiBorder);
  border-radius: 12px;
  box-shadow: 0 16px 45px rgba(0,0,0,0.5);
  padding:6px;
  display:none;
}
.dropdown.open{display:block}
/* Submenu (Format > Text) */
.submenuWrap{ position:relative; }
/* Hover bridge so submenus don't collapse when moving the mouse into them */
.submenuWrap::after{
  content:"";
  position:absolute;
  top:-8px;
  left:100%;
  width: 14px; /* covers the gap to the submenu */
  height: calc(100% + 16px);
}
.submenuBtn{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
.submenuArrow{ opacity:.75; font-size:14px; line-height:1; }
.submenu{
  position:absolute;
  top:-6px;
  left: calc(100% + 6px);
  min-width: 220px;
  background: var(--uiPanel);
  border: 1px solid var(--uiBorder);
  border-radius: 12px;
  box-shadow: 0 16px 45px rgba(0,0,0,0.5);
  padding:6px;
  display:none;
  z-index: 50;
}
.submenuWrap:hover .submenu,
.submenuWrap.subOpen .submenu{ display:block; }
.item{
  width:100%;
  text-align:left;
  border:0;
  background:transparent;
  color:var(--uiText);
  padding:10px 10px;
  border-radius:10px;
  cursor:pointer;
  font-size:13px;
  font-weight:600;
}
.item:hover{background:rgba(255,255,255,0.06)}
/* Menu checkbox rows */
.item.itemToggle{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}
.item.itemToggle .tick{
  font-weight:900;
  opacity:0.95;
}

/* Theme: light mode (toggle via View > Dark Mode) */
:root[data-theme="light"]{
  /* New UI vars */
  --uiBg:#f3f4f6;
  --uiBg2:#f3f4f6;
  --uiPanel:#ffffff;
  --uiText:#111827;
  --uiMuted:#4b5563;
  --uiBorder:#d1d5db;
  --uiShadow: 0 18px 55px rgba(0,0,0,0.12);

  /* Legacy vars (still used by some helpers) */
  --ui-bg:#f3f4f6;
  --ui-panel:#ffffff;
  --ui-border:#d1d5db;
  --ui-text:#111827;
  --ui-muted:#4b5563;

}
:root[data-theme="light"] .menuBtn:hover{background:rgba(0,0,0,0.05)}
:root[data-theme="light"] .menuBtn[aria-expanded="true"]{
  background:rgba(0,0,0,0.07);
  border-color:rgba(0,0,0,0.10);
}
:root[data-theme="light"] .item:hover{background:rgba(0,0,0,0.05)}

  color: rgba(0,0,0,0.78);

:root[data-theme="light"] .sceneBtn{
  background: rgba(0,0,0,0.03);
}
:root[data-theme="light"] .field{
  background: rgba(0,0,0,0.02);
}
:root[data-theme="light"] .typeList .pill{
  background: rgba(0,0,0,0.02);
}

.sep{height:1px;background:var(--uiBorder); margin:6px}

.topTitle{
  justify-self:center;
  font-size:13px;
  font-weight:750;
  letter-spacing:.2px;
  color:var(--uiText);
  opacity:.92;
  text-align:center;
  padding:6px 10px;
  border-radius:10px;

.stats{display:flex; gap:8px; align-items:center; flex-wrap:wrap; justify-content:flex-end; color:var(--uiMuted); font-size:12px}
.chip{
  border:1px solid var(--uiBorder);
  background: var(--uiPanel);

}

/* Layout */
.wrap{
  max-width: 1400px;
  margin: 0 auto;
  padding: 12px 24px 30px;
  display:grid;
  grid-template-columns: minmax(260px, 300px) auto minmax(260px, 300px);
  gap: 28px;
  align-items:start;
  justify-content:center;
}

/* Focus mode: hide side panels and keep pages centered */
.wrap.focus{
  grid-template-columns: 1fr !important;
  justify-items: center;
}
.wrap.focus .side,
.wrap.focus .panel{
  display:none !important;

  top: calc(var(--topBarH) + 12px);
  height: calc(100vh - var(--topBarH) - 24px);}


/* Keep panels from collapsing inward toward pages */
.side,
.panel{
  min-width: 260px;
}

/* Outline (left) */
.side{
  background: var(--uiPanel);
  border: 1px solid var(--uiBorder);
  border-radius: 14px;
  overflow:hidden;

/* Stage */
.stage{display:flex; justify-content:center; width:100%;}

/* Pages layer (visual only) */
.pagesLayer{

}
.page{

/* Title page layer */
.titleLayer{

/* Flow layer (editable script surface) */
.flowLayer{
  position: relative;
  z-index: 2;
  margin-top: calc(var(--paperH) + var(--pageGap));
  padding-top: var(--mTop);
  padding-bottom: var(--mBottom);
  width: var(--paperW);
}

  margin: 0;

  font-size: var(--fontSize);
  line-height: var(--leading);

}
.l{

  padding: 0;
  border: 0;
  background: transparent;
  white-space: pre-wrap;
  overflow-wrap: break-word;
  outline: none;
  cursor: text;
  box-sizing:border-box;
  width:100%;
}

/* Formatting (Final Draft-ish) */
.scene{ font-weight:700; letter-spacing:.2px; text-transform:uppercase; }
.scene{ margin-top: var(--paraLine); margin-bottom: var(--paraLine); }
.action{ margin-bottom: var(--paraLine); }
.character{ margin-top: var(--paraLine); padding-left: var(--indentCharacterL); padding-right: var(--indentBodyR); font-weight:700; text-transform:uppercase; }
.dialogue{ margin-bottom: var(--paraLine); padding-left: var(--indentDialogueL); padding-right: var(--indentDialogueR); }
.paren{ padding-left: var(--indentParenL); padding-right: var(--indentDialogueR); color: var(--paperMuted); }
.transition{ margin-top: var(--paraLine); margin-bottom: var(--paraLine); padding-left: var(--indentBodyL); padding-right: var(--indentBodyR); text-align:right; font-weight:700; letter-spacing:.2px; text-transform:uppercase; }
.shot{ padding-left: var(--indentBodyL); padding-right: var(--indentBodyR); font-weight:700; letter-spacing:.15px; text-transform:uppercase; }
.note{ padding-left: var(--indentBodyL); padding-right: var(--indentBodyR); font-style: italic; color: var(--paperMuted); }
.scene,.action,.shot,.note{ padding-left: var(--indentBodyL); padding-right: var(--indentBodyR); }

/* Page spacer to enforce breaks (non-editable) */
.pageSpacer{
  height: calc(var(--mBottom) + var(--pageGap) + var(--mTop) + 2px);
  pointer-events:none;
  user-select:none;
}
.pageSpacer{ contenteditable:false; }

@media (max-width: 1120px){

/* --- Print-safe export (fix cut-off / mismatch) --- */
#printRoot{ display:none; }
@media print{
  html, body{ margin:0 !important; padding:0 !important; }
  body.printing .wrap{ display:none !important; }
  body.printing #printRoot{ display:block !important; margin:0 !important; padding:0 !important; }

  /* Ensure the browser uses true A4 with no forced margins (where supported). */
  @page { size: A4; margin: 0; }

  body.printing #printRoot .printPaper{
    /* PDF exporters can introduce fractional rounding that creates a phantom blank sheet.
       Use a slightly-shorter fixed height and clip overflow to prevent any spill. */
    box-sizing: border-box;
    width: calc(var(--a4w-mm) * 1mm);
    height: calc(var(--a4h-mm) * 1mm - 0.4mm);
    background:#fff !important;
    color:#111 !important;
    border:none !important;
    border-radius:0 !important;
    box-shadow:none !important;
    margin:0 !important;
    padding:0 !important;
    position:relative;
    overflow:hidden;
    break-after: page;
  }
  body.printing #printRoot .printPaper:last-child{
    break-after: auto;
  }

  body.printing #printRoot .printDraft{
    position:absolute; top: calc(12.5 * 1mm); left: 0; right: 0; text-align: center;
    font-family: var(--font-stack); font-size: calc(var(--font-size-pt) * 1pt); color:#111; white-space:pre;
  }
  body.printing #printRoot .printTpDraft{
    position:absolute; right: calc(var(--m-right-mm) * 1mm); bottom: calc(var(--m-bot-mm) * 1mm); min-height: calc(24 * 1mm); text-align:right;
    font-family: var(--font-stack); font-size: calc(var(--font-size-pt) * 1pt); line-height: calc(var(--baseline-step-mm) * 1mm); color:#111; white-space:pre;
  }
  body.printing #printRoot .printPageNumber{
    position:absolute;
    top: calc(12.5 * 1mm);
    right: calc(var(--m-right-mm) * 1mm);
    font-family: var(--font-stack);
    font-size: calc(var(--font-size-pt) * 1pt);
    color:#111;
  }

  body.printing #printRoot .printContent{
    position:absolute; inset:0;
    box-sizing:border-box;
    padding-left: calc(var(--m-left-mm) * 1mm);
    padding-right: calc(var(--m-right-mm) * 1mm);
    padding-top: calc(var(--m-top-mm) * 1mm);
    padding-bottom: calc(var(--m-bot-mm) * 1mm);
    font-family: var(--font-stack);
    font-size: calc(var(--font-size-pt) * 1pt);
    line-height: calc(var(--baseline-step-mm) * 1mm);
    color:#111;
  }

  body.printing #printRoot .printTitleContent{
    position:absolute; inset:0;
    box-sizing:border-box;
    padding-top: calc(var(--header-band-mm) * 1mm);
    font-family: var(--font-stack);
    font-size: calc(var(--font-size-pt) * 1pt);
    line-height: calc(var(--baseline-step-mm) * 1mm);
    color:#111;
  }
  body.printing #printRoot .printTitleField{
    position:absolute;
    left: calc(var(--tp-left-mm) * 1mm);
    right: calc(var(--tp-right-mm) * 1mm);
    text-align:center;
    white-space: pre-wrap;
    word-break: break-word;
  }
  body.printing #printRoot .printTitleField.title{
    top: calc(98.1mm - (0.35 * var(--baseline-step-mm) * 1mm) + (0.25 * var(--baseline-step-mm) * 1mm));
    font-weight:700;
    text-transform:uppercase;
  }
  body.printing #printRoot .printTitleField.writtenby{ top: calc(115.6mm - (0.55 * var(--baseline-step-mm) * 1mm) + (0.25 * var(--baseline-step-mm) * 1mm)); }
  body.printing #printRoot .printTitleField.name{ top: calc(127.7mm - (0.35 * var(--baseline-step-mm) * 1mm) + (0.25 * var(--baseline-step-mm) * 1mm)); }
  body.printing #printRoot .printContact{
    position:absolute;
    left: calc(var(--tp-left-mm) * 1mm);
    bottom: calc(var(--m-bot-mm) * 1mm);
    width: calc(80 * 1mm);
    text-align:left;
    white-space: pre-wrap;
    word-break: break-word;
  }

  /* Keep existing screenplay line formatting (do NOT override widths/indents) */
  body.printing #printRoot .line{ min-height: calc(var(--baseline-step-mm) * 1mm); }
}

<script>
/* Safe localStorage wrapper: Firefox file:// pages can throw SecurityError (opaque origins). */
const __LS = (()=>{ try{
  const ls = window.localStorage;
  const k = "__scripty_ls_test__";
  ls.setItem(k,"1"); ls.removeItem(k);
  return ls;
}catch(_e){ return null; }})();
const lsGetRaw = (key)=>{ try{ return __LS ? __LS.getItem(String(key)) : null; }catch(_e){ return null; } };
const lsSet    = (key, val)=>{ try{ __LS && __LS.setItem(String(key), String(val)); }catch(_e){} };
const lsRemove = (key)=>{ try{ __LS && __LS.removeItem(String(key)); }catch(_e){} };



/* UI-only glue: menus + wiring to Project A controls. No engine logic. */

/* -------- Top Menubar (File/Edit/Format/View) --------
   This file had submenu wiring but was missing the top-level menu open/close logic.
   Without this, the menubar buttons do nothing.
------------------------------------------------------*/
(function(){
  function qs(sel, root=document){ return root.querySelector(sel); }
  function qsa(sel, root=document){ return Array.from(root.querySelectorAll(sel)); }

  function ready(fn){
    if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", fn, {once:true});
    else fn();
  }

  ready(()=>{
    if(window.__SCRIPTY_MENU_BOUND__){ return; }
    window.__SCRIPTY_MENU_BOUND__ = true;

    const btns = qsa(".menuBtn");
    if(!btns.length) return;

    const menuFor = (name)=> document.getElementById("menu-" + name);

    // Track state
    let openName = null;

    function closeSubmenus(root){
      if(!root) return;
      root.querySelectorAll(".submenuWrap.subOpen").forEach(w=>{
        w.classList.remove("subOpen");
        const b = w.querySelector(".submenuBtn");
        b && b.setAttribute("aria-expanded","false");
      });
    }

    function closeMenus(){
      openName = null;
      btns.forEach(b=> b.setAttribute("aria-expanded","false"));
      qsa(".dropdown.open").forEach(dd=>{
        dd.classList.remove("open");
        closeSubmenus(dd);
      });
    }
    window.closeMenus = closeMenus;

    function positionMenu(dd, btn){
      if(!dd || !btn) return;

      // Dropdowns are absolutely positioned inside their .menu wrapper (position:relative).
      // Convert viewport coords -> offsetParent coords.
      const br = btn.getBoundingClientRect();
      const op = dd.offsetParent || btn.parentElement || document.body;
      const pr = op.getBoundingClientRect();

      const pad = 8;
      const gap = 6;

      // Ensure the dropdown is measurable (some CSS keeps it display:none until opened)
      let ddw = dd.offsetWidth || 0;
      let ddh = dd.offsetHeight || 0;
      if(ddw <= 0 || ddh <= 0){
        try{
          const cs = getComputedStyle(dd);
          const prevDisplay = dd.style.display;
          const prevVis = dd.style.visibility;

          const needsForce = (cs && cs.display === "none");
          if(needsForce){
            dd.style.visibility = "hidden";
            dd.style.display = "block";
          }
          const r = dd.getBoundingClientRect();
          ddw = r.width || dd.offsetWidth || ddw;
          ddh = r.height || dd.offsetHeight || ddh;

          if(needsForce){
            dd.style.display = prevDisplay;
            dd.style.visibility = prevVis;
          }
        }catch(_e){}
      }

      // Fallbacks
      if(!ddw) ddw = 280;
      if(!ddh) ddh = 240;

      // X: clamp within viewport (relative to offsetParent)
      let x = br.left - pr.left;
      const maxX = (op === document.body ? window.innerWidth : (op.clientWidth || window.innerWidth)) - ddw - pad;
      if(!Number.isNaN(maxX)) x = Math.max(pad, Math.min(x, maxX));

      // Y: prefer below, but flip above if it would overflow bottom
      const viewportBottom = window.innerHeight - pad;
      const belowBottom = br.bottom + gap + ddh;
      const shouldFlipUp = belowBottom > viewportBottom;

      let y;
      if(shouldFlipUp){
        y = (br.top - pr.top) - ddh - gap;     // above button
      } else {
        y = (br.bottom - pr.top) + gap;       // below button
      }

      // Clamp Y inside viewport bounds (relative to offsetParent)
      const maxY = (window.innerHeight - pr.top) - ddh - pad;
      if(!Number.isNaN(maxY)) y = Math.max(pad, Math.min(y, maxY));

      dd.style.left = x + "px";
      dd.style.top  = y + "px";
    }


    function openMenu(name, btn){
      const dd = menuFor(name);
      if(!dd) return;
      // Toggle behavior
      if(openName === name){
        window.closeMenus();
        return;
      }
      window.closeMenus();
      openName = name;
      dd.classList.add("open");
      btn && btn.setAttribute("aria-expanded","true");
      // Position after open so width is known
      requestAnimationFrame(()=> positionMenu(dd, btn));
    }

    // Click to open
    btns.forEach(btn=>{
      const name = btn.dataset.menu;
      btn.addEventListener("click", (e)=>{
        e.preventDefault();
        e.stopPropagation();
        openMenu(name, btn);
      });
      // Hover-switch (like desktop apps) when a menu is already open
      btn.addEventListener("mouseenter", ()=>{
        if(!openName) return;
        openMenu(name, btn);
      });
    });

    // Click outside closes
    document.addEventListener("mousedown", (e)=>{
      const t = e.target;
      if(t.closest(".dropdown")) return;
      if(t.closest(".menuBtn")) return;
      window.closeMenus();
    });

    // Reposition on resize/scroll
    window.addEventListener("resize", ()=>{
      if(!openName) return;
      const btn = btns.find(b=> b.dataset.menu === openName);
      const dd = menuFor(openName);
      positionMenu(dd, btn);
    }, {passive:true});
    window.addEventListener("scroll", ()=>{
      if(!openName) return;
      const btn = btns.find(b=> b.dataset.menu === openName);
      const dd = menuFor(openName);
      positionMenu(dd, btn);
    }, {passive:true});

    // Ensure aria state reset on load
    window.closeMenus();
  });
})();



  // Submenus: keep only one submenu open at a time, and close on selection.
  function setSubmenuOpen(wrap, open){
    const btn = wrap && wrap.querySelector(".submenuBtn");
    if(open){
      wrap.classList.add("subOpen");
      btn && btn.setAttribute("aria-expanded","true");
    }else{
      wrap.classList.remove("subOpen");
      btn && btn.setAttribute("aria-expanded","false");
    }
  }

  document.querySelectorAll(".submenuBtn").forEach(btn=>{
    const wrap = btn.closest(".submenuWrap");
    if(!wrap) return;

    const openThis = () => {
      const dd = wrap.closest(".dropdown");
      if(dd){
        dd.querySelectorAll(".submenuWrap.subOpen").forEach(w=>{
          if(w !== wrap) setSubmenuOpen(w, false);
        });
      }
      setSubmenuOpen(wrap, true);
    };

    // Click-to-open (desktop app feel)
    btn.addEventListener("click", (e) => {
      e.preventDefault();
      e.stopPropagation();
      const isOpen = wrap.classList.contains("subOpen");
      if(isOpen){
        setSubmenuOpen(wrap, false);
      }else{
        openThis();
      }
    });

    // Hover-to-open (also closes other submenus)
    wrap.addEventListener("mouseenter", () => {
      const dd = wrap.closest(".dropdown");
      if(dd && dd.classList.contains("open")) openThis();
    });

    // Leaving the wrap closes it (prevents "stuck" submenus)
    wrap.addEventListener("mouseleave", () => {
      setSubmenuOpen(wrap, false);
    });
  });
  // NOTE: Menus stay open after selecting items. They close when you click elsewhere or open another menu.

  // Escape closes menus
  document.addEventListener("keydown", (e) => {
    if(e.key === "Escape") closeMenus();
  });


  // View toggles
  const side = document.getElementById("side");
  const panel = document.getElementById("panel");
  let sideOn=true, panelOn=true;
  document.getElementById("mTogglePanel")?.addEventListener("click", () => {
    closeMenus();

    // Fix #8: panels may not exist in some modes (e.g. notes). Guard null refs.
    if(!side || !panel){
      console.warn("Toggle Panels: #side or #panel missing; ignoring.");
      try{ setStatus("Panels are not available in this view."); }catch(_e){}
      return;
    }

    panelOn = !panelOn;
    const wrap = document.querySelector(".wrap");

    if(panelOn){
      // Show panels
      side.style.display = "";
      panel.style.display = "";
      wrap && wrap.classList.remove("focus");
    }else{
      // Hide panels (focus mode)
      side.style.display = "none";
      panel.style.display = "none";
      wrap && wrap.classList.add("focus");
    }

    // Force a clean layout reflow (sticky + grid)
    requestAnimationFrame(() => { document.body.offsetHeight; });
  });

  // Dark mode (View menu): keep UI as-is; optionally invert paper + script text
  const PAGES_KEY = "SCRIPTED_DARK_PAGES_V1";
  const pagesBtn = document.getElementById("mToggleDark");

  // Ensure the app stays on its original dark UI theme
  document.documentElement.removeAttribute("data-theme");

  function isDarkPages(){
    return document.documentElement.dataset.pages === "dark";
  }

  function syncPagesMenu(){
    if(!pagesBtn) return;
    const on = isDarkPages();
    pagesBtn.setAttribute("aria-checked", on ? "true" : "false");
    const tick = pagesBtn.querySelector(".tick");
    if(tick) tick.textContent = on ? "✓" : "";
  }

  function setDarkPages(on, save=true){
    if(on){
      document.documentElement.dataset.pages = "dark";
    }else{
      document.documentElement.removeAttribute("data-pages");
    }
    if(save){
      try{ lsSet(PAGES_KEY, on ? "1" : "0"); }catch(_e){}
    }
    syncPagesMenu();
  }

  // Init from localStorage (default OFF = original look)
  try{
    const stored = (lsGetRaw(PAGES_KEY) || "").trim();
    setDarkPages(stored === "1", false);
  }catch(_e){
    setDarkPages(false, false);
  }

  if(pagesBtn){
    pagesBtn.addEventListener("click", () => {
      closeMenus();
      setDarkPages(!isDarkPages(), true);
    });
  }

  // Scene Numbers (Format > Pages)
  const sceneNumsBtn = document.getElementById("mToggleSceneNumbers");
  function _isSceneNumsOn(){
    return document.documentElement.dataset.scenenums === "1";
  }
  function _syncSceneNumsMenu(){
    if(!sceneNumsBtn) return;
    const on = _isSceneNumsOn();
    sceneNumsBtn.setAttribute("aria-checked", on ? "true" : "false");
    const tick = sceneNumsBtn.querySelector(".tick");
    if(tick) tick.textContent = on ? "✓" : "";
  }
  // Initial sync (engine may update again after boot / load / import)
  setTimeout(_syncSceneNumsMenu, 0);
  document.addEventListener("scripty:sceneNumbersChanged", _syncSceneNumsMenu);

  if(sceneNumsBtn){
    sceneNumsBtn.addEventListener("click", (e) => {
      e?.stopPropagation?.();
      const on = !_isSceneNumsOn();
      if(typeof window.scriptySetSceneNumbers === "function"){
        window.scriptySetSceneNumbers(on);
      }else{
        // Fallback: just flip the flag
        if(on) document.documentElement.dataset.scenenums = "1";
        else delete document.documentElement.dataset.scenenums;
      }
      _syncSceneNumsMenu();
    });
  }

function _getSelRangeInEditor(editor){
  const sel = window.getSelection();
  if(!sel || sel.rangeCount===0) return null;
  const r = sel.getRangeAt(0);
  if(!editor.contains(r.commonAncestorContainer)) return null;
  return r;
}

function _collectSelectedLines(editor, range){
  const lines = Array.from(editor.querySelectorAll(".line"));
  const hit = [];
  for(const ln of lines){
    try{
      if(range.intersectsNode(ln)) hit.push(ln);
    }catch(e){
      if(!range.collapsed) hit.push(ln);
    }
  }
  if(hit.length===0){
    const sel = window.getSelection();
    const node = sel && sel.anchorNode ? sel.anchorNode : null;
    const caretLine = node ? (node.nodeType===1 ? node.closest?.(".line") : node.parentElement?.closest?.(".line")) : null;
    if(caretLine && editor.contains(caretLine)) return [caretLine];
  }
  return hit;
}

function _walkTextNodes(root, cb){
  const tw = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
  let n;
  while((n = tw.nextNode())) cb(n);
}

function _uppercaseLineInPlace(line){
  _walkTextNodes(line, (t)=>{
    t.nodeValue = (t.nodeValue || "").toUpperCase();
  });
}

function _measureTextPx(sampleEl, s){
  const cs = window.getComputedStyle(sampleEl);
  const font = cs.font || `${cs.fontStyle} ${cs.fontVariant} ${cs.fontWeight} ${cs.fontSize}/${cs.lineHeight} ${cs.fontFamily}`;
  _measureTextPx._c = _measureTextPx._c || document.createElement("canvas");
  const ctx = _measureTextPx._c.getContext("2d");
  ctx.font = font;
  return ctx.measureText(s).width;
}

function _prevCharacterLine(line){
  let p = line.previousElementSibling;
  while(p){
    if(p.classList && p.classList.contains("line")){
      const t = (p.innerText || p.textContent || "").replace(/\s+/g," ").trim();
      if(t && p.dataset.type === "character") return p;
      if(t) return null;
    }
    p = p.previousElementSibling;
  }
  return null;
}

function _alignParentheticalToCharacter(editor, parenLine){
 // Final Draft behavior is column-anchored (not name-length anchored).
  // Keep parentheticals snapped to the fixed parenthetical column.
  parenLine.style.marginLeft = "";
}

let _parenAlignRAF = 0;
function _scheduleParentheticalAlign(){
  if(_parenAlignRAF) return;
  _parenAlignRAF = requestAnimationFrame(()=>{
    _parenAlignRAF = 0;
    const editor = document.getElementById("scriptEditor");
    if(!editor) return;

    // Guard: avoid binding listeners twice (can happen after hot reload or re-init).
    if(editor.dataset && editor.dataset.proofBound === "1") return;
    if(editor.dataset) editor.dataset.proofBound = "1";

    // Only suppress native underlines when using System/Browser spellcheck.
    if(typeof __isNativeSpellMode === "function" && !__isNativeSpellMode()){
      _setSpellSuppressLine(null);

function _applyTypeToLines(type){
  const editor = document.getElementById("scriptEditor");
  if(!editor) return false;

  const r = _getSelRangeInEditor(editor);
  if(!r) return false;

  const lines = _collectSelectedLines(editor, r);
  if(!lines || lines.length===0) return false;

  for(const ln of lines){
    if(type==="dual"){ convertLineToDual(ln); continue; }
    ln.dataset.type = type;

    if(type==="scene" || type==="character" || type==="transition"){
      _uppercaseLineInPlace(ln);
    }

    if(type==="parenthetical"){
      const raw = (ln.innerText || ln.textContent || "").trim();
      // If blank, prefill () to match Final Draft ergonomics.
      // (We place the caret between the parens separately, after type application.)
      if(!raw){
        ln.innerText = "()";
        // Record the exact line we auto-filled so we can restore caret even if toolbar focus
        // steals the native selection (common on button clicks).
        try{ window.__lastAutoParensLineId = ln?.dataset?.id || null; }catch(_e){ window.__lastAutoParensLineId = null; }
        // Force caret inside for upcoming paginate()/selection-restore.
        try{ hintForceCaretInsideParens(ln); }catch(_e){}
        try{ placeCaretInsideParens(ln); }catch(_e){}
      } else {
        let s = raw;
        if(!s.startsWith("(")) s = "(" + s;
        if(!s.endsWith(")")) s = s + ")";
        ln.innerText = s;
      }
    } else {
      if(ln.style && ln.style.marginLeft) ln.style.marginLeft = "";
    }
  }

  _scheduleParentheticalAlign();
  return true;
}

// Scroll helper: jump EXACTLY to the given line (scene heading) on the FIRST click.
// We avoid a two-step "page then caret" scroll, because smooth scrolling can land
// near the target and only become exact after a second interaction.
function _scrollToLineExact(lineEl){
  if(!lineEl) return;
  const topBar = document.querySelector("header.top");
  const topBarH = topBar ? Math.max(0, topBar.getBoundingClientRect().bottom) : 0; // banner + menu bar

  // Position the line just under the top menubar.
  const y = window.scrollY + lineEl.getBoundingClientRect().top;
  const target = Math.max(0, y - topBarH - 18);

  // Use instant scroll so caret placement doesn't fight an in-progress smooth scroll.
  window.scrollTo({ top: target, behavior: "auto" });

  // Re-apply once next frame in case pagination/layout changes during the click.
  requestAnimationFrame(() => {
    const y2 = window.scrollY + lineEl.getBoundingClientRect().top;
    const target2 = Math.max(0, y2 - topBarH - 18);
    window.scrollTo({ top: target2, behavior: "auto" });
  });
}


// -------- Scene Hover Preview (tooltip) --------
let __scenePreviewTip = null;
let __scenePreviewHideTimer = null;
let __scenePreviewAnchor = null;

function __ensureScenePreviewTip(){
  if(__scenePreviewTip) return __scenePreviewTip;
  const tip = document.createElement("div");
  tip.className = "scenePreviewTip";
  tip.innerHTML = `<div class="hdr"></div><div class="body"></div>`;
  document.body.appendChild(tip);
  __scenePreviewTip = tip;
  return tip;
}

function __getLinePreviewText(lineEl){
  if(!lineEl) return "";
  // Use textContent so CSS uppercase doesn't rewrite the underlying preview meaningfully.
  const raw = (lineEl.textContent || "").replace(/\s+/g, " ").trim();
  return raw;
}

function __buildScenePreview(sceneEl){
  if(!sceneEl) return "";
  const parts = [];
  let chars = 0;

  // Start just after the scene heading.
  let cur = sceneEl.nextElementSibling;

  // Grab a few meaningful lines until next scene heading.
  // Keep it tight and fast to avoid UI lag.
  let linesTaken = 0;
  while(cur && linesTaken < 6){
    if(cur.classList && cur.classList.contains("pageSpacer")) { cur = cur.nextElementSibling; continue; }
    if(cur.classList && cur.classList.contains("pageHeaderBand")) { cur = cur.nextElementSibling; continue; }
    if(cur.classList && cur.classList.contains("pageNumber")) { cur = cur.nextElementSibling; continue; }

    if(cur.classList && cur.classList.contains("line")){
      const t = cur.getAttribute("data-type") || cur.dataset.type || "";
      if(t === "scene") break;

      // For dual dialogue, compress both sides into one line.
      if(t === "dual"){
        const leftChar = __getLinePreviewText(cur.querySelector('.dualField[data-part="L_CHAR"]'));
        const leftDlg  = __getLinePreviewText(cur.querySelector('.dualField[data-part="L_DLG"]'));
        const rightChar= __getLinePreviewText(cur.querySelector('.dualField[data-part="R_CHAR"]'));
        const rightDlg = __getLinePreviewText(cur.querySelector('.dualField[data-part="R_DLG"]'));
        const segs = [];
        if(leftChar || leftDlg) segs.push(`${leftChar}${leftDlg ? ": " + leftDlg : ""}`.trim());
        if(rightChar || rightDlg) segs.push(`${rightChar}${rightDlg ? ": " + rightDlg : ""}`.trim());
        const dual = segs.filter(Boolean).join("  |  ");
        if(dual){
          parts.push(dual);
          chars += dual.length;
          linesTaken++;
        }
      }else{
        const text = __getLinePreviewText(cur);
        if(text){
          parts.push(text);
          chars += text.length;
          linesTaken++;
        }
      }
      if(chars > 220) break;
    }
    cur = cur.nextElementSibling;
  }

  if(!parts.length) return "—";
  let out = parts.join("\n");
  if(out.length > 260) out = out.slice(0, 260).replace(/\s+$/,"") + "…";
  return out;
}

function __positionScenePreviewTip(tip, anchorEl){
  if(!tip || !anchorEl) return;
  const pad = 10;
  const ar = anchorEl.getBoundingClientRect();

  // Prefer to the right of the Scenes panel.
  let left = ar.right + 12;
  let top = ar.top;

  // Measure after content is set (tip is in DOM).
  const tr = tip.getBoundingClientRect();

  // If off right edge, flip to left.
  if(left + tr.width + pad > window.innerWidth){
    left = Math.max(pad, ar.left - tr.width - 12);
  }

  // Clamp vertically.
  if(top + tr.height + pad > window.innerHeight){
    top = Math.max(pad, window.innerHeight - tr.height - pad);
  }
  if(top < pad) top = pad;

  tip.style.left = `${Math.round(left)}px`;
  tip.style.top  = `${Math.round(top)}px`;
}


function __maybeRepositionScenePreview(){
  if(!__scenePreviewTip || !__scenePreviewAnchor) return;
  if(__scenePreviewTip.style.display === "none") return;
  __positionScenePreviewTip(__scenePreviewTip, __scenePreviewAnchor);
}


function __showScenePreview(sceneEl, btnEl, idx){
  __scenePreviewAnchor = btnEl || null;

}

// Briefly highlight a scene (heading + its lines) so you can see where you landed.
let __sceneFlashTimer = 0;
// Opened from a Library search result: ?line=<id>&hl=<words> → scroll there, flash it and select the words
function __jumpFromLink(){
  const qs = new URLSearchParams(location.search);
  const id = qs.get("line"), hl = qs.get("hl");
  if(!id && !hl) return;
  try{ qs.delete("line"); qs.delete("hl"); history.replaceState(null, "", location.pathname + "?" + qs.toString() + location.hash); }catch(_e){}
  const ed = document.getElementById("scriptEditor"); if(!ed) return;
  let ln = id ? ed.querySelector('.line[data-id="' + CSS.escape(id) + '"]') : null;
  const norm = (t) => String(t || "").toLowerCase();
  const lines = Array.from(ed.querySelectorAll(".line"));
  if(!ln && hl) ln = lines.find(l => norm(l.textContent).includes(norm(hl))) || null;
  if(!ln) return;
  // a paragraph split across pages: the words may be in the continuation
  if(hl && !norm(ln.textContent).includes(norm(hl))){
    let n = ln.nextElementSibling;
    while(n && !(n.classList.contains("line") && n.dataset.cont !== "1" && n !== ln)){ if(n.classList.contains("line") && norm(n.textContent).includes(norm(hl))){ ln = n; break; } n = n.nextElementSibling; }
  }
  ln.scrollIntoView({ block: "center" });
  try{ ln.classList.add("sceneFlash"); setTimeout(() => ln.classList.remove("sceneFlash"), 2500); }catch(_e){}
  if(!hl) return;
  const idx = norm(ln.textContent).indexOf(norm(hl)); if(idx < 0) return;
  const w = document.createTreeWalker(ln, NodeFilter.SHOW_TEXT);
  let pos = 0, a = null, b = null, t;
  while((t = w.nextNode())){
    const L = t.nodeValue.length;
    if(!a && idx <= pos + L){ a = [t, idx - pos]; }
    if(a && idx + hl.length <= pos + L){ b = [t, idx + hl.length - pos]; break; }
    pos += L;
  }
  if(!a || !b) return;
  try{ const r = document.createRange(); r.setStart(a[0], a[1]); r.setEnd(b[0], b[1]); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); }catch(_e){}
}
function __flashScene(sceneEl){
  try{
    clearTimeout(__sceneFlashTimer);
    for(const el of document.querySelectorAll("#scriptEditor .sceneFlash, #scriptEditor .sceneFlashBody")){
      el.classList.remove("sceneFlash", "sceneFlashBody");
    }
    void document.body.offsetWidth; // restart the animation if clicked again
    sceneEl.classList.add("sceneFlash");
    let n = sceneEl.nextElementSibling, count = 0;
    while(n && count < 400){
      if(n.classList && n.classList.contains("line")){
        if(n.dataset.type === "scene") break;
        n.classList.add("sceneFlashBody"); count++;

    btn.addEventListener("focus", () => { __showScenePreview(sceneEl, btn, idx); });

  // Inked fonts: loaded only when needed
  const __PC_FONT = { light: { family: "ScriptY Ink Light", file: "ink-light.ttf" }, heavy: { family: "ScriptY Ink Heavy", file: "ink-heavy.ttf" } };
  const __pcFontState = {};   // ink -> "loading" | "ok" | "missing"
  function __pcLoadFont(ink){

  function __pcGrainUrl(p){
    const op = (p.grain / 100 * 0.55).toFixed(3);

  // One page of paper: streaks, specks, smudges, lid shadow, hole-punch rims (sizes in CSS px)
  function __pcPageShapes(p, index, Wmm, Hmm){
    const PX = 96 / 25.4, W = Wmm * PX, H = Hmm * PX;
    const r = __pcRng(p.seed * 7919 + (index + 3) * 104729);
    const L = [];
    // streaks (drum marks)
    const nStreak = Math.round(p.streaks / 100 * 9);
    for(let i = 0; i < nStreak; i++){ const x = r() * W, w = 0.4 + r() * 1.2, a = 0.015 + r() * 0.045; L.push({ k:"streak", x, w, a }); }

  }
  function __pcPageSVG(p, index, Wmm, Hmm){
    const { W, H, L } = __pcPageShapes(p, index, Wmm, Hmm);
    const f = (n) => n.toFixed(1);
    let defs = `<radialGradient id="sm"><stop offset="0" stop-color="#000" stop-opacity=".8"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>`;
    let out = "";
    for(const s of L){
      if(s.k === "streak") out += `<rect x="${f(s.x)}" y="0" width="${f(s.w)}" height="${f(H)}" fill="#000" opacity="${s.a.toFixed(3)}"/>`;
      else if(s.k === "shadow"){
        const o = s.o.toFixed(3);
        defs += `<linearGradient id="shR" x1="1" x2="0"><stop offset="0" stop-color="#000" stop-opacity="${o}"/><stop offset=".3" stop-color="#000" stop-opacity="${(o * .35).toFixed(3)}"/><stop offset="1" stop-color="#000" stop-opacity="0"/></linearGradient>`;
        defs += `<linearGradient id="shT" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity="${(o * .7).toFixed(3)}"/><stop offset="1" stop-color="#000" stop-opacity="0"/></linearGradient>`;
        out += `<rect x="${f(W - s.w)}" y="0" width="${f(s.w)}" height="${f(H)}" fill="url(#shR)"/><rect x="0" y="0" width="${f(W)}" height="${f(s.w * .55)}" fill="url(#shT)"/>`;
      }
      else if(s.k === "smudge") out += `<ellipse cx="${f(s.x)}" cy="${f(s.y)}" rx="${f(s.rx)}" ry="${f(s.ry)}" transform="rotate(${s.rot} ${f(s.x)} ${f(s.y)})" fill="url(#sm)" opacity="${s.a.toFixed(3)}"/>`;
      else if(s.k === "dot") out += `<circle cx="${f(s.x)}" cy="${f(s.y)}" r="${s.r.toFixed(2)}" fill="#000" opacity="${s.a.toFixed(2)}"/>`;
      else if(s.k === "speck") out += `<ellipse cx="${f(s.x)}" cy="${f(s.y)}" rx="${s.rx.toFixed(2)}" ry="${s.ry.toFixed(2)}" fill="#000" opacity="${s.a.toFixed(2)}"/>`;
      else if(s.k === "hole"){

  }

  // ----- Photocopy PDF: the same page marks as PDF drawing commands -----
  // Transparency uses shared graphics states named /Ga<n> (n = alpha × 200); the caller collects them.
  function __pcPdfPageOps(p, index, Wmm, Hmm, wPt, hPt, alphas){
    const { W, H, L } = __pcPageShapes(p, index, Wmm, Hmm);
    const s2p = wPt / W;                       // CSS px → PDF points
    const X = (x) => (x * s2p).toFixed(2), Y = (y) => (hPt - y * s2p).toFixed(2), D = (d) => (d * s2p).toFixed(2);
    const gs = (a) => { const n = Math.max(1, Math.min(200, Math.round(a * 200))); alphas.add(n); return `/Ga${n} gs `; };
    const K = 0.5523;
    const ell = (cx, cy, rx, ry) => {   // in PDF space, around (0,0) after cm
      const ox = rx * K, oy = ry * K;
      return `${(cx + rx).toFixed(2)} ${cy.toFixed(2)} m ${(cx + rx).toFixed(2)} ${(cy + oy).toFixed(2)} ${(cx + ox).toFixed(2)} ${(cy + ry).toFixed(2)} ${cx.toFixed(2)} ${(cy + ry).toFixed(2)} c ` +
        `${(cx - ox).toFixed(2)} ${(cy + ry).toFixed(2)} ${(cx - rx).toFixed(2)} ${(cy + oy).toFixed(2)} ${(cx - rx).toFixed(2)} ${cy.toFixed(2)} c ` +
        `${(cx - rx).toFixed(2)} ${(cy - oy).toFixed(2)} ${(cx - ox).toFixed(2)} ${(cy - ry).toFixed(2)} ${cx.toFixed(2)} ${(cy - ry).toFixed(2)} c ` +
        `${(cx + ox).toFixed(2)} ${(cy - ry).toFixed(2)} ${(cx + rx).toFixed(2)} ${(cy - oy).toFixed(2)} ${(cx + rx).toFixed(2)} ${cy.toFixed(2)} c `;
    };
    let o = "q 0 g 0 G\n";
    for(const s of L){
      if(s.k === "streak") o += `q ${gs(s.a)}${X(s.x)} 0 ${D(s.w)} ${hPt.toFixed(2)} re f Q\n`;
      else if(s.k === "shadow"){
        const N = 14, w = s.w * s2p;
        for(let i = 0; i < N; i++){   // right edge: strongest at the edge, fading inwards
          const t = (i + .5) / N, a = t < .3 ? s.o * (1 - (t / .3) * .65) : s.o * .35 * (1 - (t - .3) / .7);
          o += `q ${gs(a)}${(wPt - w * (i + 1) / N).toFixed(2)} 0 ${(w / N + .05).toFixed(2)} ${hPt.toFixed(2)} re f Q\n`;
        }
        const th = w * .55;
        for(let i = 0; i < N; i++){ const a = s.o * .7 * (1 - (i + .5) / N); o += `q ${gs(a)}0 ${(hPt - th * (i + 1) / N).toFixed(2)} ${wPt.toFixed(2)} ${(th / N + .05).toFixed(2)} re f Q\n`; }
      }
      else if(s.k === "smudge"){
        // soft cloud: stacked ellipses from the edge inwards
        const rot = -s.rot * Math.PI / 180, c = Math.cos(rot), sn = Math.sin(rot);
        o += `q ${c.toFixed(4)} ${sn.toFixed(4)} ${(-sn).toFixed(4)} ${c.toFixed(4)} ${X(s.x)} ${Y(s.y)} cm\n`;
        const N = 6;
        for(let i = 0; i < N; i++){ const k = 1 - i / N; o += `q ${gs(s.a * .8 / N * 1.15)}${ell(0, 0, s.rx * s2p * k, s.ry * s2p * k)}f Q\n`; }
        o += "Q\n";
      }
      else if(s.k === "dot") o += `q ${gs(s.a)}${ell(+X(s.x), +Y(s.y), s.r * s2p, s.r * s2p)}f Q\n`;
      else if(s.k === "speck") o += `q ${gs(s.a)}${ell(+X(s.x), +Y(s.y), s.rx * s2p, s.ry * s2p)}f Q\n`;
      else if(s.k === "hole"){
        const cx = +X(s.x), cy = +Y(s.y), rr = s.r * s2p;
        o += `q ${gs(.05)}${ell(cx, cy, rr, rr)}f Q\n`;
        o += `q ${gs(.1)}${ell(cx, cy, rr, rr)}${ell(cx, cy, rr * .8, rr * .8)}f* Q\n`;
        o += `q ${gs(.32)}${D(.9)} w ${ell(cx, cy, rr, rr)}S Q\n`;

        const a0 = Math.atan2(-.69, -.72), a1 = Math.atan2(.2, .98);
        let path = ""; const steps = 10;
        for(let i = 0; i <= steps; i++){ const a = a0 + (a1 - a0 + (a1 < a0 ? Math.PI * 2 : 0)) * i / steps; path += `${(cx + Math.cos(a) * rr).toFixed(2)} ${(cy + Math.sin(a) * rr).toFixed(2)} ${i ? "l" : "m"} `; }
        o += `q ${gs(.22)}${D(1.6)} w 1 J ${path}S Q\n`;
      }
    }
    return o + "Q\n";
  }
  // Grain: one small noise tile (black with varying transparency), repeated over each page
  function __pcPdfGrain(p){
    const N = 240, rnd = __pcRng(p.seed * 31 + 5), op = p.grain / 100 * 0.55;
    const a = new Uint8Array(N * N);
    // soft value noise so it reads like toner grain rather than pixel static
    const g = new Float32Array((N / 2 + 1) * (N / 2 + 1)); for(let i = 0; i < g.length; i++) g[i] = rnd();
    for(let y = 0; y < N; y++) for(let x = 0; x < N; x++){
      const gx = x / 2, gy = y / 2, ix = gx | 0, iy = gy | 0, fx = gx - ix, fy = gy - iy, W2 = N / 2 + 1;
      const at = (u, v) => g[((v % (N / 2)) * W2) + (u % (N / 2))];
      const v = (at(ix, iy) * (1 - fx) + at(ix + 1, iy) * fx) * (1 - fy) + (at(ix, iy + 1) * (1 - fx) + at(ix + 1, iy + 1) * fx) * fy;
      const n = 0.5 * v + 0.5 * rnd();
      const al = Math.max(0, Math.min(1, 1.25 - 2.2 * (0.28 + n * 0.44)));
      a[y * N + x] = Math.round(al * op * 255);
    }

  }
  function __pcPdfGrainOps(wPt, hPt, tilePt){

  }
  function __pcToneRGB(t){ const v = Math.round(253 - t * 0.3); return [v, v, Math.max(0, v - 3 - Math.round(t * 0.04))]; }
  // Everything the PDF exporter needs for a Photocopy PDF (null when the look is off)
  async function __pcPdfSetup(){
    const p = __PC;
    if(!p.on) return null;
    const out = { p, grain: p.grain > 0 ? __pcPdfGrain(p) : null, tone: __pcToneRGB(p.tone), ink: null, inkName: "" };
    if(p.ink !== "clean"){
      const def = __PC_FONT[p.ink];
      try{
        const res = await fetch(new URL(def.file, location.href).href, { cache: "force-cache" });
        if(res.ok){ const b = new Uint8Array(await res.arrayBuffer()); if(b.length > 1000 && b[0] === 0 && b[1] === 1) { out.ink = b; out.inkName = def.family.replace(/\s+/g, ""); } }

  let __PC_VIEW = null;   // settings being previewed in the dialog
  const __pcCur = () => __PC_VIEW || __PC;
  const __pcPageCache = new Map();
  function __pcPageUrl(index){
    const Wmm = parseFloat(getComputedStyle(root).getPropertyValue("--a4w-mm")) || 215.9;
    const Hmm = parseFloat(getComputedStyle(root).getPropertyValue("--a4h-mm")) || 279.4;
    const key = [index, Wmm, Hmm, __pcCur().seed, __pcCur().specks, __pcCur().smudges, __pcCur().streaks, __pcCur().shadow, __pcCur().holes].join("|");
    let u = __pcPageCache.get(key);
    if(!u){

      __pcPageCache.set(key, u);
    }
    return u;
  }
  function __pcDecoratePages(){
    const on = __pcCur().on;
    const pages = document.querySelectorAll("#pagesLayer .pageBg");
    pages.forEach((pg, i) => {
      const v = on ? `${__pcPageUrl(i)}, var(--pc-grain)` : "";
      if(pg.style.backgroundImage !== v) pg.style.backgroundImage = v;
    });

  }
  // The grain is drawn once into a plain image (a live SVG texture is costly to repeat while scrolling)
  const __pcGrainCache = new Map();
  function __pcGrainBitmap(p){
    const key = p.grain + "|" + (p.seed % 50);
    const hit = __pcGrainCache.get(key);
    if(hit && hit !== "pending") return hit;
    const svgUrl = __pcGrainUrl(p);
    if(!hit){
      __pcGrainCache.set(key, "pending");
      try{
        const src = svgUrl.slice(5, -2);   // url("...") -> ...
        const img = new Image();
        img.onload = () => {
          try{

            c.getContext("2d").drawImage(img, 0, 0, 480, 480);
            c.toBlob((b) => {

              const cur = __pcCur();

  // ----- Draft name & date -----

  // ----- Notes -----
  const __NOTES_OK_TAGS = new Set(["B","STRONG","I","EM","U","BR","DIV","P","UL","OL","LI","H3"]);
  function __cleanNotesHTML(html){
    const box = document.createElement("div");
    box.innerHTML = String(html || "");
    const walk = (el) => {
      for(const n of Array.from(el.childNodes)){
        if(n.nodeType === 3) continue;
        if(n.nodeType !== 1){ n.remove(); continue; }
        walk(n);
        if(!__NOTES_OK_TAGS.has(n.tagName)){
          if(/^(SCRIPT|STYLE|IFRAME|OBJECT|EMBED|LINK|META)$/.test(n.tagName)){ n.remove(); continue; }
          const frag = document.createDocumentFragment();
          while(n.firstChild) frag.appendChild(n.firstChild);
          n.replaceWith(frag);
          continue;
        }
        for(const a of Array.from(n.attributes)) n.removeAttribute(a.name);
      }
    };
    walk(box);
    return box.innerHTML;
  }
  function __getNotesHTML(){
    const ed = document.getElementById("notesEditor");
    if(!ed) return (typeof DOC !== "undefined" && DOC && typeof DOC.notes === "string") ? DOC.notes : "";
    const txt = (ed.textContent || "").replace(/\u200B/g, "").trim();
    if(!txt && !ed.querySelector("li")) return "";
    return __cleanNotesHTML(ed.innerHTML);
  }
  function __setNotesHTML(html){
    const ed = document.getElementById("notesEditor");
    if(!ed) return;
    const clean = __cleanNotesHTML(html);
    if(ed.innerHTML !== clean) ed.innerHTML = clean;
  }

  function applyDocSettings(doc){

    setBoldSceneHeadingsEnabled(!!(doc.pageSettings && doc.pageSettings.boldSceneHeadings), {dispatch:true});
    setUnderlineSceneHeadingsEnabled(!!(doc.pageSettings && doc.pageSettings.underlineSceneHeadings), {dispatch:true});

      }
      return null;
    };

    let line = findLineForward(i) || findLineBackward(i-1) || editor.querySelector(".line");
    if(!line) return false;

      return true;
    }catch(_e){}

  function getPageMetricsPx(){

  function lineTextFromRuns(runs){

  function findSplitIndexToFit(lineEl, runs, remainingH, measurer){
    const total = runsTextLength(runs);
    if(total <= 1) return 0;

    const type = lineEl.dataset.type || "action";
    // If even a single character doesn't fit, return 0 to force new page.
    const h1 = measureRunsHeight(measurer, type, splitRuns(runs, 1)[0]);
    if(h1 > remainingH) return 0;

    let lo = 1, hi = total; // we know lo fits

      const mid = Math.ceil((lo + hi) / 2);
      const leftRuns = splitRuns(runs, mid)[0];
      const h = measureRunsHeight(measurer, type, leftRuns);

  // at least 2 lines on each page. Returns 0 if there's no good spot (caller moves the
  // paragraph to the next page, or falls back to a word break if it has to).
  const __ABBREV_RE = /(?:^|[\s(])(?:MR|MRS|MS|DR|ST|JR|SR|VS|MT|FT|LT|SGT|CPT|COL|GEN|PROF|REV|INT|EXT|NO|V\.O|O\.S|O\.C|E\.G|I\.E|ETC)\.$/i;

    const total = runsTextLength(runs);
    if(total <= 1) return 0;
    const type = lineEl.dataset.type || "action";
    const minH = 2 * stepPx - 0.5;
    if(measureRunsHeight(measurer, type, runs) < 2 * minH) return 0; // under 4 lines: don't split
    if(remainingH < minH) return 0;

    // Longest prefix that fits

    while(lo < hi){
      const mid = Math.ceil((lo + hi) / 2);
      if(measureRunsHeight(measurer, type, splitRuns(runs, mid)[0]) <= remainingH) lo = mid;
      else hi = mid - 1;

    if(lo <= 0) return 0;

    const text = lineTextFromRuns(runs);
    for(let i = Math.min(lo, total - 1); i > 0; i--){
      if(!/\s/.test(text[i]) || /\s/.test(text[i-1])) continue;
      // text[0..i) ends a word; is it a sentence end? (allow closing quotes / brackets after the mark)
      const head = text.slice(0, i).replace(/["'\u201D\u2019)\]]+$/, "");
      if(!/(?:[.?!]|\.\.\.|\u2026|--|\u2014)$/.test(head)) continue;
      if(/\.$/.test(head) && __ABBREV_RE.test(head)) continue;
      let j = i; while(j < total && /\s/.test(text[j])) j++;
      if(j >= total) continue;
      const leftH = measureRunsHeight(measurer, type, splitRuns(runs, j)[0]);
      if(leftH > remainingH + 0.5 || leftH < minH) { if(leftH < minH) break; continue; }
      const rightH = measureRunsHeight(measurer, type, trimLeadingSpaceFromRuns(splitRuns(runs, j)[1]));

      return j;
    }
    return 0;
  }

  // ---------- Scene number attributes (for display only) ----------

// Smart type heuristics (Final Draft-ish)
function isMostlyUpper(s){
  const letters = (s.match(/[A-Za-z]/g) || []).length;
  if(letters === 0) return false;
  const upper = (s.match(/[A-Z]/g) || []).length;
  return upper / letters >= 0.85;
}

function looksLikeSceneHeading(t){
  const s = (t||"").trim();
