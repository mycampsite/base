  }
  alphaList.forEach((n, i) => writeObj(nAlpha0 + i, `<< /Type /ExtGState /ca ${(n / 200).toFixed(3)} /CA ${(n / 200).toFixed(3)} >>`));
  const safeTitle = String(title || "Script").replace(/[^\x20-\x7E]/g, "").replace(/([\\()])/g, "\\$1");
  writeObj(nInfo, `<< /Title (${safeTitle}) /Creator (Camp) /Producer (Camp) >>`);

  const xrefAt = offset;
  let xref = `xref\n0 ${nInfo + 1}\n0000000000 65535 f \n`;
  for(let n = 1; n <= nInfo; n++) xref += String(offsets[n]).padStart(10, "0") + " 00000 n \n";
  push(xref);
  push(`trailer\n<< /Size ${nInfo + 1} /Root 1 0 R /Info ${nInfo} 0 R >>\nstartxref\n${xrefAt}\n%%EOF\n`);
  return new Blob(parts, { type: "application/pdf" });
}

// Build page-by-page drawing commands from the live layout.
function __pdfCollectPages(pc){
  const editor = document.getElementById("scriptEditor");
  const titlePage = document.getElementById("titlePage");
  const pageBgs = Array.from(document.querySelectorAll("#pagesLayer .pageBg"));
  if(!editor || !pageBgs.length) throw new Error("No pages to export");

  const wMm = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--a4w-mm")) || 215.9;
  const hMm = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--a4h-mm")) || 279.4;
  const wPt = wMm / 25.4 * 72, hPt = hMm / 25.4 * 72;

  const papers = []; // { rect, items: [] }
  const hasTitle = !!titlePage && ["tp_title","tp_writtenby","tp_name","tp_contact"].some(id => {
    const el = document.getElementById(id);
    return el && el.getAttribute("data-empty") !== "1" && (el.innerText || "").replace(/[ \s]+/g, "").length > 0;
  });
  if(hasTitle) papers.push({ el: titlePage, rect: titlePage.getBoundingClientRect(), items: [], isTitle: true });
  for(const bg of pageBgs) papers.push({ el: bg, rect: bg.getBoundingClientRect(), items: [] });
  const scriptPapers = papers.filter(p => !p.isTitle);

  const paperFor = (y) => {
    for(const p of scriptPapers) if(y >= p.rect.top - 1 && y < p.rect.bottom + 1) return p;
    return null;
  };
  const addRun = (paper, run) => { if(paper) paper.items.push(run); };

  // Title page text (skip empty placeholder fields)
  if(hasTitle){
    const tp = papers[0];
    for(const n of __pdfCollectTextNodes(titlePage, (p) => !!p.closest('[data-empty="1"]') || !!p.closest(".wmLayer"))){
      for(const r of __pdfRunsFromTextNode(n, titlePage)) addRun(tp, r);
    }
  }
  // Page numbers etc. drawn on the page backgrounds
  for(const p of scriptPapers){
    for(const n of __pdfCollectTextNodes(p.el, (el) => !!el.closest(".wmLayer"))){
      for(const r of __pdfRunsFromTextNode(n, p.el)) addRun(p, r);
    }
  }
  // Script text
  const revRows = new Set();
  const revMark = (window.__scriptyRevision && window.__scriptyRevision.get().mark) || "*";
  for(const n of __pdfCollectTextNodes(editor, (p) => !!p.closest(".pageSpacer"))){
    const lineEl = n.parentElement.closest(".line") || editor;
    for(const r of __pdfRunsFromTextNode(n, lineEl)){
      const paper = paperFor(r.bottom - 2);
      addRun(paper, r);
      // revision mark in the right margin, once per printed row
      if(paper && lineEl.classList && lineEl.classList.contains("revMarked")){
        const key = Math.round(r.baseline) + "|" + scriptPapers.indexOf(paper);
        if(!revRows.has(key)){
          revRows.add(key);
          const sc = paper.rect.width / wPt;
          addRun(paper, { x: paper.rect.right - 0.45 * 72 * sc, baseline: r.baseline, text: revMark, style: { ...r.style, bold:false, italic:false, underline:false, strike:false, upper:false } });
        }
      }
    }
  }
  // Automatic (CONT'D) after character names (drawn by CSS, so not real text)
  for(const ln of editor.querySelectorAll('.line[data-type="character"][data-autocontd="1"]')){
    const nodes = __pdfCollectTextNodes(ln); const last = nodes[nodes.length - 1]; if(!last) continue;
    const txt = last.nodeValue || ""; if(!txt.length) continue;
    const rg = document.createRange(); rg.setStart(last, txt.length - 1); rg.setEnd(last, txt.length);
    const rr = rg.getClientRects(); const r = rr[rr.length - 1]; if(!r) continue;
    const st = __pdfStyleOf(last.parentElement, ln);
    addRun(paperFor(r.bottom - 2), { x: r.right, baseline: r.bottom - __pdfDescentPx(st.font, st.sizePx), text: " (CONT'D)", style: Object.assign({}, st, { upper: true }) });
  }
  // (MORE) / NAME (CONT'D) markers (drawn by CSS, so not real text)
  for(const m of editor.querySelectorAll(".pageMarker")){
    const label = (m.dataset.label || "").toUpperCase();
    if(!label) continue;
    const rr = m.getBoundingClientRect();
    const st = __pdfStyleOf(m, m);
    const desc = __pdfDescentPx(st.font, st.sizePx);
    addRun(paperFor(rr.top + 1), { x: rr.left, baseline: __pdfMarkerBaseline(m, rr, desc), text: label, style: { ...st, underline: false, strike: false } });
  }
  // Scene numbers (shown in both margins when turned on)
  if(document.documentElement.dataset.scenenums === "1"){
    for(const ln of editor.querySelectorAll('.line[data-type="scene"][data-scene-num]')){
      const num = ln.dataset.sceneNum; if(!num) continue;
      const nodes = __pdfCollectTextNodes(ln);
      let base = null;
      for(const n of nodes){ const rs = __pdfRunsFromTextNode(n, ln); if(rs.length){ base = rs[0]; break; } }
      if(!base) continue;
      const paper = paperFor(base.bottom - 2); if(!paper) continue;
      const scale = paper.rect.width / wPt;
      const charW = 7.2 * scale; // Courier 12pt = 0.1in per letter
      const st = { ...base.style, bold: false, italic: false, underline: false, strike: false, upper: false };
      const leftEnd = paper.rect.left + 0.95 * 72 * scale;
      addRun(paper, { x: leftEnd - num.length * charW, baseline: base.baseline, text: num, style: st });
      addRun(paper, { x: paper.rect.right - 0.95 * 72 * scale, baseline: base.baseline, text: num, style: st });
    }
  }

  // Convert to PDF drawing commands
  let scriptIdx = 0;
  const pages = papers.map(p => {
    const scale = p.rect.width / wPt; // screen px per PDF point
    let ops = "";
    if(pc){
      // Photocopy paper: tone, grain, then the same specks/smudges/holes as on screen for this page
      const [r0, g0, b0] = pc.tone;
      ops += `q ${(r0 / 255).toFixed(3)} ${(g0 / 255).toFixed(3)} ${(b0 / 255).toFixed(3)} rg 0 0 ${__pdfNum(wPt)} ${__pdfNum(hPt)} re f Q\n`;
      if(pc.grain) ops += window.__scriptyPcPdf.grainOps(wPt, hPt, pc.grain.tilePt);
      ops += window.__scriptyPcPdf.pageOps(pc.p, p.isTitle ? -1 : scriptIdx, wMm, hMm, wPt, hPt, pc.alphas);
    }
    if(!p.isTitle) scriptIdx++;
    if(__WM.on && (!p.isTitle || __WM.titlePage)) ops += __wmPdfOps(wPt, hPt, __WM);
    ops += "0 g\n";
    for(const r of p.items){
      const x = (r.x - p.rect.left) / scale;
      const y = hPt - (r.baseline - p.rect.top) / scale;
      const size = r.style.sizePx / scale;
      const f = r.style.bold ? (r.style.italic ? 4 : 2) : (r.style.italic ? 3 : 1);
      const n = Array.from(r.text).length;
      // Match on-screen letter spacing exactly (e.g. bold scene headings are spaced slightly wider)
      let adv = size * 0.6;
      if(r.endX != null && n > 1){ const a = ((r.endX - r.x) / scale) / n; if(a > 0 && Math.abs(a - adv) < size * 0.2) adv = a; }
      const tc = adv - size * 0.6;
      if(pc && pc.ink){
        // Inked font: bold is drawn with a thin outline, italics with a slant (same letter widths)
        const bold = r.style.bold ? `0 G 2 Tr ${__pdfNum(size * 0.035)} w ` : "";
        const pos = r.style.italic ? `1 0 0.21 1 ${__pdfNum(x)} ${__pdfNum(y)} Tm` : `${__pdfNum(x)} ${__pdfNum(y)} Td`;
        ops += `BT /F6 ${__pdfNum(size)} Tf ${bold}${Math.abs(tc) > 0.005 ? (tc.toFixed(3) + " Tc ") : ""}${pos} ${__pdfHex(r.text)} Tj ET\n`;
      }else
      ops += `BT /F${f} ${__pdfNum(size)} Tf ${Math.abs(tc) > 0.005 ? (tc.toFixed(3) + " Tc ") : ""}${__pdfNum(x)} ${__pdfNum(y)} Td ${__pdfHex(r.text)} Tj ET\n`;
      const w = n * adv - (Math.abs(tc) > 0.005 ? tc : 0);
      if(r.style.underline) ops += `${__pdfNum(x)} ${__pdfNum(y - size * 0.12)} ${__pdfNum(w)} ${__pdfNum(size * 0.05)} re f\n`;
      if(r.style.strike) ops += `${__pdfNum(x)} ${__pdfNum(y + size * 0.26)} ${__pdfNum(w)} ${__pdfNum(size * 0.05)} re f\n`;
    }
    return { ops };
  });
  return { pages, wPt, hPt };
}

function __pdfMarkerBaseline(m, rr, desc){
  // Measure where a real letter would sit in this marker's line box.
  try{
    const probe = document.createElement("span");
    probe.textContent = "X";
    probe.style.cssText = "visibility:hidden;white-space:pre;";
    m.appendChild(probe);
    const range = document.createRange(); range.selectNodeContents(probe);
    const r = range.getBoundingClientRect();
    probe.remove();
    if(r && r.height) return r.bottom - desc;
  }catch(_e){}
  return rr.bottom - desc;
}

  // ----- Fountain export -----

  // ----- Fountain import -----
  function __ftnRuns(text){

  function parseFountain(src){

  // ----- FDX import -----
  function parseFDX(src){

    const add = (type, runs) => out.push({ id: uid(), type, runs });

        }

        if(line.dataset.type === "dual") continue;

    // ---------- Hover tooltip ----------
    let tipFor = null, tipHide = 0;
    // Cards dock in a fixed column just right of the page, level with their highlight. Phones fall back to sitting by the text.
    const useDock = () => !document.body.classList.contains("phoneUI") && window.innerWidth >= 900;
    function dock(el){
      el.hidden = false;
      const w = el.offsetWidth, h = el.offsetHeight, pad = 12, vw = window.innerWidth, vh = window.innerHeight;
      // Sits just right of the page, level with the highlight and its flag, so you can read the note beside the script
      const er = editor.getBoundingClientRect(), pg = document.querySelector("#pagesLayer .pageBg"), edge = Math.max(er.right, pg ? pg.getBoundingClientRect().right : 0);
      const sp = el.dataset.note ? spansOf(el.dataset.note)[0] : null, ar = sp ? sp.getBoundingClientRect() : null;

    // Topic chips: the built-in four, then custom topics (used in this script or made by you), then "+ Topic"

    // ---------- Floating "Comment" button on a highlight ----------

    // Sidebar tabs: Scenes | Comments

  // Position numbers: keep existing ones where the order didn't change; new/moved lines get a number between neighbours
  function __livePositions(ids){
    const S = __LIVE.synced;
    const old = ids.map(id => S.has(id) ? S.get(id).p : null);
    // longest increasing run of existing positions = lines that didn't move
    const idxs = [], tails = [], prev = new Array(ids.length).fill(-1);
    for(let i = 0; i < ids.length; i++){
      if(old[i] == null) continue;
      let lo = 0, hi = tails.length;
      while(lo < hi){ const m = (lo + hi) >> 1; if(old[tails[m]] < old[i]) lo = m + 1; else hi = m; }
      if(lo > 0) prev[i] = tails[lo - 1];
      tails[lo] = i;
    }
    const keep = new Set();
    for(let k = tails.length ? tails[tails.length - 1] : -1; k >= 0; k = prev[k]) keep.add(k);
    const out = new Map();
    const nextKept = new Array(ids.length + 1).fill(null);
    for(let i = ids.length - 1; i >= 0; i--) nextKept[i] = keep.has(i) ? old[i] : nextKept[i + 1];
    let last = null, cramped = false;
    for(let i = 0; i < ids.length; i++){
      let p;
      if(keep.has(i)) p = old[i];
      else{
        const nx = nextKept[i + 1];
        if(last == null && nx == null) p = i * 1024;
        else if(last == null) p = nx - 1024;
        else if(nx == null) p = last + 1024;
        else { p = (last + nx) / 2; if(!(nx - last > 1e-6)) cramped = true; }

  // ---------- Smart suggestions (Final Draft-style) ----------

  (function __smartSuggest(){
    const PREFIXES = ["INT. ", "EXT. ", "INT./EXT. ", "I/E. "];
    const TIMES = ["DAY", "NIGHT", "CONTINUOUS", "LATER", "MOMENTS LATER", "MORNING", "AFTERNOON", "EVENING", "DAWN", "DUSK", "SAME TIME"];
    const TRANSITIONS = ["CUT TO:", "DISSOLVE TO:", "SMASH CUT TO:", "MATCH CUT TO:", "JUMP CUT TO:", "FADE OUT.", "FADE TO BLACK.", "CUT TO BLACK.", "INTERCUT WITH:", "BACK TO:", "TIME CUT:"];
    const EXTENSIONS = ["V.O.", "O.S.", "O.C.", "CONT'D"];

    let menu = null, listEl = null, titleEl = null;
    let items = [], active = 0, navigated = false, ctx = null;

      if(menu) return;

      if(!loc || loc.index !== len) return null;

      const type = line.dataset.type || "action";
      const up = (s) => s.toUpperCase();

      titleEl.textContent = ctx.title;

        return false; // carry on to the next line as usual

      return false;
    };

        if(["ArrowUp","ArrowDown","Escape","Tab","Shift","Enter"].includes(e.key) && menu && !menu.hidden) return;

  const __PROOF_OK_TOKENS = new Set([

  function __proofNormalizeWord(w){ return (w||"").toLowerCase().replace(/[’‘]/g,"\'"); }

  function __proofShouldCheck(wordRaw){
    if(!wordRaw) return false;
    // Ignore ALL CAPS (CHARACTER names, acronyms)
    if(wordRaw === wordRaw.toUpperCase() && /[A-Z]/.test(wordRaw)) return false;
    // Ignore anything with digits or underscores
    if(/[0-9_]/.test(wordRaw)) return false;
    // Ignore tokens with internal dots/slashes commonly used in scripts
    const w = wordRaw.toLowerCase();

function __proofBuildIndex(){
    if(!__PROOF_DICT) return;

    // Suggestion index tuned for Word / Final Draft feel:
    // - Candidate retrieval uses character bigrams (handles wrong first letter, transpositions)
    // - Ranking uses bounded Damerau‑Levenshtein (OSA) + overlap + prefix preference
    const words = Array.from(__PROOF_DICT);
    const first = new Map(); // char -> [wordIndex]
    const bi = new Map();    // bigram -> [wordIndex]

    for(let i=0;i<words.length;i++){
      const w = words[i];
      if(!w || w.length < 2) continue;

      const k = w[0];
      let a = first.get(k);
      if(!a){ a=[]; first.set(k, a); }
      a.push(i);

      const seen = new Set();
      for(let j=0;j<w.length-1;j++){
        const bg = w[j] + w[j+1];
        if(seen.has(bg)) continue;
        seen.add(bg);
        let b = bi.get(bg);
        if(!b){ b=[]; bi.set(bg, b); }
        b.push(i);
      }
    }

    __PROOF_INDEX = { words, first, bi };
  }

  function __proofBigrams(w){
    const out = [];
    const seen = new Set();
    for(let i=0;i<w.length-1;i++){
      const bg = w[i] + w[i+1];
      if(seen.has(bg)) continue;
      seen.add(bg);
      out.push(bg);
    }
    return out;
  }

  // Optimal String Alignment (restricted Damerau‑Levenshtein) with early exit.
  function __proofDamerauOSA(a, b, maxDist){
    if(a === b) return 0;
    const al = a.length, bl = b.length;
    if(Math.abs(al - bl) > maxDist) return maxDist + 1;
    if(al === 0) return bl;
    if(bl === 0) return al;

    let dp0 = new Array(bl+1);
    let dp1 = new Array(bl+1);
    let dp2 = new Array(bl+1);

    for(let j=0;j<=bl;j++) dp1[j] = j;

    for(let i=1;i<=al;i++){
      dp2[0] = i;
      let rowMin = dp2[0];

      for(let j=1;j<=bl;j++){
        const cost = (a.charCodeAt(i-1) === b.charCodeAt(j-1)) ? 0 : 1;

        let val = dp1[j] + 1;              // deletion
        const ins = dp2[j-1] + 1;          // insertion
        if(ins < val) val = ins;
        const sub = dp1[j-1] + cost;       // substitution
        if(sub < val) val = sub;

        // transposition
        if(i>1 && j>1 &&
           a.charCodeAt(i-1) === b.charCodeAt(j-2) &&
           a.charCodeAt(i-2) === b.charCodeAt(j-1)){
          const tr = dp0[j-2] + 1;
          if(tr < val) val = tr;
        }

        dp2[j] = val;
        if(val < rowMin) rowMin = val;
      }

      if(rowMin > maxDist) return maxDist + 1;

      // rotate rows
      const t = dp0; dp0 = dp1; dp1 = dp2; dp2 = t;
    }

    return dp1[bl];
  }

  function __proofCaseify(srcRaw, candLower){
    const s = (srcRaw || "");
    if(!s) return candLower;

    const hasLetter = /[A-Za-z]/.test(s);
    if(hasLetter && s === s.toUpperCase()) return candLower.toUpperCase();

    // Title case (first letter upper, rest lower)
    if(s.length >= 2 && s[0] === s[0].toUpperCase() && s.slice(1) === s.slice(1).toLowerCase()){
      return candLower[0].toUpperCase() + candLower.slice(1);
    }

    return candLower;
  }

  function __proofGetSuggestions(wordRaw, limit=8){
    const w = __proofNormalizeWord(wordRaw);
    if(!w || w.length < 2) return [];

    if(!__PROOF_INDEX) __proofBuildIndex();
    const idx = __PROOF_INDEX;
    if(!idx || !idx.words || !idx.bi) return [];

    const wl = w.length;
    const maxDist = wl <= 4 ? 1 : 2;
    const minLen = Math.max(2, wl - 2);
    const maxLen = wl + 2;

    // Candidate retrieval by bigram overlap
    const bgs = __proofBigrams(w);
    const counts = new Map(); // wordIndex -> overlapCount
    for(const bg of bgs){
      const arr = idx.bi.get(bg);
      if(!arr) continue;
      for(const id of arr){
        counts.set(id, (counts.get(id) || 0) + 1);
      }
    }

    let candEntries = Array.from(counts.entries());
    candEntries.sort((a,b) => b[1] - a[1]);
    candEntries = candEntries.slice(0, 1400); // cap work

    // Fallback: same-first-letter bucket if bigram overlap yields little (short words, etc.)
    if(candEntries.length < 80 && idx.first){
      const fallback = idx.first.get(w[0]) || [];
      const take = Math.min(4000, fallback.length);
      for(let i=0;i<take;i++){
        const id = fallback[i];
        if(!counts.has(id)) candEntries.push([id, 0]);
      }
    }

    const pref = w.slice(0, Math.min(3, w.length));
    const scored = [];

    for(const [id, ov] of candEntries){
      const cand = idx.words[id];
      if(!cand) continue;
      if(cand === w) continue;
      if(cand.length < minLen || cand.length > maxLen) continue;

      const d = __proofDamerauOSA(w, cand, maxDist);
      if(d > maxDist) continue;

      // Lower score is better
      let score = d * 100;
      score -= ov * 10;
      score += Math.abs(cand.length - wl) * 5;
      if(pref && cand.startsWith(pref)) score -= 8;
      if(cand[0] !== w[0]) score += 3;

      scored.push([cand, score]);
    }

    scored.sort((a,b) => a[1] - b[1] || a[0].localeCompare(b[0]));

    const uniq = [];
    const seen = new Set();
    for(const [cand] of scored){
      if(seen.has(cand)) continue;
      seen.add(cand);
      uniq.push(__proofCaseify(wordRaw, cand));
      if(uniq.length >= limit) break;
    }
    return uniq;
  }

  async function __proofLoadDict(){
    if(__PROOF_DICT || __PROOF_DICT_LOADING) return;
    __PROOF_DICT_LOADING = true;
    try{
      // base64 -> Uint8Array
      const bin = atob(__PROOF_DICT_GZ_B64);
      const bytes = new Uint8Array(bin.length);
      for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);

      // gzip inflate via DecompressionStream (modern browsers)
      let text = "";
      if("DecompressionStream" in window){
        const ds = new DecompressionStream("gzip");
        const blob = new Blob([bytes]);
        const stream = blob.stream().pipeThrough(ds);
        text = await new Response(stream).text();
      } else {
        console.warn("DecompressionStream not available; custom proofing disabled.");
        __PROOF_DICT = new Set();
        return;
      }

      const set = new Set();
      const lines = text.split(/\r?\n/);
      for(const line of lines){
        const w = (line||"").trim().toLowerCase();
        if(!w) continue;
        set.add(w);
      }
      // Add common screenplay contractions/variants
      ["dont","doesnt","didnt","cant","wont","im","ive","ill","id","youre","theyre","isnt","arent","wasnt","werent","couldnt","shouldnt","wouldnt"].forEach(x=>set.add(x));

      // Load user dictionary (persisted)
      try{
        if(!__PROOF_USER_WORDS){
          const raw = lsGetRaw(__PROOF_USER_KEY);
          __PROOF_USER_WORDS = new Set();
          if(raw){
            JSON.parse(raw).forEach(w => {
              if(typeof w === "string" && w.trim()) __PROOF_USER_WORDS.add(w.trim().toLowerCase());
            });
          }
        }
        for(const w of (__PROOF_USER_WORDS||[])) set.add(w);
      }catch(_e){ __PROOF_USER_WORDS = new Set(); }

      __PROOF_DICT = set;
      __PROOF_INDEX = null;
      __proofBuildIndex();
    }catch(err){
      console.error("Proof dict load failed:", err);
      __PROOF_DICT = new Set();
    }finally{
      __PROOF_DICT_LOADING = false;
    }
  }

  function __unwrap(node){
    const parent = node.parentNode;
    if(!parent) return;
    while(node.firstChild) parent.insertBefore(node.firstChild, node);
    parent.removeChild(node);
  }

  function __stripProof(lineEl){
    if(!lineEl) return;
    lineEl.querySelectorAll("span.proof-miss").forEach(__unwrap);
  }

  function __walkTextNodes(root){
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
      acceptNode(n){
        if(!n.nodeValue || !n.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
        const p = n.parentElement;
        if(!p) return NodeFilter.FILTER_REJECT;
        if(p.closest && (p.closest("span.proof-miss") || p.closest("span.proof-gram"))) return NodeFilter.FILTER_REJECT;
        return NodeFilter.FILTER_ACCEPT;
      }
    });
    const out = [];
    let n;
    while((n = walker.nextNode())) out.push(n);
    return out;
  }

  function __applyProofToLine(lineEl){
    if(!lineEl || !__PROOF_DICT) return;
    const plain = (lineEl.textContent || "");
    if(plain.length > 800) return;

    __stripProof(lineEl);

    const textNodes = __walkTextNodes(lineEl);
    for(const tn of textNodes){
      const s = tn.nodeValue;
      let m;
      const reWord = /[A-Za-z][A-Za-z'’‘]*/g;
      reWord.lastIndex = 0;
      let lastIdx = 0;
      const frag = document.createDocumentFragment();
      let changed = false;

      while((m = reWord.exec(s))){
        const wRaw = m[0];
        const start = m.index;
        const end = start + wRaw.length;

        const before = s.slice(lastIdx, start);
        if(before) frag.appendChild(document.createTextNode(before));

        const wNorm = __proofNormalizeWord(wRaw);
        const ok = !__proofShouldCheck(wRaw) || __PROOF_DICT.has(wNorm);
        if(ok){
          frag.appendChild(document.createTextNode(wRaw));
        } else {
          const span = document.createElement("span");
          span.className = "proof-miss";
          span.textContent = wRaw;
          frag.appendChild(span);
          changed = true;
        }
        lastIdx = end;
      }

      const after = s.slice(lastIdx);
      if(after) frag.appendChild(document.createTextNode(after));

      if(changed){
        tn.parentNode.replaceChild(frag, tn);
      }
    }
  }


// --- Context proofing via LanguageTool (online) ---
function __stripGrammar(lineEl){
  if(!lineEl) return;
  try{
    lineEl.querySelectorAll("span.proof-gram").forEach(__unwrap);
  }catch(_e){}
}

function __gramMakeIgnoreKey(ruleId, badText){
  const t = __proofNormalizeWord(badText).trim();
  return (ruleId || "rule") + "::" + t;
}

// Local confused-word / wrong-context checks (offline, fast)
// These catch common screenplay-proofing mistakes even when the online checker is unavailable.
function __localConfusedWordMatches(text){
  const t = String(text || "");
  const out = [];
  if(!t) return out;

  const push = (m, ruleId, msg, sugs) => {
    try{
      const start = m.index;
      const end = start + m[0].length;
      if(start < 0 || end <= start) return;
      const bad = t.slice(start, end);
      out.push({ start, end, bad, ruleId, msg, sugs: (sugs||[]).slice(0,8) });
    }catch(_e){}
  };

  // there/their/they're
  // "there coming", "their going", etc.
  const reThere = /\bthere\b(?=\s+(?:[a-z]{2,}ing\b|are\b|were\b|is\b|was\b|gonna\b|going\b|coming\b|doing\b|saying\b|leaving\b|waiting\b))/ig;
  let m;
  while((m = reThere.exec(t))){
    push(m, "LOCAL_CONFUSED_THERE_THEYRE", 'Possibly wrong word: use "they\'re" for "they are".', ["they're"]);
  }

  const reTheir = /\btheir\b(?=\s+(?:[a-z]{2,}ing\b|are\b|were\b|is\b|was\b|gonna\b|going\b|coming\b|doing\b|saying\b))/ig;
  while((m = reTheir.exec(t))){
    push(m, "LOCAL_CONFUSED_THEIR_THEYRE", 'Possibly wrong word: use "they\'re" for "they are".', ["they're"]);
  }

  // your/you're
  const reYour = /\byour\b(?=\s+(?:[a-z]{2,}ing\b|are\b|were\b|not\b|gonna\b|going\b|coming\b|doing\b|here\b|late\b|ready\b|welcome\b))/ig;
  while((m = reYour.exec(t))){
    push(m, "LOCAL_CONFUSED_YOUR_YOURE", 'Possibly wrong word: use "you\'re" for "you are".', ["you're"]);
  }

  // its/it's (simple heuristic)
  const reIts = /\bits\b(?=\s+(?:a\b|an\b|the\b|very\b|really\b|so\b|too\b|not\b|been\b|going\b|coming\b|[a-z]{2,}ing\b))/ig;
  while((m = reIts.exec(t))){
    push(m, "LOCAL_CONFUSED_ITS_ITS", 'Possibly missing apostrophe: use "it\'s" for "it is".', ["it's"]);
  }

  // beet/beat (drum context)
  const reBeetDrum = /\bbeet\b(?=\s+of\s+the\s+drum\b)/ig;
  while((m = reBeetDrum.exec(t))){
    push(m, "LOCAL_CONFUSED_BEET_BEAT", 'Possibly wrong word in this context (drums): "beat".', ["beat"]);
  }

  // Simple "than/then" check in comparative phrases (very conservative)
  const reThenThan = /\bthen\b(?=\s+(?:more\b|less\b|better\b|worse\b|older\b|you\b|i\b|we\b|they\b|he\b|she\b|it\b))/ig;
  while((m = reThenThan.exec(t))){
    // Only flag if there is also a comparative earlier in the line
    const left = t.slice(0, m.index).toLowerCase();
    if(/\b(?:more|less|better|worse|rather)\b/.test(left)){
      push(m, "LOCAL_CONFUSED_THEN_THAN", 'Possibly wrong word: "than" is used for comparisons.', ["than"]);
    }
  }

// were/where (only flag the very specific, high-confidence "were are/is" pattern)
const reWereAre = /\bwere\b(?=\s+(?:are|is)\b)/ig;
while((m = reWereAre.exec(t))){
  push(m, "LOCAL_CONFUSED_WERE_WHERE", 'Possibly wrong word: "where" fits here (location).', ["where"]);
}

// betting/beating (common screenplay slip: "drums/heart/pulse ... betting")
const reBetting = /\bbetting\b/ig;
while((m = reBetting.exec(t))){
  const start = m.index;
  const end = start + m[0].length;
  const left = t.slice(Math.max(0, start - 40), start).toLowerCase();
  // crude but effective: look for a subject + copula within 40 chars
  if(/\b(drums?|heart|pulse|fists?|knuckles?)\b[^.]{0,25}\b(?:were|was|are|is|been|be)\s*$/.test(left)){
    push(m, "LOCAL_CONFUSED_BETTING_BEATING", 'Possibly wrong word in this context: "beating".', ["beating"]);
  }
}

// staring/steering (very specific phrase)
const reStaringWheel = /\bstaring\b(?=\s+wheel\b)/ig;
while((m = reStaringWheel.exec(t))){
  push(m, "LOCAL_CONFUSED_STARING_STEERING", 'Possibly wrong word: "steering wheel".', ["steering"]);
}

// affect/effect (high-confidence noun phrase: "an affect" -> "an effect")
const reAnAffect = /\ban\s+affect\b/ig;
while((m = reAnAffect.exec(t))){
  push(m, "LOCAL_CONFUSED_AFFECT_EFFECT", 'Possibly wrong word: "effect" (noun) is common here.', ["an effect"]);
}

  return out;
}

async function __gramCheckText(text){
  const t = (text || "").trim();
  if(!t) return [];
  const now = Date.now();
  const cached = __GRAM_CACHE.get(t);
  if(cached && (now - cached.ts) < __GRAM_CACHE_MS) return cached.matches || [];

  const body = new URLSearchParams();
  body.set("text", t);
  body.set("language", __GRAM_LANGUAGE);

  // Hard timeout so a stalled request never blocks proofing.
  const controller = new AbortController();
  const timer = setTimeout(() => { try{ controller.abort(); }catch(_e){} }, 8000);

  try{
    const resp = await fetch(__GRAM_API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: body.toString(),
      signal: controller.signal
    });
    if(!resp.ok) throw new Error("LT " + resp.status);
    const json = await resp.json();
    const matches = Array.isArray(json.matches) ? json.matches : [];
    __GRAM_CACHE.set(t, {ts: now, matches});
    return matches;
  }catch(_e){
    return [];
  }finally{
    clearTimeout(timer);
  }
}

function __resolveTextPos(root, index){
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
  let n;
  let remaining = index;
  while((n = walker.nextNode())){
    const len = (n.nodeValue || "").length;
    if(remaining <= len) return {node:n, offset:remaining};
    remaining -= len;
  }
  return {node:null, offset:0};
}

function __wrapLineRange(lineEl, start, end, meta){
  if(!lineEl) return null;
  if(start >= end) return null;
  const a = __resolveTextPos(lineEl, start);
  const b = __resolveTextPos(lineEl, end);
  if(!a.node || !b.node) return null;

  const r = document.createRange();
  try{
    r.setStart(a.node, a.offset);
    r.setEnd(b.node, b.offset);
  }catch(_e){ return null; }

  const span = document.createElement("span");
  span.className = "proof-gram";
  if(meta){
    for(const k in meta){
      try{ span.dataset[k] = String(meta[k]); }catch(_e){}
    }
  }

  const frag = r.extractContents();
  span.appendChild(frag);
  r.insertNode(span);
  r.detach();
  return span;
}

let __gramReqSeq = 0;
const __gramTimers = new WeakMap();

function __scheduleGrammar(lineEl){
  if(!lineEl) return;
  // If disabled, keep the page clean.
  if(!__GRAM_ENABLED){
    __stripGrammar(lineEl);
    return;
  }

  try{
    const old = __gramTimers.get(lineEl);
    if(old) clearTimeout(old);
  }catch(_e){}

  const t = setTimeout(() => {
    const active = __getActiveLine && __getActiveLine();
    if(active && active === lineEl) return; // don't touch active line
    __applyGrammarToLine(lineEl);
  }, 140);

  try{ __gramTimers.set(lineEl, t); }catch(_e){}
}

async function __applyGrammarToLine(lineEl){
  if(!lineEl || !__GRAM_ENABLED) return;

  const before = (lineEl.textContent || "");
  const text = before.trim();
  if(text.length < 8 || text.length > 900) { __stripGrammar(lineEl); return; }
  if(!/[A-Za-z]{3,}/.test(text)) { __stripGrammar(lineEl); return; }

  // Local (offline) confused-word checks.
  const __local = __localConfusedWordMatches(text);

  const reqId = ++__gramReqSeq;
  lineEl.__gramReqId = reqId;

  const matches = await __gramCheckText(text);

  // Stale / changed / re-focused
  if(lineEl.__gramReqId !== reqId) return;
  if((lineEl.textContent || "") !== before) return;
  const active = __getActiveLine && __getActiveLine();
  if(active && active === lineEl) return;

  // Filter matches to keep screenplay noise down:
  // prefer typos + confused words + grammar, and only when we have replacements.
  const kept = [];
  // Seed with local matches first so they can show even if the online checker is unreachable.
  for(const lm of (__local || [])){
    const ignoreKey = __gramMakeIgnoreKey(lm.ruleId || "", lm.bad || "");
    if(__GRAM_IGNORES && __GRAM_IGNORES.has(ignoreKey)) continue;
    kept.push({ start: lm.start, end: lm.end, msg: lm.msg || "", ruleId: lm.ruleId || "", bad: lm.bad || "", sugs: (lm.sugs || []).slice(0,8) });
    if(kept.length >= 6) break;
  }
  for(const m of (matches || [])){
    if(!m || typeof m.offset !== "number" || typeof m.length !== "number") continue;
    if(m.length <= 0) continue;

    const rule = m.rule || {};
    const issue = rule.issueType || "";
    const cat = (rule.category && rule.category.id) ? rule.category.id : "";

    if(issue === "misspelling") continue; // we already handle spelling locally
    const okCat = (cat === "TYPOS" || cat === "CONFUSED_WORDS" || cat === "GRAMMAR" || cat === "SEMANTICS");
    const okIssue = (issue === "typographical" || issue === "grammar");
    if(!okCat && !okIssue) continue;

    const bad = text.slice(m.offset, m.offset + m.length);
    if(!/[A-Za-z]{2,}/.test(bad)) continue;

    const reps = Array.isArray(m.replacements) ? m.replacements : [];
    const sug = reps.map(r => r && r.value).filter(v => typeof v === "string" && v.trim()).slice(0, 8);
    if(!sug.length) continue;

    const ruleId = rule.id || "";
    const ignoreKey = __gramMakeIgnoreKey(ruleId, bad);
    if(__GRAM_IGNORES && __GRAM_IGNORES.has(ignoreKey)) continue;

    kept.push({
      start: m.offset,
      end: m.offset + m.length,
      msg: m.message || "",
      ruleId,
      bad,
      sugs: sug

  }

  __stripGrammar(lineEl);
  if(!kept.length) return;

  // Make non-overlapping (earliest wins)
  kept.sort((a,b) => a.start - b.start);
  const nonOver = [];
  let lastEnd = -1;
  for(const k of kept){
    if(k.start < lastEnd) continue;
    nonOver.push(k);
    lastEnd = k.end;
  }

  for(let i=nonOver.length-1;i>=0;i--){
    const k = nonOver[i];
    __wrapLineRange(lineEl, k.start, k.end, {
      sugs: k.sugs.join("|"),
      msg: k.msg,
      ruleid: k.ruleId
    });
  }
}

            if(!opts.keepOpen) hide();
            return;
          }
          render();
          menu.hidden = false;
          position();
          return;
        }
      }
      const idx = caretIndexWithin(line);
      const full = (line.textContent || "").replace(/\n/g,"");
      const prefix = full.slice(0, idx).trim();
      const query = normalizeNameKey(prefix);

      // Avoid thrashing on no-op updates unless we explicitly need to keep open.
      if(opts.fastGuard && _lastLineId === lineId && _lastQuery === query && !opts.force){
        position();
        return;
      }
      _lastLineId = lineId;
      _lastQuery  = query;

      const index = buildIndex(line);

      if(!index.length){ hide(); return; }

      let matches;
      const hasExact = !!(query && index.includes(query));
      if(!query){
        // Do not show the autocomplete menu until the user types at least one character.
        // This also ensures Tab does not hijack navigation when the CHARACTER line is empty.
        items = [];
        if(!opts.keepOpen) hide();
        _cycleActive = false;
        _cycleLineId = "";
        _cycleItems = [];
        return;
      }else{
        matches = index.filter(n => n.startsWith(query) && n !== query).slice(0, MAX_SHOW);
      }

      if(!matches.length){ hide(); return; }

      // Fresh typing updates reset TAB-cycling.
      _cycleActive = false;
      _cycleLineId = "";
      _cycleItems = [];

      items = matches;
      activeIdx = Math.max(0, Math.min(activeIdx, items.length-1));
      render();
      menu.hidden = false;
      position();
    };

    const handleKey = (e) => {
      if(menu.hidden) return false;
      const line = getActiveCharacterLine();
      if(!line){ hide(); return false; }

      // Always allow your editor's line-breaking shortcuts. We keep Enter "flow" intact.
      if(e.key === "Escape"){
        e.preventDefault(); e.stopPropagation();
        hide();
        return true;
      }

      // Only hijack keys when we have real suggestion items to navigate.
      if(!items || !items.length) return false;

      // Don't interfere with modified shortcuts.
      if(e.altKey || e.ctrlKey || e.metaKey) return false;

      if(e.key === "ArrowDown"){
        e.preventDefault(); e.stopPropagation();
        activeIdx = (activeIdx + 1) % items.length;
        render();
        return true;
      }
      if(e.key === "ArrowUp"){
        e.preventDefault(); e.stopPropagation();
        activeIdx = (activeIdx - 1 + items.length) % items.length;
        render();
        return true;
      }

      // TAB cycles through suggestions (Final Draft-style). ENTER should keep behaving like "next line".
      if(e.key === "Tab"){
        e.preventDefault(); e.stopPropagation();
        const dir = e.shiftKey ? -1 : 1;
        const lid = line.dataset.id || "";

        // Start a new cycling session when the line changes or we haven't begun cycling yet.
        if(!_cycleActive || _cycleLineId !== lid || !_cycleItems.length){
          _cycleActive = true;
          _cycleLineId = lid;
          _cycleItems = items.slice(0);
          activeIdx = (dir < 0) ? (_cycleItems.length - 1) : 0;
        } else {
          activeIdx = (activeIdx + dir + _cycleItems.length) % _cycleItems.length;
        }

        // Keep menu + items stable while cycling.
        items = _cycleItems.slice(0);
        render();
        apply(_cycleItems[activeIdx], { keepOpen:true });
        return true;
      }
      if(e.key === "Enter"){
        // Do not consume Enter/Shift+Enter; just close the menu and let the editor handle the key.
        hide();
        return false;
      }

      return false;
    };

    // Expose hooks the engine already calls.
    window.__charMenuUpdate = (opts={}) => { try{ update(opts); }catch(_e){} };
    window.__charMenuHandleKey = (e) => { try{ return handleKey(e); }catch(_e){ return false; } };

    // Triggers: keyup catches BOTH native typing and our preventDefault+insert paths.
    editor.addEventListener("keyup", (ev) => {
      // Only attempt updates while focus is in the script.
      if(document.activeElement !== editor && !editor.contains(document.activeElement)) return;

      // Any normal typing should break us out of TAB-cycling so matches refresh.
      if(_cycleActive){
        const k = ev && ev.key;
        const keep = (k === "Tab" || k === "Shift" || k === "ArrowUp" || k === "ArrowDown" || k === "Alt" || k === "Control" || k === "Meta");
        if(!keep){
          _cycleActive = false;
          _cycleLineId = "";
          _cycleItems = [];
        }
      }
      update({ fastGuard:true });
    }, true);

    // Also update when the caret moves via mouse.
    editor.addEventListener("mouseup", () => { update({ fastGuard:true }); }, true);

    // Hide when clicking away.
    window.addEventListener("mousedown", (e) => {
      if(menu.hidden) return;
      const t = e.target;
      if(t && t instanceof Node && menu.contains(t)) return;
      hide();
    }, true);

    // Reposition on scroll/resize.
    const refreshPos = () => { if(!menu.hidden) position(); };
    window.addEventListener("scroll", refreshPos, true);
    window.addEventListener("resize", refreshPos, true);

    // If selection changes while open, refresh.
    document.addEventListener("selectionchange", () => {
      if(menu.hidden) return;
      update({ fastGuard:true, keepOpen:true });
    }, true);

    return true;
  }

  // The menu lives AFTER this script tag in the HTML, so we must wait until DOM is ready.
  if(document.readyState === "loading"){
    window.addEventListener("DOMContentLoaded", () => { try{ boot(); }catch(_e){} }, {once:true});
  }else{
    try{ boot(); }catch(_e){}
  }
})();;

// ---------- Scene Location Autocomplete (Scene Heading lines) ----------
(function __bindSceneLocationAutocomplete(){
  const MAX_SHOW = 8;

  const getEditor = () => document.getElementById("scriptEditor");

  const safeActiveLine = () => {
    try{ if(typeof getActiveLine === "function") return getActiveLine(); }catch(_e){}
    const ed = getEditor();
    const sel = window.getSelection();
    if(!ed || !sel || !sel.rangeCount) return null;
    const r = sel.getRangeAt(0);
    const n = r.startContainer;
    const el = (n && n.nodeType === 1) ? n : (n ? n.parentElement : null);
    return el ? el.closest(".line") : null;
  };

  const isSceneLine = (line) => !!(line && line.classList && line.classList.contains("line") && line.getAttribute("data-type") === "scene");

  const caretOffsetIn = (el) => {
    try{
      const sel = window.getSelection();
      if(!sel || !sel.rangeCount) return 0;
      const r = sel.getRangeAt(0);
      if(!el.contains(r.startContainer)) return 0;
      const pre = document.createRange();
      pre.selectNodeContents(el);
      pre.setEnd(r.startContainer, r.startOffset);
      return pre.toString().length;
    }catch(_e){ return 0; }
  };

  const clampToViewport = (x,y) => {
    const pad = 8;
    const w = menu ? (menu.offsetWidth || 240) : 240;
    const h = menu ? (menu.offsetHeight || 160) : 160;
    const maxX = Math.max(pad, window.innerWidth - w - pad);
    const maxY = Math.max(pad, window.innerHeight - h - pad);
    return { x: Math.min(Math.max(pad, x), maxX), y: Math.min(Math.max(pad, y), maxY) };
  };

  const normKey = (s) => (s||"").toUpperCase().replace(/\s+/g," ").trim();

  // Parse a scene heading into { prefix, location, time, sepIndexInFullText }
  const parseSceneHeading = (fullText) => {
    const t = (fullText||"").replace(/\n/g," ").replace(/\s+/g," ").trim();
    if(!t) return null;

    const m = t.match(/^(INT\.?\/EXT\.?|INT\.?|EXT\.?|I\/E\.?|EST\.?)\s+/i);
    if(!m) return null;

    const prefix = t.slice(0, m[0].trimEnd().length); // preserve typed prefix (no trailing space)
    const rest = t.slice(m[0].length); // after the first required space(s)

    // Find first " - " (space-hyphen-space) as time separator
    const sepMatch = rest.match(/\s-\s/);
    if(sepMatch){
      const sepIdx = sepMatch.index; // in 'rest'
      const loc = rest.slice(0, sepIdx).trim();
      const time = rest.slice(sepIdx + 3).trim();
      return { prefix, location: loc, time, sepInFull: m[0].length + sepIdx };
    }else{
      return { prefix, location: rest.trim(), time: "", sepInFull: -1 };
    }
  };

  // Build canonical location list from existing scene headings.
  const listLocations = (skipLine) => {
    const ed = getEditor();
    if(!ed) return [];
    const els = ed.querySelectorAll('.line[data-type="scene"]');
    const freq = new Map(); // key -> count
    const canon = new Map(); // key -> canonical display
    for(const el of els){
      if(skipLine && el === skipLine) continue;
      const raw = (el.textContent || "").replace(/\n/g," ").trim();
      if(!raw) continue;
      const parsed = parseSceneHeading(raw);
      if(!parsed || !parsed.location) continue;
      const k = normKey(parsed.location);
      if(!k) continue;
      freq.set(k, (freq.get(k)||0) + 1);
      if(!canon.has(k)) canon.set(k, parsed.location.toUpperCase());
    }
    return Array.from(freq.entries())
      .sort((a,b)=> (b[1]-a[1]) || a[0].localeCompare(b[0]))
      .map(([k]) => canon.get(k) || k);
  };

  let menu, listEl, titleEl, editor;
  let activeIdx = 0;
  let currentItems = [];
  let currentLineId = "";
  let _cycleActive = false;
  let _cycleItems = [];
  let _cycleLineId = "";

  const hide = () => {
    if(!menu) return;
    menu.hidden = true;
    currentItems = [];
    activeIdx = 0;
    currentLineId = "";
    _cycleActive = false;
    _cycleItems = [];
    _cycleLineId = "";
  };

  const render = () => {
    if(!listEl) return;
    listEl.innerHTML = "";
    for(let i=0;i<currentItems.length;i++){
      const name = currentItems[i];
      const btn = document.createElement("button");
      btn.type = "button";
      btn.textContent = name;
      if(i === activeIdx) btn.classList.add("active");
      btn.addEventListener("mousedown", (e) => {
        // Prevent editor focus loss / selection reset.
        e.preventDefault();
      });
      btn.addEventListener("click", (e) => {
        e.preventDefault();
        apply(currentItems[i], { keepOpen:true });
      });
      listEl.appendChild(btn);
    }
  };

  const positionMenu = (lineEl) => {
    if(!menu || !lineEl) return;
    const r = lineEl.getBoundingClientRect();

    // Anchor to the line box (stable), placed below and slightly inset so it doesn't cover typing.
    let x = r.left + 12;
    let y = r.bottom + 8;

    const pos = clampToViewport(x, y);
    menu.style.left = pos.x + "px";
    menu.style.top  = pos.y + "px";
  };

  const update = (opts={}) => {
    if(!menu || !editor) return;
    const line = safeActiveLine();
    if(!isSceneLine(line)){ hide(); return; }

    const raw = (line.textContent || "").replace(/\n/g," ");
    const parsed = parseSceneHeading(raw);
    if(!parsed){ hide(); return; }

    // Only show once the user has started typing the LOCATION (not just the prefix).
    const locFrag = (parsed.location || "").trim();
    if(locFrag.length < 1){ hide(); return; }

    // If user is typing in TIME (after " - "), do not show location suggestions.
    const caret = caretOffsetIn(line);
    if(parsed.sepInFull >= 0 && caret > (parsed.sepInFull + 3)){ hide(); return; }

    currentLineId = (line.dataset && line.dataset.id) ? line.dataset.id : (line.getAttribute("data-line-id") || "");

    // If we're Tab-cycling on this same line, keep the original cycle set so cycling is continuous
    // even after we apply a full location text (which would otherwise collapse matches to 1).
    if(_cycleActive && _cycleLineId === currentLineId && _cycleItems && _cycleItems.length){
      currentItems = _cycleItems;
      activeIdx = ((activeIdx % _cycleItems.length) + _cycleItems.length) % _cycleItems.length;

      menu.hidden = false;
      if(titleEl) titleEl.textContent = "Location";
      render();
      positionMenu(line);
      return;
    }

    const all = listLocations(line);
    const want = normKey(locFrag);

    const matches = all.filter(loc => normKey(loc).startsWith(want)).slice(0, MAX_SHOW);

    // Smart show: only display if we actually have matches.
    if(!matches.length){ hide(); return; }

    currentItems = matches;
    activeIdx = Math.min(activeIdx, currentItems.length-1);

    // Maintain cycling set per-line (so Tab keeps moving through same match set).
    if(!_cycleActive || _cycleLineId !== currentLineId){
      _cycleActive = false;
      _cycleLineId = "";
      _cycleItems = [];
    }

    menu.hidden = false;
    if(titleEl) titleEl.textContent = "Location";
    render();
    positionMenu(line);
  };

  const apply = (loc, opts={}) => {
    const line = safeActiveLine();
    if(!isSceneLine(line)){ hide(); return; }

    const keepOpen = !!opts.keepOpen;

    try{ if(typeof scheduleSnapshot === "function") scheduleSnapshot("scene-loc-autocomplete"); }catch(_e){}

    const full = (line.textContent || "").replace(/\n/g," ").replace(/\s+/g," ").trim();
    const parsed = parseSceneHeading(full);
    if(!parsed){ hide(); return; }

    // Preserve prefix and any existing time portion if present.
    const prefix = parsed.prefix;
    const time = parsed.time;
    const newText = time ? (prefix + " " + loc.toUpperCase() + " - " + time) : (prefix + " " + loc.toUpperCase());

    line.textContent = newText;

    try{ if(typeof normalizeEditorStructure === "function") normalizeEditorStructure(); }catch(_e){}

    // Put caret at end of location (before time if any), so the flow feels natural.
    try{
      const sel = window.getSelection();
      const r = document.createRange();
      r.selectNodeContents(line);
      // Move caret before " - " if it exists
      const idx = newText.indexOf(" - ");
      const target = (idx >= 0) ? idx : newText.length;
      // Find node + offset by walking text nodes
      let remaining = target;
      let node = null;
      const walker = document.createTreeWalker(line, NodeFilter.SHOW_TEXT, null);
      while(walker.nextNode()){
        const t = walker.currentNode;
        const L = t.nodeValue.length;
        if(remaining <= L){ node = t; break; }
        remaining -= L;
      }
      if(!node){
        node = line.firstChild;
        remaining = (node && node.nodeType === 3) ? node.nodeValue.length : 0;
      }
      r.setStart(node, Math.max(0, Math.min(remaining, node.nodeValue.length)));
      r.collapse(true);
      sel.removeAllRanges();
      sel.addRange(r);
    }catch(_e){}

    if(!keepOpen){ hide(); return; }
    update({ keepOpen:true });
  };

  const handleKey = (e) => {
    if(!menu || menu.hidden) return false;

    const line = safeActiveLine();
    if(!isSceneLine(line)){ hide(); return false; }

    // Only consume keys that are for suggestion navigation/cycling.
    if(e.key === "ArrowDown"){
      e.preventDefault();
      activeIdx = (activeIdx + 1) % currentItems.length;
      render();
      apply(currentItems[activeIdx], { keepOpen:true });
      return true;
    }
    if(e.key === "ArrowUp"){
      e.preventDefault();
      activeIdx = (activeIdx - 1 + currentItems.length) % currentItems.length;
      render();
      apply(currentItems[activeIdx], { keepOpen:true });
      return true;
    }

    // Tab cycles; Shift+Tab cycles backwards. Does not accept/close.
    if(e.key === "Tab"){
      // If the editor has other Tab behaviors, only consume when menu is open with items.
      e.preventDefault();

      if(!_cycleActive || _cycleLineId !== ((line.dataset && line.dataset.id) ? line.dataset.id : (line.getAttribute("data-line-id") || ""))){
        _cycleActive = true;
        _cycleLineId = (line.dataset && line.dataset.id) ? line.dataset.id : (line.getAttribute("data-line-id") || "");
        _cycleItems = currentItems.slice(0);
        activeIdx = e.shiftKey ? (_cycleItems.length - 1) : 0;
      }else{
        activeIdx = e.shiftKey
          ? ((activeIdx - 1 + _cycleItems.length) % _cycleItems.length)
          : ((activeIdx + 1) % _cycleItems.length);
      }

      render();
      apply(_cycleItems[activeIdx], { keepOpen:true });
      return true;
    }

    if(e.key === "Escape"){
      e.preventDefault();
      hide();
      return true;
    }

    // Do not consume Enter/Shift+Enter: allow normal scene->action flow.
    if(e.key === "Enter"){
      hide();
      return false;
    }

    return false;
  };

  function boot(){
    menu   = document.getElementById("sceneLocMenu");
    listEl = document.getElementById("sceneLocMenuList");
    titleEl= document.getElementById("sceneLocMenuTitle");
    editor = getEditor();
    if(!menu || !listEl || !editor) return;

    // Expose hooks used by the engine lifecycle.
    window.__sceneLocMenuUpdate = (opts={}) => { try{ update(opts); }catch(_e){} };
    window.__sceneLocMenuHandleKey = (e) => { try{ return handleKey(e); }catch(_e){ return false; } };

    // Keyup catches BOTH native typing and preventDefault insert paths.
    editor.addEventListener("keyup", (ev) => {
      if(document.activeElement !== editor && !editor.contains(document.activeElement)) return;

      // Break out of cycling when normal typing occurs (so matches refresh).
      if(_cycleActive){
        const k = ev && ev.key;
        const keep = (k === "Tab" || k === "Shift" || k === "ArrowUp" || k === "ArrowDown" || k === "Alt" || k === "Control" || k === "Meta");
        if(!keep){
          _cycleActive = false;
          _cycleLineId = "";
          _cycleItems = [];
        }
      }
      update({ fastGuard:true });
    }, true);

    editor.addEventListener("mouseup", () => { update({ fastGuard:true }); }, true);
    window.addEventListener("scroll", () => { if(!menu.hidden) update({ fastGuard:true }); }, true);
    window.addEventListener("resize", () => { if(!menu.hidden) update({ fastGuard:true }); }, true);

    // Hide when clicking away.
    window.addEventListener("mousedown", (e) => {
      if(menu.hidden) return;
      const t = e.target;
      if(t && t instanceof Node && menu.contains(t)) return;
      hide();
    }, true);
  }

  // Menu is after this script tag; wait until DOM is ready.
  if(document.readyState === "loading"){
    window.addEventListener("DOMContentLoaded", () => { try{ boot(); }catch(_e){} }, {once:true});
  }else{
    try{ boot(); }catch(_e){}
  }


})();

<script>
/* ---------- Find / Replace (SCRIPT editor only) ---------- */
(() => {
  const editor = document.getElementById("scriptEditor");
  const panel = document.getElementById("findPanel");
  if(!editor || !panel) return;

  const $ = (id)=>document.getElementById(id);

  const findInp = $("findInp");
  const replaceInp = $("replaceInp");
  const replaceRow = $("replaceRow");
  const countEl = $("findCount");
  const errEl = $("findErr");
  const titleEl = $("findTitle");

  const btnPrev = $("findPrev");
  const btnNext = $("findNext");
  const btnReplace = $("findReplace");
  const btnReplaceAll = $("findReplaceAll");
  const btnClose = $("findClose");

  const togCase = $("findCase");
  const togWord = $("findWord");
  const togRegex = $("findRegex");

  const MAX_MATCHES = 5000;
  const DEBOUNCE_MS = 180;

  let lastOpenSel = null;
  let matches = [];
  let curIndex = -1;
  let searchTimer = null;

  function inScriptFocus(){
    const ae = document.activeElement;
    if(ae && (ae === editor || editor.contains(ae))) return true;
    const sel = window.getSelection();
    if(!sel || sel.rangeCount===0) return false;
    const r = sel.getRangeAt(0);
    return editor.contains(r.commonAncestorContainer);
  }

  function setToggle(btn, on){
    btn.classList.toggle("on", !!on);
    btn.setAttribute("aria-pressed", on ? "true":"false");
  }

  function showErr(msg){
    errEl.textContent = msg || "";
  }

  function openPanel(mode){
    lastOpenSel = (typeof getSelectionDescriptor === "function") ? getSelectionDescriptor() : null;

    // Start with the selected word/phrase (if any) in the Find box
    try{
      const sel = window.getSelection();
      const picked = (sel && sel.rangeCount && !sel.isCollapsed && editor.contains(sel.getRangeAt(0).commonAncestorContainer)) ? String(sel.toString()) : "";
      if(picked && picked.length <= 80 && !/\n/.test(picked.trim())) findInp.value = picked.trim();
    }catch(_e){}

    panel.classList.add("open");
    // Find and Replace always show together
    if(titleEl) titleEl.textContent = "Find & Replace";
    replaceRow.style.display = "";
    btnReplace.style.display = "";
    btnReplaceAll.style.display = "";

    // focus the Find box
    requestAnimationFrame(() => {
      findInp.focus();
      findInp.select();
      scheduleSearch(true);
    });
  }

  function closePanel(){
    panel.classList.remove("open");
    showErr("");
    clearHighlights();
    matches = [];
    curIndex = -1;
    renderCount();
    // restore prior selection if possible
    if(lastOpenSel && typeof restoreSelectionDescriptor === "function"){
      requestAnimationFrame(() => restoreSelectionDescriptor(lastOpenSel));
    }
  }

  // Expose minimal API for menu items / external triggers.
  window.__scriptyFindReplaceOpen = openPanel;
  window.__scriptyFindReplaceClose = closePanel;


  function escapeRegExp(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }

  function buildRegex(){
    const q = findInp.value || "";
    if(!q){
      showErr("");
      return null;
    }

    const useRegex = togRegex.classList.contains("on");
    const matchCase = togCase.classList.contains("on");
    const wholeWord = togWord.classList.contains("on");

    let source = q;
    if(!useRegex) source = escapeRegExp(q);

    if(wholeWord){
      // Keep it simple and predictable (within-line only)
      source = `\\b(?:${source})\\b`;
    }

    const flags = "g" + (matchCase ? "" : "i");
    try{
      showErr("");
      return new RegExp(source, flags);
    }catch(e){
      showErr("Invalid pattern");
      return null;
    }
  }

  function getSearchHosts(){
    // A "host" is where we allow matches to occur (within one logical line / field).
    // We never match across separate lines/fields.
    const hosts = [];
    const lineEls = Array.from(editor.querySelectorAll(".line"));
    for(const lineEl of lineEls){
      const type = (lineEl.dataset.type || "");
      const lineId = lineEl.dataset.id;
      if(!lineId) continue;

      if(type === "dual"){
        const fields = Array.from(lineEl.querySelectorAll(".dualField"));
        for(const f of fields){
          const part = f.dataset.part || "";
          hosts.push({ lineId, part, el: f });
        }
      }else{
        hosts.push({ lineId, part: null, el: lineEl });
      }
    }
    return hosts;
  }

  
  function __findHostTextStream(hostEl){
    // Build a text stream that matches resolveVisualIndexInElement() indexing:
    // - concatenates ONLY text nodes in DOM order
    // - ignores <br> (which would appear as "\n" in textContent/innerText and breaks indexing)
    if(!hostEl) return "";
    let out = "";
    const walker = document.createTreeWalker(hostEl, NodeFilter.SHOW_TEXT, null);
    while(walker.nextNode()){
      const n = walker.currentNode;
      if(n && typeof n.nodeValue === "string") out += n.nodeValue;
    }
    return out;
  }

function computeMatches(){
    clearHighlights();
    matches = [];
    curIndex = -1;

    const re = buildRegex();
    if(!re){
      renderCount();
      return;
    }

    const hosts = getSearchHosts();
    const started = performance.now();

    for(const h of hosts){
      const text = __findHostTextStream(h.el);
      re.lastIndex = 0;

      let m;
      while((m = re.exec(text))){
        const start = m.index;
        const end = start + (m[0] || "").length;
        if(end <= start){
          // Avoid infinite loops on zero-length matches
          re.lastIndex = start + 1;
          continue;
        }
        matches.push({ lineId: h.lineId, part: h.part, start, end });
        if(matches.length >= MAX_MATCHES) break;
        // Basic "too slow" guard
        if(performance.now() - started > 120){
          // Stop scanning if it looks pathological
          break;
        }
      }
      if(matches.length >= MAX_MATCHES) break;
      if(performance.now() - started > 120) break;
    }

    if(matches.length){
      curIndex = 0;
      applyHighlights();
      jumpToCurrent(false);
    }else{
      renderCount();
    }
  }

  function renderCount(){
    const total = matches.length;
    const cur = (total && curIndex >= 0) ? (curIndex + 1) : 0;
    countEl.textContent = `${cur} of ${total}`;
  }

  
  function withHistoryLock(fn){
    // Prevent Find/Replace highlight spans from polluting the script undo history.
    // HISTORY_LOCK is defined by the editor's custom history system.
    const has = (typeof HISTORY_LOCK !== "undefined");
    const prev = has ? HISTORY_LOCK : false;
    try{
      if(has) HISTORY_LOCK = true;
      return fn();
    }finally{
      if(has) HISTORY_LOCK = prev;
    }
  }

function clearHighlights(){
    // unwrap all highlight spans (history-locked so undo snapshots never capture these transient spans)
    withHistoryLock(() => {
      const spans = editor.querySelectorAll("span.findMark, span.findMarkCurrent");
      spans.forEach(sp => {
        const parent = sp.parentNode;
        if(!parent) return;
        while(sp.firstChild) parent.insertBefore(sp.firstChild, sp);
        sp.remove();
        try{ parent.normalize(); }catch(_e){}
      });
    });
  }

  function wrapTextSlice(textNode, start, end, className){
    let node = textNode;
    const len = node.nodeValue.length;
    const s = Math.max(0, Math.min(start, len));
    const e = Math.max(0, Math.min(end, len));
    if(e <= s) return null;

    if(e < len) node.splitText(e);
    if(s > 0) node = node.splitText(s);

    const span = document.createElement("span");
    span.className = className;
    node.parentNode.insertBefore(span, node);
    span.appendChild(node);
    return span;
  }

  function applyHighlights(){
    const selDesc = (typeof getSelectionDescriptor === "function") ? getSelectionDescriptor() : null;

    withHistoryLock(() => {
      // Group matches per host, so we can walk text nodes once per host.
    const byHost = new Map(); // key: lineId|part
    for(let i=0;i<matches.length;i++){
      const m = matches[i];
      const key = `${m.lineId}||${m.part||""}`;
      if(!byHost.has(key)) byHost.set(key, []);
      byHost.get(key).push({ ...m, idx: i });
    }
    for(const list of byHost.values()){
      list.sort((a,b)=>a.start - b.start);
    }

    for(const [key, list] of byHost.entries()){
      const [lineId, part] = key.split("||");
      const lineEl = editor.querySelector(`.line[data-id="${CSS.escape(lineId)}"]`);
      if(!lineEl) continue;

      let hostEl = lineEl;
      if((lineEl.dataset.type||"") === "dual" && part){
        hostEl = lineEl.querySelector(`.dualField[data-part="${CSS.escape(part)}"]`) || lineEl;
      }

      // Walk text nodes and wrap from end->start to keep offsets stable.
      const textNodes = [];
      const walker = document.createTreeWalker(hostEl, NodeFilter.SHOW_TEXT, null);
      while(walker.nextNode()){
        const n = walker.currentNode;
        if(n.nodeValue) textNodes.push(n);
      }

      // Build cumulative offsets for each text node
      const spansToMake = [];
      let acc = 0;
      for(const n of textNodes){
        const start = acc;
        const end = acc + n.nodeValue.length;
        spansToMake.push({ node:n, start, end });
        acc = end;
      }

      // For each match, find the text nodes it intersects and wrap slices
      for(let k=list.length-1;k>=0;k--){
        const mm = list[k];
        const isCur = (mm.idx === curIndex);
        const cls = isCur ? "findMark findMarkCurrent" : "findMark";

        // Find nodes overlapping [mm.start, mm.end)
        for(let t=spansToMake.length-1; t>=0; t--){
          const tn = spansToMake[t];
          if(mm.end <= tn.start) continue;
          if(mm.start >= tn.end) continue;

          const localStart = Math.max(0, mm.start - tn.start);
          const localEnd   = Math.min(tn.end - tn.start, mm.end - tn.start);
          if(localEnd <= localStart) continue;

          // Don't wrap whitespace-only slices (visual noise)
          const sliceStr = tn.node.nodeValue.slice(localStart, localEnd);
          if(!sliceStr || !sliceStr.trim()) continue;

          const sp = wrapTextSlice(tn.node, localStart, localEnd, cls);
          if(sp) sp.dataset.mi = String(mm.idx);
        }
      }
      try{ hostEl.normalize(); }catch(_e){}
    }
    });

    // Restore selection (if it was in script) after wrapping
    if(selDesc && typeof restoreSelectionDescriptor === "function"){
      requestAnimationFrame(() => restoreSelectionDescriptor(selDesc));
    }

    renderCount();
  }

  
  function jumpToCurrent(ensurePanelOpen=true){
    if(ensurePanelOpen && !panel.classList.contains("open")) return;
    if(!matches.length || curIndex < 0) return;

    // Re-apply highlights so current match is distinct
    clearHighlights();
    applyHighlights();

    const m = matches[curIndex];

    // Always scroll to the containing line/field (selection may not be visibly painted while inputs have focus)
    try{
      const lineEl = editor.querySelector(`.line[data-id="${CSS.escape(m.lineId)}"]`);
      let scrollEl = lineEl;
      if(lineEl && m.part){
        const f = lineEl.querySelector(`.dualField[data-part="${CSS.escape(m.part)}"]`);
        if(f) scrollEl = f;
      }
      if(scrollEl && scrollEl.scrollIntoView){
        scrollEl.scrollIntoView({ block:"center", inline:"nearest" });
        // subtle flash to orient the eye
        if(lineEl){
          lineEl.classList.remove("findLineFlash");
          // force reflow so animation retriggers
          void lineEl.offsetWidth;
          lineEl.classList.add("findLineFlash");
          setTimeout(()=>lineEl.classList.remove("findLineFlash"), 650);
        }
      }
    }catch(_e){}

    // Also set an actual DOM selection for replace operations + accessibility
    if(typeof resolveScriptIndex !== "function") return;
    const a = resolveScriptIndex(m.lineId, m.start, m.part || undefined);
    const b = resolveScriptIndex(m.lineId, m.end, m.part || undefined);
    if(!a || !b) return;

    const range = document.createRange();
    range.setStart(a.node, a.offset);
    range.setEnd(b.node, b.offset);

    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  function nextMatch(dir){
    if(!matches.length) return;
    curIndex = (curIndex + dir + matches.length) % matches.length;
    jumpToCurrent();
  }

  function scheduleSearch(force=false){
    if(!panel.classList.contains("open") && !force) return;
    if(searchTimer) clearTimeout(searchTimer);
    searchTimer = setTimeout(() => computeMatches(), DEBOUNCE_MS);
  }

  function replaceOne(){
    if(!matches.length || curIndex < 0) return;
    const rep = (replaceInp.value ?? "");
    const m = matches[curIndex];
    if(!m) return;

    showErr("");

    // Take an undo snapshot BEFORE we mutate, and ensure the mutation itself doesn't get polluted by highlight spans.
    try{
      if(typeof snapshot === "function") snapshot("find-replace:pre");
      else if(typeof scheduleSnapshot === "function") scheduleSnapshot("find-replace:pre");
    }catch(_e){}

    const lineEl = editor.querySelector(`.line[data-id="${CSS.escape(m.lineId)}"]`);

    // Prefer span-based replacement: the current highlight is the most reliable anchor.
    const curSpan =
      editor.querySelector('span.findMarkCurrent[data-mi="'+curIndex+'"]') ||
      editor.querySelector('span.findMarkCurrent') ||
      editor.querySelector('span.findMark[data-mi="'+curIndex+'"]');

    const doCapFix = () => {
      try{
        if(!lineEl) return;
        const t = (lineEl.dataset.type || "action");
        if(typeof applyTypeCapitalization === "function"){
          applyTypeCapitalization(lineEl, t);
        }
      }catch(_e){}
    };

    const finalize = () => {
      // Ensure no transient spans remain in the DOM when we commit history.
      clearHighlights();

      // Normalize affected host for stable selection + history serialization.
      try{
        let hostEl = lineEl;
        if(lineEl && m.part){
          const f = lineEl.querySelector(`.dualField[data-part="${CSS.escape(m.part)}"]`);
          if(f) hostEl = f;
        }
        if(hostEl && hostEl.normalize) hostEl.normalize();
      }catch(_e2){}

      doCapFix();

      try{
        if(typeof normalizeEditorStructure === "function") normalizeEditorStructure();
        if(typeof paginate === "function") paginateWhenReady_();
      }catch(_e3){}

      // Commit an undo snapshot AFTER the change, while the DOM is clean (no highlights).
      try{
        if(typeof snapshot === "function") snapshot("find-replace");
        else if(typeof scheduleSnapshot === "function") scheduleSnapshot("find-replace");
      }catch(_e4){}

      // Re-run search/highlights on next frame (history-locked inside highlight ops).
      requestAnimationFrame(() => {
        computeMatches();
        if(matches.length){
          // Move to next match after replace.
          curIndex = Math.min(curIndex, matches.length-1);
          nextMatch(+1);
        }
      });
    };

    if(curSpan){
      // Replace text inside wrapper.
      try{
        if(curSpan.firstChild && curSpan.firstChild.nodeType === 3){
          curSpan.firstChild.nodeValue = rep;
        }else{
          curSpan.textContent = rep;
        }
      }catch(_e){}
      finalize();
      return;
    }

    // Fallback: Range-based replacement via resolved indices.
    try{
      const a = resolveScriptIndex(m.lineId, m.start, m.part || undefined);
      const b = resolveScriptIndex(m.lineId, m.end, m.part || undefined);
      if(!a || !b) return;

      const r = document.createRange();
      r.setStart(a.node, a.offset);
      r.setEnd(b.node, b.offset);

      r.deleteContents();
      r.insertNode(document.createTextNode(rep));
    }catch(_e){}

    finalize();
  }


  function replaceAll(){
    if(!matches.length) return;
    const rep = (replaceInp.value ?? "");
    const total = matches.length;

    showErr("");

    // Snapshot pre-change.
    try{
      if(typeof snapshot === "function") snapshot("find-replace-all:pre");
      else if(typeof scheduleSnapshot === "function") scheduleSnapshot("find-replace-all:pre");
    }catch(_e){}

    // Ensure highlights exist so we can operate span-by-span (most reliable).
    clearHighlights();
    computeMatches();
    if(!matches.length){
      showErr("0 matches.");
      return;
    }

    // Apply highlights so each match is wrapped.
    clearHighlights();
    applyHighlights();

    // Replace from end -> start to avoid any DOM shifting concerns.
    const spans = Array.from(editor.querySelectorAll("span.findMark, span.findMarkCurrent"));
    const touchedLines = new Set();

    for(let i=spans.length-1;i>=0;i--){
      const sp = spans[i];
      if(!sp) continue;

      // Track affected lines for capitalization re-apply (scene/character/transition)
      try{
        const ln = sp.closest(".line");
        if(ln && ln.dataset && ln.dataset.id) touchedLines.add(ln.dataset.id);
      }catch(_e){}

      try{
        if(sp.firstChild && sp.firstChild.nodeType === 3){
          sp.firstChild.nodeValue = rep;
        }else{
          sp.textContent = rep;
        }
      }catch(_e2){}
    }

    // Cleanup highlights and normalize.
    clearHighlights();
    try{ editor.normalize(); }catch(_e3){}

    // Re-apply capitalization rules for affected lines (important for Scene Headings).
    try{
      if(typeof applyTypeCapitalization === "function"){
        for(const id of touchedLines){
          const ln = editor.querySelector(`.line[data-id="${CSS.escape(id)}"]`);
          if(!ln) continue;
          applyTypeCapitalization(ln, (ln.dataset.type || "action"));
        }
      }
    }catch(_e4){}

    try{
      if(typeof normalizeEditorStructure === "function") normalizeEditorStructure();
      if(typeof paginate === "function") paginateWhenReady_();
      }catch(_e5){}

    // Snapshot post-change (DOM clean, no highlights).
    try{
      if(typeof snapshot === "function") snapshot("find-replace-all");
      else if(typeof scheduleSnapshot === "function") scheduleSnapshot("find-replace-all");
    }catch(_e6){}

    requestAnimationFrame(() => {
      computeMatches();
      showErr(`Replaced ${total} occurrence${total===1?"":"s"}.`);
      setTimeout(()=>{ if(panel.classList.contains("open")) showErr(""); }, 1200);
    });
  }


  // ---------- UI events ----------
  findInp.addEventListener("input", () => scheduleSearch());
  replaceInp.addEventListener("input", () => { /* no-op */ });

  [togCase, togWord, togRegex].forEach(btn=>{
    btn.addEventListener("click", () => {
      setToggle(btn, !btn.classList.contains("on"));
      scheduleSearch(true);
    });
  });

  btnPrev.addEventListener("click", () => nextMatch(-1));
  btnNext.addEventListener("click", () => nextMatch(+1));
  btnReplace.addEventListener("click", () => replaceOne());
  btnReplaceAll.addEventListener("click", () => replaceAll());
  btnClose.addEventListener("click", () => closePanel());

  // Enter behavior
  findInp.addEventListener("keydown", (e) => {
    if(e.key === "Enter"){
      e.preventDefault();
      if(e.shiftKey) nextMatch(-1);
      else nextMatch(+1);
    }else if(e.key === "Escape"){
      e.preventDefault();
      closePanel();
    }
  });

  replaceInp.addEventListener("keydown", (e) => {
    if(e.key === "Enter"){
      e.preventDefault();
      replaceOne();
    }else if(e.key === "Escape"){
      e.preventDefault();
      closePanel();
    }
  });

  // Close on Esc from anywhere while panel open
  document.addEventListener("keydown", (e) => {
    if(!panel.classList.contains("open")) return;
    if(e.key === "Escape"){
      e.preventDefault();
      closePanel();
    }
  }, true);

  // Keyboard open hooks (capture early so browser Find doesn't steal it)
  document.addEventListener("keydown", (e) => {
    const isMac = navigator.platform.toLowerCase().includes("mac");
    const mod = isMac ? e.metaKey : e.ctrlKey;

    if(!mod) return;
    const key = (e.key || "").toLowerCase();

    if(key === "f" || (key === "h" && !isMac) || (key === "f" && e.altKey)){
      // Ctrl/Cmd+F (and Ctrl+H) open Find & Replace from anywhere in the page (Notes uses the browser's own Find)
      if(document.body.classList.contains("notesMode")) return;
      e.preventDefault();
      if(panel.classList.contains("open") && panel.contains(document.activeElement)){
        findInp.focus(); findInp.select(); return;
      }
      openPanel("find");
    }
  }, true);

  // If user edits script while search panel is open, remove highlights and re-scan shortly.
  editor.addEventListener("input", () => {
    if(!panel.classList.contains("open")) return;
    // Prevent highlights from "sticking" across edits (ephemeral requirement)
    clearHighlights();
    scheduleSearch(true);
  });

  editor.addEventListener("blur", () => {
    if(!panel.classList.contains("open")) return;
    // Keep highlights while the panel is open (focus moves to inputs).
    // Clearing here breaks Replace/Replace All because the active match wrapper disappears.
  }, true);
})();
</script>
