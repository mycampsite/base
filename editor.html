}

const __EXACT_TRANSITIONS = ["FADE OUT.", "FADE TO BLACK.", "CUT TO BLACK.", "INTERCUT WITH:", "TIME CUT:"];
function looksLikeTransition(t){
  const s = (t||"").trim();
  if(__EXACT_TRANSITIONS.includes(s.toUpperCase())) return true;
  if(s.length < 3) return false;
  if(s.length > 28) return false;
  if(!/TO:\s*$/.test(s)) return false;
  return isMostlyUpper(s);

function looksLikeCharacter(t, prevLineEl){
  let s = (t||"").trim();
  // Allow an extension like "SARAH (V.O.)" or "SARAH (CONT'D)"
  const ext = s.replace(/\s*\((?:V\.?O\.?|O\.?S\.?|O\.?C\.?|CONT['\u2019]?D|PRE-?LAP|FILTERED|ON PHONE|ON TV|INTO PHONE)\)\s*$/i, "");
  if(ext && ext !== s) s = ext.trim();
  if(s.length < 1 || s.length > 35) return false;
  // Character lines are usually short, mostly uppercase, and NOT sentence-like.
  if(/[:]/.test(s)) return false;
  if(/[\.\,\;\?\!]/.test(s)) return false;
  if(/\)$/.test(s)) return false;
  const wc = s.split(/\s+/).filter(Boolean).length;
  if(wc > 4) return false;
  if(!isMostlyUpper(s)) return false;
  // Character is usually introduced after a blank line or a scene heading/action break
  if(prevLineEl && getLineTextLength(prevLineEl)===0) return true;
  return false;
}

}

function _uppercaseTextNodes(rootEl){
  if(!rootEl) return;
  const walker = document.createTreeWalker(rootEl, NodeFilter.SHOW_TEXT, {
    acceptNode(node){
      if(!node.nodeValue) return NodeFilter.FILTER_REJECT;
      // Skip our invisible caret anchor if it ever ends up inside.
      if(node.parentElement && node.parentElement.id === "caretAnchor") return NodeFilter.FILTER_REJECT;
      return NodeFilter.FILTER_ACCEPT;
    }
  });
  const nodes = [];
  while(walker.nextNode()) nodes.push(walker.currentNode);
  for(const tn of nodes){
    tn.nodeValue = tn.nodeValue.toUpperCase();
  }
}

  function setLineType(lineEl, type, opts={}){

  function insertTextAtCaretPlain(text){

    const r = sel.getRangeAt(0);

    let host = null;

      const el = (n && n.nodeType === 1) ? n : (n ? n.parentElement : null);

    let idx = 0;
    try{
      const sc = r.startContainer;
      const so = r.startOffset;
      if(host && host.classList && host.classList.contains("line") && typeof locateVisualIndexInLine === "function"){

function toggleCapsOnSelection(){
    const sel = window.getSelection();
    if(!sel || sel.rangeCount===0) return;
    const range = sel.getRangeAt(0);
    const editor = $("#scriptEditor");
    if(!editor.contains(range.commonAncestorContainer)) return;
    if(range.collapsed) return;

    // Take one snapshot before mutation (Word/FD style)
    scheduleSnapshot("caps");

    // Collect all text nodes that intersect the selection (skip caret anchor / spacers)
    const textNodes = [];
    const walker = document.createTreeWalker(
      editor,
      NodeFilter.SHOW_TEXT,
      {
        acceptNode(node){
          if(!node.nodeValue || node.nodeValue.length===0) return NodeFilter.FILTER_REJECT;
          const p = node.parentElement;
          if(!p) return NodeFilter.FILTER_REJECT;
          if(p.closest && p.closest("#caretAnchor")) return NodeFilter.FILTER_REJECT;
          if(p.closest && p.closest(".pageSpacer")) return NodeFilter.FILTER_REJECT;
          return NodeFilter.FILTER_ACCEPT;
        }
      }
    );

    const intersectsRange = (node) => {
      const r2 = document.createRange();
      r2.selectNodeContents(node);
      // true if ranges overlap
      return !(range.compareBoundaryPoints(Range.END_TO_START, r2) >= 0 ||
               range.compareBoundaryPoints(Range.START_TO_END, r2) <= 0);
    };

    let n;
    while((n = walker.nextNode())){
      if(intersectsRange(n)) textNodes.push(n);
    }
    if(textNodes.length===0) return;

    // Decide toggle direction:
    // If ANY selected text is not inside a caps span => APPLY caps.
    // Otherwise => REMOVE caps.
    const isInCaps = (node) => {
      const el = node.parentElement;
      return !!(el && el.closest && el.closest('span[data-caps="1"]'));
    };
    const shouldApply = textNodes.some(t => !isInCaps(t));

    // Helper: split a text node and return the middle node [start,end)
    function isolateTextSlice(textNode, start, end){
      let node = textNode;
      const len = node.nodeValue.length;

      const safeStart = Math.max(0, Math.min(start, len));
      const safeEnd   = Math.max(0, Math.min(end, len));
      if(safeEnd <= safeStart) return null;

      // Split at end first, then at start so indices remain valid
      if(safeEnd < len) node.splitText(safeEnd);
      if(safeStart > 0) node = node.splitText(safeStart);
      return node; // now exactly the selected slice
    }

    function wrapCaps(textNode){
      const capsSpan = document.createElement("span");
      capsSpan.dataset.caps = "1";
      textNode.parentNode.insertBefore(capsSpan, textNode);
      capsSpan.appendChild(textNode);
    }
    function unwrapCapsSlice(textNode){
      const capsSpan = textNode.parentElement && textNode.parentElement.closest
        ? textNode.parentElement.closest('span[data-caps="1"]')
        : null;
      if(!capsSpan) return;

      // Preserve any inline formatting *inside* the caps span (b/i/u/s/etc).
      // We move only the selected text slice out of the caps span, recreating its
      // ancestor formatting chain (excluding the caps span) so nothing disappears.
      const chain = [];
      let p = textNode.parentNode;
      while(p && p !== capsSpan){
        if(p.nodeType === 1) chain.push(p);
        p = p.parentNode;
      }

      // Build clone chain from outermost -> innermost
      let outerClone = null;
      let inner = null;
      for(let i = chain.length - 1; i >= 0; i--){
        const src = chain[i];
        const clone = src.cloneNode(false); // shallow clone keeps tag + attrs
        if(!outerClone){
          outerClone = clone;
          inner = clone;
        }else{
          inner.appendChild(clone);
          inner = clone;
        }
      }

      // Insert either the clone chain (if any) or the raw text node before capsSpan
      if(outerClone){
        capsSpan.parentNode.insertBefore(outerClone, capsSpan);
        inner.appendChild(textNode); // move the slice into the innermost clone
      }else{
        capsSpan.parentNode.insertBefore(textNode, capsSpan);
      }

      // Clean up any now-empty wrappers left behind inside capsSpan
      for(const src of chain){
        if(src && src.parentNode && !src.firstChild){
          src.remove();
        }
      }

      // If the capsSpan is empty after removal, delete it.
      if(!capsSpan.firstChild || !capsSpan.textContent){
        if(!capsSpan.textContent || capsSpan.textContent.length === 0) capsSpan.remove();
      }
    }


    // Apply mutation node-by-node
    for(const t of textNodes){
      const start = (t === range.startContainer) ? range.startOffset : 0;
      const end   = (t === range.endContainer) ? range.endOffset : t.nodeValue.length;

      const slice = isolateTextSlice(t, start, end);
      if(!slice) continue;

      if(shouldApply){
        // Avoid double-wrapping
        if(!isInCaps(slice)) wrapCaps(slice);
      } else {
        // Remove only the selected slice from caps
        if(isInCaps(slice)) unwrapCapsSlice(slice);
      }
    }

    // Preserve selection: serialize a descriptor *before* paginate rebuild moves nodes
    const selDesc = getSelectionDescriptor();

    requestAnimationFrame(() => {
      normalizeEditorStructure();
      paginateWhenReady_();
      // Restore selection after paginate
      requestAnimationFrame(() => restoreSelectionDescriptor(selDesc));
    });
  }

    if(!line || (line.dataset.type || "") === "dual") return;
    const r = sel.getRangeAt(0);
    if(t === "insertParagraph" || t === "insertLineBreak"){
      e.preventDefault();
      __AUTO_BOUNDARY_PENDING = false;
      try{ _autoCorrectTokenInActiveLine(); }catch(_e){}
      try{ if(window.__smartMenuHandleKey) window.__smartMenuHandleKey({ key:"Escape", preventDefault(){} }); }catch(_e){}
      splitLineAtCaret();
      try{ markDirty(); }catch(_e){}
      return;
    }
    if(!r.collapsed){
      const lineOf = (n) => { const el = n && (n.nodeType === 1 ? n : n.parentElement); return el ? el.closest(".line") : null; };
      const a = lineOf(r.startContainer), b = lineOf(r.endContainer);
      if(!a || !b || a !== b){
        e.preventDefault();
        scheduleSnapshot("delete-selection");
        if(!deleteSelectionWordlike()){ try{ normalizeEditorStructure(); paginateWhenReady_(); }catch(_e){} }
        try{ markDirty(); }catch(_e){}
      }
      return;
    }
    const loc = locateScriptIndex(r.startContainer, r.startOffset); if(!loc) return;
    if(t === "deleteContentBackward" && loc.index === 0 && previousLine(line)){
      e.preventDefault(); mergeWithPreviousLine(); try{ markDirty(); }catch(_e){}
    }else if(t === "deleteContentForward" && loc.index >= getLineTextLength(line) && nextLine(line)){
      e.preventDefault(); mergeWithNextLine(); try{ markDirty(); }catch(_e){}
    }
  });

  // Pagination rebuild clears and re-adds line DOM (required for page layout), which can cause native spell underlines
  // to visually "flash" if we do it on every keystroke. Debounce pagination so typing feels stable.
  let __paginateDebounceTimer = null;
  // ---- Font/metrics lock (Final Draft-style predictability) ----
  // Pagination must wait until the screenplay font is loaded; otherwise line breaks/page breaks can shift after a late font swap.
  let __fontsReady = false;
  let __fontsReadyPromise = null;
  let __paginateAfterFonts = false;
  let __didInitialPaginate = false;

  function ensureFontsReady_(){
    if(__fontsReady) return Promise.resolve(true);
    if(__fontsReadyPromise) return __fontsReadyPromise;
    try{
      if(document.fonts && document.fonts.ready){
        const readyP = document.fonts.ready.then(() => true).catch(() => false);
        // Fallback timeout so the editor never stays "blank" if fonts are blocked.
        const timeoutP = new Promise((res) => setTimeout(() => res(false), 1500));
        __fontsReadyPromise = Promise.race([readyP, timeoutP]).then((ok) => {
          __fontsReady = true;
          return ok;
        });
        return __fontsReadyPromise;
      }
    }catch(_e){}
    __fontsReady = true;
    return Promise.resolve(false);
  }

  function paginateWhenReady_(){
    // Always render at least once immediately so pages are visible.
    if(!__didInitialPaginate){
      __didInitialPaginate = true;
      try{ paginate(); }catch(_e){}
    }

    if(__fontsReady){
      // Fonts ready: re-paginate once to lock metrics/page breaks.
      try{ paginate(); }catch(_e){}
      return;
    }

    __paginateAfterFonts = true;
    ensureFontsReady_().then(() => {
      if(__paginateAfterFonts){
        __paginateAfterFonts = false;
        try{ paginate(); }catch(_e){}
      }
    });
  }

function schedulePaginate(){
    if(__paginateDebounceTimer) clearTimeout(__paginateDebounceTimer);
    __paginateDebounceTimer = setTimeout(() => {
      __paginateDebounceTimer = null;
      // Nothing moved: the pages are still right, so don't rebuild them (keeps typing smooth)
      if(__fontsReady && window.__scriptyLayoutUnchanged && window.__scriptyLayoutUnchanged()){
        try{ if(window.__charMenuUpdate) window.__charMenuUpdate({ keepOpen:true }); }catch(_e){}
        try{ if(window.__sceneLocMenuUpdate) window.__sceneLocMenuUpdate({ keepOpen:true }); }catch(_e){}
        __pendingSelectionOverride = null; // no rebuild: drop the saved caret so it can't snap back later
        return;
      }
      paginateWhenReady_();
      try{ _refreshSpellSuppress(); }catch(_e){}

      // Character name autocomplete: pagination rebuilds DOM/selection; refresh menu position + items.
      // (Prevents the menu from appearing to "not work" due to an immediate reflow/hide.)
      try{ if(window.__charMenuUpdate) window.__charMenuUpdate({ keepOpen:true }); }catch(_e){}
      try{ if(window.__sceneLocMenuUpdate) window.__sceneLocMenuUpdate({ keepOpen:true }); }catch(_e){}
    }, 120);
  }


  // Input normalization + pagination (selection-safe)
  $("#scriptEditor").addEventListener("input", (e) => {
    // Capture a stable selection *before* we normalize/paginate so the caret never snaps mid-line.
    try{
      const d = getSelectionDescriptor();
      if(d && d.scope === "script") hintSelectionOverride(d);
    }catch(_e){}

    // Only repair if the caret has truly fallen into non-editable chrome (spacers/anchor).
    try{
      const sel = window.getSelection();
      const r = (sel && sel.rangeCount) ? sel.getRangeAt(0) : null;
      const sc = r ? r.startContainer : null;
      const el = sc ? (sc.nodeType === 1 ? sc : sc.parentElement) : null;
      if(el && (el.closest && (el.closest(".pageSpacer") || el.closest("#caretAnchor")))){
        repairCaretIfDetached();
      }
    }catch(_e){}

    // Spell underline cadence handled by bindSpellcheckCadence() (prevents flicker + mid-word underlines).

    // Spellcheck breathing room: only show underlines after a short idle pause.
    /* Spellcheck cadence handled by bindSpellcheckCadence() */

    normalizeEditorStructure();

    // If caret fell onto the editor root (common after big deletes), snap back into a real line.
    try{ snapCaretIntoNearestLine(); }catch(_e){}

    // Smart auto-type (scene/character/transition) based on what you just typed.
    // Runs only when the current line is still "action" to avoid fighting explicit user choices.
    applySmartTypeFromText(getActiveLine());

    // Run autocorrect as part of the same input pipeline (prevents caret snapping).
    if(__AUTO_BOUNDARY_PENDING){
      __AUTO_BOUNDARY_PENDING = false;
      _autoCorrectTokenInActiveLine();
    }

    scheduleSnapshot("input");

    schedulePaginate();

    // Character name autocomplete: update suggestions as you type.
    try{ if(window.__charMenuUpdate) window.__charMenuUpdate(); }catch(_e){}
  });

function normalizePastedText(text){
  let t = (text || "").replace(/\r/g, "");
  // Normalize common invisible/spacing characters
  t = t.replace(/\u00A0/g, " ");            // NBSP -> space
  t = t.replace(/[\u200B\u200C\u200D\uFEFF]/g, ""); // zero-width chars
  // Normalize smart quotes and apostrophes
  t = t.replace(/[\u2018\u2019\u201A\u2032]/g, "'");
  t = t.replace(/[\u201C\u201D\u201E\u2033]/g, '"');
  // Normalize dashes
  t = t.replace(/[\u2013\u2014]/g, "-");
  // Normalize line endings and trim trailing spaces per line (keeps leading spaces if user wants them)
  t = t.split("\n").map(line => line.replace(/[ \t]+$/g, "")).join("\n");
  return t;
}


// ---------- Rich Paste (keep structure + inline formatting) ----------
function cssPxToNumber(v){
  if(!v) return 0;
  const m = String(v).match(/(-?\d+(\.\d+)?)/);
  return m ? parseFloat(m[1]) : 0;
}

function fmtFromAncestors(el){
  const fmt = { b:false,i:false,u:false,s:false,c:false };
  let n = el;
  while(n && n.nodeType===1){
    const tag = n.tagName;
    if(tag==="B" || tag==="STRONG") fmt.b = true;
    if(tag==="I" || tag==="EM") fmt.i = true;
    if(tag==="U") fmt.u = true;
    if(tag==="S" || tag==="STRIKE") fmt.s = true;

    const st = n.getAttribute && n.getAttribute("style");
    if(st){
      const low = st.toLowerCase();
      if(low.includes("font-weight") && low.match(/font-weight\s*:\s*(bold|[6-9]\d\d)/)) fmt.b = true;
      if(low.includes("font-style") && low.match(/font-style\s*:\s*italic/)) fmt.i = true;
      if(low.includes("text-decoration") && low.match(/underline/)) fmt.u = true;
      if(low.includes("text-decoration") && low.match(/line-through/)) fmt.s = true;
      if(low.includes("text-transform") && low.match(/uppercase/)) fmt.c = true;
    }
    if(n.dataset && n.dataset.caps==="1") fmt.c = true;
    n = n.parentElement;
  }
  return fmt;
}

function collectRunsFromHTMLBlock(blockEl){
  // Returns runs with '\n' included where <br> appears, so caller can split into multiple lines.
  const runs = [];
  const push = (t, fmt) => {
    if(t === "") return;
    const last = runs[runs.length-1];
    const r = { t, b:!!fmt.b, i:!!fmt.i, u:!!fmt.u, s:!!fmt.s, c:!!fmt.c };
    if(last && last.b===r.b && last.i===r.i && last.u===r.u && last.s===r.s && last.c===r.c){
      last.t += r.t;
    } else runs.push(r);
  };

  function walk(node){
    if(node.nodeType === 3){
      const text = node.nodeValue || "";
      if(text) push(text, fmtFromAncestors(node.parentElement));
      return;
    }
    if(node.nodeType !== 1) return;
    const el = node;
    if(el.tagName === "BR"){
      push("\n", {b:false,i:false,u:false,s:false,c:false});
      return;
    }
    // Treat <p>/<div> nested blocks as inline within this block (we already split blocks outside).
    for(const child of Array.from(el.childNodes)) walk(child);
    // Some editors use <span style="white-space:pre"> etc. We rely on text nodes.
  }
  walk(blockEl);

  if(runs.length===0) runs.push({t:"",b:false,i:false,u:false,s:false,c:false});
  return runs;
}

function splitRunsOnNewlines(runs){
  const lines = [];
  let cur = [];
  const flush = () => {
    if(cur.length===0) cur = [{t:"",b:false,i:false,u:false,s:false,c:false}];
    // Remove any literal \n from runs
    cur = cur.map(r => ({...r, t:(r.t||"").replace(/\n/g,"")}));
    lines.push(cur);
    cur = [];
  };

  for(const r of runs){
    const t = r.t || "";
    if(!t.includes("\n")){
      cur.push({...r});
      continue;
    }
    const parts = t.split("\n");
    for(let i=0;i<parts.length;i++){
      const part = parts[i];
      if(part){
        cur.push({...r, t: part});
      }
      if(i !== parts.length-1){
        flush();
      }
    }
  }
  flush();
  return lines;
}

function classifyByHeuristics(text, prevType){
  const t = (text||"").replace(/\s+$/,"");
  const s = t.trim();
  if(s === "") return "action";
  if(lineLooksLikeSceneHeading(s)) return "scene";
  if(looksLikeTransition(s)) return "transition";
  if(/^\(.+\)$/.test(s)) return "parenthetical";
  // PDF/clipboard plain text often loses the blank-line cue before character.
  // Use a looser character detector as a fallback.
  if(looksLikeCharacter(s, null) || looksLikeCharacterLoose(s)) return "character";
  // Dialogue inference
  if(prevType==="character" || prevType==="parenthetical" || prevType==="dialogue"){
    // Do NOT keep consuming action lines as dialogue when PDF paste has no blank line.
    // Break out of dialogue mode when the next line looks like third-person narration.
    if(looksLikeNarrationAction(s)) return "action";
    return "dialogue";
  }
  return "action";
}

function looksLikeCharacterLoose(s){
  const t = (s||"").trim();
  if(!t) return false;
  if(lineLooksLikeSceneHeading(t)) return false;
  if(looksLikeTransition(t)) return false;
  if(/^\(.+\)$/.test(t)) return false;
  // Keep it conservative.
  if(t.length > 35) return false;
  // Allow a single parenthetical suffix like (V.O.)/(O.S.)/(CONT'D)
  // IMPORTANT: do the punctuation check *after* removing the suffix,
  // because (V.O.) contains periods that would otherwise incorrectly disqualify the line.
  const base = t.replace(/\s*\((V\.O\.|O\.S\.|CONT'D|CONT\.?D)\)\s*$/i, "").trim();
  if(!base) return false;
  // Now disqualify punctuation in the *name* part only.
  if(/[\.:,;!?]/.test(base)) return false;
  // Mostly uppercase letters, allow spaces and apostrophes.
  if(!isMostlyUpper(base)) return false;
  // Word count limit
  const wc = base.split(/\s+/).filter(Boolean).length;
  if(wc > 4) return false;
  return true;
}

// Rich-paste helper: Character cues are usually short, mostly-uppercase lines.
// This is intentionally conservative to avoid misclassifying ALL CAPS action.
function lineLooksLikeCharacterName(t){
  return looksLikeCharacterLoose(t);
}


function looksLikeNarrationAction(s){
  const t = (s||"").trim();
  if(!t) return false;

  // Strong cue: starts with third-person / scene-description determiners.
  // Common screenplay action openings that should NOT be treated as dialogue.
  if(/^(Her|His|Their|She|He|They|The|A|An|It|Outside|Inside|In\b|On\b|At\b|With\b)\b/.test(t)) return true;

  // Score-based cue: dialogue leans 1st/2nd person; action leans 3rd person.
  const lower = t.toLowerCase();
  const dialogueHits = (lower.match(/\b(i|i'm|ive|i've|id|i'd|me|my|mine|we|we're|weve|we've|our|ours|you|you're|youre|you've|youve|your|yours)\b/g) || []).length;
  const actionHits   = (lower.match(/\b(he|she|they|their|them|his|her|hers|him|its|it’s|it)\b/g) || []).length;

  // If it's clearly 3rd-person narration (and not clearly dialogue), treat as action.
  if(actionHits >= 2 && actionHits >= dialogueHits + 1) return true;

  // Another cue: action often has descriptive clauses and commas.
  if(actionHits >= 1 && /[,;]/.test(t) && dialogueHits === 0) return true;

  return false;
}




function lineLooksLikeSceneHeading(t){
  const s = (t||"").trim();
  // allow optional leading numbering like "1 " from certain PDF pastes
  const s2 = s.replace(/^\d+\s+/, "");
  return looksLikeSceneHeading(s2);
}

function runsLineStartsWithBoldSlug(runsLine){
  if(!runsLine || !runsLine.length) return false;
  // Find first non-space char and see if it's in a bold run
  let idx = 0;
  for(const r of runsLine){
    const t = (r.t || "");
    let j = 0;
    while(j < t.length && /\s/.test(t[j])) j++;
    if(j < t.length){
      // first visible char is in this run
      if(!r.b) return false;
      const full = runsLine.map(x=>x.t||"").join("");
      return lineLooksLikeSceneHeading(full);
    }
    idx += t.length;
  }
  return false;
}

function ensureBlankAfterScene(lines){
  const out = [];
  for(let i=0;i<lines.length;i++){
    const ln = lines[i];
    out.push(ln);
    if(ln.type === "scene"){
      const next = lines[i+1];
      if(next){
        const nextBlank = (next.runs||[]).every(r => (r.t||"").trim()==="");
        if(!nextBlank){
          out.push({ type:"action", runs:[{t:"",b:false,i:false,u:false,s:false,c:false}] });
        }
      }
    }
  }
  // Coalesce multiple blanks
  const cleaned = [];
  for(const ln of out){
    const isBlank = (ln.runs||[]).every(r => (r.t||"").trim()==="");
    if(isBlank && cleaned.length){
      const prevBlank = (cleaned[cleaned.length-1].runs||[]).every(r => (r.t||"").trim()==="");
      if(prevBlank) continue;
    }
    cleaned.push(ln);
  }
  return cleaned;
}

function ensureBlankAfterDialogueBlock(lines){
  // Insert a single blank line after a dialogue block (dialogue + optional parentheticals)
  // when the next non-blank line is a different block type.
  const out = [];
  const isBlank = (ln) => (ln.runs||[]).every(r => (r.t||"").trim()==="");
  const isDialogueFamily = (t) => (t === "dialogue" || t === "parenthetical");

  for(let i=0;i<lines.length;i++){
    const ln = lines[i];
    out.push(ln);

    if(!isDialogueFamily(ln.type)) continue;

    // Find the next line (immediate) and decide if we're ending a dialogue block.
    const next = lines[i+1];
    if(!next) continue;
    if(isBlank(next)) continue; // already has gap

    // If next is still dialogue/parenthetical, we're in the same block.
    if(isDialogueFamily(next.type)) continue;

    // If current line is dialogue-family and the next is a new block, insert one blank.
    out.push({ type:"action", runs:[{t:"",b:false,i:false,u:false,s:false,c:false}] });
  }

  // Coalesce multiple blanks
  const cleaned = [];
  for(const ln of out){
    const blank = isBlank(ln);
    if(blank && cleaned.length){
      const prevBlank = isBlank(cleaned[cleaned.length-1]);
      if(prevBlank) continue;
    }
    cleaned.push(ln);
  }
  return cleaned;
}


function detectTypeFromHTMLBlock(blockEl, text, prevType){
  const cls = (blockEl.getAttribute("class") || "").toLowerCase();
  const style = (blockEl.getAttribute("style") || "").toLowerCase();

  const has = (re) => re.test(cls) || re.test(style);

  if(has(/scene|slug|heading/)) return "scene";
  if(has(/character/)) return "character";
  if(has(/dialogue/)) return "dialogue";
  if(has(/paren/)) return "parenthetical";
  if(has(/transition/)) return "transition";
  if(has(/action/)) return "action";

  // Indent heuristic via inline styles (common in HTML exports)
  const ml = cssPxToNumber((style.match(/margin-left\s*:\s*([^;]+)/)||[])[1]);
  const ti = cssPxToNumber((style.match(/text-indent\s*:\s*([^;]+)/)||[])[1]);
  const pl = cssPxToNumber((style.match(/padding-left\s*:\s*([^;]+)/)||[])[1]);
  const indent = Math.max(ml, pl) + Math.max(0, ti);

  // Rough thresholds (px) – tuned for typical 96dpi exports
  // Character ~ 3.0-3.7in from left -> >= 230px common
  if(indent >= 210 && isMostlyUpper((text||"").trim())) return "character";
  // Dialogue often around 2.0-2.5in -> 140-190px
  if(indent >= 130 && indent < 210){
    const s = (text||"").trim();
    if(/^\(.+\)$/.test(s)) return "parenthetical";
    if(prevType==="character" || prevType==="parenthetical") return "dialogue";
    // If it looks like character, still treat as character
    if(isMostlyUpper(s) && s.length<=35 && !/[:\.\,\;\?\!]/.test(s)) return "character";
    return "dialogue";
  }

  return classifyByHeuristics(text, prevType);
}

function parseClipboardHTMLToLines(htmlText){
  const parser = new DOMParser();
  const doc = parser.parseFromString(htmlText, "text/html");
  const body = doc.body;

  // Prefer paragraphs/divs; fall back to body child nodes
  const blocks = Array.from(body.querySelectorAll("p, div, li")).filter(el => {
    // Skip any wrapper that itself holds nested paragraph/div/li blocks — those children
    // are already picked up as their own blocks. Without this, a wrapper div (very common
    // in Google Docs/Word/web-page paste HTML, e.g. a top-level "<div id=docs-internal-...>"
    // around the whole document) gets treated as ONE giant block, and every paragraph inside
    // it gets glommed into a single run with no paragraph breaks (only <br> splits lines) —
    // that's what caused whole scenes to clump into one blob, out of order, ahead of the
    // correctly-split copy of the same text below it.
    if(el.querySelector("p, div, li")) return false;
    return true;
  });
  const useBlocks = blocks.length ? blocks : Array.from(body.childNodes).filter(n => n.nodeType===1);

  const out = [];
  let prevType = "action";

  for(const block of useBlocks){
    const rawText = (block.innerText || block.textContent || "").replace(/\r/g,"");
    // Keep intentional blank lines: if a block is empty, we insert a blank action line.
    if(rawText.trim()===""){
      out.push({ type:"action", runs:[{t:"",b:false,i:false,u:false,s:false,c:false}] });
      prevType = "action";
      continue;
    }

    const runs = collectRunsFromHTMLBlock(block);
    const runLines = splitRunsOnNewlines(runs);

    for(const rl of runLines){
      const text = rl.map(r=>r.t||"").join("");
      let type = detectTypeFromHTMLBlock(block, text, prevType);
      // If the line starts with a bolded INT/EXT slug (common in PDF/FD pastes), force SCENE.
      if(runsLineStartsWithBoldSlug(rl)) type = "scene";

      // Character + dialogue recognition for rich pastes:
      // - A mostly-uppercase short line like "MOTHER (V.O.)" should be CHARACTER.
      // - Lines immediately following a CHARACTER/PARENTHETICAL should be DIALOGUE until a blank/new block.
      const tTrim = (text||"").trim();
      if(type !== "scene" && type !== "transition" && type !== "parenthetical"){
        if(lineLooksLikeCharacterName(tTrim)) type = "character";
      }
      if((prevType === "character" || prevType === "parenthetical") && type === "action" && tTrim){
        // The line under a character cue is always their dialogue (Final Draft never puts action there)
        if(!lineLooksLikeSceneHeading(tTrim) && !looksLikeTransition(tTrim) && !lineLooksLikeCharacterName(tTrim)) type = "dialogue";
      }

      out.push({ type, runs: rl });
      prevType = type;
    }
  }

  // Coalesce consecutive blanks to a single blank line (Word/FD-ish)
  const cleaned = [];
  for(const ln of out){
    const isBlank = ln.runs.every(r => (r.t||"").trim()==="");
    if(isBlank && cleaned.length){
      const prevBlank = cleaned[cleaned.length-1].runs.every(r => (r.t||"").trim()==="");
      if(prevBlank) continue;
    }
    cleaned.push(ln);
  }
  const post = looksHardWrappedLines(cleaned) ? reflowWrappedPlainPaste(cleaned) : cleaned;
  return ensureBlankAfterDialogueBlock(ensureBlankAfterScene(post));
}


function expandFlatScreenplayText(t){
  // Some external sources (certain PDF viewers, some web apps) put the entire page on the clipboard
  // as one giant paragraph with minimal/newline loss. Try to reconstruct likely screenplay breaks.
  const raw = (t || "");
  const nlCount = (raw.match(/\n/g) || []).length;
  if(nlCount >= 3) return raw;

  const longEnough = raw.length >= 140;
  const hasSlug = /\b(?:INT\.|EXT\.|INT\/EXT\.|I\/E\.|EST\.)\b/i.test(raw);
  const hasTo = /\b[A-Z ]{3,40}TO:\b/.test(raw) || /\b(?:CUT TO:|DISSOLVE TO:|SMASH CUT TO:|MATCH CUT TO:|FADE OUT\.|FADE TO BLACK\.)\b/.test(raw);
  if(!longEnough || (!hasSlug && !hasTo)) return raw;

  let s = raw;

  // Normalize weird spacing that can hide boundaries.
  s = s.replace(/\s{3,}/g, "  ");

  // Insert breaks before sluglines.
  s = s.replace(/(\s)(?=(?:INT\.|EXT\.|INT\/EXT\.|I\/E\.|EST\.)\s)/gi, "\n");

  // Insert breaks before common transitions / any ALLCAPS phrase ending with TO:
  s = s.replace(/(\s)(?=(?:CUT TO:|DISSOLVE TO:|SMASH CUT TO:|MATCH CUT TO:|WIPE TO:|FADE OUT\.|FADE TO BLACK\.)\b)/g, "\n");
  s = s.replace(/(\s)(?=[A-Z][A-Z \.\-]{2,40}TO:\b)/g, "\n");

  // Insert breaks before parentheticals when they look like their own beat.
  s = s.replace(/(\s)(?=\([^\)\n]{2,60}\)\s)/g, "\n");

  // Light character cue detection: break before short ALL CAPS tokens followed by two spaces or a quote/dash.
  // This is intentionally conservative to avoid chopping ACTION lines.
  s = s.replace(/(\s)(?=[A-Z][A-Z0-9 \.\'\-\(\)]{1,28}(?:\s{2,}|\s*[\u2014\-]))/g, "\n");

  // Clean up: collapse multiple newlines and trim.
  s = s.replace(/\n{3,}/g, "\n\n");
  return s.trim();
}


function looksHardWrappedLines(lines){
  // Heuristic: detect PDF-style hard-wrapped paragraphs (newline at every visual wrap).
  // We only attempt this when there are no intentional blank lines.
  if(!lines || lines.length < 3) return false;
  const blankCount = lines.filter(ln => (ln.runs||[]).every(r => (r.t||"").trim()==="")).length;
  if(blankCount > 0) return false;

  // Ignore if there are many explicit screenplay blocks (scene/transition/character) in the chunk.
  const nonBody = lines.filter(ln => ["scene","transition","character","parenthetical"].includes(ln.type)).length;
  if(nonBody >= Math.max(2, Math.floor(lines.length/3))) return false;

  const texts = lines.map(ln => (ln.runs||[]).map(r=>r.t||"").join("").trim()).filter(Boolean);
  if(texts.length < 3) return false;

  const avgLen = texts.reduce((a,s)=>a+s.length,0)/texts.length;
  const shortProp = texts.filter(s => s.length > 0 && s.length < 75).length / texts.length;

  const noTerminalProp = texts.filter(s => !/[\.!\?:…"\)]\s*$/.test(s)).length / texts.length;
  const nextStartsLowerProp = texts.slice(1).filter(s => /^[a-z(]/.test(s)).length / Math.max(1, texts.length-1);

  // Typical hard-wrap: many short lines, most lines don't end with terminal punctuation,
  // and many subsequent lines start lowercase/paren.
  if(shortProp >= 0.55 && (noTerminalProp >= 0.55 || nextStartsLowerProp >= 0.45) && avgLen < 90) return true;

  return false;
}

function parsePlainScreenplayTextToLines(text){
  // Screenplay-aware plain-text paste. Handles three common clipboard shapes:
  //  1) Final Draft / Fountain style: one element per line, blank lines between elements
  //  2) PDF copies WITH indentation (character, dialogue, parenthetical columns kept as spaces)
  //  3) PDF copies WITHOUT indentation or blank lines (every visual line hard-wrapped)
  // Wrapped lines are rejoined into paragraphs, and the line after a CHARACTER cue is always dialogue.
  let t = normalizePastedText(text||"");
  t = expandFlatScreenplayText(t);
  const R = (s) => [{t:s,b:false,i:false,u:false,s:false,c:false}];
  const isParen = (s) => /^\(/.test(s);
  const nameOf = (s) => s.replace(/\s*\([^)]*\)\s*$/g, "").replace(/\s*\([^)]*\)\s*$/g, "").trim();
  const looksName = (s) => {
    const b = nameOf(s);
    if(!b || b.length > 35 || /[.:,;!?]/.test(b.replace(/\bMR?S?\.|\bDR\./g, ""))) return false;
    if(b.split(/\s+/).length > 4) return false;
    return isMostlyUpper(b);
  };

  // ---- 1) Read lines (keep indent), drop PDF page furniture ----
  const src = [];
  let afterMore = false;
  for(const raw of t.split("\n")){
    const exp = raw.replace(/\t/g, "    ");
    let s = exp.trim();
    if(!s){ src.push({ ind:0, s:"" }); continue; }
    if(/^\d{1,3}\.$/.test(s)) continue;                                   // page numbers
    if(/^\(MORE\)$/i.test(s)){ afterMore = true; continue; }              // dialogue split across pages
    if(/^\(?CONTINUED\)?:?(\s*\(\d+\))?$/i.test(s)) continue;
    const sn = s.match(/^(\d+[A-Z]?)\s+(.*?)\s+\1$/);                      // scene numbers both sides
    if(sn && lineLooksLikeSceneHeading(sn[2])) s = sn[2];
    src.push({ ind: exp.length - exp.replace(/^\s+/, "").length, s, afterMore });
    afterMore = false;
  }
  while(src.length && !src[0].s) src.shift();
  while(src.length && !src[src.length-1].s) src.pop();
  if(!src.length) return [{ type:"action", runs:R("") }];

  const filled = src.filter(x => x.s);
  const base = Math.min(...filled.map(x => x.ind));
  const useIndent = filled.filter(x => x.ind - base >= 6).length >= 2;
  // Blank lines that only mark PDF page breaks don't count: real element gaps are frequent.
  const hasBlanks = src.filter(x => !x.s).length >= Math.max(1, filled.length * 0.12);
  // A PDF wraps every line at ~61 chars. Typed text has longer lines. Allow a few garbled long lines.
  const hardWrapped = filled.length >= 4 && filled.filter(x => x.s.length > 72).length <= Math.max(1, filled.length * 0.03);

  // ---- 2) Classify each line ----
  const items = [];   // { type, s, blankBefore }
  let prev = "", blank = false, dual = null;
  const DUAL_COL = 31;   // right column of Final Draft dual dialogue starts ~3.1" right of the action margin
  for(let i = 0; i < src.length; i++){
    const x = src[i], s = x.s;
    if(!s){ blank = true; dual = null; continue; }
    const rel = x.ind - base;
    let type;

    // Dual dialogue (indented PDF copies): two speaker columns side by side
    if(useIndent){
      const line = " ".repeat(rel) + s;
      const L = line.slice(0, DUAL_COL).trim(), Rt = line.slice(DUAL_COL).trim();
      const isHead = L && Rt && rel >= 8 && looksName(L) && looksName(Rt) && /\s{3,}/.test(line.trim());
      if(isHead){
        dual = { left:{ c:[L], d:[] }, right:{ c:[Rt], d:[] } };
        items.push({ type:"dual", dual, blankBefore: blank });
        prev = "dual"; blank = false; continue;
      }
      // A line running across both columns (no wide gap) is ordinary text again: the dual block is over.
      if(dual && prev === "dual" && L && Rt && !/\S\s{3,}\S/.test(line.trim())){ dual = null; prev = "action"; blank = true; }
      if(dual && prev === "dual"){
        const sides = [["left", L], ["right", Rt]];
        for(const [k, v] of sides){
          if(!v) continue;
          if(/^\((?:CONT['’]D|V\.?O\.?|O\.?S\.?|O\.?C\.?)\)$/i.test(v) && !dual[k].d.length) dual[k].c.push(v);
          else dual[k].d.push(v);
        }
        continue;
      }
    }

    // A "NAME (CONT'D)" straight after (MORE) just continues the same speech: skip it
    if(x.afterMore && looksName(s) && (prev === "dialogue" || prev === "parenthetical")){ continue; }

    if(lineLooksLikeSceneHeading(s)) type = "scene";
    else if(useIndent){
      if(rel >= 30) type = (looksLikeTransition(s) || isMostlyUpper(s)) ? "transition" : "dialogue";
      else if(rel >= 17) type = isParen(s) ? "parenthetical" : (looksName(s) ? "character" : "dialogue");
      else if(rel >= 6) type = (isParen(s) || (prev === "parenthetical" && !blank && !/\)$/.test(items[items.length-1].s))) ? "parenthetical" : "dialogue";
      else type = looksLikeTransition(s) ? "transition" : "action";
      // Indented text right after a blank that isn't under a speaker is still dialogue only if a cue precedes it
      if((type === "dialogue" || type === "parenthetical") && blank && prev !== "character") type = "action";
    } else {
      const inSpeech = prev === "character" || prev === "parenthetical" || prev === "dialogue";
      if(looksLikeTransition(s)) type = "transition";
      else if(prev === "parenthetical" && !blank && !/\)\s*$/.test(items[items.length-1].s)) type = "parenthetical";
      else if(isParen(s) && inSpeech && !blank) type = "parenthetical";
      else if(looksName(s) && prev !== "character" && prev !== "parenthetical" &&
              (blank || !hasBlanks || (src[i+1] && src[i+1].s && !looksName(src[i+1].s) && !lineLooksLikeSceneHeading(src[i+1].s)))) type = "character";
      else if((prev === "character" || prev === "parenthetical") && !blank) type = "dialogue";   // always dialogue under a cue
      else if(prev === "dialogue" && !blank){
        // Line right after dialogue with no gap: either the speech wraps on, or (PDF copies) action resumes.
        const last = items[items.length-1].s;
        if(hasBlanks) type = (/[.!?…"]$/.test(last) && looksLikeNarrationAction(s)) ? "action" : "dialogue";
        else {
          // A finished sentence followed by narration or a NAME in caps is action resuming, even if the line was full.
          const ended = /[.!?…"]$/.test(last);
          const actionish = looksLikeNarrationAction(s) || /^[A-Z][A-Z'’\-]{1,}\b/.test(s);
          type = (__wraps(last, s, "dialogue") && !(ended && actionish)) ? "dialogue" : "action";
        }
      }
      else type = "action";
    }
    items.push({ type, s, blankBefore: blank });
    prev = type; blank = false;
  }

  // ---- 3) Rejoin hard-wrapped lines into paragraphs ----
  // Standard screenplay column widths in characters (Courier 12, 10 chars per inch)
  function __width(type){ return { action:61, scene:61, dialogue:35, parenthetical:26, transition:20 }[type] || 61; }
  function __wraps(prevLine, nextLine, type){
    if(!hardWrapped) return false;
    const w = (nextLine.match(/^\S+/) || [""])[0].length;
    return prevLine.length + 1 + w > __width(type) - 2;
  }
  const els = [];
  for(const it of items){
    const last = els[els.length-1];
    const joinable = last && !it.blankBefore && last.type === it.type &&
      (it.type === "action" || it.type === "dialogue" || it.type === "parenthetical");
    if(joinable){
      const tail = last.lines[last.lines.length-1];
      // Parentheticals rejoin until the closing ")". Others rejoin when the previous line was full.
      const cont = it.type === "parenthetical" ? !/\)\s*$/.test(tail) : (hasBlanks && it.type === "dialogue" ? true : __wraps(tail, it.s, it.type));
      if(cont){ last.lines.push(it.s); continue; }
    }
    els.push({ type: it.type, lines: [it.s], dual: it.dual, blankBefore: it.blankBefore });
  }

  // ---- 4) Emit lines with Final Draft spacing (one blank line between blocks) ----
  const out = [];
  const speech = (t) => t === "dialogue" || t === "parenthetical";
  const push = (ln) => out.push(ln);
  const blankLine = () => { if(out.length && !(out[out.length-1].type === "action" && out[out.length-1].runs[0].t === "")) push({ type:"action", runs:R("") }); };
  for(let i = 0; i < els.length; i++){
    const e = els[i], p = els[i-1];
    const sameBlock = p && (speech(e.type) && (p.type === "character" || speech(p.type)));
    if(p && !sameBlock) blankLine();
    if(e.type === "dual"){
      const side = (d) => ({ characterRuns: R(d.c.join(" ").replace(/\s+/g, " ")), dialogueRuns: R(d.d.join(" ").replace(/\s+/g, " ")) });
      push({ type:"dual", dual:{ left: side(e.dual.left), right: side(e.dual.right) }, runs: R("") });
      continue;
    }
    push({ type: e.type, runs: R(e.lines.join(" ").replace(/\s{2,}/g, " ")) });
  }
  if(out.length && out[out.length-1].type === "dual") push({ type:"action", runs:R("") });
  if(out.length && out[0].type === "dual") out.unshift({ type:"action", runs:R("") });
  return out;
}

function reflowWrappedPlainPaste(lines){
  const out = [];
  const endsSentence = (s) => /[\.\!\?\:]\s*$/.test(s);
  const startsLower = (s) => /^[a-z]/.test((s||"").trim());
  const startsParen = (s) => /^\(/.test((s||"").trim());

  // Heuristic: identify action/narration lines that often follow dialogue without an empty line
  // after PDF paste (e.g., "Her son paws at her leg...", "She crosses...", "The door..." etc.).
  // We use this to avoid "sucking" action into dialogue mode.
  const looksLikeActionNarration = (s) => {
    const t = (s||"").trim();
    if(!t) return false;
    // Sentence case, with lowercase present.
    if(!/^[A-Z]/.test(t) || !/[a-z]/.test(t)) return false;
    // Common narration starters.
    const starters = /^(Her|His|Their|She|He|They|The|A|An|Outside|Inside|In|On|At|Across|Behind|Above|Below)\b/;
    if(!starters.test(t)) return false;
    // Longer and clausey tends to be action, not dialogue.
    if(t.length < 24) return false;
    // Often contains punctuation typical of action prose.
    if(!/[\,\.\;\:—\-]/.test(t)) return false;
    return true;
  };

  for(let i=0;i<lines.length;i++){
    const cur = lines[i];
    const curText = (cur.runs||[]).map(r=>r.t||"").join("");
    const next = lines[i+1];
    const nextText = next ? (next.runs||[]).map(r=>r.t||"").join("") : "";

    // Always keep scene/transition/character as standalone paragraphs.
    if(cur.type === "scene" || cur.type === "transition" || cur.type === "character" || cur.type === "parenthetical"){
      out.push(cur);
      continue;
    }

    // Attempt to merge action/dialogue hard-wrapped lines.
    if((cur.type === "action" || cur.type === "dialogue") && next && next.type === cur.type){
      // If current line likely continues (no terminal punctuation) OR next starts lowercase, merge.
      if(!endsSentence(curText) || startsLower(nextText)){
        // Merge by appending a space + nextText (preserve original as unformatted run)
        const mergedText = (curText.trimEnd() + " " + nextText.trimStart()).replace(/\s+/g, " ");
        // Replace current, skip next
        lines[i+1] = { ...next, type: cur.type, runs:[{t: mergedText,b:false,i:false,u:false,s:false,c:false}] };
        // Don't push current yet; it has been merged into next slot.
        continue;
      }
    }

    // Dialogue often continues across multiple hard-wrapped lines even if next is misclassified as action.
    if(cur.type === "dialogue" && next && next.type === "action" && (startsLower(nextText) || startsParen(nextText))){
      const mergedText = (curText.trimEnd() + " " + nextText.trimStart()).replace(/\s+/g, " ");
      lines[i+1] = { ...next, type: "dialogue", runs:[{t: mergedText,b:false,i:false,u:false,s:false,c:false}] };
      continue;
    }

    out.push(cur);
  }

  // Second pass: rebuild dialogue chaining when characters are detected in a PDF-like paste.
  const chained = [];
  let mode = "action";
  for(const ln of out){
    const txt = (ln.runs||[]).map(r=>r.t||"").join("").trim();
    if(ln.type === "scene" || ln.type === "transition"){
      mode = "action";
      chained.push(ln);
      continue;
    }
    if(ln.type === "character"){
      mode = "dialogue";
      chained.push(ln);
      continue;
    }
    if(ln.type === "parenthetical"){
      mode = "dialogue";
      chained.push(ln);
      continue;
    }
    if(mode === "dialogue" && ln.type === "action" && txt){
      // If we're in dialogue mode, only chain into dialogue when it doesn't look like narration.
      // This prevents action paragraphs after dialogue from being mis-typed when PDF paste
      // removes the separating blank line.
      if(looksLikeActionNarration(txt)){
        mode = "action";
        chained.push(ln);
      } else {
        chained.push({ ...ln, type: "dialogue" });
      }
      continue;
    }
    // Reset mode on blank or clear action paragraphs.
    if(!txt) mode = "action";
    chained.push(ln);
  }

  return chained;
}

// Clean one pasted line: layout comes from the element type, not from spaces/tabs.
// Strip leading/trailing spaces & tabs (PDF/Final Draft copies use them for indents,
// which pushed text past the page margins) and turn non-breaking spaces into normal ones.
function __cleanPastedRuns(runs){
  const out = (runs || []).map(r => ({ ...r, t: String(r.t || "").replace(/[\u00A0\u2007\u202F]/g, " ").replace(/\t/g, " ") }));
  while(out.length && !out[0].t.replace(/^\s+/, "")){ out.shift(); }
  if(out.length) out[0].t = out[0].t.replace(/^\s+/, "");
  while(out.length && !out[out.length-1].t.replace(/\s+$/, "")){ out.pop(); }
  if(out.length) out[out.length-1].t = out[out.length-1].t.replace(/\s+$/, "");
  if(!out.length) out.push({t:"",b:false,i:false,u:false,s:false,c:false});
  return out;
}

function pasteLinesModelAtCaret(lines){
  if(!lines || !lines.length) return;
  lines = lines.map(l => ({ ...l, runs: __cleanPastedRuns(l.runs) }));

  scheduleSnapshot("paste-rich");
  deleteSelectionWordlike();

  const editor = $("#scriptEditor");
  const sel = window.getSelection();
  if(!editor || !sel || sel.rangeCount===0) return;
  let r = sel.getRangeAt(0);

  // Robustness: after Cmd/Ctrl+A (or other broad selections), the browser range can be anchored
  // on the editor root instead of inside a .line. Final Draft/Word still allow paste-replace.
  let line = getActiveLine();
  if(!line){
    line = editor.querySelector(".line") || null;
    if(!line){
      const nl = makeLine("action", [{t:"",b:false,i:false,u:false,s:false,c:false}]);
      editor.innerHTML = "";
      editor.appendChild(nl);
      line = nl;
    }
    // Place caret at the start of this fallback line so locateScriptIndex works.
    try{ placeCaretAtLineIndex(line.dataset.id, 0); }catch(_e){}

  const [leftRuns, rightRuns] = splitRuns(baseRuns, splitIdx);

  // Apply first line into current line
  const first = lines[0];
  if(first && first.type) line.dataset.type = first.type;

  const mergedFirst = mergeRuns(leftRuns, first.runs || [{t:"",b:false,i:false,u:false,s:false,c:false}]);
  line.innerHTML = "";
  line.appendChild(renderRuns(mergedFirst));

  let insertAfter = line;

  // Middle lines become new lines
  for(let i=1;i<lines.length;i++){
    const item = lines[i];
    const isLast = (i === lines.length-1);
    const runs = item.runs || [{t:"",b:false,i:false,u:false,s:false,c:false}];

    if(isLast){
      // Last line gets the rightRuns appended
      const finalRuns = mergeRuns(runs, rightRuns);
      const endLine = makeLine(item.type || (line.dataset.type||"action"), finalRuns);
      insertAfter.parentElement.insertBefore(endLine, insertAfter.nextSibling);
      insertAfter = endLine;

      touched.push(endLine);
      // Caret at end of pasted content (before rightRuns)
      const pastedLen = runsTextLength(runs);

        ? makeLineFromModel({ type:"dual", dual:item.dual })

      insertAfter.parentElement.insertBefore(nl, insertAfter.nextSibling);
      insertAfter = nl;
      touched.push(nl);
    }
  }

  // If only one line pasted, caret should end at end of inserted content within current line
  if(lines.length === 1){
    const pastedLen = runsTextLength(first.runs || []);
    placeCaretAtLineIndex(line.dataset.id, splitIdx + pastedLen);
  }

  // Enforce screenplay boundary spacing (e.g., blank line before CHARACTER, around SCENE).
  for(const ln of touched){
    try{ _applyBoundarySpacing(ln); }catch(_e){}
  }

  normalizeEditorStructure();
  paginateWhenReady_();
      }


  // Paste
  // Paste (rich if available; otherwise screenplay-aware plain text)
$("#scriptEditor").addEventListener("paste", (e) => {
  e.preventDefault();
  const cd = e.clipboardData || window.clipboardData;
  const htmlData = cd ? cd.getData("text/html") : "";
  const plainData = cd ? cd.getData("text/plain") : "";

  let lines = null;

  if(htmlData && /<(p|div|li|br|b|strong|i|em|u|s|strike|span)\b/i.test(htmlData)){

// Copy: keep focus stable (some browsers briefly blur contenteditable after Cmd/Ctrl+C when

// Cut: Word/Final Draft–like behavior across multi-line selections.
// Native cut can sometimes remove structural spacer/anchor nodes when the range is anchored
// on the editor root (common after Cmd/Ctrl+A), which can make the caret "disappear".
$("#scriptEditor").addEventListener("cut", (e) => {

  const sel = window.getSelection();
  if(!editor || !sel || sel.rangeCount===0) return;
  const r = sel.getRangeAt(0);

      editor.appendChild(line);

// Title page placeholder integrity + native undo (Final Draft-style)
// IMPORTANT: Do NOT stomp titleField.textContent on every keystroke — that clears the browser's native undo stack.
// We only "normalize" anchors when necessary, and we prefer undoable edit operations (execCommand) while focused.
const __TITLE_IDS = ["tp_title","tp_writtenby","tp_name","tp_contact"];


  // Title page history (Word-like undo granularity)
  // Native browser undo inside contenteditable can coalesce large chunks. For the title page fields,
  // we snapshot *pre-change* state via beforeinput (capture) and restore it ourselves, which feels
  // closer to Word/Final Draft (smaller, predictable undo steps).
  const __TITLE_HISTORY = new WeakMap();
  const __TITLE_HISTORY_LIMIT = 250;
  let __TITLE_HISTORY_RESTORING = false;

  function __initTitleHistory(el){

    __TITLE_HISTORY.set(el, { undo: [], redo: [], composing: false, compStart: null });

  function __titleGetSelectionOffsets(el){
    try{
      const sel = window.getSelection();
      if(!sel || !sel.rangeCount) return {start:0,end:0};
      const r = sel.getRangeAt(0);
      if(!el.contains(r.commonAncestorContainer)) return {start:0,end:0};

      const pre = r.cloneRange();
      pre.selectNodeContents(el);
      pre.setEnd(r.startContainer, r.startOffset);
      const start = pre.toString().length;

      const pre2 = r.cloneRange();
      pre2.selectNodeContents(el);
      pre2.setEnd(r.endContainer, r.endOffset);
      const end = pre2.toString().length;

      return { start, end };

      return {start:0,end:0};
    }

    const off = __titleGetSelectionOffsets(el);

  function __titleSetSelectionOffsets(el, start, end){
    try{
      if(!el) return;
      const txt = String(el.textContent || "");
      const s = Math.max(0, Math.min(start, txt.length));
      const e = Math.max(0, Math.min(end,   txt.length));
      const a = Math.min(s,e), b = Math.max(s,e);

      // Ensure a text node exists.
      if(!el.firstChild || el.firstChild.nodeType !== 3){
        el.textContent = txt.length ? txt : "\u00A0";
      }

      const locate = (pos) => {
        const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, null);
        let node = null;
        let remaining = pos;
        while((node = walker.nextNode())){

          if(remaining <= len) return { node, offset: remaining };
          remaining -= len;

      };

      const p2 = locate(b);

      const r = document.createRange();

function __ensureTitleAnchor(el){
  if(!el) return;

  if(__TITLE_HISTORY_RESTORING){ el.textContent = " "; return; }

  const raw = String(el.textContent || "");

function __titleRoom(el){
  const lim = __TITLE_LIMITS[el.id] || { max:200, lines:3 };
  const cur = el.dataset.empty === "1" ? "" : __getTitleUserText(el).replace(/\r/g,"");
  const sel = window.getSelection();
  const selTxt = (sel && sel.rangeCount && el.contains(sel.anchorNode)) ? sel.toString() : "";
  const left = Math.max(0, cur.length - selTxt.length);
  const linesUsed = left ? Math.max(1, cur.split("\n").length - (selTxt ? selTxt.split("\n").length - 1 : 0)) : 1;
  return { lim, chars: Math.max(0, lim.max - left), lines: Math.max(0, lim.lines - linesUsed) };
}

    const r = __titleRoom(el);
    if(t === "insertParagraph" || t === "insertLineBreak"){ if(r.lines < 1) e.preventDefault(); return; }
    const add = String(e.data || "");
    if(add.length > r.chars) e.preventDefault();

    e.preventDefault();

    let txt = String((e.clipboardData || window.clipboardData).getData("text/plain") || "")
      .replace(/\r/g,"").replace(/\t/g," ").replace(/[ \u00A0]+/g," ")
      .replace(/[\u200B\u200C\u200D\uFEFF]/g,"");
    const parts = txt.split("\n").map(x => x.trim()).filter(Boolean);
    txt = r.lim.lines === 1 ? parts.join(" ") : parts.slice(0, r.lines + 1).join("\n");
    txt = txt.slice(0, r.chars);
    if(!txt) return;
    __titleInternal(() => {
      if(el.dataset.empty === "1"){

        if(!__deleteAllInElUndoable(el)) el.textContent = "";
      }
      if(!__insertTextUndoable(txt)) el.textContent = (el.textContent || "") + txt;
    });
    __syncTitleEmptyState(el, { duringInput:false });
  });

  function jsonpGet_(endpoint, params={}, timeoutMs=20000){
    return new Promise((resolve, reject)=>{
      const cb = "cb_" + Date.now() + "_" + Math.random().toString(16).slice(2);
      const qs = new URLSearchParams(Object.assign({}, params, { callback: cb, _: String(Date.now()) }));
      const src = endpoint + (endpoint.includes("?") ? "&" : "?") + qs.toString();

      const s = document.createElement("script");
      s.async = true;

      let done = false;
      const t = setTimeout(()=>{
        if(done) return;
        done = true;
        cleanup();
        reject(new Error("JSONP timeout"));
      }, timeoutMs);

      function cleanup(){
        clearTimeout(t);
        try{ delete window[cb]; }catch(_e){ window[cb] = undefined; }
        if(s.parentNode) s.parentNode.removeChild(s);
      }

      window[cb] = (data)=>{
        if(done) return;
        done = true;
        cleanup();
        resolve(data);
      };

      s.onerror = ()=>{
        if(done) return;
        done = true;
        cleanup();
        reject(new Error("JSONP load error"));
      };

      s.src = src;
      document.head.appendChild(s);
    });
  }

    } finally {

function xdrPost_(endpoint, payloadObj, timeoutMs=20000) {
  return new Promise((resolve, reject) => {
    let iframeDone = false;
    let fetchFired = false;
    
    const iframe = document.createElement("iframe");
    iframe.name = "gas_sink_" + Date.now() + "_" + Math.random().toString(16).slice(2);

    form.method = "POST";
    form.action = endpoint;
    form.target = iframe.name;
    form.style.display = "none";
    
    const input = document.createElement("input");
    input.type = "hidden";
    input.name = "payload";
    input.value = JSON.stringify(payloadObj || {});
    form.appendChild(input);
    document.body.appendChild(form);
    
    const cleanup = () => {
      try { window.removeEventListener("message", onMessage); } catch(_e) {}
      try { if(form.parentNode) form.parentNode.removeChild(form); } catch(_e) {}
      try { if(iframe.parentNode) iframe.parentNode.removeChild(iframe); } catch(_e) {}
    };
    
    const onMessage = (ev) => {
      if (!ev.origin || !ev.origin.includes("script.google.com")) return;
      const data = ev.data;
      if (!data || typeof data !== "object") return;
      
      if (iframeDone) return;
      iframeDone = true;
      clearTimeout(fallbackTimer);
      clearTimeout(hardTimer);
      cleanup();
      
     if (data.ok) {
  // Update cache after successful save
  if (data.fileId) {
    try {
      const cacheKey = 'SCRIPTY:' + data.fileId;
      const currentDoc = serializeDocFromDOM();
      sessionStorage.setItem(cacheKey, JSON.stringify(currentDoc));
    } catch(_e) {}
  }
  resolve(data);
} else {
  reject(new Error(data.error || "Save failed"));
}
    };
    
    window.addEventListener("message", onMessage);
    form.submit();
    
    const fallbackTimer = setTimeout(() => {
      if (iframeDone || fetchFired) return;
      fetchFired = true;
      
      console.warn("[xdrPost] No postMessage after 3s (Firefox?), falling back to fetch POST");
      
      fetch(endpoint, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payloadObj),
        cache: "no-store"
      })
      .then(r => r.json())
      .then(data => {
        if (iframeDone) return;
        iframeDone = true;
        clearTimeout(hardTimer);
        cleanup();
        
        if (data.ok) {
  // Update cache after successful save

      sessionStorage.setItem(cacheKey, JSON.stringify(currentDoc));
    } catch(_e) {}
  }
  resolve(data);
} else {
  reject(new Error(data.error || "Save failed"));
}
      })
      .catch(err => {
        if (iframeDone) return;
        console.warn("[xdrPost] Fetch fallback failed:", err);
      });
    }, 3000);
    
    const hardTimer = setTimeout(() => {
      if (iframeDone) return;
      iframeDone = true;
      cleanup();
      reject(new Error("Save timeout (iframe blocked, fetch failed)"));
    }, timeoutMs);
  });
}

  const LAST_LIST_KEY = "SCRIPTY_LAST_LIST_V1"; // written by index.html
  function _nextUntitledFromList_(arr){
    // Finds the smallest available number (accounts for deletions).
    // Accepts file objects {name} or raw name strings.
    const used = new Set();
    let hasPlainUntitled = false;

    const take = (nm)=>{
      const s = String(nm||"").replace(/\.json$/i,"").trim();
      if(!s) return;
      if(/^untitled$/i.test(s)){ hasPlainUntitled = true; return; }
      const m = s.match(/^untitled\s*script\s*(\d+)\s*$/i);
      if(m){
        const n = parseInt(m[1], 10);
        if(Number.isFinite(n) && n > 0) used.add(n);
        return;
      }
      // Legacy variants like "Untitled 3"
      const m2 = s.match(/^untitled\s*(\d+)\s*$/i);
      if(m2){
        const n = parseInt(m2[1], 10);
        if(Number.isFinite(n) && n > 0) used.add(n);
        return;
      }
    };

    try{
      (arr||[]).forEach(it=>{
        if(typeof it === "string") take(it);
        else if(it && typeof it === "object") take(it.name || it.title || it.filename);
      });
    }catch(_e){}

    // If there is a plain "Untitled", treat it as occupying #1
    if(hasPlainUntitled) used.add(1);

    let n = 1;
    while(used.has(n) && n < 10000) n++;
    return n;
  }

  // Big saves go gzip-compressed (about 8x smaller to upload) once the server says it can read them
  async function __gzipB64(text){
    const cs = new CompressionStream("gzip");
    const buf = await new Response(new Blob([text]).stream().pipeThrough(cs)).arrayBuffer();
    const bytes = new Uint8Array(buf);
    let bin = "";
    for(let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    return btoa(bin);
  }
  async function __saveBody(payload){

    try{
      const rest = Object.assign({}, payload || {}); const action = rest.action; delete rest.action;
      const gz = await __gzipB64(JSON.stringify(rest));
      return gz.length < plain.length ? JSON.stringify({ key: getCloudKey(), action, gz }) : plain;
    }catch(_e){ return plain; }
  }

function buildPrintRoot(){
  const printRoot = document.getElementById("printRoot");
  const editor = document.getElementById("scriptEditor");
  const pagesLayer = document.getElementById("pagesLayer");
  const titlePage = document.getElementById("titlePage");
  if(!printRoot || !editor) return;

  // Clear
  printRoot.innerHTML = "";

  // Title page clone (non-editable) — preserve inline formatting (bold/italic/underline/spans)
  if(titlePage){
    const t = document.createElement("div");
    t.className = "printTitle printPaper";

    // IMPORTANT:
    // - Title fields are contenteditable and may contain inline markup (e.g. <span style="font-style:italic">)
    // - Using innerText would strip that markup and cause export/print mismatches.
    // - We also suppress placeholder/NBSP padding when a field is visually empty.
    const getFieldHTML = (id) => {
      const el = document.getElementById(id);
      if(!el) return "";
      if(el.getAttribute("data-empty") === "1") return "";
      // Some fields keep a NBSP so the caret can sit on an "empty" line.
      // Remove a pure-NBSP payload so it doesn't print as a blank glyph box.
      const html = (el.innerHTML ?? "");
      const text = (el.innerText ?? "").replace(/[\u00A0\s]+/g, "");
      if(text.length === 0) return "";
      return html;
    };

    t.innerHTML = `
      <div class="printTitleContent">
        <div class="printTitleField title"></div>
        <div class="printTitleField writtenby"></div>
        <div class="printTitleField name"></div>
        <div class="printContact"></div>
      </div>`;

    t.querySelector(".printTitleField.title").innerHTML = getFieldHTML("tp_title");
    t.querySelector(".printTitleField.writtenby").innerHTML = getFieldHTML("tp_writtenby");
    t.querySelector(".printTitleField.name").innerHTML = getFieldHTML("tp_name");
    t.querySelector(".printContact").innerHTML = getFieldHTML("tp_contact");

    try{
      const tpd = document.getElementById("tpDraft");
      if(tpd && !tpd.hidden && tpd.textContent.trim()){
        const dd = document.createElement("div"); dd.className = "printTpDraft"; dd.textContent = tpd.textContent;
        t.appendChild(dd);
      }
    }catch(_e){}
    try{ if(__WM.on && __WM.titlePage) t.insertAdjacentHTML("beforeend", __wmLayerHTML()); }catch(_e){}
    printRoot.appendChild(t);
  }

  // Group editor children into pages using between-spacers as delimiters
  const kids = Array.from(editor.children);
  const pages = [];
  let cur = [];

  const pushIfNonEmpty = (arr) => {
    if(arr.length) pages.push(arr);
  };

  for(const el of kids){
    if(el.classList.contains("pageSpacer")){
      const kind = el.getAttribute("data-kind");
      if(kind === "top"){
        // ignore (top margin spacer)
        continue;
      }
      if(kind === "between"){
        // delimiter between pages
        pushIfNonEmpty(cur);
        cur = [];
        continue;
      }
      if(kind === "more" || kind === "contd"){ cur.push(el); continue; }
      continue;
    }
    if(el.classList.contains("line")){
      cur.push(el);
    }
  }
  pushIfNonEmpty(cur);

  // If editor is completely empty, still print a single blank script page
  if(pages.length === 0){
    pages.push([]);
  }

  // Some documents can accumulate a "visually empty" first script page (e.g. leading blank line
  // blocks used for spacing). In print/PDF this becomes a random blank page between the title
  // page and the first writing page. Trim ONLY leading empty pages; keep intentional blanks later.
  // Normalize any text down to what would register as "ink" on the page.
  // We aggressively strip/neutralize invisible formatting chars that frequently
  // sneak in via contenteditable / copy-paste (NBSP, zero-width, soft hyphen,
  // bidi controls, various Unicode "format" chars, etc.).
  const normalizeVisibleText = (s) => {
    let out = String(s ?? "");
    // 1) Remove common invisible/format characters explicitly
    out = out.replace(/[\u00A0\u00AD\u034F\u061C\u180E\u200B-\u200F\u202A-\u202E\u2060-\u206F\uFEFF]/g, " ");
    // 2) Remove any remaining Unicode "format" chars (Cf) and space separators (Zs)
    //    (Property escapes supported in modern browsers; fallback keeps prior behavior)
    try{
      out = out.replace(/[\p{Cf}\p{Zs}]/gu, " ");
    }catch(e){ /* ignore */ }
    // 3) Collapse whitespace
    out = out.replace(/\s+/g, " ").trim();
    return out;
  };

  const isVisuallyEmptyPage = (lineEls) => {
    if(!lineEls || lineEls.length === 0) return true;
    for(const el of lineEls){
      // innerText is closer to what the user sees than textContent (handles <br> etc.)
      const t = normalizeVisibleText(el.innerText ?? "");
      if(t.length) return false;

      // If a line contains any non-text renderable content, treat as non-empty.
      if(el.querySelector && el.querySelector("img,svg,canvas")) return false;
    }
    return true;
  };

  while(pages.length > 1 && isVisuallyEmptyPage(pages[0])){
    pages.shift();
  }

// Build print pages
  pages.forEach((lineEls, i) => {
    const page = document.createElement("div");
    page.className = "printPage printPaper";

    // Page numbers: no number on first script page
    if(i > 0){
      const pn = document.createElement("div");
      pn.className = "printPageNumber";
      pn.textContent = (i+1) + ".";
      page.appendChild(pn);
    }

    try{
      const pd = document.querySelector("#pagesLayer .pageDraft");
      if(pd && pd.textContent.trim()){
        const dd = document.createElement("div"); dd.className = "printDraft"; dd.textContent = pd.textContent;
        page.appendChild(dd);
      }
    }catch(_e){}

    try{ if(__WM.on) page.insertAdjacentHTML("beforeend", __wmLayerHTML()); }catch(_e){}

    const content = document.createElement("div");
    content.className = "printContent";

    for(const lineEl of lineEls){
      const clone = lineEl.cloneNode(true);
      clone.removeAttribute("contenteditable");
      content.appendChild(clone);
    }

    page.appendChild(content);
    printRoot.appendChild(page);
  });
}

// Builds a real PDF straight from what's on screen: same pages, same line breaks,
// (MORE)/(CONT'D), page numbers, scene numbers, title page. Uses the standard PDF
// Courier font (same letter widths as Courier Prime), so nothing can shift.
const __PDF_WINANSI = {0x20AC:0x80,0x201A:0x82,0x0192:0x83,0x201E:0x84,0x2026:0x85,0x2020:0x86,0x2021:0x87,0x02C6:0x88,0x2030:0x89,0x0160:0x8A,0x2039:0x8B,0x0152:0x8C,0x017D:0x8E,0x2018:0x91,0x2019:0x92,0x201C:0x93,0x201D:0x94,0x2022:0x95,0x2013:0x96,0x2014:0x97,0x02DC:0x98,0x2122:0x99,0x0161:0x9A,0x203A:0x9B,0x0153:0x9C,0x017E:0x9E,0x0178:0x9F};
function __pdfHex(str){
  let out = "";
  for(const ch of String(str)){
    let c = ch.codePointAt(0);
    if(c === 0x2212 || c === 0x2010 || c === 0x2011) c = 0x2D;
    else if(c === 0x00A0 || c === 0x2007 || c === 0x202F) c = 0x20;
    let b;
    if(c >= 0x20 && c < 0x7F) b = c;
    else if(c >= 0xA0 && c <= 0xFF) b = c;
    else if(__PDF_WINANSI[c] != null) b = __PDF_WINANSI[c];
    else b = 0x3F; // "?"
    out += (b < 16 ? "0" : "") + b.toString(16);
  }
  return "<" + out + ">";
}
const __pdfNum = (n) => (Math.round(n * 100) / 100).toString();

function __pdfCollectTextNodes(rootEl, skip){
  const out = [];
  const w = document.createTreeWalker(rootEl, NodeFilter.SHOW_TEXT, {
    acceptNode(n){
      if(!n.nodeValue || !n.nodeValue.length) return NodeFilter.FILTER_REJECT;
      const p = n.parentElement;
      if(!p) return NodeFilter.FILTER_REJECT;
      if(skip && skip(p)) return NodeFilter.FILTER_REJECT;
      return NodeFilter.FILTER_ACCEPT;
    }
  });
  let n; while((n = w.nextNode())) out.push(n);
  return out;
}

function __pdfStyleOf(el, stopEl){
  const cs = getComputedStyle(el);
  const bold = (parseInt(cs.fontWeight, 10) || 400) >= 600;
  const italic = cs.fontStyle === "italic" || cs.fontStyle.startsWith("oblique");
  let underline = false, strike = false;
  for(let a = el; a && a.nodeType === 1; a = a.parentElement){
    const d = getComputedStyle(a).textDecorationLine || "";
    if(d.includes("underline")) underline = true;
    if(d.includes("line-through")) strike = true;
    if(a === stopEl) break;
  }
  const upper = cs.textTransform === "uppercase";
  const hidden = cs.visibility === "hidden" || cs.display === "none" || parseFloat(cs.opacity) === 0;
  return { bold, italic, underline, strike, upper, hidden, font: cs.font, sizePx: (parseFloat(cs.fontSize) || 16) * __pdfViewK };
}

// Pages can be shown scaled down to fit the window (CSS transform on #paperArea). Positions read from
// the screen are already scaled, but font sizes from getComputedStyle are not, so scale those to match.
let __pdfViewK = 1;
function __pdfViewScale(){
  const pa = document.getElementById("paperArea");
  if(!pa || !pa.offsetWidth) return 1;
  const k = pa.getBoundingClientRect().width / pa.offsetWidth;
  return (k > 0.05 && k < 20) ? k : 1;
}
const __pdfDescentCache = {};   // unscaled px, per font
function __pdfDescentPx(font, sizePx){
  if(__pdfDescentCache[font] == null){
    let d = (sizePx / __pdfViewK) * 0.2;
    try{
      const c = document.createElement("canvas").getContext("2d");
      c.font = font;
      const m = c.measureText("Hg");
      if(m && m.fontBoundingBoxDescent > 0) d = m.fontBoundingBoxDescent;
    }catch(_e){}
    __pdfDescentCache[font] = d;
  }
  return __pdfDescentCache[font] * __pdfViewK;
}

// Turn one text node into positioned runs: [{x, baseline, text, style}] in page px.
function __pdfRunsFromTextNode(node, stopEl){
  const st = __pdfStyleOf(node.parentElement, stopEl);
  if(st.hidden) return [];
  const text = node.nodeValue;
  const range = document.createRange();
  const desc = __pdfDescentPx(st.font, st.sizePx);
  if(!/[\t\r\n]/.test(text)){
    const fast = __pdfRunsFast(node, text, range, st, desc);
    if(fast) return fast;
  }
  const runs = [];
  let cur = null;
  const flush = () => {
    if(cur){
      const t = cur.text.replace(/\s+$/, "");
      if(t.trim().length) runs.push({ ...cur, text: st.upper ? t.toUpperCase() : t });
    }
    cur = null;
  };
  let i = 0;
  for(const ch of text){
    const len = ch.length;
    range.setStart(node, i); range.setEnd(node, i + len);
    i += len;
    if(ch === "\n" || ch === "\t" || ch === "\r"){ flush(); continue; }
    const rs = range.getClientRects();
    const r = rs.length ? rs[rs.length - 1] : null;
    if(!r || r.width < 0.1){ flush(); continue; }
    if(cur && Math.abs(r.bottom - cur.bottom) < 2 && Math.abs(r.left - cur.nextX) < 1.5){
      cur.text += ch; cur.nextX = r.right; if(!/\s/.test(ch)) cur.endX = r.right; continue;
    }
    flush();
    if(/\s/.test(ch)) continue; // never start a run with a space
    cur = { x: r.left, bottom: r.bottom, baseline: r.bottom - desc, nextX: r.right, endX: r.right, text: ch, style: st };
  }
  flush();
  return runs;
}

// Fast path: find each visual row with a binary search instead of measuring every letter.
function __pdfRunsFast(node, text, range, st, desc){
  const N = text.length;
  const rectAt = (i) => {
    range.setStart(node, i); range.setEnd(node, i + 1);
    const rs = range.getClientRects();
    return rs.length ? rs[rs.length - 1] : null;
  };
  const runs = [];
  let start = 0;
  let guard = 0;
  while(start < N && guard++ < 10000){
    // skip spaces that hang at a row start
    while(start < N && /\s/.test(text[start])) start++;
    if(start >= N) break;
    const r0 = rectAt(start);
    if(!r0 || r0.width < 0.1) return null;
    const rowBottom = r0.bottom;
    // first index after start that sits on a lower row
    let lo = start + 1, hi = N;
    while(lo < hi){
      let mid = (lo + hi) >> 1;
      const c = text.charCodeAt(mid);
      if(c >= 0xDC00 && c <= 0xDFFF && mid > start + 1) mid--; // don't split emoji pairs
      const r = rectAt(mid);
      if(!r) return null;
      if(r.bottom > rowBottom + 2) hi = mid; else lo = mid + 1;
    }
    const rowText = text.slice(start, lo).replace(/\s+$/, "");
    if(rowText.length){
      const lastIdx = start + rowText.length - 1;
      const rl = rectAt(lastIdx);
      if(!rl || rl.bottom > rowBottom + 2 || rl.bottom < rowBottom - 2) return null;
      runs.push({ x: r0.left, bottom: rowBottom, baseline: rowBottom - desc, nextX: rl.right, endX: rl.right, text: st.upper ? rowText.toUpperCase() : rowText, style: st });
    }
    start = lo;
  }
  return runs;
}

async function __pdfDeflate(bytes){

    const buf = await new Response(new Blob([bytes]).stream().pipeThrough(cs)).arrayBuffer();

}

  const fontNames = ["Courier","Courier-Bold","Courier-Oblique","Courier-BoldOblique","Helvetica-Bold"];
  const nFontStart = 3;
  const nPagesStart = nFontStart + fontNames.length; // page objs, then content objs
  const nGs = nPagesStart + pages.length * 2;
  // Photocopy extras: ink font (3 objects), grain image (2 objects), transparency states
  const alphaList = pc && pc.alphas ? Array.from(pc.alphas).sort((a, b) => a - b) : [];

  const nInkFont = (pc && pc.ink) ? nNext : 0; if(nInkFont) nNext += 3;
  const nGrain = (pc && pc.grain) ? nNext : 0; if(nGrain) nNext += 2;
  const nAlpha0 = nNext; nNext += alphaList.length;
  const nInfo = nNext;
  const kids = pages.map((_, i) => `${nPagesStart + i * 2} 0 R`).join(" ");

  const writeObj = (num, body) => { offsets[num] = offset; push(`${num} 0 obj\n`); for(const b of [].concat(body)) push(b); push("\nendobj\n"); };

  writeObj(1, `<< /Type /Catalog /Pages 2 0 R >>`);
  writeObj(2, `<< /Type /Pages /Kids [${kids}] /Count ${pages.length} /MediaBox [0 0 ${__pdfNum(wPt)} ${__pdfNum(hPt)}] >>`);
  fontNames.forEach((fn, k) => writeObj(nFontStart + k, `<< /Type /Font /Subtype /Type1 /BaseFont /${fn} /Encoding /WinAnsiEncoding >>`));
  const fontRes = fontNames.map((_, k) => `/F${k + 1} ${nFontStart + k} 0 R`).join(" ") + (nInkFont ? ` /F6 ${nInkFont} 0 R` : "");
  const gsRes = `/GSwm ${nGs} 0 R` + alphaList.map((n, i) => ` /Ga${n} ${nAlpha0 + i} 0 R`).join("");
  const xoRes = nGrain ? ` /XObject << /PcGrain ${nGrain} 0 R >>` : "";

  for(let i = 0; i < pages.length; i++){
    const pNum = nPagesStart + i * 2, cNum = pNum + 1;

    const raw = enc.encode(pages[i].ops);
    const z = await __pdfDeflate(raw);
    if(z) writeObj(cNum, [`<< /Length ${z.length} /Filter /FlateDecode >>\nstream\n`, z, `\nendstream`]);
    else writeObj(cNum, [`<< /Length ${raw.length} >>\nstream\n`, raw, `\nendstream`]);
  }
  const op = Math.max(0.02, Math.min(1, (Number(__WM.opacity) || 15) / 100));
  writeObj(nGs, `<< /Type /ExtGState /ca ${op.toFixed(3)} /CA ${op.toFixed(3)} >>`);
  if(nInkFont){
    const ttf = pc.ink, z = await __pdfDeflate(ttf), name = pc.inkName || "ScriptYInk";
    const widths = new Array(224).fill(600).join(" ");
    writeObj(nInkFont, `<< /Type /Font /Subtype /TrueType /BaseFont /${name} /FirstChar 32 /LastChar 255 /Widths [${widths}] /Encoding /WinAnsiEncoding /FontDescriptor ${nInkFont + 1} 0 R >>`);
    writeObj(nInkFont + 1, `<< /Type /FontDescriptor /FontName /${name} /Flags 34 /FontBBox [-410 -300 680 940] /ItalicAngle 0 /Ascent 781 /Descent -342 /CapHeight 580 /StemV 90 /FontFile2 ${nInkFont + 2} 0 R >>`);
    if(z) writeObj(nInkFont + 2, [`<< /Length ${z.length} /Length1 ${ttf.length} /Filter /FlateDecode >>\nstream\n`, z, `\nendstream`]);
    else writeObj(nInkFont + 2, [`<< /Length ${ttf.length} /Length1 ${ttf.length} >>\nstream\n`, ttf, `\nendstream`]);
  }
  if(nGrain){
    const N = pc.grain.size, black = new Uint8Array(N * N);

                                    : [`<< /Type /XObject /Subtype /Image /Width ${N} /Height ${N} /ColorSpace /DeviceGray /BitsPerComponent 8 /Length ${data.length}${extra} >>\nstream\n`, data, `\nendstream`];
    writeObj(nGrain, img(black, zb, ` /SMask ${nGrain + 1} 0 R`));
