<!-- ---------- Menu polish: shortcut hints, Storyboard link, Library shortcut, Keyboard Shortcuts sheet ---------- -->
<style>
  .item .kbd{ margin-left:auto; padding-left:18px; font-weight:500; font-size:12px; color:var(--uiMuted); letter-spacing:.02em; white-space:nowrap; }
  .item.hasKbd{ display:flex; align-items:center; }
  .item.itemToggle .kbd{ margin-left:auto; padding-left:12px; }

  .kbSheet{ display:grid; grid-template-columns: 1fr 1fr; gap:4px 28px; margin-top:14px; }
  .kbSheet h4{ grid-column:1 / -1; margin:14px 0 4px; font-size:11.5px; letter-spacing:.06em; text-transform:uppercase; color:rgba(255,255,255,.5); font-weight:600; }
  .kbSheet h4:first-child{ margin-top:0; }
  .kbRow{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:5px 0; border-bottom:1px solid rgba(255,255,255,.06); font-size:13px; }
  .kbRow kbd{ font:600 11.5px/1 Inter,system-ui,sans-serif; padding:4px 7px; border-radius:6px; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.14); white-space:nowrap; }
  @media (max-width: 620px){ .kbSheet{ grid-template-columns: 1fr; } }
  @media (hover: none) and (pointer: coarse){ .item .kbd{ display:none; } }
</style>
<script>
(function(){
  "use strict";
  const isMac = /mac|iphone|ipad/i.test(navigator.platform || navigator.userAgent || "");
  const K = (combo) => isMac
    ? combo.replace(/Shift\+/g, "⇧").replace(/Alt\+/g, "⌥").replace(/Mod\+/g, "⌘")
    : combo.replace(/Mod\+/g, "Ctrl+");
  const HINTS = {
    mSave: "Mod+S", mPrint: "Mod+P", mUndo: "Mod+Z", mRedo: isMac ? "Shift+Mod+Z" : "Mod+Y",
    mCut: "Mod+X", mCopy: "Mod+C", mPaste: "Mod+V", mSelectAll: "Mod+A", mFind: "Mod+F",
    mAddComment: isMac ? "Alt+Mod+M" : "Mod+Alt+M", mBold: "Mod+B", mItalic: "Mod+I", mUnderline: "Mod+U",
    mToggleNotes: "Mod+\\", mShortcuts: "Mod+/"
  };
  for(const id of Object.keys(HINTS)){
    const el = document.getElementById(id); if(!el || el.querySelector(".kbd")) continue;
    const k = document.createElement("span"); k.className = "kbd"; k.textContent = K(HINTS[id]); k.setAttribute("aria-hidden", "true");
    const tick = el.querySelector(".tick");
    if(tick) el.insertBefore(k, tick); else { el.classList.add("hasKbd"); el.appendChild(k); }
    el.setAttribute("aria-keyshortcuts", HINTS[id].replace(/Mod/g, isMac ? "Meta" : "Control"));
  }
  // Line-type buttons: show their shortcut on hover
  const TYPE_KEYS = { scene: "1", action: "2", character: "3", dialogue: "4", parenthetical: "5", transition: "6" };
  document.querySelectorAll('#typeButtons .pill[data-type]').forEach(b => {
    const n = TYPE_KEYS[b.dataset.type];
    b.title = b.textContent.trim() + (n ? " (" + K("Mod+" + n) + ")" : b.dataset.type === "dual" ? "" : "");
  });
  document.querySelectorAll('#inlineButtons .pill').forEach(b => {
    const m = { bBtn: "Mod+B", iBtn: "Mod+I", uBtn: "Mod+U" }[b.id];
    if(m) b.title = b.getAttribute("aria-label") + " (" + K(m) + ")";
  });

  // ---- Where things live ----
  function cloud(){ try{ return (window.__scriptyCloudInfo && window.__scriptyCloudInfo()) || {}; }catch(_e){ return {}; } }
  window.__storyboardHref = function(){
    const c = cloud(); const qs = new URLSearchParams(location.search);
    const p = new URLSearchParams();
    const id = c.fileId || qs.get("fileId") || "";
    if(id) p.set("fileId", id);
    const nm = c.name || qs.get("name"); if(nm) p.set("name", nm);
    const ep = c.endpoint || qs.get("cloud"); if(ep) p.set("cloud", ep);
    const hub = qs.get("hub"); if(hub) p.set("hub", hub);
    return "storyboard.html" + (p.toString() ? "?" + p.toString() : "");
  };
  function flash(msg){
    const t = document.getElementById("saveToast"), m = document.getElementById("saveToastMsg");
    if(t && m){ m.textContent = msg; t.classList.add("show", "err"); clearTimeout(flash._t); flash._t = setTimeout(() => t.classList.remove("show", "err"), 3800); }
    else alert(msg);
  }
  function goStoryboard(){
    try{ window.closeMenus && window.closeMenus(); }catch(_e){}
    const c = cloud();
    if(!c.fileId && !new URLSearchParams(location.search).get("fileId")){
      flash("Save this script to Drive first — the Storyboard opens from a saved script."); return;
    }
    location.href = window.__storyboardHref();
  }
  document.getElementById("mStoryboard")?.addEventListener("click", goStoryboard);
  document.getElementById("mTreatment")?.addEventListener("click", () => {
    try{ window.closeMenus && window.closeMenus(); }catch(_e){}
    const c = cloud();
    if(!c.fileId && !new URLSearchParams(location.search).get("fileId")){
      flash("Save this script to Drive first — the Treatment opens from a saved script."); return;
    }
    location.href = window.__storyboardHref().replace("storyboard.html", "treatment.html");
  });

  // ---- Keyboard Shortcuts sheet ----
  const SHEET = [
    ["Writing", [["New line of the next type", "Enter"], ["Change this line's type", "Tab / Shift+Tab"], ["Jump to a new Character line", "Shift+Enter"],
      ["Scene Heading", "Mod+1"], ["Action", "Mod+2"], ["Character", "Mod+3"], ["Dialogue", "Mod+4"], ["Parenthetical", "Mod+5"], ["Transition", "Mod+6"]]],
    ["Editing", [["Undo", "Mod+Z"], ["Redo", isMac ? "Shift+Mod+Z" : "Mod+Y"], ["Bold", "Mod+B"], ["Italic", "Mod+I"], ["Underline", "Mod+U"], ["Find & Replace", "Mod+F"], ["Add a comment", isMac ? "Alt+Mod+M" : "Mod+Alt+M"]]],
    ["Script", [["Save now", "Mod+S"], ["Print", "Mod+P"], ["Switch Script / Notes", "Mod+\\"], ["This list", "Mod+/"]]]
  ];
  function openShortcuts(){
    try{ window.closeMenus && window.closeMenus(); }catch(_e){}
    if(document.getElementById("kbShade")) return;
    const shade = document.createElement("div");
    shade.className = "wmShade"; shade.id = "kbShade";
    const rows = SHEET.map(([h, list]) => `<h4>${h}</h4>` + list.map(([a, k]) => `<div class="kbRow"><span>${a}</span><kbd>${K(k)}</kbd></div>`).join("")).join("");
    shade.innerHTML = `<div class="wmBox" role="dialog" aria-modal="true" aria-label="Keyboard shortcuts" style="width:min(640px,100%)">
      <div class="wmHead"><b>Keyboard shortcuts</b><span>Final Draft-style: Enter and Tab do most of the formatting for you.</span></div>
      <div class="kbSheet">${rows}</div>
      <div class="wmActs"><button type="button" class="primary" data-a="close">Done</button></div></div>`;
    const prev = document.activeElement;
    const close = () => { shade.remove(); try{ prev && prev.focus && prev.focus({ preventScroll: true }); }catch(_e){} };
    shade.addEventListener("mousedown", (e) => { if(e.target === shade) close(); });
    shade.addEventListener("keydown", (e) => { e.stopPropagation(); if(e.key === "Escape" || e.key === "Enter"){ e.preventDefault(); close(); } });
    shade.querySelector('[data-a="close"]').onclick = close;
    document.body.appendChild(shade);
    setTimeout(() => shade.querySelector('[data-a="close"]').focus(), 20);
  }
  document.getElementById("mShortcuts")?.addEventListener("click", openShortcuts);

  // ---- Dialogs: keyboard focus moves into a dialog when it opens, and Escape always closes the top one ----
  // (Some dialogs only listened for Escape while focus was already inside them, which it often wasn't.)
  const isDlg = (el) => el && el.matches && el.matches('[role="dialog"]') && el.id !== "findPanel";
  const visible = (el) => !!(el && el.offsetParent !== null && getComputedStyle(el).visibility !== "hidden");
  function topDialog(){ const all = [...document.querySelectorAll('body > * [role="dialog"], body > [role="dialog"]')].filter((d) => isDlg(d) && visible(d)); return all[all.length - 1] || null; }
  new MutationObserver((muts) => {
    for(const m of muts) for(const n of m.addedNodes){
      if(n.nodeType !== 1) continue;
      const d = isDlg(n) ? n : n.querySelector && n.querySelector('[role="dialog"]');
      if(!isDlg(d)) continue;
      setTimeout(() => {
        if(!d.isConnected || d.contains(document.activeElement)) return;
        const t = d.querySelector('input:not([type=hidden]):not([disabled]), textarea, select') || d.querySelector("button.primary, .primary") || d.querySelector("button");
        if(t){ try{ t.focus({ preventScroll: true }); }catch(_e){} }
        else { d.tabIndex = -1; try{ d.focus({ preventScroll: true }); }catch(_e){} }
      }, 80);
    }
  }).observe(document.body, { childList: true });
  document.addEventListener("keydown", (e) => {
    if(e.key !== "Escape" || e.defaultPrevented) return;
    const d = topDialog();
    if(!d || d.contains(e.target)) return;
    e.preventDefault();
    d.dispatchEvent(new KeyboardEvent("keydown", { key: "Escape", code: "Escape", bubbles: true, cancelable: true }));
  });

  document.addEventListener("keydown", (e) => {
    const mod = e.metaKey || e.ctrlKey;
    if(!mod || e.altKey) return;
    if(e.key === "/" || e.code === "Slash"){ e.preventDefault(); openShortcuts(); return; }
    // Ctrl/Cmd+P prints the formatted script (not a screenshot of the editor)
    if(!e.shiftKey && String(e.key || "").toLowerCase() === "p"){
      if(document.body.classList.contains("notesMode")) return;
      e.preventDefault(); document.getElementById("printBtn")?.click();
    }
  }, true);
})();
</script>

<script>
/* ---------- Camp banner: menu, sign out, email chip, back to the hub ---------- */
(function(){
  const Camp = window.Camp || window.camp;
  const cloudParam = (Camp && Camp.cloudParam) ? Camp.cloudParam : () => "";
  const qs = new URLSearchParams(location.search);
  const docKey = qs.get("pid") || qs.get("fileId") || qs.get("id") || "";

  // Hamburger menu (phones)
  const menu = document.getElementById("navMenu"), menuBtn = document.getElementById("menuBtn");
  if(menuBtn && menu){
    menuBtn.onclick = (e) => { e.stopPropagation(); const on = menu.classList.toggle("show"); menuBtn.setAttribute("aria-expanded", on ? "true" : "false"); };
    document.addEventListener("click", (e) => { if(!e.target.closest("#navMenu")){ menu.classList.remove("show"); menuBtn.setAttribute("aria-expanded", "false"); } });
  }

  // Sign out: Camp's own helper if it has one, otherwise Firebase, then back to the Library
  const so = document.getElementById("signOutBtn");
  if(so) so.onclick = async () => {
    try{
      if(Camp && typeof Camp.signOut === "function") await Camp.signOut();
      else if(window.firebase && window.firebase.apps && window.firebase.apps.length) await window.firebase.auth().signOut();
    }catch(_e){}
    location.href = "index.html";
  };

  // Email chip (filled in when the script loads)
  window.setUserChip = (email) => { const c = document.getElementById("userChip"); if(!c) return; c.textContent = email || ""; c.title = c.textContent; };
  if(window.__scriptyMe && window.__scriptyMe.email) window.setUserChip(window.__scriptyMe.email);

  // Back: always to the hub when the script belongs to a project (on the Scripts section),
  // otherwise to the page you came from, otherwise the Library. Survives reloads.
  const HUB_TAB = "scripts";
  const back = document.getElementById("backLink"), mnLib = document.getElementById("mnLib");
  const BK = "Camp_BACK:" + location.pathname + ":" + docKey;
  let came = "";
  try{
    const ref = document.referrer || "";
    if(ref && ref.indexOf(location.origin) === 0 && ref.split("?")[0] !== location.href.split("?")[0]) sessionStorage.setItem(BK, ref);
    came = sessionStorage.getItem(BK) || "";
  }catch(_e){}
  const hub = qs.get("hub") || "";
  const cameHub = /\/hub\.html/i.test(came) ? came : "";
  const hubHref = hub ? "index.html?pid=" + encodeURIComponent(hub) + cloudParam() + "&tab=" + HUB_TAB : "";
  const backHref = cameHub || hubHref || came || "index.html";
  const fromHub = !!(cameHub || hubHref);
  window.__campBackHref = backHref;
  if(back){ back.href = backHref; back.innerHTML = fromHub ? "&larr; Project" : (came ? "&larr; Back" : "&larr; Library"); }
  if(mnLib){ mnLib.href = backHref; mnLib.textContent = fromHub ? "Project" : (came ? "Back" : "Library"); }
  const go = (e) => {
    e.preventDefault();
    // going back through history restores the hub exactly as it was left (scroll, open section)
    if(cameHub && document.referrer === cameHub && history.length > 1){ history.back(); setTimeout(() => { location.href = backHref; }, 700); }
    else location.href = backHref;
  };
  if(back) back.onclick = go;
  if(mnLib) mnLib.onclick = go;
  // File › Library goes to the same place
  const ml = document.getElementById("mLibrary");
  if(ml){ const c = ml.cloneNode(true); ml.replaceWith(c); c.textContent = fromHub ? "Back to Project" : "Library"; c.addEventListener("click", (e) => { try{ window.closeMenus && window.closeMenus(); }catch(_e){} go(e); }); }
})();
</script>

<script>
(function(){
  const PH = { L_CHAR:"CHARACTER", L_DLG:"Dialogue", R_CHAR:"CHARACTER", R_DLG:"Dialogue" };
  const ed = document.getElementById("scriptEditor");
  if(!ed) return;
  let raf = 0;
  function refresh(){
    raf = 0;
    const sel = window.getSelection();
    let n = sel && sel.rangeCount ? sel.anchorNode : null;
    while(n && n !== ed && !(n.classList && n.classList.contains("line"))) n = n.parentNode;
    const active = (n && n !== ed && n.dataset && n.dataset.type === "dual") ? n : null;
    for(const l of ed.querySelectorAll(".line.dualActive")) if(l !== active) l.classList.remove("dualActive");
    if(active) active.classList.add("dualActive");
    for(const f of ed.querySelectorAll('.line[data-type="dual"] .dualField')){
      const empty = !(f.textContent || "").replace(/[\u200B\u00A0\s]/g, "");
      if(empty){ if(f.dataset.empty !== "1"){ f.dataset.empty = "1"; f.dataset.ph = PH[f.dataset.part] || ""; } }
      else if(f.dataset.empty) delete f.dataset.empty;
    }
  }
  const later = () => { if(!raf) raf = requestAnimationFrame(refresh); };
  document.addEventListener("selectionchange", later);
  ed.addEventListener("input", later);
  new MutationObserver(later).observe(ed, { childList: true });
  later();
})();
</script>
<script>
/* Blank-line caret: Chrome can leave the caret invisible on an empty line, so draw our own there.
   It disappears the moment there's text (the browser's own caret takes over) and is never saved or printed. */
(function(){
  const ed = document.getElementById("scriptEditor");
  if(!ed) return;
  const bar = document.createElement("div");
  bar.id = "blankCaret"; bar.setAttribute("aria-hidden", "true"); bar.hidden = true;
  document.body.appendChild(bar);
  let raf = 0, lastKey = "";
  const hostOf = (node) => { const el = node && (node.nodeType === 1 ? node : node.parentElement); return el ? (el.closest(".dualField") || el.closest(".line")) : null; };
  const isBlank = (el) => !(el.textContent || "").replace(/[\u200B\u00A0\s]/g, "") && !el.querySelector("br,img");
  function update(){
    raf = 0;
    const hide = () => { bar.hidden = true; lastKey = ""; document.body.classList.remove("ownCaret"); };
    const sel = window.getSelection();
    if(!sel || !sel.rangeCount || !sel.isCollapsed) return hide();
    if(document.body.classList.contains("previewLock") || document.body.classList.contains("notesMode")) return hide();
    const n = sel.anchorNode;
    if(!n || !ed.contains(n)) return hide();
    const ae = document.activeElement;
    if(ae !== ed && !(ae && ed.contains(ae))) return hide();
    const host = hostOf(n);
    if(!host || !ed.contains(host) || host.matches('.line[data-type="dual"]') || !isBlank(host)) return hide();
    const r = host.getBoundingClientRect();
    if(!r.width || !r.height) return hide();
    const cs = getComputedStyle(host), scale = host.offsetHeight ? r.height / host.offsetHeight : 1;
    let x = r.left + (parseFloat(cs.paddingLeft) || 0) * scale;
    if(cs.textAlign === "center") x = r.left + r.width / 2;
    else if(cs.textAlign === "right" || cs.textAlign === "end") x = r.right - (parseFloat(cs.paddingRight) || 0) * scale;
    const h = Math.min(r.height, (parseFloat(cs.lineHeight) || r.height) * scale);
    const key = Math.round(x) + "," + Math.round(r.top);
    bar.style.left = x + "px"; bar.style.top = r.top + "px"; bar.style.height = h + "px"; bar.style.background = cs.color;
    bar.hidden = false; document.body.classList.add("ownCaret");   // one caret only: ours on blank lines, the browser's otherwise
    if(key !== lastKey){ lastKey = key; bar.style.animation = "none"; void bar.offsetWidth; bar.style.animation = ""; }   // solid right after you move, then blinks
  }
  const later = () => { if(!raf) raf = requestAnimationFrame(update); };
  document.addEventListener("selectionchange", later);
  document.addEventListener("focusin", later); document.addEventListener("focusout", later);
  window.addEventListener("scroll", later, true); window.addEventListener("resize", later);
  ed.addEventListener("input", later); ed.addEventListener("keyup", later); ed.addEventListener("mouseup", later);
  new MutationObserver(later).observe(ed, { childList: true, subtree: true, characterData: true });
  later();
})();
</script>

(function(){

  if(!ed || !m) return;
  const hide = () => { m.hidden = true; };
  m.addEventListener("mousedown", (e) => e.preventDefault());   // keep the selection in the script
  m.addEventListener("click", (e) => {
    const b = e.target.closest("button"); if(!b) return;
    if(b.parentElement.classList.contains("qSub")){ b.parentElement.classList.toggle("open"); return; }
    const id = b.dataset.q, t = b.dataset.t;
    hide();
    if(id){ const el = document.getElementById(id); if(el) el.click(); }
    else if(t){ const pill = document.querySelector('#typeButtons .pill[data-type="' + t + '"], .typeList .pill[data-type="' + t + '"]'); if(pill) pill.click(); }
  });
  ed.addEventListener("contextmenu", (e) => {
    if(e.defaultPrevented) return;                                  // spelling / grammar menu already took it
    if(e.target.closest && e.target.closest(".proof-miss,.proof-gram")) return;
    try{ if(typeof __isNativeSpellMode === "function" && __isNativeSpellMode()) return; }catch(_e){}
    if(document.body.classList.contains("previewLock")) return;
    e.preventDefault();
    const cur = (document.getElementById("typeSel") || {}).value;
    m.querySelectorAll(".qFly button").forEach(b => b.classList.toggle("on", b.dataset.t === cur));
    m.querySelector(".qSub").classList.remove("open");
    m.hidden = false; m.classList.remove("flip"); m.classList.remove("up");
    const w = m.offsetWidth, h = m.offsetHeight;
    m.style.left = Math.max(6, Math.min(e.clientX, innerWidth - w - 6)) + "px";
    m.style.top = Math.max(6, Math.min(e.clientY, innerHeight - h - 6)) + "px";
    if(parseFloat(m.style.left) + w + 160 > innerWidth) m.classList.add("flip");
    if(parseFloat(m.style.top) + 300 > innerHeight) m.classList.add("up");
  });
  document.addEventListener("mousedown", (e) => { if(!m.hidden && !m.contains(e.target)) hide(); }, true);
  document.addEventListener("keydown", (e) => { if(e.key === "Escape") hide(); });
  window.addEventListener("scroll", hide, true); window.addEventListener("resize", hide); window.addEventListener("blur", hide);
})();
</script>
